[pytest]
# The trees under canonical/tests/fixtures are INPUT DATA for the tools being tested
# (tree-sitter call graphs, patch generation, mutation lanes). They contain deliberately wrong
# code: fixtures/tree_sitter_swe/python/test_calc.py asserts twice(2,3) == 10 precisely so a
# repair tool can be shown finding that failure. pytest collects them anyway because they match
# test_*.py, which buries the real baseline under ~800 fixture failures starting at the 9% mark.
#
# Measured 2026-11-24: with fixtures collected, a repo-wide run is an unreadable wall of F's.
# `--ignore` on the command line does not help either, because collection happens before it.
#
# pytest ignores a directory only when its NAME matches, and only for glob patterns without a
# path separator -- so the pattern is the bare directory name.
norecursedirs = fixtures node_modules .git __pycache__ build dist
