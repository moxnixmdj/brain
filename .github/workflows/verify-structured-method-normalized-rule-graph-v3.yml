name: Verify structured method normalized rule graph v3
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/structured_method_normalized_rule_graph_v3.py
      - canonical/tests/test_structured_method_normalized_rule_graph_v3.py
      - .github/workflows/verify-structured-method-normalized-rule-graph-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_structured_method_normalized_rule_graph_v3
