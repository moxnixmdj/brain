name: Verify terminal 29 truth basis V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/terminal_frontier_factorizer_v2.py"
      - "canonical/runtime/terminal_coverage_partition_compiler_v2.py"
      - "canonical/tests/test_terminal_29_truth_basis_v1.py"
      - "canonical/governance/CURRENT_TERMINAL_COVERAGE_PARTITION_V4.json"
      - ".github/workflows/verify-terminal-29-basis-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m py_compile canonical/runtime/terminal_frontier_factorizer_v2.py canonical/runtime/terminal_coverage_partition_compiler_v2.py
      - run: python -m pytest -q canonical/tests/test_terminal_29_truth_basis_v1.py
