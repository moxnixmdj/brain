name: Verify Root3 subprocess mediator V1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/root3_subprocess_mediator_v1.py
      - canonical/tests/test_root3_subprocess_mediator_v1.py
      - canonical/governance/ROOT3_SUBPROCESS_MEDIATOR_20261005_V1.json
      - .github/workflows/verify-root3-subprocess-mediator-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile mediator
        run: python -m py_compile canonical/runtime/root3_subprocess_mediator_v1.py
      - name: Execute fail-closed behavioral tests
        run: python -m pytest -q canonical/tests/test_root3_subprocess_mediator_v1.py
