name: Verify terminal information dominance v1

on:
  push:
    paths:
      - "canonical/runtime/terminal_information_dominance_v1.py"
      - "canonical/runtime/current_terminal_information_dominance_v1.py"
      - "canonical/tests/test_terminal_information_dominance_v1.py"
      - "canonical/tests/test_terminal_information_dominance_current_v1.py"
      - "canonical/tests/test_current_terminal_information_dominance_v1.py"
      - "canonical/governance/TERMINAL_INFORMATION_DOMINANCE_CANDIDATE_V1.json"
      - "canonical/governance/CURRENT_TERMINAL_INFORMATION_DOMINANCE_V1.json"
      - "canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V3.json"
      - "canonical/governance/TERMINAL_CERTIFICATE_CUT_ACTIVATION_V2.json"
      - ".github/workflows/verify-terminal-information-dominance-v1.yml"
  pull_request:
    paths:
      - "canonical/runtime/terminal_information_dominance_v1.py"
      - "canonical/runtime/current_terminal_information_dominance_v1.py"
      - "canonical/tests/test_terminal_information_dominance_v1.py"
      - "canonical/tests/test_terminal_information_dominance_current_v1.py"
      - "canonical/tests/test_current_terminal_information_dominance_v1.py"
      - "canonical/governance/TERMINAL_INFORMATION_DOMINANCE_CANDIDATE_V1.json"
      - "canonical/governance/CURRENT_TERMINAL_INFORMATION_DOMINANCE_V1.json"
      - "canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V3.json"
      - "canonical/governance/TERMINAL_CERTIFICATE_CUT_ACTIVATION_V2.json"
      - ".github/workflows/verify-terminal-information-dominance-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run optimizer unit tests
        run: python -m unittest canonical.tests.test_terminal_information_dominance_v1 -v
      - name: Run historical-current frontier regression
        run: python -m unittest canonical.tests.test_terminal_information_dominance_current_v1 -v
      - name: Run live V9-bound frontier regression
        run: python -m unittest canonical.tests.test_current_terminal_information_dominance_v1 -v
      - name: Evaluate historical V3 information dominance
        run: python canonical/runtime/terminal_information_dominance_v1.py
      - name: Evaluate live V9-bound information dominance
        run: |
          python canonical/runtime/current_terminal_information_dominance_v1.py > CURRENT_TERMINAL_INFORMATION_DOMINANCE_RESULT.json
          python - <<'PY'
          import json
          x=json.load(open("CURRENT_TERMINAL_INFORMATION_DOMINANCE_RESULT.json"))
          assert x["pass"] is True,x
          s=x["live_world_summary"]
          assert s["frozen_predicates"]==38,x
          assert s["proved_predicates"]==11,x
          assert s["unresolved_predicates"]==27,x
          assert s["live_action_coverage_count"]==27,x
          assert s["tool_discovery_retrieval_authority_gate_required"] is True,x
          assert s["tool_discovery_retrieval_authority_gate_pass"] is True,x
          d=x["dominance"]
          assert d["status"]=="EXACT_INFORMATION_DOMINANCE_COMPUTED",x
          assert d["unresolved_predicate_count"]==27,x
          assert d["best_full_frontier_bundle"]["covered_predicate_count"]==27,x
          assert x["new_reality_units_consumed"]==0,x
          assert x["fresh_reality_authority"] is False,x
          assert x["execution_authority"] is False,x
          assert x["promotion_authority"] is False,x
          print("live V9-bound information dominance verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-terminal-information-dominance-v1
          path: CURRENT_TERMINAL_INFORMATION_DOMINANCE_RESULT.json
          if-no-files-found: error
