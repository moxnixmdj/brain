name: Project Brain Astra Hidden One Shot
on:
  push:
    branches: [main]
    paths: ['canonical/astra/RUN_HIDDEN_ONESHOT.trigger']
permissions: {contents: write}
concurrency:
  group: project-brain-astra-hidden-oneshot
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check websocket-client
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - name: Arm exactly once
        run: python canonical/runtime/astra_hidden_visual_executor.py arm
      - name: Persist irreversible one-shot marker before navigation
        run: |
          git config user.name 'Project Brain Astra OneShot'
          git config user.email 'project-brain-astra@users.noreply.github.com'
          git add canonical/astra/HIDDEN_ONESHOT_CONSUMED.json
          git commit -m 'Arm frozen Astra hidden one-shot before navigation'
          git push
      - name: Execute frozen hidden visual mission
        run: python canonical/runtime/astra_hidden_visual_executor.py execute
      - name: Preserve sealed trajectory
        if: always()
        run: |
          git pull --rebase
          git config user.name 'Project Brain Astra Executor'
          git config user.email 'project-brain-astra@users.noreply.github.com'
          git add canonical/astra/HIDDEN_RESULT.json canonical/astra/HIDDEN_TRAJECTORY.json canonical/astra/HIDDEN_AUTHORITY.sqlite canonical/astra/hidden_frames/ || true
          if ! git diff --cached --quiet; then git commit -m 'Seal Astra hidden one-shot trajectory'; git push; fi
