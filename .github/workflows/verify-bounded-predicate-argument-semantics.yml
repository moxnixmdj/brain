name: Verify bounded predicate argument semantics
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/bounded_predicate_argument_semantics.py
      - canonical/runtime/m0a_semantic_graph_consensus.py
      - canonical/tests/test_bounded_predicate_argument_semantics.py
      - .github/workflows/verify-bounded-predicate-argument-semantics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_bounded_predicate_argument_semantics
