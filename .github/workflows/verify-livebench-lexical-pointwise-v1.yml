name: Verify LiveBench lexical pointwise 192 V1

on:
  pull_request:
    paths:
      - "canonical/runtime/livebench_legacy15_lexical_collision_signatures_v2.py"
      - "canonical/runtime/livebench_legacy15_lexical_pointwise_audit_v1.py"
      - "canonical/runtime/livebench_legacy15_relaxed_candidate_search_v1.py"
      - "canonical/runtime/livebench_legacy15_pointwise_search_v1.py"
      - "canonical/runtime/livebench_legacy15_exact_postvalidator_v1.py"
      - "canonical/runtime/livebench_legacy15_slot_feasibility_v1.py"
      - "canonical/runtime/livebench_legacy15_contract_composer_v2.py"
      - "canonical/tests/test_livebench_legacy15_lexical_collision_signatures_v2.py"
      - "canonical/tests/test_livebench_legacy15_proofgrade_runtime_binding_v1.py"
      - "canonical/verification_requests/livebench_lexical_pointwise_192_v1.json"
      - ".github/workflows/verify-livebench-lexical-pointwise-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen legacy import dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet             pytest==8.4.2 nltk==3.10.3 langdetect==1.0.9 immutabledict==4.3.1

      - name: Checkout exact frozen LiveBench scorer
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench fetch --quiet --depth=1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench checkout --quiet --detach 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/livebench rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"

      - name: Run focused unit guards
        run: |
          python -m pytest -q             canonical/tests/test_livebench_legacy15_lexical_collision_signatures_v2.py             canonical/tests/test_livebench_legacy15_proofgrade_runtime_binding_v1.py             canonical/tests/test_livebench_legacy15_relaxed_candidate_search_v1.py             canonical/tests/test_livebench_legacy15_pointwise_search_v1.py

      - name: Run exact 192-state lexical pointwise audit
        run: |
          mkdir -p /tmp/receipt
          printf '%s\n' '{"livebench_root":"/tmp/livebench","max_per_subset":8,"max_total":256}'             | python canonical/runtime/livebench_legacy15_lexical_pointwise_audit_v1.py             > /tmp/receipt/livebench-lexical-pointwise-192-v1.json
          python - <<'PY'
          import json
          p="/tmp/receipt/livebench-lexical-pointwise-192-v1.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["status"]=="PASS__ALL_192_LEXICAL_SIGNATURES_POINTWISE_OPTIMAL", x
          assert x["signature_count"]==192, x
          assert x["full_score_signature_count"]==37, x
          assert x["partial_pointwise_optimal_signature_count"]==155, x
          assert x["feasibility_mismatch_count"]==0, x
          assert not x["failures"], x
          print(json.dumps({
              "status":x["status"],
              "signatures":x["signature_count"],
              "full":x["full_score_signature_count"],
              "partial":x["partial_pointwise_optimal_signature_count"],
              "histogram":x["true_checker_count_histogram"],
          },sort_keys=True))
          PY

      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-lexical-pointwise-192-v1
          path: /tmp/receipt/livebench-lexical-pointwise-192-v1.json
          if-no-files-found: error
