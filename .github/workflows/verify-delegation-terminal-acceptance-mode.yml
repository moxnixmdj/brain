name: Verify delegation terminal acceptance mode
on:
  push:
    branches: [main]
    paths:
      - canonical/governance/DELEGATION_TERMINAL_ACCEPTANCE_MODE_V1.json
      - canonical/governance/DELEGATION_TERMINAL_POPULATION_BINDING_V1.json
      - canonical/governance/TASK_TO_DELEGATION_SCOPE_EQUIVALENT_PROOF_GATE_V2_INPUT.json
      - canonical/verification/DELEGATION_TERMINAL_POPULATION_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json
      - canonical/verification/DELEGATION_SCOPE_GATE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json
      - canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json
      - canonical/runtime/delegation_whole_scope_proof_v2.py
      - canonical/tests/test_delegation_terminal_acceptance_mode_v1.py
      - .github/workflows/verify-delegation-terminal-acceptance-mode.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_delegation_terminal_acceptance_mode_v1
