name: Verify professional artifact T1 multiplex binding
on:
  push:
    branches: [main]
    paths:
      - canonical/governance/PROFESSIONAL_ARTIFACT_T1_MULTIPLEX_TERMINAL_BINDING_V1.json
      - canonical/runtime/professional_artifact_t1_multiplex_preflight.py
      - canonical/tests/test_professional_artifact_t1_multiplex_preflight.py
      - .github/workflows/verify-professional-artifact-t1-multiplex.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_professional_artifact_t1_multiplex_preflight
      - run: python canonical/runtime/professional_artifact_t1_multiplex_preflight.py .
