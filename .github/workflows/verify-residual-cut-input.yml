name: Verify residual proof cut input

on:
  push:
    branches: [main]
    paths:
      - canonical/governance/RESIDUAL_CUT_INPUT_V1.json
      - canonical/runtime/global_proof_cut_compiler.py
      - .github/workflows/verify-residual-cut-input.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact frozen-universe compiler
        run: |
          python - <<'PY'
          import json
          from canonical.runtime.global_proof_cut_compiler import compile_cut
          p=json.load(open("canonical/governance/RESIDUAL_CUT_INPUT_V1.json",encoding="utf-8"))
          out=compile_cut(p)
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["status"]=="GRAPH_INCOMPLETE", out
          assert out["missing_obligations"]==["M0A","M1A"], out
          PY
