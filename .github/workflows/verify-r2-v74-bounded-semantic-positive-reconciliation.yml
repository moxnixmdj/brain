name: verify-r2-v74-bounded-semantic-positive-reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/CURRENT_R2_DECISION_INTELLIGENCE.json
      - canonical/governance/R2_V74_BOUNDED_SEMANTIC_POSITIVE_RECONCILIATION_20261010_V1.json
      - canonical/tests/test_r2_v74_bounded_semantic_positive_reconciliation_v1.py
      - .github/workflows/verify-r2-v74-bounded-semantic-positive-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify R2 V74 bounded semantic positives
        run: |
          set -o pipefail
          PYTHONPATH=. python3 -m unittest -v             canonical.tests.test_r2_v74_bounded_semantic_positive_reconciliation_v1             2>&1 | tee r2-v74-bounded-semantic-positive-output.txt
      - name: Publish verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-v74-bounded-semantic-positive-output
          path: r2-v74-bounded-semantic-positive-output.txt
          if-no-files-found: warn
