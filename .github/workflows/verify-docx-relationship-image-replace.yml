name: Verify DOCX relationship image replacement
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/docx_relationship_image_replace.py
      - canonical/tests/test_docx_relationship_image_replace.py
      - .github/workflows/verify-docx-relationship-image-replace.yml
  push:
    branches: [main]
    paths:
      - canonical/runtime/docx_relationship_image_replace.py
      - canonical/tests/test_docx_relationship_image_replace.py
      - .github/workflows/verify-docx-relationship-image-replace.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_docx_relationship_image_replace
