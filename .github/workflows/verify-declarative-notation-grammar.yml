name: Verify declarative notation grammar
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/declarative_notation_grammar.py
      - canonical/tests/test_declarative_notation_grammar.py
      - .github/workflows/verify-declarative-notation-grammar.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_declarative_notation_grammar
