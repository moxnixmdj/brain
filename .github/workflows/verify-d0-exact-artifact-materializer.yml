name: Verify D0 exact artifact materialization
on:
  push:
    branches: [obs-d0-exact-artifact-materialization-20261002]
    paths:
      - canonical/runtime/exact_artifact_materializer.py
      - canonical/tests/test_exact_artifact_materializer.py
      - .github/workflows/verify-d0-exact-artifact-materializer.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/exact_artifact_materializer.py
      - canonical/tests/test_exact_artifact_materializer.py
      - .github/workflows/verify-d0-exact-artifact-materializer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_exact_artifact_materializer
