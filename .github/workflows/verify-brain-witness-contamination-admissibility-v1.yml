name: Verify Brain witness contamination admissibility

on:
  push:
    paths:
      - "canonical/governance/OPUS55_BRAIN_WITNESS_NORMALIZATION_V1.json"
      - "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json"
      - "canonical/verification/ARTIFACT_UNCOVERED_SCOPE_PARTITION_PROOF_20261002_V1.json"
      - "canonical/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json"
      - "canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json"
      - "canonical/runtime/brain_witness_contamination_admissibility_v1.py"
      - "canonical/tests/test_brain_witness_contamination_admissibility_v1.py"
      - ".github/workflows/verify-brain-witness-contamination-admissibility-v1.yml"
  pull_request:
    paths:
      - "canonical/governance/OPUS55_BRAIN_WITNESS_NORMALIZATION_V1.json"
      - "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json"
      - "canonical/verification/ARTIFACT_UNCOVERED_SCOPE_PARTITION_PROOF_20261002_V1.json"
      - "canonical/governance/TOOL_DISCOVERY_ACCEPTANCE_CEILING_WITNESS_V1.json"
      - "canonical/governance/DELEGATION_ACCEPTANCE_CEILING_WITNESS_V1.json"
      - "canonical/runtime/brain_witness_contamination_admissibility_v1.py"
      - "canonical/tests/test_brain_witness_contamination_admissibility_v1.py"
      - ".github/workflows/verify-brain-witness-contamination-admissibility-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run contamination admissibility tests
        run: python -m unittest canonical.tests.test_brain_witness_contamination_admissibility_v1 -v
      - name: Verify live normalized witness catalog
        run: python canonical/runtime/brain_witness_contamination_admissibility_v1.py
