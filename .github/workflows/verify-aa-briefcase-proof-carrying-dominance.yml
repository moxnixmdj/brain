name: Verify AA-Briefcase proof-carrying dominance

on:
  pull_request:
    paths:
      - "canonical/runtime/aa_briefcase_scope_complete_dominance_v1.py"
      - "canonical/runtime/aa_briefcase_current_epoch_noninferiority_bridge_v3.py"
      - "canonical/runtime/aa_briefcase_current_epoch_result_bridge_v2.py"
      - "canonical/tests/test_aa_briefcase_scope_complete_dominance_v1.py"
      - "canonical/tests/test_aa_briefcase_current_epoch_noninferiority_bridge_v3.py"
      - "canonical/governance/AA_BRIEFCASE_PROOF_CARRYING_DOMINANCE_ROUTE_20261008_V1.json"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused AA-Briefcase tests
        run: |
          python -m unittest -v \
            canonical.tests.test_aa_briefcase_scope_complete_dominance_v1 \
            canonical.tests.test_aa_briefcase_current_epoch_noninferiority_bridge_v3 \
            canonical.tests.test_aa_briefcase_current_epoch_result_bridge_v2
