name: verify-professional-quality-closure-normal-form-v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/PROFESSIONAL_QUALITY_CLOSURE_NORMAL_FORM_20261009_V1.json
      - canonical/governance/PROFESSIONAL_QUALITY_ADVERSARIAL_CHALLENGE_MATRIX_20261009_V1.json
      - canonical/runtime/professional_quality_closure_normal_form_v1.py
      - canonical/tests/test_professional_quality_closure_normal_form_v1.py
      - canonical/governance/PROFESSIONAL_QUALITY_V7_12_OF_12_COMPOSITION_INPUT_20261010_V1.json
      - canonical/runtime/professional_quality_v7_12_of_12_composition_verify_v1.py
      - canonical/tests/test_professional_quality_v7_12_of_12_composition_verify_v1.py
      - canonical/tests/test_professional_quality_same_subject_composition_gate_v4.py
      - canonical/governance/PROFESSIONAL_QUALITY_R12_ROOT_SUBJECT_BINDING_20261010_V1.json
      - canonical/verification/PROFESSIONAL_QUALITY_R12_V7_ROOT_SUBJECT_BINDING_PUBLIC_VERIFY_20261010_V1.json
      - canonical/runtime/professional_quality_same_subject_composition_gate_v4.py
      - .github/workflows/verify-professional-quality-closure-normal-form-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest canonical.tests.test_professional_quality_closure_normal_form_v1 -v
