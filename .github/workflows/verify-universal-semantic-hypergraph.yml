name: Verify universal semantic hypergraph
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/universal_semantic_hypergraph.py
      - canonical/tests/test_universal_semantic_hypergraph.py
      - .github/workflows/verify-universal-semantic-hypergraph.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_universal_semantic_hypergraph
