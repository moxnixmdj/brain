name: Direct Generator Integration Delta Diagnostic 001

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata-only package contents index
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-file
          sudo apt-file update
      - name: Prove runtime unchanged from canonical main
        run: |
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD -- canonical/runtime/)"
      - name: Run one no-mutation integration delta diagnostic
        run: python canonical/experiments/run_direct_generator_integration_delta_diagnostic_001.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: direct-generator-integration-delta-diagnostic-001
          path: canonical/astra_runtime/evidence/DIRECT_GENERATOR_INTEGRATION_DELTA_DIAGNOSTIC_001__RESULT.json
          if-no-files-found: error
