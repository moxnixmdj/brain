name: Verify terminal frontier compiler V1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/terminal_frontier_compiler_v1.py
      - canonical/tests/test_terminal_frontier_compiler_v1.py
      - canonical/governance/TERMINAL_FRONTIER_COMPILER_V1.json
      - canonical/governance/TERMINAL_ROOT_CAUSE_STATE_V1.json
      - canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json
      - canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json
      - canonical/governance/ROOT1_TERMINAL_FAMILY_ENVELOPE_AUDIT_V*.json
      - canonical/governance/CURRENT_ZERO_REALITY_MINIMUM_CUT_V*.json
      - canonical/verification/ROOT1_TERMINAL_FAMILY_ENVELOPE_AUDIT_V*.json
      - canonical/verification/CURRENT_ZERO_REALITY_MINIMUM_CUT_V*.json
      - .github/workflows/verify-terminal-frontier-compiler-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile live frontier
        run: python canonical/runtime/terminal_frontier_compiler_v1.py
      - name: Run frontier tests
        run: python -m pytest -q canonical/tests/test_terminal_frontier_compiler_v1.py
