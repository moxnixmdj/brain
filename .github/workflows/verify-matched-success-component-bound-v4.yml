name: Verify matched-success component-bound V4

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/matched_success_component_bound_v4.py"
      - "canonical/tests/test_matched_success_component_bound_v4.py"
      - "canonical/governance/MATCHED_SUCCESS_COMPONENT_BOUND_SEMANTIC_V4.json"
      - ".github/workflows/verify-matched-success-component-bound-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m py_compile canonical/runtime/matched_success_component_bound_v4.py
      - run: python -m pytest -q canonical/tests/test_matched_success_component_bound_v4.py
