name: Executable Candidate Diagnostic 001

on:
  push:
    branches:
      - diagnostic/executable-candidate-ranking-v1-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove canonical runtime unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD -- canonical/runtime/)"
      - name: Run metadata-only candidate diagnostic
        run: python canonical/experiments/run_executable_candidate_diagnostic_001.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: executable-candidate-diagnostic-001
          path: canonical/astra_runtime/evidence/EXECUTABLE_CANDIDATE_DIAGNOSTIC_001__RESULT.json
