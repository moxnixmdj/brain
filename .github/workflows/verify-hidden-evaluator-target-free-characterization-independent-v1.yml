name: Verify target-free monotone characterization independently

on:
  pull_request:
    branches:
      - breakthrough/target-free-monotone-dominance-iff-20261005-sol
    paths:
      - canonical/governance/HIDDEN_EVALUATOR_TARGET_FREE_MONOTONE_DOMINANCE_CHARACTERIZATION_V1.json
      - canonical/runtime/hidden_evaluator_target_free_characterization_v1.py
      - canonical/tests/test_hidden_evaluator_target_free_characterization_v1.py
      - canonical/verification/HIDDEN_EVALUATOR_TARGET_FREE_MONOTONE_DOMINANCE_WOLFRAM_VERIFICATION_20261005_V1.json
      - canonical/tests/test_hidden_evaluator_target_free_characterization_independent_v1.py
      - .github/workflows/verify-hidden-evaluator-target-free-characterization-independent-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run independent exhaustive characterization verifier
        run: python -m canonical.tests.test_hidden_evaluator_target_free_characterization_independent_v1
