name: Verify current terminal launch authority
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/terminal_wave_launch_authority_reducer_v1.py
      - canonical/runtime/terminal_prequalification_reducer.py
      - canonical/runtime/terminal_parent_portfolio_launcher_v1.py
      - canonical/runtime/terminal_parent_portfolio_runner_v1.py
      - canonical/runtime/direct_route_terminal_executors_v1.py
      - canonical/runtime/cad_t0_route_specific_terminal_executor_v1.py
      - canonical/runtime/portfolio_multiplex_terminal_instrumentation_v1.py
      - canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json
      - canonical/governance/TERMINAL_PARENT_CASE_PRODUCER_MANIFEST_V1.json
      - canonical/governance/TERMINAL_PARENT_LAUNCHER_BINDING_V1.json
      - canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json
      - canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json
      - canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json
      - canonical/tests/test_terminal_wave_launch_authority_reducer_v1.py
      - canonical/tests/test_terminal_parent_portfolio_launcher_v1.py
      - .github/workflows/verify-current-terminal-launch-authority.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture exact-current authority diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p authority-diagnostics
          PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_wave_launch_authority_reducer_v1 canonical.tests.test_terminal_parent_portfolio_launcher_v1 > authority-diagnostics/tests.txt 2>&1
          tests_rc=$?
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . > authority-diagnostics/authority.json 2> authority-diagnostics/authority.stderr.txt
          reducer_rc=$?
          TESTS_RC="$tests_rc" REDUCER_RC="$reducer_rc" python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              authority=json.loads(Path("authority-diagnostics/authority.json").read_text())
          except Exception:
              authority={"parse_error":True}
          out={
              "tests_exit_code":int(os.environ["TESTS_RC"]),
              "reducer_exit_code":int(os.environ["REDUCER_RC"]),
              "authority":authority,
          }
          Path("authority-diagnostics/summary.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          exit 0
      - name: Upload exact-current authority diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-current-terminal-authority-diagnostic
          path: authority-diagnostics/
          if-no-files-found: error
          retention-days: 1
      - name: Enforce exact-current authority gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out=json.loads(Path("authority-diagnostics/summary.json").read_text())
          tests=Path("authority-diagnostics/tests.txt").read_text(errors="replace")
          stderr=Path("authority-diagnostics/authority.stderr.txt").read_text(errors="replace")
          authority=out["authority"]
          assert out["tests_exit_code"]==0, tests
          assert out["reducer_exit_code"]==0, stderr+"\n"+json.dumps(authority,indent=2)
          assert authority.get("pass") is True, authority
          assert authority.get("launch_authority") is True, authority
          assert authority.get("execution_authority") is True, authority
          assert authority.get("route_count") == 12, authority
          assert authority.get("failed_predicates") == [], authority
          assert authority.get("terminal_results_observed",0) == 0, authority
          assert authority.get("fresh_terminal_evidence_consumed",0) == 0, authority
          PY
