name: Verify positioned OCR bridge

on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/positioned_ocr_tesseract_bridge.py
      - canonical/tests/test_positioned_ocr_tesseract_bridge.py
      - canonical/runtime/bound_capabilities/image_ocr_tesseract.py
      - .github/workflows/verify-positioned-ocr-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_positioned_ocr_tesseract_bridge
