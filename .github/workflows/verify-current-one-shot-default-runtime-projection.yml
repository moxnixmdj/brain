name: verify-current-one-shot-default-runtime-projection
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/current_one_shot_projection_v1.py
      - canonical/tests/test_current_one_shot_dynamic_finance_wake_projection_v1.py
      - canonical/governance/CURRENT_ONE_SHOT_REALITY_CLOSURE.json
      - canonical/governance/CURRENT_DEFAULT_RUNTIME_INTEGRATION.json
      - canonical/governance/CURRENT_R2_DECISION_INTELLIGENCE.json
      - canonical/governance/CURRENT_TERMINAL_AUTHORITY.json
      - canonical/runtime/r2_direct_live_admission_v1.py
      - canonical/runtime/general_adequate_decision_fixed_point_v2.py
      - canonical/runtime/r2_direct_end_to_end_adequacy_v19.py
      - canonical/runtime/r2_direct_end_to_end_adequacy_v21.py
      - canonical/governance/CURRENT_R2_DIRECT_ROUTE_ADMISSIONS.json
      - canonical/governance/R2_DIRECT_ROUTE_DYNAMIC_ADMISSIONS_20261009_V1.json
      - .github/workflows/verify-current-one-shot-default-runtime-projection.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile projection
        run: python -m py_compile canonical/runtime/current_one_shot_projection_v1.py
      - name: Run projection regressions
        run: python -m pytest -q canonical/tests/test_current_one_shot_dynamic_finance_wake_projection_v1.py
      - name: Execute live dynamic projection
        run: python canonical/runtime/current_one_shot_projection_v1.py
