name: Verify native PDF edit transactions

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/pdf_native_edit_transaction.py
      - canonical/tests/test_pdf_native_edit_transaction.py
      - .github/workflows/verify-pdf-native-edit-transaction.yml
  push:
    branches: [main]
    paths:
      - canonical/runtime/pdf_native_edit_transaction.py
      - canonical/tests/test_pdf_native_edit_transaction.py
      - .github/workflows/verify-pdf-native-edit-transaction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input pypdf==6.19.0 Pillow==12.3.0
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_pdf_native_edit_transaction
