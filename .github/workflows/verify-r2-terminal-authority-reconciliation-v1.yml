name: verify-r2-terminal-authority-reconciliation-v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/CURRENT_TERMINAL_AUTHORITY.json
      - canonical/governance/CURRENT_R2_DECISION_INTELLIGENCE.json
      - canonical/governance/CURRENT_ONE_SHOT_REALITY_CLOSURE.json
      - canonical/governance/R2_DIRECT_END_TO_END_ADEQUACY_ROUTES_ACTIVATION_20261009_V27.json
      - canonical/governance/CURRENT_MAIN_V52_COREFERENCE_PROJECTION_RECONCILIATION_20261009_V1.json
      - canonical/verification/R2_FINANCE_COREFERENCE_AMBIGUITY_CONTROL_VERIFY_20261009_V2.json
      - canonical/tests/test_current_main_v52_coreference_projection_reconciliation.py
      - .github/workflows/verify-r2-terminal-authority-reconciliation-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run current R2 V52 terminal authority reconciliation test
        run: python -m unittest -v canonical.tests.test_current_main_v52_coreference_projection_reconciliation
