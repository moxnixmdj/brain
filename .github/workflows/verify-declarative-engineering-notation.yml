name: Verify declarative engineering notation

on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/declarative_engineering_notation.py
      - canonical/runtime/visual_symbol_template_matcher.py
      - canonical/tests/test_declarative_engineering_notation.py
      - .github/workflows/verify-declarative-engineering-notation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - run: python -m unittest -v canonical.tests.test_declarative_engineering_notation
