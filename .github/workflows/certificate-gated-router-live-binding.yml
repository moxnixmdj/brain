name: Certificate-gated router live binding

on:
  pull_request:
    paths:
      - 'canonical/runtime/certificate_gated_selected_route_router_v1.py'
      - '.github/workflows/certificate-gated-router-live-binding.yml'

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Execute exact content-addressed router canaries
        env:
          GITHUB_RUN_ID_LOCAL: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_LOCAL: ${{ github.run_attempt }}
          HEAD_SHA_LOCAL: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export ROUTER_BLOB_SHA="$(git hash-object canonical/runtime/certificate_gated_selected_route_router_v1.py)"
          PYTHONPATH=. python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from canonical.runtime.certificate_gated_selected_route_router_v1 import AdmissionReceipt, RouterFailClosed, select_certified_route

          context = hashlib.sha256(b"PROJECT_BRAIN_ROUTER_LIVE_BINDING_CANARY_V2").hexdigest()
          a = AdmissionReceipt(context, "CELL_A", "route-a", "1"*40, "f"*40, "a"*40, True)
          b = AdmissionReceipt(context, "CELL_B", "route-b", "3"*40, "2"*40, "b"*40, True)
          x1 = select_certified_route(actual_context_digest=context, receipts=[b, a])
          x2 = select_certified_route(actual_context_digest=context, receipts=[a, b])
          assert x1 == x2 and x1.route_id == "route-a"

          reason = None
          try:
              select_certified_route(
                  actual_context_digest=context,
                  receipts=[AdmissionReceipt("other", "NEG", "must-not-route", "4"*40, "5"*40, "6"*40, True)],
              )
          except RouterFailClosed as exc:
              reason = str(exc)
          assert reason == "NO_CERTIFIED_ROUTE_FOR_ACTUAL_CONTEXT"

          receipt = {
              "schema": "PROJECT_BRAIN_CERTIFICATE_GATED_ROUTER_LIVE_BINDING_RECEIPT_V2",
              "status": "PASS__GITHUB_ACTIONS_PR_CARRIER_EXECUTED_EXACT_ROUTER_CORE__DETERMINISTIC_AND_FAIL_CLOSED",
              "pass": True,
              "github_run_id": os.environ["GITHUB_RUN_ID_LOCAL"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT_LOCAL"],
              "head_sha": os.environ["HEAD_SHA_LOCAL"],
              "router_git_blob_sha": os.environ["ROUTER_BLOB_SHA"],
              "selected_route_id": x1.route_id,
              "exact_replay_same_under_input_permutation": True,
              "fail_closed_negative_replay": True,
              "fail_closed_reason": reason,
              "scope": "MECHANICAL_DEPLOYED_ROUTER_BINDING_ONLY",
              "abc_closed": False,
              "d_finality_closed": False,
              "terminal": False,
              "terminal_credit_delta": 0,
          }
          Path("router_live_binding_receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload durable replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: certificate-gated-router-live-binding-receipt
          path: router_live_binding_receipt.json
          if-no-files-found: error
          retention-days: 90
