name: Verify M2 DOCX story-part replacement
on:
  pull_request:
    paths:
      - canonical/runtime/docx_story_part_replace.py
      - canonical/tests/test_docx_story_part_replace.py
      - .github/workflows/verify-m2-docx-story-part-replace.yml
  push:
    branches: [main]
    paths:
      - canonical/runtime/docx_story_part_replace.py
      - canonical/tests/test_docx_story_part_replace.py
      - .github/workflows/verify-m2-docx-story-part-replace.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_docx_story_part_replace
