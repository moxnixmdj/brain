name: Verify shared decision primitives

on:
  push:
    paths:
      - "canonical/runtime/shared_decision_primitives.py"
      - "canonical/tests/test_shared_decision_primitives.py"
      - ".github/workflows/verify-shared-decision-primitives.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify bounded cross-lane decision kernel
        run: PYTHONPATH=. python canonical/tests/test_shared_decision_primitives.py
