name: Verify terminal certificate activation integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V1.json"
      - "canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V2.json"
      - "canonical/governance/TERMINAL_CERTIFICATE_CUT_ACTIVATION_V2.json"
      - "canonical/runtime/terminal_certificate_cut_v1.py"
      - "canonical/tests/test_terminal_certificate_activation_integrity_v1.py"
      - "canonical/tests/test_terminal_certificate_cut_v2.py"
      - ".github/workflows/verify-terminal-certificate-activation-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment_probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner and Python probe
        run: |
          python3 --version
          pwd

  checkout_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout
        run: test -f canonical/governance/TERMINAL_CERTIFICATE_CUT_ACTIVATION_V2.json

  activation_integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify active frontier is canonical and count-consistent
        run: python3 canonical/tests/test_terminal_certificate_activation_integrity_v1.py

  exact_cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact 31-predicate certificate cut
        run: PYTHONPATH=. python3 canonical/tests/test_terminal_certificate_cut_v2.py
