name: Verify five public-bar observable target scope closure

on:
  push:
    paths:
      - "canonical/governance/FIVE_PUBLIC_BAR_OBSERVABLE_TARGET_SCOPE_CLOSURE_REDUCTION_20261005_V1.json"
      - "canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"
      - "canonical/governance/PUBLIC_BAR_TASK_UNION_SCOPE_COVERAGE_AUDIT_20261005_V1.json"
      - "canonical/governance/TARGET_BEHAVIOR_MECHANISM_SCOPE_SEPARATION_20261005_V1.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/verification/PUBLIC_BAR_TASK_UNION_TARGET_CONDITIONED_RESIDUAL_RECONCILIATION_CONNECTOR_VERIFICATION_20261005_V1.json"
      - "canonical/runtime/five_public_bar_observable_target_scope_closure_verifier_v1.py"
      - "canonical/tests/test_five_public_bar_observable_target_scope_closure_verifier_v1.py"
      - ".github/workflows/verify-five-public-bar-observable-target-scope-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed verifier
        run: python canonical/runtime/five_public_bar_observable_target_scope_closure_verifier_v1.py
      - name: Run verifier tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q canonical/tests/test_five_public_bar_observable_target_scope_closure_verifier_v1.py
