name: verify-professional-whole-leaf-scope-cover-v1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'canonical/runtime/professional_quality_whole_leaf_scope_cover_v1.py'
      - 'canonical/tests/test_professional_quality_whole_leaf_scope_cover_v1.py'
      - '.github/workflows/verify-professional-whole-leaf-scope-cover-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact verifier and tests
        run: |
          python -m py_compile             canonical/runtime/professional_quality_whole_leaf_scope_cover_v1.py             canonical/tests/test_professional_quality_whole_leaf_scope_cover_v1.py
      - name: Run exact and adversarial scope-cover replay
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE"             python -m unittest -v canonical.tests.test_professional_quality_whole_leaf_scope_cover_v1
