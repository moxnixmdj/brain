name: GDPval public 220 composed semantic localization v2

on:
  push:
    branches: [main]
    paths:
      - "canonical/runtime/gdpval_semantic_complement_localizer_v2.py"
      - "canonical/tests/test_gdpval_semantic_complement_localizer_v2.py"
      - ".github/workflows/gdpval-semantic-complement-v2.yml"
      - "canonical/runtime/gdpval_rubric_acceptance_index_v1.py"
      - "canonical/runtime/gdpval_rubric_acceptance_replay_v1.py"
      - "canonical/runtime/gdpval_rubric_acceptance_evidence_verifier_v1.py"
      - "canonical/tests/test_gdpval_rubric_acceptance_replay_v1.py"
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/gdpval_semantic_complement_localizer_v2.py"
      - "canonical/tests/test_gdpval_semantic_complement_localizer_v2.py"
      - ".github/workflows/gdpval-semantic-complement-v2.yml"
      - "canonical/runtime/gdpval_rubric_acceptance_index_v1.py"
      - "canonical/runtime/gdpval_rubric_acceptance_replay_v1.py"
      - "canonical/runtime/gdpval_rubric_acceptance_evidence_verifier_v1.py"
      - "canonical/tests/test_gdpval_rubric_acceptance_replay_v1.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdpval-public-220-composed-semantic-localization-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify fail-closed localizer
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p canonical/evidence
          python -m unittest -v canonical.tests.test_gdpval_semantic_complement_localizer_v2             2>&1 | tee canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_UNITTEST.log

      - name: Verify fail-closed rubric replay and evidence verifier
        run: |
          set -euo pipefail
          python -m unittest -v canonical.tests.test_gdpval_rubric_acceptance_replay_v1

      - name: Execute complete public 220 structural localization
        id: population
        if: steps.unit.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m canonical.runtime.gdpval_semantic_complement_localizer_v2             > canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2.json             2> canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_STDERR.log
          python - <<'PY'
          import json
          p="canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2.json"
          x=json.load(open(p))
          assert x["status"].startswith("PASS__"), x
          assert x["population"]["task_count"] == 220, x
          assert x["inference"]["fresh_target_model_queries"] == 0, x
          assert x["inference"]["provider_evaluation_queries"] == 0, x
          assert x["soundness"]["candidate_is_credit"] is False, x
          assert x["soundness"]["gdpval_scope_closed"] is False, x
          assert x["soundness"]["u_deletion_authority"] is False, x
          assert x["soundness"]["terminal_authority"] is False, x
          print(json.dumps({
              "status":x["status"],
              "population":x["population"],
              "aggregate":x["aggregate"],
              "compound_candidate_counts":x["compound_candidate_counts"],
          },sort_keys=True))
          PY

      - name: Execute complete public 220 rubric acceptance replay
        id: rubric
        if: steps.population.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m canonical.runtime.gdpval_rubric_acceptance_replay_v1 > canonical/evidence/GDPVAL_PUBLIC_220_RUBRIC_ACCEPTANCE_INDEX_20261007_V1.json
          python - <<'PY'
          import json
          from canonical.runtime.gdpval_rubric_acceptance_evidence_verifier_v1 import verify

          source = "canonical/evidence/GDPVAL_PUBLIC_220_RUBRIC_ACCEPTANCE_INDEX_20261007_V1.json"
          receipt = "canonical/verification/GDPVAL_PUBLIC_220_RUBRIC_ACCEPTANCE_INDEX_VERIFICATION_20261007_V1.json"
          x = json.load(open(source, encoding="utf-8"))
          assert x["status"] == "PASS__EXACT_BOUND_PUBLIC_220_RUBRIC_ACCEPTANCE_INDEX", x
          assert x["dataset"]["observed_revision"] == "11e7900cdcac61bc4daf59e65feb238acda98fbf", x
          assert x["index"]["aggregate"]["task_count"] == 220, x
          assert x["index"]["aggregate"]["criterion_count"] == 10453, x
          assert x["inference"]["fresh_target_model_queries"] == 0, x
          assert x["inference"]["provider_evaluation_queries"] == 0, x
          assert x["soundness"]["u_deletion_authority"] is False, x
          assert x["soundness"]["terminal_authority"] is False, x
          verdict = verify(x)
          assert verdict["pass"] is True, verdict
          with open(receipt, "w", encoding="utf-8") as f:
              json.dump(verdict, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps({
              "status": x["status"],
              "population_contract_sha256": x["index"]["population_contract_sha256"],
              "aggregate": x["index"]["aggregate"],
              "verification": verdict,
          }, sort_keys=True))
          PY

      - name: Upload localization diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdpval-public-220-composed-semantic-localization-v2
          path: |
            canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2.json
            canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_UNITTEST.log
            canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_STDERR.log
            canonical/evidence/GDPVAL_PUBLIC_220_RUBRIC_ACCEPTANCE_INDEX_20261007_V1.json
            canonical/verification/GDPVAL_PUBLIC_220_RUBRIC_ACCEPTANCE_INDEX_VERIFICATION_20261007_V1.json
          if-no-files-found: error

      - name: Persist content-addressed evidence
        if: github.event_name != 'pull_request' && steps.unit.outcome == 'success' && steps.population.outcome == 'success' && steps.rubric.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "Project Brain GDPval Localizer"
          git config user.email "project-brain-gdpval-localizer@users.noreply.github.com"
          git add \
            canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2.json \
            canonical/evidence/GDPVAL_PUBLIC_220_RUBRIC_ACCEPTANCE_INDEX_20261007_V1.json \
            canonical/verification/GDPVAL_PUBLIC_220_RUBRIC_ACCEPTANCE_INDEX_VERIFICATION_20261007_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "Bind GDPval public 220 composed semantic localization v2"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

      - name: Enforce verification result
        if: always()
        run: |
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.population.outcome }}" = "success"
          test "${{ steps.rubric.outcome }}" = "success"
