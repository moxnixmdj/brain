name: GDPval public 220 composed semantic localization v2

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/gdpval_semantic_complement_localizer_v2.py"
      - "canonical/tests/test_gdpval_semantic_complement_localizer_v2.py"
      - ".github/workflows/gdpval-semantic-complement-v2.yml"
      - "canonical/action_intents/ACTION_INTENT_GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_V2_20261007_V1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and unit test with diagnostics
        id: unit
        shell: bash
        run: |
          set +e
          mkdir -p canonical/evidence
          {
            python -m py_compile canonical/runtime/gdpval_semantic_complement_localizer_v2.py
            python -m py_compile canonical/tests/test_gdpval_semantic_complement_localizer_v2.py
            python -m unittest -v canonical.tests.test_gdpval_semantic_complement_localizer_v2
          } > canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_UNITTEST.log 2>&1
          code=$?
          cat canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_UNITTEST.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Execute public 220 localization with diagnostics
        id: population
        if: steps.unit.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python -m canonical.runtime.gdpval_semantic_complement_localizer_v2             > canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2.json             2> canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_STDERR.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if test -f canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2.json; then
            python - <<'PY'
import json
p="canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2.json"
try:
    x=json.load(open(p))
    print(json.dumps({"status":x.get("status"),"population":x.get("population"),"aggregate":x.get("aggregate"),"compound_candidate_counts":x.get("compound_candidate_counts")},sort_keys=True))
except Exception as exc:
    print("RESULT_JSON_PARSE_FAILED",type(exc).__name__,str(exc))
PY
          fi
          cat canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_STDERR.log || true
          exit 0

      - name: Upload all diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdpval-public-220-composed-semantic-localization-v2-diagnostics
          path: |
            canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2.json
            canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_UNITTEST.log
            canonical/evidence/GDPVAL_PUBLIC_220_COMPOSED_SEMANTIC_LOCALIZATION_20261007_V2_STDERR.log
          if-no-files-found: error

      - name: Enforce
        if: always()
        shell: bash
        run: |
          test "${{ steps.unit.outputs.exit_code }}" = "0"
          test "${{ steps.population.outputs.exit_code }}" = "0"
