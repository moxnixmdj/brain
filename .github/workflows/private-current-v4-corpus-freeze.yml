name: Private current V4 corpus freeze carrier
on:
  pull_request:
    branches: [main]
    paths:
      - "v4_private_freeze_trigger/**"
permissions:
  contents: write
jobs:
  freeze:
    if: startsWith(github.head_ref, 'private-v4-freeze-trigger-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact current mechanism bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical/runtime/post_delegation_v4_index_adapter_v1.py)" = "8b2bf05d2a67726af4ad744e2bab129c9a6d67a3"
          test "$(git hash-object canonical/runtime/post_delegation_frontier_recompile_v1.py)" = "47adb1b3c91fde4972563a58b466c22eba0278a1"
          test "$(git hash-object canonical/runtime/proof_atom_receipt_index_v4.py)" = "712443ddad23aed8d27df1e4f5372147c00ca57a"
          test "$(git hash-object canonical/runtime/canonical_proof_atom_basis_v2.py)" = "5b5957f353edab6c86a34f947ef253099822b0d1"
          test "$(git hash-object canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V5.json)" = "4b5517dbd12978f8ffe481fb775e85592c7790c8"
          test "$(git hash-object canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json)" = "ec0ca144939a19234f1c53378cc76af2014a6179"
          test "$(git hash-object canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json)" = "898e450c62c06cf6d1a4a3f826a255da9161a229"
      - name: Execute private full-corpus freeze
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          python canonical/runtime/post_delegation_v4_index_adapter_v1.py > /tmp/current-v4-result.json
          SOURCE_HEAD="$SOURCE_HEAD" SOURCE_TREE="$SOURCE_TREE" python - <<'PY'
          import json,os,pathlib
          src=json.load(open("/tmp/current-v4-result.json",encoding="utf-8"))
          assert src["status"].startswith("PASS__POST_DELEGATION_39_ATOM_V4_CORPUS_INDEX")
          idx=src["v4_index"]
          assert idx["status"].startswith("PASS__CORPUS_BOUND_CONTENT_ADDRESSED_CANDIDATE_INDEX")
          assert idx["canonical_atom_count"]==39
          assert src["capability_credit_delta"]==0 and src["family_credit_delta"]==0
          assert src["execution_authority"] is False and src["promotion_authority"] is False
          doc={
            "schema":"PROJECT_BRAIN_POST_DELEGATION_V4_PRIVATE_CORPUS_FREEZE_V1",
            "date":"2026-10-03",
            "status":"PRIVATE_SAFE_CARRIER_EXECUTION_PASS__39_ATOM_CORPUS_FROZEN__CANDIDATE_RECEIPTS_ONLY__ZERO_CREDIT",
            "source_head_sha":os.environ["SOURCE_HEAD"],
            "source_tree_sha":os.environ["SOURCE_TREE"],
            "carrier":"PRIVATE_GITHUB_ACTIONS_EXACT_HEAD_CHECKOUT",
            "private_corpus_exposed_to_public_verifier":False,
            "mechanism_verification":"canonical/verification/POST_DELEGATION_V4_INDEX_ADAPTER_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json",
            "result":src,
            "terminal_results_replayed":0,
            "new_reality_units_consumed":0,
            "incremental_spend_usd":0,
            "capability_credit_delta":0,
            "family_credit_delta":0,
            "execution_authority":False,
            "promotion_authority":False,
            "next":"ADJUDICATE_CONTENT_ADDRESSED_CANDIDATE_RECEIPTS_IN_REVIEW_QUEUE__NO_ATOM_CREDIT_UNTIL_INDEPENDENT_SEMANTIC_SCOPE_AND_METRIC_BINDING_VERIFICATION__RUN_FIXED_POINT_AFTER_EACH_VERIFIED_FACT"
          }
          path=pathlib.Path("canonical/governance/POST_DELEGATION_V4_PRIVATE_CORPUS_FREEZE_20261003_V1.json")
          path.write_text(json.dumps(doc,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
      - name: Commit frozen result to trigger branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "brain-private-freeze"
          git config user.email "brain-private-freeze@users.noreply.github.com"
          git add canonical/governance/POST_DELEGATION_V4_PRIVATE_CORPUS_FREEZE_20261003_V1.json
          git commit -m "Freeze current private 39-atom V4 corpus result"
          git push origin HEAD:${{ github.head_ref }}
