name: Verify U-empty selected-discriminator bridge current v1
on:
  pull_request:
    paths:
      - canonical/governance/SELECTED_DISCRIMINATOR_POLICY_COVER_BRIDGE_20261007_V1.json
      - canonical/runtime/selected_discriminator_policy_cover_bridge_verifier_v1.py
      - canonical/tests/test_selected_discriminator_policy_cover_bridge_v1.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input pytest
      - run: python canonical/runtime/selected_discriminator_policy_cover_bridge_verifier_v1.py
      - run: python -m pytest -q canonical/tests/test_selected_discriminator_policy_cover_bridge_v1.py
