# branch-verification-v2
name: verify-sec-issuer-extension-custom-semantics
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/sec_issuer_extension_concept_semantics_v1.py
      - canonical/runtime/sec_issuer_extension_concept_semantics_verify_v1.py
      - canonical/runtime/sec_issuer_extension_fact_semantics_bind_v1.py
      - canonical/runtime/sec_issuer_extension_fact_semantics_bind_verify_v1.py
      - canonical/tests/test_sec_issuer_extension_concept_semantics_v1.py
      - canonical/tests/test_sec_issuer_extension_fact_semantics_bind_v1.py
      - .github/workflows/verify-sec-issuer-extension-custom-semantics.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==8.4.2
      - run: python -m py_compile canonical/runtime/bound_capabilities/sec_issuer_extension_concept_semantics_v1.py canonical/runtime/sec_issuer_extension_concept_semantics_verify_v1.py canonical/runtime/sec_issuer_extension_fact_semantics_bind_v1.py canonical/runtime/sec_issuer_extension_fact_semantics_bind_verify_v1.py
      - run: python -m pytest -q canonical/tests/test_sec_issuer_extension_concept_semantics_v1.py canonical/tests/test_sec_issuer_extension_fact_semantics_bind_v1.py
