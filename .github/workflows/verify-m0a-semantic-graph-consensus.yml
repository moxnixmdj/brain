name: Verify M0A semantic graph consensus
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/m0a_semantic_graph_consensus.py
      - canonical/tests/test_m0a_semantic_graph_consensus.py
      - .github/workflows/verify-m0a-semantic-graph-consensus.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_m0a_semantic_graph_consensus
