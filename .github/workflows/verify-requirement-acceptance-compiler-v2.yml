name: Verify requirement acceptance compiler v2

on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/requirement_acceptance_compiler.py
      - canonical/runtime/independent_acceptance_model.py
      - canonical/tests/test_requirement_acceptance_compiler_unittest.py
      - .github/workflows/verify-requirement-acceptance-compiler-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_requirement_acceptance_compiler_unittest
