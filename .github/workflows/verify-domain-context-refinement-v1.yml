name: verify-domain-context-refinement-v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/domain_mapping_truth_certificate_v1.py
      - canonical/runtime/source_aligned_regcap_context_proof_v1.py
      - canonical/tests/test_domain_mapping_contextual_refinement_v1.py
      - .github/workflows/verify-domain-context-refinement-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest canonical.tests.test_domain_mapping_contextual_refinement_v1 -v
