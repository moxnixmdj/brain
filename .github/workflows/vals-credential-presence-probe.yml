name: Probe Vals credential presence
# probe-trigger: 2026-10-07-v6-same-repo-pr-transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vals-credential-presence-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canonical/action_intents/VALS_CREDENTIAL_PRESENCE_PROBE_ACTIVATION_20261007_V1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: ${{ github.event_name != 'pull_request' || (github.head_ref == 'activate/vals-presence-probe-20261007' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      VALS_API_KEY: ${{ secrets.VALS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record nonspending credential presence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical/verification
          python3 - <<'PY'
          import json, os
          out={
            "schema":"PROJECT_BRAIN_VALS_CREDENTIAL_PRESENCE_PROBE_V1",
            "date":"2026-10-07",
            "status":"VALS_API_KEY_PRESENT" if bool(os.environ.get("VALS_API_KEY")) else "VALS_API_KEY_ABSENT",
            "credential_present":bool(os.environ.get("VALS_API_KEY")),
            "network_requests":0,
            "model_or_benchmark_requests":0,
            "purchases_or_topups":0,
            "secret_values_emitted":False,
            "incremental_spend_usd":0,
            "terminal_credit_delta":0
          }
          with open("canonical/verification/VALS_CREDENTIAL_PRESENCE_PROBE_20261007_V1.json","w",encoding="utf-8") as f:
            json.dump(out,f,indent=2,sort_keys=True); f.write("\n")
          print(out["status"])
          PY

      - name: Upload sanitized receipt before repository write
        uses: actions/upload-artifact@v4
        with:
          name: vals-credential-presence-receipt
          path: canonical/verification/VALS_CREDENTIAL_PRESENCE_PROBE_20261007_V1.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit sanitized receipt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Brain Vals Probe"
          git config user.email "project-brain-vals-probe@users.noreply.github.com"
          git add canonical/verification/VALS_CREDENTIAL_PRESENCE_PROBE_20261007_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Vals credential presence"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 1; continue; }
            git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1
