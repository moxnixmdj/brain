name: Verify direct image OCR deductive reuse
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/image_ocr_tesseract.py
      - canonical/tests/test_image_ocr_tesseract.py
      - canonical/verification/verify_image_ocr_tesseract_reuse.py
      - canonical/verification/verify_pinned_image_ocr_surface.py
      - .github/workflows/verify-image-ocr-tesseract-reuse.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr=5.3.4-1build5 \
            libtesseract5=5.3.4-1build5 \
            tesseract-ocr-eng=1:4.1.0-2
      - run: python -m unittest -v canonical.tests.test_image_ocr_tesseract
      - run: python canonical/verification/verify_image_ocr_tesseract_reuse.py
      - run: python -m canonical.verification.verify_pinned_image_ocr_surface
