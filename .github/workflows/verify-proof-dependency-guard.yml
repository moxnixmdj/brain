name: Verify proof dependency guard
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/proof_dependency_guard.py
      - canonical/tests/test_proof_dependency_guard.py
      - canonical/governance/PROOF_DEPENDENCY_INVALIDATION_PROTOCOL_V1.json
      - .github/workflows/verify-proof-dependency-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_proof_dependency_guard
