name: Verify proof atom receipt index v2
on:
  pull_request:
    paths:
      - "canonical/runtime/proof_atom_receipt_index_v2.py"
      - "canonical/tests/test_proof_atom_receipt_index_v2.py"
      - "canonical/governance/PROOF_ATOM_RECEIPT_INDEX_V2.json"
      - "canonical/runtime/canonical_proof_atom_basis_v2.py"
      - "canonical/tests/test_canonical_proof_atom_basis_v2.py"
      - "canonical/governance/CANONICAL_PROOF_ATOM_BASIS_V2_ACTIVATION_V1.json"
      - "canonical/governance/CANONICAL_PROOF_ATOM_BASIS_V2_ACTIVE_AUTHORITY_V1.json"
      - "canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json"
      - "canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V5.json"
      - "canonical/verification/CANONICAL_PROOF_ATOM_BASIS_V2_HARDENED_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - ".github/workflows/verify-proof-atom-receipt-index-v2.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V2 receipt index tests
        run: python -m unittest canonical.tests.test_proof_atom_receipt_index_v2 -v
      - name: Execute authority-bound corpus scan
        run: python -m canonical.runtime.proof_atom_receipt_index_v2 > proof_atom_receipt_index_v2_scan.json
      - name: Print exact scan summary
        run: |
          python - <<'PY'
          import json
          p="proof_atom_receipt_index_v2_scan.json"
          x=json.load(open(p,encoding="utf-8"))
          print(json.dumps({
              "status": x["status"],
              "canonical_atom_count": x["canonical_atom_count"],
              "scanned_file_count": x["scanned_file_count"],
              "candidate_match_count": x["candidate_match_count"],
              "atoms_with_candidate_matches": x["atoms_with_candidate_matches"],
              "atoms_without_candidate_matches": x["atoms_without_candidate_matches"],
              "basis_binding": x["basis_binding"],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: proof-atom-receipt-index-v2-scan
          path: proof_atom_receipt_index_v2_scan.json
          if-no-files-found: error
