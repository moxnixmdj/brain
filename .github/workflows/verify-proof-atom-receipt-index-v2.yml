name: Verify proof atom receipt index v2
on:
  pull_request:
    paths:
      - "canonical/runtime/proof_atom_receipt_index_v2.py"
      - "canonical/tests/test_proof_atom_receipt_index_v2.py"
      - "canonical/governance/PROOF_ATOM_RECEIPT_INDEX_V2.json"
      - "canonical/runtime/canonical_proof_atom_basis_v2.py"
      - "canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json"
      - "canonical/runtime/proof_atom_receipt_snapshot_v1.py"
      - "canonical/tests/test_proof_atom_receipt_snapshot_v1.py"
      - ".github/workflows/verify-proof-atom-receipt-index-v2.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V2 receipt index and sealed-universe tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest canonical.tests.test_proof_atom_receipt_index_v2 canonical.tests.test_proof_atom_receipt_snapshot_v1 -v > /tmp/proof_atom_corpus_completeness_tests.txt 2>&1
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-atom-corpus-completeness-tests
          path: /tmp/proof_atom_corpus_completeness_tests.txt
          if-no-files-found: error
      - name: Enforce test result
        run: test "${{ steps.tests.outputs.rc }}" = "0"
