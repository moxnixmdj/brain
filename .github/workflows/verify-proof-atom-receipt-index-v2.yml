name: Verify proof atom receipt index v2
on:
  pull_request:
    paths:
      - "canonical/runtime/proof_atom_receipt_index_v2.py"
      - "canonical/tests/test_proof_atom_receipt_index_v2.py"
      - "canonical/governance/PROOF_ATOM_RECEIPT_INDEX_V2.json"
      - "canonical/runtime/canonical_proof_atom_basis_v2.py"
      - "canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json"
      - ".github/workflows/verify-proof-atom-receipt-index-v2.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V2 receipt index tests
        shell: bash
        run: |
          set +e
          python -m unittest canonical.tests.test_proof_atom_receipt_index_v2 -v > /tmp/v2-index-tests.txt 2>&1
          RC=$?
          printf '%s\n' "$RC" > /tmp/v2-index-tests.rc
          cat /tmp/v2-index-tests.txt
          exit 0
      - name: Upload V2 index diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-index-test-diagnostic
          path: |
            /tmp/v2-index-tests.txt
            /tmp/v2-index-tests.rc
          if-no-files-found: error
      - name: Enforce V2 index tests
        shell: bash
        run: test "$(cat /tmp/v2-index-tests.rc)" = "0"
