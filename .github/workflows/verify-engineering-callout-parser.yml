name: Verify engineering callout parser
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/engineering_callout_parser.py
      - canonical/tests/test_engineering_callout_parser.py
      - .github/workflows/verify-engineering-callout-parser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_engineering_callout_parser
