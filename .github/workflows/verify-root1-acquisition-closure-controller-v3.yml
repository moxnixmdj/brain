name: Verify Root1 acquisition closure controller V3

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/root1_acquisition_closure_controller_v3.py"
      - "canonical/tests/test_root1_acquisition_closure_controller_v3.py"
      - "canonical/governance/ROOT1_ACQUISITION_CLOSURE_CONTROLLER_V3.json"
      - "canonical/governance/ROOT1_TERMINAL_FAMILY_ENVELOPE_AUDIT_V1.json"
      - ".github/workflows/verify-root1-acquisition-closure-controller-v3.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Root1 V3
        run: |
          python -m py_compile canonical/runtime/root1_acquisition_closure_controller_v3.py
      - name: Run Root1 V3 tests
        run: |
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_root1_acquisition_closure_controller_v3 -v
