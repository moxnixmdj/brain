name: Account bound route preflight
on:
  push:
    branches:
      - preflight/account-bound-routes-20261003
    paths:
      - ".github/workflows/preflight-account-bound-routes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Credential presence only
        shell: bash
        run: |
          if [ -n "$HF_TOKEN" ] || [ -n "$HUGGINGFACE_TOKEN" ]; then
            echo "HF_CREDENTIAL=PRESENT"
          else
            echo "HF_CREDENTIAL=ABSENT"
          fi
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$GOOGLE_API_KEY" ]; then
            echo "GEMINI_CREDENTIAL=PRESENT"
          else
            echo "GEMINI_CREDENTIAL=ABSENT"
          fi
