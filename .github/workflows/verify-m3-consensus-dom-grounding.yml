name: Verify M3 consensus DOM grounding
on:
  push:
    branches: [obs-m3-consensus-grounding-20261002]
    paths:
      - canonical/runtime/consensus_dom_grounding.py
      - canonical/tests/test_consensus_dom_grounding.py
      - .github/workflows/verify-m3-consensus-dom-grounding.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/consensus_dom_grounding.py
      - canonical/tests/test_consensus_dom_grounding.py
      - .github/workflows/verify-m3-consensus-dom-grounding.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_consensus_dom_grounding
