name: Verify proof obligation delta compiler

on:
  push:
    paths:
      - "canonical/runtime/proof_obligation_delta_compiler_v1.py"
      - "canonical/tests/test_proof_obligation_delta_compiler_v1.py"
      - "canonical/governance/PROOF_OBLIGATION_DELTA_COMPILER_ACTIVATION_V1.json"
      - ".github/workflows/verify-proof-obligation-delta-compiler.yml"
  pull_request:
    paths:
      - "canonical/runtime/proof_obligation_delta_compiler_v1.py"
      - "canonical/tests/test_proof_obligation_delta_compiler_v1.py"
      - "canonical/governance/PROOF_OBLIGATION_DELTA_COMPILER_ACTIVATION_V1.json"
      - ".github/workflows/verify-proof-obligation-delta-compiler.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run obligation delta compiler tests
        run: python -m unittest canonical.tests.test_proof_obligation_delta_compiler_v1 -v
