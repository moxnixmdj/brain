name: Verify post-V7 current terminal routing

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/CURRENT_ZERO_REALITY_MINIMUM_CUT_ACTIVE_POINTER_V1.json"
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/runtime/current_terminal_routing_post_v7_verifier.py"
      - ".github/workflows/verify-post-v7-current-terminal-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m json.tool canonical/governance/CURRENT_ZERO_REALITY_MINIMUM_CUT_ACTIVE_POINTER_V1.json > /dev/null
      - run: python -m json.tool canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json > /dev/null
      - run: python -m py_compile canonical/runtime/current_terminal_routing_post_v7_verifier.py
      - run: python canonical/runtime/current_terminal_routing_post_v7_verifier.py
