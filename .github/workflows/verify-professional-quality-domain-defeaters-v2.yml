name: verify-professional-quality-domain-defeaters-v2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/PROFESSIONAL_QUALITY_ASSURANCE_GRAPH_20261009_V2.json
      - canonical/governance/PROFESSIONAL_QUALITY_DOMAIN_DEFEATER_CATALOG_20261009_V2.json
      - canonical/governance/PROFESSIONAL_QUALITY_EXISTING_EVIDENCE_REUSE_MATRIX_20261009_V1.json
      - canonical/tests/test_professional_quality_assurance_graph_v2.py
      - .github/workflows/verify-professional-quality-domain-defeaters-v2.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest canonical.tests.test_professional_quality_assurance_graph_v2 -v
