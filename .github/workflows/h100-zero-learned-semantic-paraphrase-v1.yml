name: H100 zero-learned semantic paraphrase V1

on:
  push:
    branches:
      - research/h100-zero-learned-semantic-paraphrase-v1
    paths:
      - 'canonical/governance/H100_ZERO_LEARNED_SEMANTIC_PARAPHRASE_PREEXPOSURE_V1.json'
      - 'canonical/governance/H100_ZERO_LEARNED_SEMANTIC_PARAPHRASE_CANDIDATE_V1.json'
      - 'canonical/runtime/h100_zero_learned_semantic_paraphrase_v1.py'
      - 'canonical/tests/test_h100_zero_learned_semantic_paraphrase_v1.py'
      - '.github/workflows/h100-zero-learned-semantic-paraphrase-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/H100_ZERO_LEARNED_SEMANTIC_PARAPHRASE_PREEXPOSURE_V1.json'
      - 'canonical/governance/H100_ZERO_LEARNED_SEMANTIC_PARAPHRASE_CANDIDATE_V1.json'
      - 'canonical/runtime/h100_zero_learned_semantic_paraphrase_v1.py'
      - 'canonical/tests/test_h100_zero_learned_semantic_paraphrase_v1.py'
      - '.github/workflows/h100-zero-learned-semantic-paraphrase-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run semantic paraphrase tests
        run: python -m unittest canonical.tests.test_h100_zero_learned_semantic_paraphrase_v1 -v
