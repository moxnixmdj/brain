name: Verify composition state capsule V2 hardening

on:
  pull_request:
    paths:
      - "canonical/governance/COMPOSITION_STATE_CAPSULE_V2_NONFINITE_JSON_HARDENING_20261005_V1.json"
      - "canonical/runtime/composition_state_capsule_v2.py"
      - "canonical/tests/test_composition_state_capsule_v2.py"
      - ".github/workflows/verify-composition-state-capsule-v2-hardening.yml"
  push:
    branches: [main]
    paths:
      - "canonical/governance/COMPOSITION_STATE_CAPSULE_V2_NONFINITE_JSON_HARDENING_20261005_V1.json"
      - "canonical/runtime/composition_state_capsule_v2.py"
      - "canonical/tests/test_composition_state_capsule_v2.py"
      - ".github/workflows/verify-composition-state-capsule-v2-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Verify exact frozen subject blobs
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          expected = {
              "canonical/governance/COMPOSITION_STATE_CAPSULE_V2_NONFINITE_JSON_HARDENING_20261005_V1.json": "a8d5d50514ce340c2ca69fa8bf6d005283faec67",
              "canonical/runtime/composition_state_capsule_v2.py": "b218d2bc70206a88a43e87471346d39fcedd6d3b",
              "canonical/tests/test_composition_state_capsule_v2.py": "309569be0841429ed190b3f98dbe35d2c946a180",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if got != want:
                  raise SystemExit(f"BLOB_DRIFT {path} {got} != {want}")
          print("EXACT_BLOBS_PASS")
      - name: Validate governance JSON
        run: python -m json.tool canonical/governance/COMPOSITION_STATE_CAPSULE_V2_NONFINITE_JSON_HARDENING_20261005_V1.json >/dev/null
      - name: Run V2 adversarial tests
        run: python -m unittest -v canonical.tests.test_composition_state_capsule_v2
