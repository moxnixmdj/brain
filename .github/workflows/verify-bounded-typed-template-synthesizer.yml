name: Verify bounded typed template synthesizer
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/typed_template_synthesizer.py
      - canonical/tests/test_typed_template_synthesizer.py
      - .github/workflows/verify-bounded-typed-template-synthesizer.yml
  push:
    branches: [main]
    paths:
      - canonical/runtime/typed_template_synthesizer.py
      - canonical/tests/test_typed_template_synthesizer.py
      - .github/workflows/verify-bounded-typed-template-synthesizer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_typed_template_synthesizer
