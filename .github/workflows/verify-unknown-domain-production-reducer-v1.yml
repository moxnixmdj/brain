name: Verify Unknown-Domain production reducer V1

on:
  pull_request:
    paths:
      - "canonical/runtime/unknown_domain_direct_production_reducer_v1.py"
      - "canonical/tests/test_unknown_domain_direct_production_reducer_v1.py"
      - ".github/workflows/verify-unknown-domain-production-reducer-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify independent reducer
        run: |
          python -m pip install pytest
          pytest -q canonical/tests/test_unknown_domain_direct_production_reducer_v1.py
