name: Verify owned causal falsification v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/verification/test_owned_causal_falsification_v1.py'
      - 'canonical/capabilities/internalized/causal_falsification/agent_replay_v1/**'
      - '.github/workflows/verify-owned-causal-falsification-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Brain-owned kernel without donor install
        run: python canonical/verification/test_owned_causal_falsification_v1.py
