name: Verify terminal authorization integrity

on:
  pull_request:
    paths:
      - canonical/runtime/terminal_authority_integrity_guard.py
      - canonical/tests/test_terminal_authority_integrity_guard.py
      - canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json
      - canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json
      - canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json
      - canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json
      - canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json
      - canonical/verification/TERMINAL_AUTHORITY_DERIVATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json
      - .github/workflows/verify-terminal-authorization-integrity.yml
  push:
    branches: [main]
    paths:
      - canonical/runtime/terminal_authority_integrity_guard.py
      - canonical/tests/test_terminal_authority_integrity_guard.py
      - canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json
      - canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json
      - canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json
      - canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json
      - canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json
      - canonical/verification/TERMINAL_AUTHORITY_DERIVATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json
      - .github/workflows/verify-terminal-authorization-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest -v canonical.tests.test_terminal_authority_integrity_guard 2>&1 | tee /tmp/unit.txt
      - name: Live exact-world guard
        id: guard
        continue-on-error: true
        run: |
          python canonical/runtime/terminal_authority_integrity_guard.py > /tmp/guard.json 2> /tmp/guard.stderr
      - name: Publish deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-authority-integrity-diagnostics
          path: |
            /tmp/unit.txt
            /tmp/guard.json
            /tmp/guard.stderr
          if-no-files-found: warn
      - name: Enforce pass
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          unit=pathlib.Path('/tmp/unit.txt').read_text() if pathlib.Path('/tmp/unit.txt').exists() else ''
          assert 'FAILED (' not in unit and 'ERROR' not in unit, unit
          p=json.load(open('/tmp/guard.json'))
          assert p['pass'] is True, p
          assert p['launch_integrity'] is True, p
          assert p['terminal_results_observed']==0
          assert p['fresh_terminal_evidence_consumed']==0
          print(json.dumps({'status':p['status'],'bound_files':p['bound_files']},sort_keys=True))
          PY
