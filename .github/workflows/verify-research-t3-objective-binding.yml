name: Verify research T3 objective binding

on:
  push:
    branches: [main]
    paths:
      - canonical/governance/RESEARCH_T3_OBJECTIVE_TERMINAL_BINDING_V1.json
      - canonical/runtime/research_t3_objective_binding_validator.py
      - canonical/tests/test_research_t3_objective_binding_validator.py
      - canonical/runtime/research_control_information_safe_proof.py
      - canonical/runtime/research_control_information_safe_candidate.py
      - canonical/governance/GLOBAL_TERMINAL_SELECTION_KERNEL_V1.json
      - canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json
      - canonical/governance/OUTER_TERMINAL_MULTIPLEX_PORTFOLIOS_V1.json
      - canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json
      - canonical/governance/OBJECTIVE_ORACLE_DOMINANCE_LIVE_INPUT_V1.json
      - canonical/verification/RESEARCH_CONTROL_INFORMATION_SAFE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json
      - .github/workflows/verify-research-t3-objective-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_research_t3_objective_binding_validator
      - run: python canonical/runtime/research_t3_objective_binding_validator.py .
