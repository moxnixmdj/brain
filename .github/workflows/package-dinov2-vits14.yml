name: Package DINOv2 ViT-S14 capability bytes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-dinov2-vits14.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Acquire and checksum raw checkpoint without executing it
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dinov2_vits14_package"
          mkdir -p "$out"
          url="https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth"
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 "$url" -o "$out/dinov2_vits14_pretrain.pth"
          size="$(stat -c '%s' "$out/dinov2_vits14_pretrain.pth")"
          sha="$(sha256sum "$out/dinov2_vits14_pretrain.pth" | awk '{print $1}')"
          python -c 'import json,sys; p,sha,size=sys.argv[1],sys.argv[2],int(sys.argv[3]); d={"schema":"PROJECT_BRAIN_INTERNALIZED_DINOV2_VITS14_V1","date":"2026-10-02","status":"CHECKSUM_BOUND_CAPABILITY_PACKAGE_READY_FOR_DURABLE_DRIVE_MIRROR__ZERO_CAPABILITY_CREDIT","upstream_repository":"facebookresearch/dinov2","upstream_commit":"7764ea0f912e53c92e82eb78a2a1631e92725fc8","model":"dinov2_vits14 distilled backbone","parameter_count_millions":21,"upstream_model_card_license":"Apache-2.0","checkpoint_source":"https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth","checkpoint_sha256":sha,"checkpoint_size_bytes":size,"acquisition_execution_policy":"RAW_BYTES_ONLY__NO_PICKLE_EXECUTION_DURING_ACQUISITION","incremental_spend_usd":0,"capability_credit_delta":0,"family_credit_delta":0}; open(p,"w",encoding="utf-8").write(json.dumps(d,indent=2,sort_keys=True)+"\n")' "$out/INTERNALIZATION_MANIFEST.json" "$sha" "$size"
          (cd "$out" && sha256sum dinov2_vits14_pretrain.pth INTERNALIZATION_MANIFEST.json > PACKAGE_SHA256SUMS.txt)
          echo "checkpoint_size_bytes=$size"
          echo "checkpoint_sha256=$sha"

      - name: Publish exact capability package artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-dinov2-vits14-capability-package
          path: ${{ runner.temp }}/dinov2_vits14_package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
