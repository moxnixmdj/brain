name: Verify Root3 child-process registry V1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/root3_child_process_channel_registry_v1.py
      - canonical/tests/test_root3_child_process_channel_registry_v1.py
      - canonical/governance/ROOT3_CHILD_PROCESS_CHANNEL_REGISTRY_20261005_V1.json
      - .github/workflows/verify-root3-child-process-registry-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile exact child-process universe
        run: python canonical/runtime/root3_child_process_channel_registry_v1.py
      - name: Run fail-closed registry tests
        run: python -m pytest -q canonical/tests/test_root3_child_process_channel_registry_v1.py
