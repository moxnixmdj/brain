name: Verify drawing annotation constraint pipeline
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/drawing_annotation_constraint_pipeline.py
      - canonical/tests/test_drawing_annotation_constraint_pipeline.py
      - canonical/runtime/raw_drawing_primitives.py
      - canonical/runtime/engineering_feature_notation.py
      - canonical/runtime/engineering_callout_parser.py
      - canonical/runtime/declarative_notation_grammar.py
      - canonical/runtime/declarative_engineering_notation.py
      - canonical/runtime/visual_symbol_template_matcher.py
      - canonical/runtime/callout_geometry_association.py
      - canonical/runtime/feature_constraint_composer.py
      - .github/workflows/verify-drawing-annotation-constraint-pipeline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input numpy opencv-python-headless
      - run: python -m unittest -v canonical.tests.test_drawing_annotation_constraint_pipeline
