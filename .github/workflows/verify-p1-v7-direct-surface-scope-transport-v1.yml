name: Verify P1 V7 direct-surface scope transport v1

on:
  pull_request:
    paths:
      - "canonical/governance/P1_V7_DIRECT_SURFACE_SCOPE_TRANSPORT_GATE_V1.json"
      - "canonical/runtime/p1_v7_direct_surface_scope_transport_v1.py"
      - "canonical/tests/test_p1_v7_direct_surface_scope_transport_v1.py"
      - "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json"
      - "canonical/governance/TERMINAL_PORTFOLIO_BINDING_MANIFESTS_V1.json"
      - "canonical/governance/CONTRACT_NATIVE_PRIVATE_SURFACE_PROOF_ROUTES_V1.json"
      - "canonical/governance/FOUR_UNCOVERED_BEHAVIORAL_PROOF_CONTRACTS_V1.json"
      - "canonical/verification/P1_V6_DERIVED_ONLY_SCOPE_FALSIFICATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/verification/P1_V7_CURRENT_MAIN_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/governance/P1_TYPED_CAUSAL_INTERVENTION_ENVELOPE_V7.json"
      - "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json"
      - ".github/workflows/verify-p1-v7-direct-surface-scope-transport-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run gate tests
        run: python -m unittest canonical.tests.test_p1_v7_direct_surface_scope_transport_v1 -v
      - name: Execute zero-reality transport gate
        run: python -m canonical.runtime.p1_v7_direct_surface_scope_transport_v1 > p1-v7-direct-surface-transport.json
      - name: Enforce classified current verdict and zero credit
        run: |
          python - <<'PY'
          import json
          p=json.load(open("p1-v7-direct-surface-transport.json"))
          assert p["status"] == "FAIL_CLOSED__V7_DIRECT_SURFACE_FAILURE_SEMANTICS_TRANSPORT_NOT_PROVED__ZERO_CREDIT", p
          assert p["classification"] == "FORMAL_INPUT_BINDING_RESIDUAL", p
          assert p["surface_count"] == 3, p
          assert p["failure_semantics_transport_explicit"] is False, p
          assert p["missing_transport_fact"] == "EXPLICIT_FROZEN_SURFACE_TO_V7_FAILURE_SEMANTICS_MAPPING_OR_PROOF_PRESERVING_ADAPTER", p
          assert p["terminal_receipts_preserved"]["terminal_results_replayed"] == 0, p
          assert p["new_reality_units_consumed"] == 0, p
          assert p["capability_credit_delta"] == 0, p
          assert p["family_credit_delta"] == 0, p
          assert p["execution_authority"] is False, p
          assert p["promotion_authority"] is False, p
          PY
      - name: Upload zero-reality verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-v7-direct-surface-scope-transport-v1
          path: p1-v7-direct-surface-transport.json
          if-no-files-found: error
