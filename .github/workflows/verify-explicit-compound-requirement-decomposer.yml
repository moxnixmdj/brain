name: Verify explicit compound requirement decomposer
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/explicit_compound_requirement_decomposer.py
      - canonical/tests/test_explicit_compound_requirement_decomposer.py
      - .github/workflows/verify-explicit-compound-requirement-decomposer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_explicit_compound_requirement_decomposer
