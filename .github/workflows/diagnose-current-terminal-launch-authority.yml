name: Diagnose current terminal launch authority
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-current-terminal-launch-authority.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Derive diagnostic without consuming terminal evidence
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_wave_launch_authority_reducer_v1 > /tmp/tests.out 2>&1
          test_rc=$?
          PYTHONPATH=. python canonical/runtime/terminal_wave_launch_authority_reducer_v1.py . > /tmp/authority.json 2>/tmp/authority.err
          reducer_rc=$?
          TEST_RC="$test_rc" REDUCER_RC="$reducer_rc" GITHUB_SHA_VALUE="$GITHUB_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              authority=json.loads(Path("/tmp/authority.json").read_text())
          except Exception:
              authority={"parse_error":True,"stdout":Path("/tmp/authority.json").read_text(errors="replace"),"stderr":Path("/tmp/authority.err").read_text(errors="replace")}
          out={
              "schema":"PROJECT_BRAIN_CURRENT_TERMINAL_LAUNCH_AUTHORITY_DIAGNOSTIC_20261002_V1",
              "source_commit":os.environ["GITHUB_SHA_VALUE"],
              "unit_test_exit_code":int(os.environ["TEST_RC"]),
              "reducer_exit_code":int(os.environ["REDUCER_RC"]),
              "authority":authority,
              "terminal_results_observed":0,
              "fresh_terminal_evidence_consumed":0,
              "capability_credit_delta":0,
              "family_credit_delta":0,
              "incremental_spend_usd":0
          }
          path=Path("canonical/verification/CURRENT_TERMINAL_LAUNCH_AUTHORITY_DIAGNOSTIC_20261002_V1.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "project-brain-ci"
          git config user.email "project-brain-ci@users.noreply.github.com"
          git add canonical/verification/CURRENT_TERMINAL_LAUNCH_AUTHORITY_DIAGNOSTIC_20261002_V1.json
          if ! git diff --cached --quiet; then
            git commit -m "Record current terminal launch authority diagnostic"
            git push origin HEAD:main
          fi
          exit 0
