      - "canonical/governance/TB_SCIENCE_DEDICATED_PLANNER_V2_CANDIDATE.json"
      - "canonical/governance/TB_SCIENCE_PROMOTION_PREFLIGHT_RECONCILIATION_20261003_V1.json"
      - "canonical/governance/TB_SCIENCE_CONSERVATIVE_CENSORING_LOWER_BOUND_V1.json"
      - "canonical/runtime/harbor_science_agent_v1.py"
