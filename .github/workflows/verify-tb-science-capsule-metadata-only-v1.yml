    paths:
      - "canonical/governance/TB_SCIENCE_EXECUTION_CAPSULE_CANDIDATE_V1.json"
      - "canonical/governance/TB_SCIENCE_TERMINAL_EXECUTION_MANIFEST_V1.json"
