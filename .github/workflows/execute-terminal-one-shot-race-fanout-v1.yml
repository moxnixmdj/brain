# retrigger: terminal one-shot fanout after verified rank10 reconciliation
name: Execute terminal one-shot race fanout V1

on:
  push:
    branches: [main]
    paths:
      - 'canonical/astra_runtime/missions/ASTRA_TERMINAL_*_RACE_20261007_V1.json'
      - 'canonical/same_identity_worker/tasks/SI_TERMINAL_*_RACE_20261007_V1.json'
      - 'canonical/runtime/terminal_autopilot_v1.py'
      - 'canonical/runtime/terminal_autopilot_executor_v1.py'
      - '.github/workflows/execute-terminal-one-shot-race-fanout-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-one-shot-race-fanout-v1
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" pytest
      - name: Verify planner and executor before launch
        run: |
          set -euo pipefail
          python -m unittest -v canonical.tests.test_terminal_autopilot_v1 canonical.tests.test_terminal_autopilot_executor_v1
      - name: Execute all runnable one-shot races
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python canonical/runtime/terminal_autopilot_executor_v1.py > /tmp/terminal_one_shot_executor.json 2>/tmp/terminal_one_shot_executor.err
          echo $? > /tmp/terminal_one_shot_executor.rc
          cat /tmp/terminal_one_shot_executor.json || true
          cat /tmp/terminal_one_shot_executor.err >&2 || true
          exit 0
      - name: Re-run mandatory terminal reducer
        shell: bash
        run: |
          set +e
          python canonical/runtime/terminal_closure_reducer.py canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json > /tmp/terminal_one_shot_reducer.json 2>/tmp/terminal_one_shot_reducer.err
          echo $? > /tmp/terminal_one_shot_reducer.rc
          cat /tmp/terminal_one_shot_reducer.json || true
          exit 0
      - name: Persist exact race outputs only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical/verification
          python - <<'PY'
          import json, os, pathlib
          def read(p):
              q=pathlib.Path(p)
              return q.read_text(errors='replace') if q.exists() else ''
          receipt={
            'schema':'PROJECT_BRAIN_TERMINAL_ONE_SHOT_RACE_FANOUT_EXECUTION_V1',
            'trigger_sha':os.environ.get('GITHUB_SHA'),
            'executor_returncode':int(read('/tmp/terminal_one_shot_executor.rc') or 999),
            'executor_output':read('/tmp/terminal_one_shot_executor.json')[-20000:],
            'executor_stderr':read('/tmp/terminal_one_shot_executor.err')[-12000:],
            'reducer_returncode':int(read('/tmp/terminal_one_shot_reducer.rc') or 999),
            'reducer_output':read('/tmp/terminal_one_shot_reducer.json')[-20000:],
            'terminal_credit_claim':False
          }
          pathlib.Path('canonical/verification/TERMINAL_ONE_SHOT_RACE_FANOUT_EXECUTION_LATEST.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "Project Brain Terminal One-Shot"
          git config user.email "project-brain-terminal-one-shot@users.noreply.github.com"
          git add canonical/verification/TERMINAL_ONE_SHOT_RACE_FANOUT_EXECUTION_LATEST.json
          git add -f canonical/astra_runtime/artifacts/TERMINAL_*_RACE_RESULT_20261007_V1.json 2>/dev/null || true
          git add -f canonical/same_identity_worker/state/SI-TERMINAL-*-RACE-20261007-V1.json 2>/dev/null || true
          git add -f canonical/same_identity_worker/evidence/SI-TERMINAL-*-RACE-20261007-V1__*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Record terminal one-shot race fanout execution"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 1; continue; }
            git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1
      - name: Upload raw execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-one-shot-race-fanout-v1
          if-no-files-found: warn
          retention-days: 90
          path: |
            canonical/verification/TERMINAL_ONE_SHOT_RACE_FANOUT_EXECUTION_LATEST.json
            canonical/astra_runtime/artifacts/TERMINAL_*_RACE_RESULT_20261007_V1.json
            canonical/same_identity_worker/state/SI-TERMINAL-*-RACE-20261007-V1.json
            canonical/same_identity_worker/evidence/SI-TERMINAL-*-RACE-20261007-V1__*.json
