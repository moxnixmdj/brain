name: Execute terminal U-root one-shot V2

on:
  push:
    branches: [main]
    paths:
      - 'canonical/astra_runtime/missions/ASTRA_TERMINAL_U_RACE_20261007_V1.json'
      - 'canonical/same_identity_worker/tasks/SI_TERMINAL_U_RACE_20261007_V1.json'
      - 'canonical/runtime/same_identity_supervisor.py'
      - 'canonical/runtime/root3_production_astra_launcher_v1.py'
      - '.github/workflows/execute-terminal-one-shot-race-fanout-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-u-root-one-shot-v2
  cancel-in-progress: true

# Landing on main goes through the front door (pull request + signed referee check);
# .github/scripts/land_on_main.sh needs the Brain Automation app to open that pull request.
env:
  AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
  AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" pytest
      - name: Hydrate U mission against current OBS and preserve exact scratch bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          mission_path=root/'canonical/astra_runtime/missions/ASTRA_TERMINAL_U_RACE_20261007_V1.json'
          task_path=root/'canonical/same_identity_worker/tasks/SI_TERMINAL_U_RACE_20261007_V1.json'
          def sha256(rel): return hashlib.sha256((root/rel).read_bytes()).hexdigest()
          pointer=json.loads((root/'canonical/CANONICAL_POINTER.json').read_text())
          obs={
            'schema':'PROJECT_BRAIN_CONTINUOUS_OBS_CONTEXT_V1',
            'status':'CURRENT',
            'canonical_generation':pointer['canonical_generation'],
            'canonical_state_dependencies':[
              {'path':'canonical/CANONICAL_POINTER.json','sha256':sha256('canonical/CANONICAL_POINTER.json')},
              {'path':'canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json','sha256':sha256('canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json')},
              {'path':'canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json','sha256':sha256('canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json')},
            ],
            'dependency_inventory_complete':True,
            'material_world_state_dependencies_complete':True,
            'information_boundary_complete':True,
            'information_policy':{'mode':'NO_EXTERNAL_INFORMATION','allowed_exact_sources':[],'allowed_external_tool_kinds':[]},
            'unknown_material_dependencies':[],
            'stale_authority_absent':True,
            'valid_proof_action_priority':True,
            'obs_layers_current':{'goal':True,'capability':True,'blocker':True,'solution':True,'verification':True,'inherited_system':True,'obs_process':True},
            'dependencies':[
              {'dependency_id':'CURRENT_TERMINAL_AUTHORITY','class':'EXECUTION_AUTHORITY','material':True,'volatility':'STATIC','scope':'GLOBAL','status':'READY','evidence':['canonical/governance/CURRENT_TERMINAL_AUTHORITY.json']},
              {'dependency_id':'TERMINAL_ARCHITECTURE_SELF_TOURNAMENT','class':'CANONICAL_STATE','material':True,'volatility':'STATIC','scope':'GLOBAL','status':'READY','evidence':['canonical/governance/TERMINAL_ARCHITECTURE_SELF_TOURNAMENT_20261007_V1.json']},
              {'dependency_id':'CURRENT_PRIMITIVE_U_FRONTIER','class':'CANONICAL_STATE','material':True,'volatility':'STATIC','scope':'GLOBAL','status':'READY','evidence':['canonical/governance/CURRENT_PRIMITIVE_U_FRONTIER_20261007_V1.json']},
              {'dependency_id':'CURRENT_DB_UNION','class':'CANONICAL_STATE','material':True,'volatility':'STATIC','scope':'GLOBAL','status':'READY','evidence':['canonical/governance/DB_EXISTING_EVIDENCE_SATURATION_UNION_20261007_V13.json']},
            ],
          }
          mission=json.loads(mission_path.read_text())
          mission['continuous_obs']=obs
          mission_path.write_text(json.dumps(mission,indent=2,sort_keys=True)+'\n')
          task=json.loads(task_path.read_text())
          task['mission_sha256']=hashlib.sha256(mission_path.read_bytes()).hexdigest()
          task_path.write_text(json.dumps(task,indent=2,sort_keys=True)+'\n')
          out=root/'canonical/verification'
          out.mkdir(parents=True,exist_ok=True)
          (out/'TERMINAL_U_RACE_HYDRATED_MISSION_LATEST.json').write_bytes(mission_path.read_bytes())
          (out/'TERMINAL_U_RACE_HYDRATED_TASK_LATEST.json').write_bytes(task_path.read_bytes())
          print(json.dumps({'mission_sha256':hashlib.sha256(mission_path.read_bytes()).hexdigest(),'task_sha256':hashlib.sha256(task_path.read_bytes()).hexdigest()}))
          PY
          PYTHONPATH=. python canonical/runtime/continuous_obs_runtime.py --root . --work-file canonical/astra_runtime/missions/ASTRA_TERMINAL_U_RACE_20261007_V1.json
      - name: Verify U-root execution substrate
        run: |
          set -euo pipefail
          python -m unittest -v canonical.tests.test_terminal_autopilot_executor_v1
          python canonical/tests/test_terminal_architecture_self_tournament_20261007_v1.py
      - name: Execute the single U-root worker with checkpoint resume
        shell: bash
        run: |
          set +e
          TASK=canonical/same_identity_worker/tasks/SI_TERMINAL_U_RACE_20261007_V1.json
          python canonical/runtime/same_identity_supervisor.py --root . --agent-id SUPERWORKER-TERMINAL-U --task "$TASK" > /tmp/u_first.json 2>/tmp/u_first.err
          RC1=$?
          if [ "$RC1" -eq 75 ]; then
            python canonical/runtime/same_identity_supervisor.py --root . --agent-id SUPERWORKER-TERMINAL-U --task "$TASK" > /tmp/u_second.json 2>/tmp/u_second.err
            RC2=$?
          else
            RC2=999
          fi
          printf '%s\n' "$RC1" > /tmp/u_first.rc
          printf '%s\n' "$RC2" > /tmp/u_second.rc
          cat /tmp/u_first.json || true
          cat /tmp/u_second.json || true
          cat /tmp/u_first.err >&2 || true
          cat /tmp/u_second.err >&2 || true
          exit 0
      - name: Run mandatory terminal reducer after U attempt
        shell: bash
        run: |
          set +e
          python canonical/runtime/terminal_closure_reducer.py canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json > /tmp/u_reducer.json 2>/tmp/u_reducer.err
          echo $? > /tmp/u_reducer.rc
          cat /tmp/u_reducer.json || true
          exit 0
      - name: Persist exact U-root evidence without hydration drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          def read(p):
              q=pathlib.Path(p)
              return q.read_text(errors='replace') if q.exists() else ''
          def sha(p):
              q=pathlib.Path(p)
              return hashlib.sha256(q.read_bytes()).hexdigest() if q.exists() else None
          receipt={
            'schema':'PROJECT_BRAIN_TERMINAL_U_ROOT_ONE_SHOT_EXECUTION_V2',
            'trigger_sha':os.environ.get('GITHUB_SHA'),
            'first_returncode':int((read('/tmp/u_first.rc') or '999').strip()),
            'second_returncode':int((read('/tmp/u_second.rc') or '999').strip()),
            'first_stdout':read('/tmp/u_first.json')[-16000:],
            'second_stdout':read('/tmp/u_second.json')[-24000:],
            'first_stderr':read('/tmp/u_first.err')[-12000:],
            'second_stderr':read('/tmp/u_second.err')[-16000:],
            'hydrated_mission_sha256':sha('canonical/verification/TERMINAL_U_RACE_HYDRATED_MISSION_LATEST.json'),
            'hydrated_task_sha256':sha('canonical/verification/TERMINAL_U_RACE_HYDRATED_TASK_LATEST.json'),
            'reducer_returncode':int((read('/tmp/u_reducer.rc') or '999').strip()),
            'reducer_output':read('/tmp/u_reducer.json')[-24000:],
            'terminal_credit_claim':False
          }
          pathlib.Path('canonical/verification/TERMINAL_U_ROOT_ONE_SHOT_EXECUTION_LATEST.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          # Hydration is execution scratch, not canonical mission mutation.
          git restore -- canonical/astra_runtime/missions/ASTRA_TERMINAL_U_RACE_20261007_V1.json canonical/same_identity_worker/tasks/SI_TERMINAL_U_RACE_20261007_V1.json
          git config user.name "Project Brain Terminal U Root"
          git config user.email "project-brain-terminal-u@users.noreply.github.com"
          git add canonical/verification/TERMINAL_U_ROOT_ONE_SHOT_EXECUTION_LATEST.json
          git add canonical/verification/TERMINAL_U_RACE_HYDRATED_MISSION_LATEST.json
          git add canonical/verification/TERMINAL_U_RACE_HYDRATED_TASK_LATEST.json
          git add -f canonical/astra_runtime/artifacts/TERMINAL_U_RACE_RESULT_20261007_V1.json 2>/dev/null || true
          git add -f canonical/same_identity_worker/state/SI-TERMINAL-U-RACE-20261007-V1.json 2>/dev/null || true
          git add -f canonical/same_identity_worker/evidence/SI-TERMINAL-U-RACE-20261007-V1__*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Record terminal U-root one-shot execution V2"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 1; continue; }
            bash .github/scripts/land_on_main.sh && exit 0
            sleep 1
          done
          exit 1
      - name: Upload exact U-root evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-u-root-one-shot-v2
          if-no-files-found: warn
          retention-days: 90
          path: |
            canonical/verification/TERMINAL_U_ROOT_ONE_SHOT_EXECUTION_LATEST.json
            canonical/verification/TERMINAL_U_RACE_HYDRATED_MISSION_LATEST.json
            canonical/verification/TERMINAL_U_RACE_HYDRATED_TASK_LATEST.json
            canonical/astra_runtime/artifacts/TERMINAL_U_RACE_RESULT_20261007_V1.json
            canonical/same_identity_worker/state/SI-TERMINAL-U-RACE-20261007-V1.json
            canonical/same_identity_worker/evidence/SI-TERMINAL-U-RACE-20261007-V1__*.json
# retrigger_terminal_u_root_20261008_0212_cairo
