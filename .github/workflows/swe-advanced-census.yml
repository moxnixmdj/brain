name: swe-advanced-census

# THE ADVANCED LANE IS THE ONLY THING THAT MEASURES THE PRODUCT.
#
# `execution_guard/swe_advanced_probe_v1.py` runs 49 advanced software-engineering requests
# -- polyglot, build, CI, performance, concurrency, test authoring, debugging, refactoring,
# review, git surgery, design -- through the live front door and records which reached a
# verified outcome and which refused, by name.
#
# Nothing ran it. Measured 2026-10-31 on 34f867a: it reported SERVED 2 of 49 across three
# inventories and two weeks while every workflow in the repository stayed green. The surface
# census next door became a gate at floor 25 on 2026-10-31 and went 25 -> 28. A number that
# nobody can regress is a number nobody fixes.
#
# 2026-10-31: 3 -> 4. The rename sentence that states "the public function total" now reaches
# the rename row that already existed (see test_the_function_name_is_the_one_the_file_defines_v1).
#
# 2026-10-31: 4 -> 5. "Show me the diff of <file> against HEAD~1" reaches the repository row that
# already declared `diff` in OPS (see test_a_row_declares_only_what_it_implements_v1).
#
# The floor is the count that exists today, not a target. When a change raises it, raise the
# floor in the same pull request -- that is the only way the guard keeps meaning what it says.
#
# 2026-11-01: 5 -> 35. The floor had been stale for two weeks: the census served 35 of 49 and the
# gate asked for 5, so eleven refusals could have regressed without a red check. 35 is the number
# measured on this image with the substrate restored (see the restore step below). The two "nothing
# to do" sentences that same round fixed took it to 37 locally; the floor is left at the count that
# is independent of those two rows being routed, and will be raised again the moment a measured
# run on this runner agrees.
#
# There is deliberately NO paths filter: every capability row, its input derivation, the door
# that admits it and the adapter that executes it are in scope, and a filter would miss
# exactly the change that breaks one of them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      floor:
        description: "Minimum number of the 49 advanced requests that must reach a verified outcome"
        required: false
        default: "35"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: swe-advanced-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # THE IMAGE IS PART OF THE MEASUREMENT, SO IT IS PART OF THE JOB.
      #
      # Measured 2026-11-01, same commit, same 49 sentences, two interpreters:
      #   a bare venv (0 of 10 tools)  35 served of 49   41 REAL of 54
      #   this image, restored         35 served of 49   43 REAL of 54
      # The census number does not move, which is exactly why nobody noticed: the two matrix
      # cases that do (`lint`, `type_check`) were answering PASS_SYNTAX_ONLY / PASS_BASELINE_ONLY,
      # an environment fact printed in the column reserved for capability facts. Restoring is one
      # command and takes ~12 s. The census also refuses to print a board if this step fails, so
      # a green run here means the number is about the tree.
      - name: Restore the software-engineering substrate
        shell: bash
        run: python3 scripts/restore_substrate_v1.py

      - name: Run the advanced SWE census
        shell: bash
        run: |
          FLOOR="${{ github.event.inputs.floor }}"
          FLOOR="${FLOOR:-35}"
          python execution_guard/swe_advanced_probe_v1.py \
            --json /tmp/advanced.json --floor "$FLOOR" \
            --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee /tmp/advanced.log

      - name: Upload the census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-advanced-census
          path: |
            /tmp/advanced.json
            /tmp/advanced.log
          if-no-files-found: warn
