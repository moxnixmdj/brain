name: Verify Orthographic Visual Hull 001

on:
  push:
    branches:
      - breakthrough/orthographic-visual-hull-20261002
    paths:
      - canonical/runtime/orthographic_visual_hull.py
      - canonical/tests/test_orthographic_visual_hull.py
      - canonical/capabilities/opus55/ORTHOGRAPHIC_VISUAL_HULL_001.json
      - .github/workflows/verify-orthographic-visual-hull-001.yml
  pull_request:
    paths:
      - canonical/runtime/orthographic_visual_hull.py
      - canonical/tests/test_orthographic_visual_hull.py
      - canonical/capabilities/opus55/ORTHOGRAPHIC_VISUAL_HULL_001.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic and randomized verification
        run: python -m unittest -v canonical.tests.test_orthographic_visual_hull
