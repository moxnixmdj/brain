jobs:
  verify-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile R3 live control surface
        run: >-
          python -m py_compile
          canonical/runtime/autonomous_verified_self_improvement_v1.py
          canonical/runtime/r3_improvement_queue_driver_v1.py
          canonical/runtime/r3_root1_adapter_gap_witness_v1.py
          canonical/runtime/r3_verification_frontier_repair_reducer_v1.py
          canonical/runtime/r3_quarantine_recovery_v1.py
          canonical/runtime/r3_independent_learning_verifier_v1.py
          canonical/runtime/universal_bound_capability_carrier_v1.py
          canonical/runtime/bound_capability_execution_verifier_v1.py
          canonical/runtime/r3_bound_success_adapter_v1.py
          canonical/runtime/r3_success_adapter_author_context_v1.py
          canonical/runtime/r3_deterministic_mode_guard_patch_author_v1.py
          canonical/runtime/r3_bound_success_checkpoint_verifier_v1.py
          canonical/runtime/executable_skill_program_v7.py
          canonical/runtime/executable_skill_verification_authenticator_v1.py
          canonical/runtime/live_brain_runtime_v1.py
          canonical/runtime/unified_cognitive_fabric_v1.py
      - name: Run R3 skill authority authenticator suite
        run: python -m unittest canonical.tests.test_executable_skill_verification_authenticator_v1 -v
      - name: Run R3 learning regression suite
        run: python -m unittest canonical.tests.test_autonomous_verified_self_improvement_v1 -v
      - name: Run R3 integrator disposition totality suite
        run: python -m unittest canonical.tests.test_r3_integrator_disposition_totality_v1 -v
      - name: Run R3 verified cross-scope generalization suite
        run: python -m unittest canonical.tests.test_r3_verified_cross_scope_generalization_v1 -v
      - name: Run R3 queue-driver regression suite
        run: python -m unittest canonical.tests.test_r3_improvement_queue_driver_v1 -v
      - name: Run R3 direct-owned no-delta disposition suite
        run: python -m unittest canonical.tests.test_r3_direct_owned_no_delta_v1 -v
      - name: Run R3/Root1 constructive adapter-gap witness suite
        run: python -m unittest canonical.tests.test_r3_root1_adapter_gap_witness_v1 -v
      - name: Run R3 verification-frontier repair reducer suite
        run: python -m unittest canonical.tests.test_r3_verification_frontier_repair_reducer_v1 -v
      - name: Run R3 distinguishing-evidence request compiler suite
        run: python -m unittest canonical.tests.test_r3_distinguishing_evidence_request_v1 -v
      - name: Run R3 distinguishing-evidence acquisition suite
        run: python -m unittest canonical.tests.test_r3_distinguishing_evidence_acquisition_v1 -v
      - name: Run R3 repair-reduction scheduler suite
        run: python -m unittest canonical.tests.test_r3_repair_reduction_scheduler_v1 -v
      - name: Run R3/Root1 adapter-gap queue integration suite
        run: python -m unittest canonical.tests.test_r3_root1_adapter_gap_driver_v1 -v
      - name: Run R3 durable queue-kind totality suite
        run: python -m unittest canonical.tests.test_r3_queue_kind_totality_v1 -v
      - name: Run R3 quarantine recovery regression suite
        run: python -m unittest canonical.tests.test_r3_quarantine_recovery_v1 -v
      - name: Run R3 independent learning-verifier suite
        run: python -m unittest canonical.tests.test_r3_independent_learning_verifier_v1 -v
      - name: Run bound execution verifier contract suite
        run: |
          python - <<'PY'
          from canonical.tests import test_bound_capability_execution_verifier_v1 as t
          tests = [
              t.test_exact_recomputed_execution_trace_passes,
              t.test_executor_cannot_swap_planned_action,
              t.test_failed_expectation_cannot_mint_target_effect,
              t.test_missing_target_producing_step_fails,
              t.test_executor_cannot_insert_undeclared_extra_step,
          ]
          for fn in tests:
              fn()
          print(f"PASS_COUNT={len(tests)}")
          PY
      - name: Run R3 bound-success read-only learning suite
        run: python -m unittest canonical.tests.test_r3_bound_success_readonly_learning_v1 -v
      - name: Run R3 repair replay regression suite
        run: python -m unittest canonical.tests.test_verified_repair_replay_loop_v1 -v
      - name: Run R3 live runtime regression suite
        run: python -m unittest canonical.tests.test_live_brain_runtime_v1 -v
      - name: Run R3 unified fabric regression suite
        run: python -m unittest canonical.tests.test_unified_cognitive_fabric_v1 -v
      - name: Run R3 fabric improvement-cycle integration suite
        run: python -m unittest canonical.tests.test_r3_improvement_cycle_fabric_v1 -v
      - name: Run R2/R3 durable policy repair context suite
        run: python -m unittest canonical.tests.test_r2_r3_durable_policy_repair_context_v2 -v
      - name: Run R3 second-family grounding compounding cycle
        run: python -m unittest canonical.tests.test_r3_second_family_grounding_compounding_cycle_v1 -v
      - name: Run R3 third-family typed decision compounding cycle
        run: python -m unittest canonical.tests.test_r3_third_family_decision_compounding_cycle_v1 -v
      - name: Run R3 candidate patch firewall suite
        run: python -m unittest canonical.tests.test_r3_success_adapter_patch_firewall_v1 -v
      - name: Run R3 redacted patch-author context suite
        run: python -m unittest canonical.tests.test_r3_success_adapter_author_context_v1 -v
      - name: Run R3 candidate patch-author wrapper suite
        run: python -m unittest canonical.tests.test_r3_success_adapter_patch_author_wrapper_v1 -v
      - name: Run R3 deterministic mode-guard patch-author suite
        run: python -m unittest canonical.tests.test_r3_deterministic_mode_guard_patch_author_v1 -v
      - name: Run R3 deterministic mapping-guard patch-author suite
        run: python -m unittest canonical.tests.test_r3_deterministic_mapping_guard_patch_author_v1 -v
      - name: Run R3 mode-guard author dominance truth-repair suite
        run: python -m unittest canonical.tests.test_r3_mode_guard_patch_author_dominance_v1 -v
