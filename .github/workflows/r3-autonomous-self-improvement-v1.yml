name: R3 autonomous self-improvement verification

on:
  pull_request:
    paths:
      - "canonical/runtime/autonomous_verified_self_improvement_v1.py"
      - "canonical/runtime/r3_improvement_queue_driver_v1.py"
      - "canonical/runtime/r3_independent_learning_verifier_v1.py"
      - "canonical/tests/test_r3_independent_learning_verifier_v1.py"
      - "canonical/runtime/r3_independent_learning_verifier_v1.py"
      - "canonical/tests/test_r3_independent_learning_verifier_v1.py"
      - "canonical/runtime/executable_skill_program_v7.py"
      - "canonical/runtime/executable_skill_verification_authenticator_v1.py"
      - "canonical/runtime/live_brain_runtime_v1.py"
      - "canonical/runtime/universal_verified_adaptive_solver_v12.py"
      - "canonical/runtime/capability_first_scheduler_v1.py"
      - "canonical/tests/test_autonomous_verified_self_improvement_v1.py"
      - "canonical/tests/test_r3_improvement_queue_driver_v1.py"
      - "canonical/tests/test_r3_verified_cross_scope_generalization_v1.py"
      - "canonical/tests/test_verified_repair_replay_loop_v1.py"
      - "canonical/tests/test_live_brain_runtime_v1.py"
      - "canonical/runtime/unified_cognitive_fabric_v1.py"
      - "canonical/tests/test_unified_cognitive_fabric_v1.py"
      - "canonical/tests/test_r3_improvement_cycle_fabric_v1.py"
      - ".github/workflows/r3-autonomous-self-improvement-v1.yml"
  push:
    branches:
      - "main"
      - "r3-final-ci-gate-20261008"
    paths:
      - "canonical/runtime/autonomous_verified_self_improvement_v1.py"
      - "canonical/runtime/r3_improvement_queue_driver_v1.py"
      - "canonical/runtime/executable_skill_program_v7.py"
      - "canonical/runtime/executable_skill_verification_authenticator_v1.py"
      - "canonical/runtime/live_brain_runtime_v1.py"
      - "canonical/runtime/universal_verified_adaptive_solver_v12.py"
      - "canonical/runtime/capability_first_scheduler_v1.py"
      - "canonical/tests/test_autonomous_verified_self_improvement_v1.py"
      - "canonical/tests/test_r3_improvement_queue_driver_v1.py"
      - "canonical/tests/test_r3_verified_cross_scope_generalization_v1.py"
      - "canonical/tests/test_verified_repair_replay_loop_v1.py"
      - "canonical/tests/test_live_brain_runtime_v1.py"
      - "canonical/runtime/unified_cognitive_fabric_v1.py"
      - "canonical/tests/test_unified_cognitive_fabric_v1.py"
      - "canonical/tests/test_r3_improvement_cycle_fabric_v1.py"
      - ".github/workflows/r3-autonomous-self-improvement-v1.yml"

jobs:
  verify-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile R3 live control surface
        run: >-
          python -m py_compile
          canonical/runtime/autonomous_verified_self_improvement_v1.py
          canonical/runtime/r3_improvement_queue_driver_v1.py
          canonical/runtime/r3_independent_learning_verifier_v1.py
          canonical/runtime/executable_skill_program_v7.py
          canonical/runtime/executable_skill_verification_authenticator_v1.py
          canonical/runtime/live_brain_runtime_v1.py
          canonical/runtime/unified_cognitive_fabric_v1.py
      - name: Run R3 learning regression suite
        run: python -m unittest canonical.tests.test_autonomous_verified_self_improvement_v1 -v
      - name: Run R3 verified cross-scope generalization suite
        run: python -m unittest canonical.tests.test_r3_verified_cross_scope_generalization_v1 -v
      - name: Run R3 queue-driver regression suite
        run: python -m unittest canonical.tests.test_r3_improvement_queue_driver_v1 -v
      - name: Run R3 independent learning-verifier suite
        run: python -m unittest canonical.tests.test_r3_independent_learning_verifier_v1 -v
      - name: Run R3 repair replay regression suite
        run: python -m unittest canonical.tests.test_verified_repair_replay_loop_v1 -v
      - name: Run R3 live runtime regression suite
        run: python -m unittest canonical.tests.test_live_brain_runtime_v1 -v
      - name: Run R3 unified fabric regression suite
        run: python -m unittest canonical.tests.test_unified_cognitive_fabric_v1 -v
      - name: Run R3 fabric improvement-cycle integration suite
        run: python -m unittest canonical.tests.test_r3_improvement_cycle_fabric_v1 -v
