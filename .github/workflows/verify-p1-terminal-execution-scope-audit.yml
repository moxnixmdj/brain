name: Verify P1 terminal execution scope audit

on:
  pull_request:
    paths:
      - "canonical/runtime/p1_terminal_execution_scope_audit_v1.py"
      - "canonical/tests/test_p1_terminal_execution_scope_audit_v1.py"
      - "canonical/governance/P1_TERMINAL_EXECUTION_SCOPE_MISMATCH_QUARANTINE_V1.json"
      - "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json"
      - "canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json"
      - "canonical/runtime/terminal_parent_portfolio_runner_v1.py"
      - "canonical/runtime/contract_native_proof_suites.py"
  push:
    branches:
      - "audit/p1-terminal-scope-mismatch-20261002"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed scope audit
        run: |
          python canonical/runtime/p1_terminal_execution_scope_audit_v1.py
          python -m unittest canonical.tests.test_p1_terminal_execution_scope_audit_v1 -v
