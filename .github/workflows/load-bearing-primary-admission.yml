name: Load-bearing primary admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: load-bearing-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
      - name: Preserve trusted gate
        run: |
          cp execution_guard/load_bearing_primary_admission.py /tmp/trusted_load_bearing_primary_admission.py
          cp execution_guard/enforce_load_bearing_primary_pr.py /tmp/trusted_load_bearing_primary_pr.py
          cp execution_guard/agent_orientation_check_v1.py /tmp/trusted_agent_orientation_check_v1.py
      - name: Resolve refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=pr-head" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce load-bearing primary admission
        run: |
          PYTHONPATH=/tmp python /tmp/trusted_load_bearing_primary_pr.py             --base "${{ steps.refs.outputs.base }}"             --head "${{ steps.refs.outputs.head }}"
