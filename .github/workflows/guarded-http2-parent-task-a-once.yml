name: Guarded HTTP2 Parent Task A Once

on:
  pull_request:
    branches: [main]
    paths:
      - ARM_GUARDED_HTTP2_PARENT_TASK_A_20260930_003

permissions:
  contents: write

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Generate exact frozen guard plan
        run: python generate_guarded_http2_parent_plan.py
      - name: Atomically admit once then execute frozen parent task
        id: guarded
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_http2_parent_task_a_plan.json --receipt guarded-http2-parent-admission.json
      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-http2-parent-task-terminal
          path: |
            guarded-http2-parent-admission.json
            guarded_http2_parent_task_a_plan.json
            http2-parent-task-terminal.json
          if-no-files-found: warn
      - name: Preserve terminal failure
        if: steps.guarded.outcome != 'success'
        run: exit 1
