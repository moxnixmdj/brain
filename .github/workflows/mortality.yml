name: knowing it can end
# The gate is not the feature. It is the control:
#   an agent that consults its remaining life must start different work than one that does not.
# If both start the same thing, the ending is a counter with a name and the module is decoration.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mortality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest
      - name: Knowing must change what it starts
        run: python -m pytest canonical/tests/test_mortality_is_not_decoration_v1.py -q
