name: Verify proof compression v1

on:
  pull_request:
    paths:
      - 'canonical/runtime/acceptance_bound_compiler_v1.py'
      - 'canonical/runtime/evaluation_information_firewall_v1.py'
      - 'canonical/runtime/acceptance_proof_first_frontier_v1.py'
      - 'canonical/tests/test_acceptance_bound_compiler_v1.py'
      - 'canonical/tests/test_evaluation_information_firewall_v1.py'
      - 'canonical/tests/test_acceptance_proof_first_frontier_v1.py'
      - 'canonical/governance/ACCEPTANCE_BOUND_COMPILER_V1.json'
      - 'canonical/governance/EVALUATION_INFORMATION_FIREWALL_V1.json'
      - 'canonical/governance/PROOF_FIRST_FRONTIER_V1.json'
      - 'canonical/governance/ACCEPTANCE_BOUND_SCAN_20261002_V1.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact proof-compression tests
        run: |
          python -m unittest             canonical.tests.test_acceptance_bound_compiler_v1             canonical.tests.test_evaluation_information_firewall_v1             canonical.tests.test_acceptance_proof_first_frontier_v1 -v
