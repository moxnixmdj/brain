name: Verify proof dependency-cone cache
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/proof_dependency_cone_cache.py
      - canonical/tests/test_proof_dependency_cone_cache.py
      - canonical/governance/PROOF_DEPENDENCY_CONE_CACHE_ACTIVATION_V1.json
      - .github/workflows/verify-proof-dependency-cone-cache.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_proof_dependency_cone_cache
