name: Verify DOCX exact text preservation editor
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/docx_exact_text_edit.py
      - canonical/tests/test_docx_exact_text_edit.py
      - .github/workflows/verify-docx-exact-text-edit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_docx_exact_text_edit
