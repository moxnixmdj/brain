name: Capability receipt independent verification

# WHY THIS WORKFLOW EXISTS
#
# `load_verified_registry` checks for a producer receipt and a second record
# claiming a distinct verifier, a matching result, and a GitHub run reference.
# Those fields are not themselves platform-attested.
#
# SECURITY LIMITATION: the workflow retains decoded OIDC claims, not the signed token or
# an attestation bound to the records. The current consumers do not authenticate those
# claims, and receipt-specified Python would execute in the verifier process. The records
# alone therefore do not prove independent execution, even when they contain a run id.
#
# The preflight below stops this workflow before receipt code executes or records are
# published until an authenticated, result-bound verification policy exists.
#
# Nothing here writes a registry: the executable set is derived from reproduced evidence,
# so no capability is declared and no capability is deleted.

on:
  # `pull_request` (never `pull_request_target`, which AGENTS.md rule 7 forbids).
  # PR runs cannot commit resulting records.
  pull_request:
    paths:
      - ".github/workflows/capability-receipt-verification.yml"
      - "canonical/runtime/capability_receipt_lane_v1.py"
      - "canonical/astra_runtime/evidence/CAPABILITY__**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/capability-receipt-verification.yml"
      - "canonical/runtime/capability_receipt_lane_v1.py"
      - "canonical/astra_runtime/evidence/CAPABILITY__**"
  workflow_dispatch:

concurrency:
  group: capability-receipt-verification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required by the legacy reference producer; its decoded claims are not an
  # authenticated, result-bound attestation.
  id-token: write

jobs:
  verify-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-execute producer receipts as an independent identity
        shell: bash
        env:
          AUDIENCE: https://github.com/moxnixmdj/brain
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          export TOKEN_JSON
          python3 - <<'PY' > /tmp/run_reference.json
          import base64, json, os, urllib.request
          token = json.loads(os.environ["TOKEN_JSON"])["value"]
          part = token.split(".")[1]
          part += "=" * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          keep = ("iss", "aud", "repository", "repository_id", "workflow_ref", "job_workflow_ref",
                  "run_id", "run_attempt", "event_name", "head_ref", "actor", "jti")
          print(json.dumps({"github_run_id": int(claims["run_id"]),
                            "oidc_claims": {k: claims.get(k) for k in keep}}, sort_keys=True))
          PY
          unset TOKEN_JSON
          cat /tmp/run_reference.json
          # Never execute receipt-specified code on this runner while its
          # result-bound provenance and isolation are unestablished.
          python3 - <<'PY'
          import json
          from canonical.runtime.capability_receipt_lane_v1 import run_reference_is_attested
          with open('/tmp/run_reference.json', encoding='utf-8') as stream:
              reference = json.load(stream)
          if not run_reference_is_attested(reference):
              raise SystemExit('INDEPENDENT_VERIFICATION_UNAVAILABLE: run reference and result are not authenticated')
          PY
          python3 canonical/runtime/capability_receipt_lane_v1.py \
            --verify \
            --root . \
            --ran-by "github-actions:${GITHUB_REPOSITORY}" \
            --run-reference-json "$(cat /tmp/run_reference.json)" \
            | tee /tmp/verification.json
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/verification.json"))
          print(f"reproduced {report['reproduced']}/{report['producer_receipts']}; "
                f"not reproduced: {report['mismatched']}")
          for path in report.get("not_reproduced", []):
              print(f"  NOT REPRODUCED (no record written, so not admitted): {path}")
          # A capability that does not reproduce gets NO verification record and is therefore
          # not admitted.  That must not block the ones that do reproduce: report it loudly,
          # and fail only if the mechanism itself produced nothing.
          if report["producer_receipts"] and not report["reproduced"]:
              raise SystemExit("NO RECEIPT REPRODUCED - the verification mechanism is broken")
          PY

      - name: Publish the verification records as an artifact
        # Do not publish stale records if the preflight or reproduction fails.
        # A future authenticated path must still bind the artifact bytes.
        uses: actions/upload-artifact@v4
        with:
          name: capability-independent-verification
          path: canonical/astra_runtime/evidence/CAPABILITY__*__INDEPENDENT_VERIFICATION.json
          if-no-files-found: warn

      - name: Land the verification records
        shell: bash
        # Defense in depth, not a sandbox: any future re-enabled execution
        # would still share the runner and its job-level OIDC authority.
        env:
          AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git config user.name "project-brain-capability-receipt-verification"
          git config user.email "project-brain-capability-receipt-verification@users.noreply.github.com"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Pull-request runs verify and report; they do NOT commit or push. Measured: each run
            # stamps a new run_id / jti / elapsed_ms into every record, so committing here made
            # every run a new head commit, which re-ran the workflow and invalidated approval
            # forever. The records are still generated and checked in this run.
            echo "verification records generated for this pull request; not committed"
            exit 0
          fi
          git add canonical/astra_runtime/evidence/CAPABILITY__*__INDEPENDENT_VERIFICATION.json
          git diff --cached --quiet && echo "no new verification records" && exit 0
          git commit -m "Record independent verification of capability execution receipts"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            bash .github/scripts/land_on_main.sh && exit 0
            sleep 2
          done
          exit 1
