name: verify-unified-cognitive-fabric-v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/unified_cognitive_fabric_v1.py
      - canonical/runtime/live_brain_runtime_v1.py
      - canonical/governance/LIVE_BRAIN_RUNTIME_V1_ACTIVATION_20261008_V1.json
      - canonical/runtime/live_capability_ownership_v1.py
      - canonical/runtime/live_capability_invoker_v1.py
      - canonical/runtime/live_capability_composition_v1.py
      - canonical/runtime/r1_live_architecture_closure_gate_v1.py
      - canonical/governance/LIVE_CAPABILITY_OWNERSHIP_MANIFEST_V1.json
      - canonical/governance/CURRENT_TERMINAL_AUTHORITY.json
      - canonical/runtime/autonomous_verified_self_improvement_v1.py
      - canonical/tests/test_unified_cognitive_fabric_v1.py
      - canonical/tests/test_finance_bounded_concept_registry_v1.py
      - canonical/tests/test_finance_bounded_concept_registry_fabric_v1.py
      - canonical/runtime/finance_bounded_concept_registry_v1.py
      - canonical/runtime/finance_bounded_concept_registry_verify_v1.py
      - canonical/tests/test_r3_direct_experience_totality_v1.py
      - canonical/tests/test_live_brain_runtime_v1.py
      - canonical/tests/test_live_capability_ownership_v1.py
      - canonical/tests/test_live_capability_invoker_v1.py
      - canonical/tests/test_live_capability_composition_v1.py
      - canonical/tests/test_r1_live_architecture_closure_gate_v1.py
      - .github/workflows/verify-unified-cognitive-fabric-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest canonical.tests.test_live_capability_ownership_v1 canonical.tests.test_live_capability_invoker_v1 canonical.tests.test_live_capability_composition_v1 canonical.tests.test_r1_live_architecture_closure_gate_v1 canonical.tests.test_unified_cognitive_fabric_v1 canonical.tests.test_finance_bounded_concept_registry_v1 canonical.tests.test_finance_bounded_concept_registry_fabric_v1 canonical.tests.test_r3_direct_experience_totality_v1 canonical.tests.test_live_brain_runtime_v1 -v
