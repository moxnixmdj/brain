name: Verify ownership promotion compiler v1
on:
  pull_request:
    paths:
      - "canonical/runtime/ownership_promotion_compiler_v1.py"
      - "canonical/tests/test_ownership_promotion_compiler_v1.py"
      - "canonical/governance/OWNERSHIP_PROMOTION_BATCH_V1.json"
      - ".github/workflows/verify-ownership-promotion-compiler-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest canonical.tests.test_ownership_promotion_compiler_v1 -v
      - run: python canonical/runtime/ownership_promotion_compiler_v1.py
