name: Verify differential dominance compiler v1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/differential_dominance_compiler_v1.py"
      - "canonical/tests/test_differential_dominance_compiler_v1.py"
      - "canonical/governance/DIFFERENTIAL_DOMINANCE_COMPILER_V1.json"
      - ".github/workflows/verify-differential-dominance-compiler-v1.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest canonical.tests.test_differential_dominance_compiler_v1 -v
