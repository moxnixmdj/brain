name: Verify counterexample-guided architecture synthesis
on:
  pull_request:
    paths:
      - canonical/runtime/counterexample_guided_causal_architecture_synthesizer_v1.py
      - canonical/tests/test_counterexample_guided_causal_architecture_synthesizer_v1.py
      - canonical/governance/COUNTEREXAMPLE_GUIDED_CAUSAL_ARCHITECTURE_SYNTHESIS_20261007_V1.json
      - .github/workflows/verify-counterexample-guided-causal-architecture-synthesis-v1.yml
  push:
    branches: [main]
    paths:
      - canonical/runtime/counterexample_guided_causal_architecture_synthesizer_v1.py
      - canonical/tests/test_counterexample_guided_causal_architecture_synthesizer_v1.py
      - canonical/governance/COUNTEREXAMPLE_GUIDED_CAUSAL_ARCHITECTURE_SYNTHESIS_20261007_V1.json
      - .github/workflows/verify-counterexample-guided-causal-architecture-synthesis-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and preserve diagnostics
        id: verify
        shell: bash
        run: |
          set +e
          {
            python -m py_compile canonical/runtime/counterexample_guided_causal_architecture_synthesizer_v1.py
            python -m py_compile canonical/tests/test_counterexample_guided_causal_architecture_synthesizer_v1.py
            python -m unittest -v canonical.tests.test_counterexample_guided_causal_architecture_synthesizer_v1
          } > /tmp/architecture-synthesis-test.log 2>&1
          code=$?
          cat /tmp/architecture-synthesis-test.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-synthesis-test-log
          path: /tmp/architecture-synthesis-test.log
          if-no-files-found: error
      - name: Enforce verification result
        shell: bash
        run: test "${{ steps.verify.outputs.exit_code }}" = "0"
