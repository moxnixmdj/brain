name: Verify tool discovery T2 T3 objective binding

on:
  push:
    branches: [main]
    paths:
      - canonical/governance/TOOL_DISCOVERY_T2_T3_OBJECTIVE_TERMINAL_BINDING_V1.json
      - canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py
      - canonical/tests/test_tool_discovery_t2_t3_objective_binding_validator.py
      - canonical/runtime/tool_discovery_information_safe_proof_v2.py
      - canonical/runtime/tool_discovery_information_safe_candidate.py
      - canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json
      - canonical/governance/OUTER_TERMINAL_MULTIPLEX_PORTFOLIOS_V1.json
      - canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json
      - .github/workflows/verify-tool-discovery-t2-t3-objective-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_tool_discovery_t2_t3_objective_binding_validator
      - run: python canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py .
