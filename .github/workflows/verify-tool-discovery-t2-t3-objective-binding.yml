name: Verify tool discovery T2 T3 objective binding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_tool_discovery_t2_t3_objective_binding_validator
      - run: python canonical/runtime/tool_discovery_t2_t3_objective_binding_validator.py .
