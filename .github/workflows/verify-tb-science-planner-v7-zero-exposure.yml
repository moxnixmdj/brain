name: Verify TB-Science planner v7 zero exposure

on:
  push:
    branches:
      - repair/tb-science-planner-generation-timeout-v7-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repaired runtime
        run: |
          python -m py_compile canonical/runtime/harbor_science_planner_v7.py
          python -m py_compile canonical/runtime/harbor_science_agent_v13.py
      - name: Run exact Rank18 deadline regressions
        run: python -m unittest canonical.tests.test_harbor_science_planner_v7_generation_deadline -v
      - name: Prove no execution authority in this verification
        run: |
          python - <<'PY'
          import json
          print(json.dumps({
            "schema": "PROJECT_BRAIN_TB_SCIENCE_PLANNER_V7_ZERO_EXPOSURE_VERIFY_V1",
            "task_read": False,
            "task_started": False,
            "benchmark_trials_consumed": 0,
            "execution_authority": False,
            "rank19_authority": False
          }, sort_keys=True))
          PY
