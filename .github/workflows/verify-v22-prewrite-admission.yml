name: Verify V22 prewrite admission
on:
  push:
    paths: ["execution_guard/v22_prewrite_admission.py","execution_guard/github_actions_guarded_run_live.py","canonical/runtime/enforce_goal_hierarchy.py","canonical/tests/test_v22_prewrite_admission_v1.py",".github/workflows/verify-v22-prewrite-admission.yml"]
  pull_request:
    paths: ["execution_guard/v22_prewrite_admission.py","execution_guard/github_actions_guarded_run_live.py","canonical/runtime/enforce_goal_hierarchy.py","canonical/tests/test_v22_prewrite_admission_v1.py",".github/workflows/verify-v22-prewrite-admission.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest canonical.tests.test_v22_prewrite_admission_v1 -v
      - run: |
          python -m py_compile execution_guard/v22_prewrite_admission.py
          python -m py_compile execution_guard/github_actions_guarded_run_live.py
          python -m py_compile canonical/runtime/enforce_goal_hierarchy.py
