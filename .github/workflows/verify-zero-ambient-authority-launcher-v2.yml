name: Verify zero ambient authority launcher V2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/zero_ambient_authority_launcher_v1.py
      - canonical/tests/test_zero_ambient_authority_launcher_v1.py
      - canonical/tests/test_zero_ambient_authority_escape_integration_v1.py
      - canonical/governance/ZERO_AMBIENT_AUTHORITY_LAUNCHER_PRECHILD_EFFECT_HARDENING_20261005_V2.json
      - .github/workflows/verify-zero-ambient-authority-launcher-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile launcher
        run: python -m py_compile canonical/runtime/zero_ambient_authority_launcher_v1.py
      - name: Run deterministic launcher tests
        run: python -m unittest -v canonical.tests.test_zero_ambient_authority_launcher_v1
      - name: Explicitly preload pinned canary image outside credited launcher
        run: docker pull alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
      - name: Run Docker confinement escape canaries
        run: python -m unittest -v canonical.tests.test_zero_ambient_authority_escape_integration_v1
