name: R3 verified compounding regression

on:
  pull_request:
    paths:
      - "canonical/runtime/autonomous_verified_compounding_v1.py"
      - "canonical/runtime/universal_verified_adaptive_solver_v12.py"
      - "canonical/tests/test_autonomous_verified_compounding_v1.py"
      - ".github/workflows/r3-verified-compounding-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the compounding loop and prior solver regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            canonical/tests/test_autonomous_verified_compounding_v1.py \
            canonical/tests/test_universal_verified_adaptive_solver_v12.py \
            canonical/tests/test_verified_skill_macro_planner_v1.py
