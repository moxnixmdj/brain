name: Verify Root3 direct-process 19-to-18 transport

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/ROOT3_DIRECT_PROCESS_19_TO_18_TRANSPORT_V1.json"
      - "canonical/runtime/root3_direct_process_19_to_18_transport_v1.py"
      - "canonical/tests/test_root3_direct_process_19_to_18_transport_v1.py"
      - ".github/workflows/verify-root3-direct-process-19-to-18-transport-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: git cat-file -e fd60e692d08176c8f5cb40cbc915fa46eaea2fa5^{commit}
      - run: python -m py_compile canonical/runtime/root3_direct_process_19_to_18_transport_v1.py
      - run: python -m pytest -q canonical/tests/test_root3_direct_process_19_to_18_transport_v1.py
