name: Verify SEC CompanyConcept source-native semantics

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bound_capabilities/sec_companyconcept_source_native.py
      - canonical/runtime/sec_companyconcept_source_native_verify_v1.py
      - canonical/tests/test_sec_companyconcept_source_native_v1.py
      - .github/workflows/verify-sec-companyconcept-source-native-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source-native semantic falsification suite
        id: semantic_tests
        shell: bash
        run: |
          set +e
          python3 -m unittest -v canonical.tests.test_sec_companyconcept_source_native_v1 > sec-companyconcept-test.log 2>&1
          rc=$?
          cat sec-companyconcept-test.log
          echo "$rc" > sec-companyconcept-test.exit
          exit "$rc"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-companyconcept-source-native-diagnostics
          path: |
            sec-companyconcept-test.log
            sec-companyconcept-test.exit
          if-no-files-found: warn
