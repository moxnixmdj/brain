name: Verify external benchmark dominance v1

on:
  push:
    branches: ["brain/benchmark-dominance-v1-20261003-sol"]
    paths:
      - "canonical/governance/EXTERNAL_BENCHMARK_DOMINANCE_CANDIDATE_V1.json"
      - "canonical/runtime/external_benchmark_dominance_compiler_v1.py"
      - "canonical/tests/test_external_benchmark_dominance_compiler_v1.py"
      - ".github/workflows/verify-external-benchmark-dominance-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/EXTERNAL_BENCHMARK_DOMINANCE_CANDIDATE_V1.json"
      - "canonical/runtime/external_benchmark_dominance_compiler_v1.py"
      - "canonical/tests/test_external_benchmark_dominance_compiler_v1.py"
      - ".github/workflows/verify-external-benchmark-dominance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pytest -q canonical/tests/test_external_benchmark_dominance_compiler_v1.py
      - run: python canonical/runtime/external_benchmark_dominance_compiler_v1.py
