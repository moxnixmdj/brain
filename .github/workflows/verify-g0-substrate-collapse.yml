name: Verify G0 proposal substrate collapse
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/G0_PROPOSAL_SUBSTRATE_COLLAPSE_V1.json
      - canonical/governance/SHARED_SEMANTIC_RESIDUAL_BASIS_V2.json
      - canonical/governance/GLOBAL_TERMINAL_OBLIGATION_GRAPH_V1.json
      - canonical/governance/GLOBAL_TERMINAL_PROOF_CUT_V1.json
      - canonical/governance/GLOBAL_TERMINAL_UNIVERSE_V1.json
      - canonical/governance/OUTER_GLOBAL_MINIMUM_REALITY_CUT_VERDICT_V2.json
      - canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json
      - canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json
      - canonical/CANONICAL_POINTER.json
      - canonical/capabilities/FRONTIER_CAPABILITY_OBSOLESCENCE_QUEUE_V1.json
      - canonical/capabilities/frontier/ADVANCED_AGENTIC_SOFTWARE_ENGINEERING_SUPERPOWERS_V1.json
      - canonical/tests/test_g0_substrate_collapse_state.py
      - .github/workflows/verify-g0-substrate-collapse.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_g0_substrate_collapse_state
