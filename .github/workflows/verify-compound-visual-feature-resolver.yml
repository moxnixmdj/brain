name: Verify compound visual feature resolver
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/compound_visual_feature_resolver.py
      - canonical/tests/test_compound_visual_feature_resolver_dev.py
      - canonical/runtime/engineering_feature_notation.py
      - .github/workflows/verify-compound-visual-feature-resolver.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_compound_visual_feature_resolver_dev
