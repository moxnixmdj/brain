name: Verify Root3 subprocess final-authorizer adapter V1

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/root3_subprocess_final_authorizer_adapter_v1.py
      - canonical/tests/test_root3_subprocess_final_authorizer_adapter_v1.py
      - canonical/governance/ROOT3_SUBPROCESS_FINAL_AUTHORIZER_ADAPTER_20261005_V1.json
      - .github/workflows/verify-root3-subprocess-final-authorizer-adapter-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile adapter
        run: python -m py_compile canonical/runtime/root3_subprocess_final_authorizer_adapter_v1.py
      - name: Run focused tests
        run: python -m unittest -v canonical.tests.test_root3_subprocess_final_authorizer_adapter_v1
