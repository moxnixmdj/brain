name: Verify R3 success-adapter patch firewall V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/r3_success_adapter_patch_firewall_v1.py"
      - "canonical/tests/test_r3_success_adapter_patch_firewall_v1.py"
      - ".github/workflows/verify-r3-success-adapter-patch-firewall-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile firewall
        run: python -m py_compile canonical/runtime/r3_success_adapter_patch_firewall_v1.py
      - name: Run adversarial firewall suite
        run: python -m unittest canonical.tests.test_r3_success_adapter_patch_firewall_v1 -v
