name: Verify semantic state bus V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/SEMANTIC_STATE_BUS_V1.json"
      - "canonical/runtime/semantic_state_bus_v1.py"
      - "canonical/tests/test_semantic_state_bus_v1.py"
      - ".github/workflows/verify-semantic-state-bus-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m py_compile canonical/runtime/semantic_state_bus_v1.py
      - run: python -m pytest -q canonical/tests/test_semantic_state_bus_v1.py
