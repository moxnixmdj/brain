name: One-shot rebase P3 provenance gate onto live main

on:
  push:
    branches:
      - terminal/p3-provenance-gate-live-20261007-v1
    paths:
      - .github/workflows/oneshot-rebase-p3-provenance-gate-live.yml

permissions:
  contents: write

jobs:
  rebase-patch-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reset to live main and apply fail-closed semantic patch
        shell: bash
        run: |
          set -euo pipefail
          OLD_HEAD="$(git rev-parse HEAD)"
          BRANCH="terminal/p3-provenance-gate-live-20261007-v1"
          git fetch origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          git reset --hard "$LIVE_MAIN"

          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path

          ROOT=Path(".")
          EXPECTED={
              "canonical/runtime/contract_native_brain_candidate.py":"afc18af1d1da6f25166c6cc57dcbc0cd3070bb85",
              "canonical/runtime/contract_native_proof_suites.py":"0210790c7dd705ef328e1b55d529a30c5c6c3337",
              "canonical/tests/test_contract_native_brain_candidate.py":"c97680cdcdf50a841c168f080e28f2a153ef7916",
              "canonical/tests/test_contract_native_proof_suites.py":"b1cdc1506530e1078dc2259c7ae9f5b5e4ce2bf2",
              "canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json":"a1630299d29ea9c07e55b4314c07ddb3228c3287",
          }
          NEW_PATHS=[
              "canonical/runtime/p3_contract_native_provenance_gate_verifier_v1.py",
              "canonical/tests/test_p3_contract_native_provenance_gate_verifier_v1.py",
              ".github/workflows/verify-p3-contract-native-provenance-gate.yml",
          ]

          def blob(path:Path)->str:
              raw=path.read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()

          for rel,expected in EXPECTED.items():
              path=ROOT/rel
              actual=blob(path)
              if actual!=expected:
                  raise SystemExit(f"SOURCE_DRIFT:{rel}:{expected}:{actual}")
          for rel in NEW_PATHS:
              if (ROOT/rel).exists():
                  raise SystemExit(f"NEW_PATH_COLLISION:{rel}")

          # Candidate: provenance becomes part of the executable output.
          path=ROOT/"canonical/runtime/contract_native_brain_candidate.py"
          c=path.read_text()
          c=c.replace(
              "    required=[]; optional=[]; uncertainty=[]\n",
              "    required=[]; optional=[]; uncertainty=[]; provenance_by_claim={}; seen_claim_ids=set()\n",
              1,
          )
          old='''        if not isinstance(cid,str) or not cid:
              raise CandidateError("CLAIM_ID_INVALID")
          if role=="required" and support!="unsupported":
              required.append(cid)
          elif role=="optional" and support!="unsupported":
              optional.append(cid)
  '''
          new='''        if not isinstance(cid,str) or not cid:
              raise CandidateError("CLAIM_ID_INVALID")
          if cid in seen_claim_ids:
              raise CandidateError("DUPLICATE_CLAIM_ID")
          seen_claim_ids.add(cid)
          selectable=role in {"required","optional"} and support!="unsupported"
          if selectable:
              provenance=row.get("provenance")
              if (
                  not isinstance(provenance,list)
                  or not provenance
                  or any(not isinstance(x,str) or not x for x in provenance)
                  or len(provenance)!=len(set(provenance))
              ):
                  raise CandidateError("PROVENANCE_INVALID")
              provenance_by_claim[cid]=list(provenance)
          if role=="required" and support!="unsupported":
              required.append(cid)
          elif role=="optional" and support!="unsupported":
              optional.append(cid)
  '''
          if old not in c: raise SystemExit("CANDIDATE_PATCH_ANCHOR_MISSING")
          c=c.replace(old,new,1)
          old='''    return {
          "selected_claims":selected,
          "uncertainty_claims":[x for x in uncertainty if x in selected_set],
      }
  '''
          new='''    return {
          "selected_claims":selected,
          "uncertainty_claims":[x for x in uncertainty if x in selected_set],
          "provenance_by_claim":{x:list(provenance_by_claim[x]) for x in selected},
      }
  '''
          if old not in c: raise SystemExit("CANDIDATE_RETURN_ANCHOR_MISSING")
          c=c.replace(old,new,1)
          path.write_text(c)

          # Proof suite: fix the latent seed-80 required/unsupported contradiction,
          # then make provenance exact and load-bearing in the scorer.
          path=ROOT/"canonical/runtime/contract_native_proof_suites.py"
          s=path.read_text()
          old='''    if not required:
          evidence[0]["role"]="required"; required.append("C0")
          if "C0" in optional: optional.remove("C0")
          if "C0" in forbidden: forbidden.remove("C0")
  '''
          new='''    if not required:
          evidence[0]["role"]="required"; required.append("C0")
          if "C0" in optional: optional.remove("C0")
          if "C0" in forbidden:
              forbidden.remove("C0")
              evidence[0]["support"]="supported"
  '''
          if old not in s: raise SystemExit("SUITE_REQUIRED_FALLBACK_ANCHOR_MISSING")
          s=s.replace(old,new,1)
          old='''            "uncertainty":sorted(uncertainty),
          },
  '''
          new='''            "uncertainty":sorted(uncertainty),
              "provenance":{
                  row["claim_id"]:list(row["provenance"])
                  for row in evidence
                  if row["role"] in {"required","optional"} and row["support"]!="unsupported"
              },
          },
  '''
          if old not in s: raise SystemExit("SUITE_ORACLE_ANCHOR_MISSING")
          s=s.replace(old,new,1)

          start=s.index("def _score_synthesis(")
          end=s.index("\ndef _professional_plan_case", start)
          score='''def _score_synthesis(case: Mapping[str, Any], candidate: Mapping[str, Any]) -> dict[str, Any]:
      selected=candidate.get("selected_claims")
      uncertainty=candidate.get("uncertainty_claims")
      provenance=candidate.get("provenance_by_claim")
      if not isinstance(selected,list) or not isinstance(uncertainty,list) or not isinstance(provenance,Mapping):
          return {"pass":False,"reasons":["OUTPUT_SCHEMA_INVALID"]}
      selected=[str(x) for x in selected]
      uncertainty=[str(x) for x in uncertainty]
      o=case["_oracle"]; reasons=[]
      if len(selected)!=len(set(selected)):
          reasons.append("DUPLICATE_SELECTED_CLAIM")
      normalized_provenance={}
      for claim_id, sources in provenance.items():
          if (
              not isinstance(claim_id,str)
              or not isinstance(sources,list)
              or not sources
              or any(not isinstance(x,str) or not x for x in sources)
              or len(sources)!=len(set(sources))
          ):
              reasons.append("PROVENANCE_SCHEMA_INVALID:"+str(claim_id))
              continue
          normalized_provenance[claim_id]=list(sources)
      missing=sorted(set(o["required"])-set(selected))
      forbidden=sorted(set(o["forbidden"])&set(selected))
      unknown=sorted(set(selected)-set(o["required"])-set(o["allowed_optional"]))
      missing_uncertainty=sorted(set(o["uncertainty"])&set(selected)-set(uncertainty))
      extra_uncertainty=sorted(set(uncertainty)-set(selected))
      expected_provenance=o["provenance"]
      missing_provenance=sorted(
          claim_id for claim_id in selected
          if claim_id in expected_provenance and claim_id not in normalized_provenance
      )
      wrong_provenance=sorted(
          claim_id for claim_id in selected
          if claim_id in expected_provenance
          and claim_id in normalized_provenance
          and normalized_provenance[claim_id] != expected_provenance[claim_id]
      )
      extra_provenance=sorted(set(normalized_provenance)-set(selected))
      if missing: reasons.append("REQUIRED_CLAIMS_MISSING:"+",".join(missing))
      if forbidden: reasons.append("UNSUPPORTED_CLAIMS_SELECTED:"+",".join(forbidden))
      if unknown: reasons.append("UNKNOWN_CLAIMS:"+",".join(unknown))
      if missing_uncertainty: reasons.append("UNCERTAINTY_DROPPED:"+",".join(missing_uncertainty))
      if extra_uncertainty: reasons.append("UNCERTAINTY_WITHOUT_CLAIM:"+",".join(extra_uncertainty))
      if missing_provenance: reasons.append("PROVENANCE_MISSING:"+",".join(missing_provenance))
      if wrong_provenance: reasons.append("PROVENANCE_MISMATCH:"+",".join(wrong_provenance))
      if extra_provenance: reasons.append("PROVENANCE_WITHOUT_SELECTED_CLAIM:"+",".join(extra_provenance))
      max_claims=case["task"]["format_constraints"]["max_claims"]
      if len(selected)>max_claims: reasons.append("FORMAT_MAX_CLAIMS_EXCEEDED")
      if case["task"]["format_constraints"]["ordered_required_first"]:
          req_positions=[selected.index(x) for x in o["required"] if x in selected]
          opt_positions=[selected.index(x) for x in selected if x in o["allowed_optional"]]
          if req_positions and opt_positions and max(req_positions)>min(opt_positions):
              reasons.append("AUDIENCE_ORDER_CONSTRAINT_FAILED")
      return {"pass":not reasons,"reasons":reasons}
  '''
          s=s[:start]+score+s[end:]
          old='''        return {"selected_claims":selected,"uncertainty_claims":[x for x in case["_oracle"]["uncertainty"] if x in selected]}
  '''
          new='''        return {
              "selected_claims":selected,
              "uncertainty_claims":[x for x in case["_oracle"]["uncertainty"] if x in selected],
              "provenance_by_claim":{x:list(case["_oracle"]["provenance"][x]) for x in selected},
          }
  '''
          if old not in s: raise SystemExit("SUITE_ORACLE_CANDIDATE_ANCHOR_MISSING")
          s=s.replace(old,new,1)
          path.write_text(s)

          # Existing tests get direct mutation and seed-80 locks.
          path=ROOT/"canonical/tests/test_contract_native_brain_candidate.py"
          t=path.read_text()
          anchor='''    def test_hidden_oracle_not_required(self):
  '''
          insert='''    def test_synthesis_emits_exact_public_provenance_for_selected_claims(self):
          case=suite.generate_case("EVIDENCE_TO_AUDIENCE_SYNTHESIS_001",4321,5)
          public=suite.public_task(case)
          got=candidate.solve(public)
          by_id={row["claim_id"]:row["provenance"] for row in public["task"]["evidence"]}
          self.assertEqual(
              got["provenance_by_claim"],
              {claim_id:by_id[claim_id] for claim_id in got["selected_claims"]},
          )
          self.assertTrue(suite.score_case(case,got)["pass"])

  '''
          if anchor not in t: raise SystemExit("CANDIDATE_TEST_ANCHOR_MISSING")
          t=t.replace(anchor,insert+anchor,1)
          path.write_text(t)

          path=ROOT/"canonical/tests/test_contract_native_proof_suites.py"
          t=path.read_text()
          anchor='''    def test_professional_suboptimal_plan_fails(self):
  '''
          insert='''    def test_synthesis_missing_provenance_fails(self):
          case=generate_case("EVIDENCE_TO_AUDIENCE_SYNTHESIS_001", 505, 5)
          candidate=oracle_candidate(case)
          victim=candidate["selected_claims"][0]
          del candidate["provenance_by_claim"][victim]
          out=score_case(case,candidate)
          self.assertFalse(out["pass"])
          self.assertTrue(any(x.startswith("PROVENANCE_MISSING:") for x in out["reasons"]), out)

      def test_synthesis_swapped_provenance_fails(self):
          case=generate_case("EVIDENCE_TO_AUDIENCE_SYNTHESIS_001", 506, 5)
          candidate=oracle_candidate(case)
          victim=candidate["selected_claims"][0]
          candidate["provenance_by_claim"][victim]=["FORGED-SOURCE"]
          out=score_case(case,candidate)
          self.assertFalse(out["pass"])
          self.assertTrue(any(x.startswith("PROVENANCE_MISMATCH:") for x in out["reasons"]), out)

      def test_synthesis_orphan_provenance_fails(self):
          case=generate_case("EVIDENCE_TO_AUDIENCE_SYNTHESIS_001", 507, 5)
          candidate=oracle_candidate(case)
          victim=candidate["selected_claims"][-1]
          candidate["selected_claims"]=[x for x in candidate["selected_claims"] if x!=victim]
          candidate["uncertainty_claims"]=[x for x in candidate["uncertainty_claims"] if x!=victim]
          out=score_case(case,candidate)
          self.assertFalse(out["pass"])
          self.assertTrue(any(x.startswith("PROVENANCE_WITHOUT_SELECTED_CLAIM:") for x in out["reasons"]), out)

      def test_synthesis_required_fallback_is_supported_seed_80(self):
          case=generate_case("EVIDENCE_TO_AUDIENCE_SYNTHESIS_001",80,1)
          required=set(case["_oracle"]["required"])
          rows={row["claim_id"]:row for row in case["task"]["evidence"]}
          self.assertTrue(required)
          self.assertTrue(all(rows[cid]["support"]!="unsupported" for cid in required))
          self.assertTrue(score_case(case,oracle_candidate(case))["pass"])

  '''
          if anchor not in t: raise SystemExit("PROOF_TEST_ANCHOR_MISSING")
          t=t.replace(anchor,insert+anchor,1)
          path.write_text(t)

          verifier='''from __future__ import annotations

  import json

  from canonical.runtime import contract_native_brain_candidate as candidate
  from canonical.runtime import contract_native_proof_suites as suite

  P3 = "EVIDENCE_TO_AUDIENCE_SYNTHESIS_001"


  def verify() -> dict:
      errors: list[str] = []
      checked = 0
      for seed in range(500):
          for difficulty in range(1, 6):
              case = suite.generate_case(P3, seed, difficulty)
              public = suite.public_task(case)
              if "_oracle" in public:
                  errors.append(f"ORACLE_LEAK:{seed}:{difficulty}")
                  continue
              try:
                  got = candidate.solve(public)
                  verdict = suite.score_case(case, got)
              except Exception as exc:
                  errors.append(f"EXCEPTION:{seed}:{difficulty}:{type(exc).__name__}")
                  continue
              checked += 1
              if verdict.get("pass") is not True:
                  errors.append(f"BASE_CASE_FAIL:{seed}:{difficulty}:{verdict.get('reasons')}")
                  continue
              selected = got.get("selected_claims")
              provenance = got.get("provenance_by_claim")
              if not isinstance(selected, list) or not isinstance(provenance, dict):
                  errors.append(f"PROVENANCE_OUTPUT_SCHEMA:{seed}:{difficulty}")
                  continue
              public_by_id = {row["claim_id"]: list(row["provenance"]) for row in public["task"]["evidence"]}
              expected = {claim_id: public_by_id[claim_id] for claim_id in selected}
              if provenance != expected:
                  errors.append(f"PUBLIC_PROVENANCE_NOT_EXACT:{seed}:{difficulty}")

      seed80 = suite.generate_case(P3, 80, 1)
      rows80 = {row["claim_id"]: row for row in seed80["task"]["evidence"]}
      if any(rows80[cid]["support"] == "unsupported" for cid in seed80["_oracle"]["required"]):
          errors.append("SEED80_REQUIRED_UNSUPPORTED_REGRESSION")

      mutation_results: dict[str, list[str]] = {}
      for kind, seed in [("missing",505),("mismatch",506),("orphan",507)]:
          case = suite.generate_case(P3, seed, 5)
          got = candidate.solve(suite.public_task(case))
          if not got["selected_claims"]:
              errors.append(f"MUTATION_NO_SELECTED:{kind}")
              continue
          victim = got["selected_claims"][0]
          if kind == "missing":
              del got["provenance_by_claim"][victim]
              prefix = "PROVENANCE_MISSING:"
          elif kind == "mismatch":
              got["provenance_by_claim"][victim] = ["FORGED-SOURCE"]
              prefix = "PROVENANCE_MISMATCH:"
          else:
              victim = got["selected_claims"][-1]
              got["selected_claims"] = [x for x in got["selected_claims"] if x != victim]
              got["uncertainty_claims"] = [x for x in got["uncertainty_claims"] if x != victim]
              prefix = "PROVENANCE_WITHOUT_SELECTED_CLAIM:"
          verdict = suite.score_case(case, got)
          reasons = list(verdict.get("reasons") or [])
          mutation_results[kind] = reasons
          if verdict.get("pass") is True or not any(str(x).startswith(prefix) for x in reasons):
              errors.append(f"MUTATION_SURVIVED:{kind}:{reasons}")

      return {
          "schema": "PROJECT_BRAIN_P3_CONTRACT_NATIVE_PROVENANCE_GATE_VERIFIER_V1",
          "status": "PASS__PROVENANCE_PRESERVATION_EXECUTABLE_AND_MUTATION_LOAD_BEARING" if not errors else "FAIL_CLOSED",
          "pass": not errors,
          "base_cases_checked": checked,
          "mutation_results": mutation_results,
          "seed80_required_support_repaired": "SEED80_REQUIRED_UNSUPPORTED_REGRESSION" not in errors,
          "errors": errors,
          "terminal": False,
          "terminal_credit_delta": 0,
      }


  if __name__ == "__main__":
      out = verify()
      print(json.dumps(out, indent=2, sort_keys=True))
      raise SystemExit(0 if out["pass"] else 1)
  '''
          (ROOT/NEW_PATHS[0]).write_text(verifier)

          verifier_test='''from canonical.runtime.p3_contract_native_provenance_gate_verifier_v1 import verify


  def test_p3_contract_native_provenance_gate_is_executable_and_fail_closed():
      out = verify()
      assert out["pass"] is True, out
      assert out["base_cases_checked"] == 2500
      assert out["seed80_required_support_repaired"] is True
      assert set(out["mutation_results"]) == {"missing", "mismatch", "orphan"}
      assert out["terminal"] is False
      assert out["terminal_credit_delta"] == 0
  '''
          (ROOT/NEW_PATHS[1]).write_text(verifier_test)

          permanent_workflow='''name: Verify P3 contract-native provenance gate
  on:
    push:
      branches: [main]
      paths:
        - canonical/runtime/contract_native_brain_candidate.py
        - canonical/runtime/contract_native_proof_suites.py
        - canonical/runtime/p3_contract_native_provenance_gate_verifier_v1.py
        - canonical/tests/test_contract_native_brain_candidate.py
        - canonical/tests/test_contract_native_proof_suites.py
        - canonical/tests/test_p3_contract_native_provenance_gate_verifier_v1.py
        - canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json
        - .github/workflows/verify-p3-contract-native-provenance-gate.yml
    pull_request:
      branches: [main]
      paths:
        - canonical/runtime/contract_native_brain_candidate.py
        - canonical/runtime/contract_native_proof_suites.py
        - canonical/runtime/p3_contract_native_provenance_gate_verifier_v1.py
        - canonical/tests/test_contract_native_brain_candidate.py
        - canonical/tests/test_contract_native_proof_suites.py
