          binding["exact_brain_blobs"]["canonical/runtime/contract_native_brain_candidate.py"]=blob(ROOT/"canonical/runtime/contract_native_brain_candidate.py")
          binding["exact_brain_blobs"]["canonical/runtime/contract_native_proof_suites.py"]=blob(ROOT/"canonical/runtime/contract_native_proof_suites.py")
          binding["independent_verification"]=None
