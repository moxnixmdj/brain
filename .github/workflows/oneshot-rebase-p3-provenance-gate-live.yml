              canonical.tests.test_terminal_parent_portfolio_runner_v1
        - run: PYTHONPATH=. python canonical/runtime/p3_contract_native_provenance_gate_verifier_v1.py
  '''
          (ROOT/NEW_PATHS[2]).write_text(permanent_workflow)

          # Rebind exact runtime bytes after patching them.
          binding_path=ROOT/"canonical/governance/TERMINAL_PARENT_PORTFOLIO_RUNNER_BINDING_V1.json"
          binding=json.loads(binding_path.read_text())
