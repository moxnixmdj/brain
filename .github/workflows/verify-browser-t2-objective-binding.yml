name: Verify browser T2 objective binding

on:
  push:
    branches: [main]
    paths:
      - canonical/governance/BROWSER_T2_OBJECTIVE_TERMINAL_BINDING_V1.json
      - canonical/runtime/browser_t2_objective_binding_validator.py
      - canonical/tests/test_browser_t2_objective_binding_validator.py
      - canonical/runtime/browser_state_information_safe_proof.py
      - canonical/runtime/browser_state_information_safe_candidate.py
      - canonical/runtime/browser_transition_objective_audit_v1.py
      - canonical/governance/AUTOMATIONBENCH_PUBLIC_SCOPE_BINDING_V1.json
      - canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json
      - canonical/governance/OUTER_TERMINAL_MULTIPLEX_PORTFOLIOS_V1.json
      - canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json
      - .github/workflows/verify-browser-t2-objective-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_browser_t2_objective_binding_validator
      - run: python canonical/runtime/browser_t2_objective_binding_validator.py .
