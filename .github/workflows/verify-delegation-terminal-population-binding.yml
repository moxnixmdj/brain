name: Verify delegation terminal population binding
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/delegation_terminal_population_binding_v1.py
      - canonical/tests/test_delegation_terminal_population_binding_v1.py
      - .github/workflows/verify-delegation-terminal-population-binding.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_delegation_terminal_population_binding_v1
