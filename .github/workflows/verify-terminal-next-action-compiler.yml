name: Verify terminal next-action compiler

on:
  push:
    paths:
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json"
      - "canonical/runtime/acceptance_ir_compiler_v1.py"
      - "canonical/runtime/terminal_next_action_compiler_v1.py"
      - "canonical/tests/test_terminal_next_action_compiler_v1.py"
      - ".github/workflows/verify-terminal-next-action-compiler.yml"
  pull_request:
    paths:
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json"
      - "canonical/runtime/acceptance_ir_compiler_v1.py"
      - "canonical/runtime/terminal_next_action_compiler_v1.py"
      - "canonical/tests/test_terminal_next_action_compiler_v1.py"
      - ".github/workflows/verify-terminal-next-action-compiler.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run next-action compiler tests
        run: python -m unittest canonical.tests.test_terminal_next_action_compiler_v1 -v
      - name: Compile live terminal next-action frontier
        run: python canonical/runtime/terminal_next_action_compiler_v1.py
