name: Verify terminal next-action compiler

on:
  push:
    paths:
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json"
      - "canonical/governance/TOOL_DISCOVERY_SCOPE_FORMALISM_CUT_ACTIVATION_V1.json"
      - "canonical/runtime/acceptance_ir_compiler_v1.py"
      - "canonical/runtime/terminal_next_action_compiler_v1.py"
      - "canonical/tests/test_terminal_next_action_compiler_v1.py"
      - ".github/workflows/verify-terminal-next-action-compiler.yml"
  pull_request:
    paths:
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json"
      - "canonical/governance/TOOL_DISCOVERY_SCOPE_FORMALISM_CUT_ACTIVATION_V1.json"
      - "canonical/runtime/acceptance_ir_compiler_v1.py"
      - "canonical/runtime/terminal_next_action_compiler_v1.py"
      - "canonical/tests/test_terminal_next_action_compiler_v1.py"
      - ".github/workflows/verify-terminal-next-action-compiler.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run next-action compiler tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest canonical.tests.test_terminal_next_action_compiler_v1 -v 2>&1 | tee /tmp/next-action-tests.txt
      - name: Compile live terminal next-action frontier
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          python canonical/runtime/terminal_next_action_compiler_v1.py 2>&1 | tee /tmp/next-action-live.txt
      - name: Upload diagnostic transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-next-action-diagnostic
          path: |
            /tmp/next-action-tests.txt
            /tmp/next-action-live.txt
      - name: Enforce verification result
        if: steps.unit.outcome != 'success' || steps.compile.outcome != 'success'
        run: exit 1
