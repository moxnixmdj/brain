name: Verify LiveBench zero-sentence completeness SOL
on:
  push:
    branches:
      - 'breakthrough/livebench-zero-sentence-completeness-20261005-sol'
    paths:
      - 'canonical/runtime/livebench_legacy15_contract_composer_v2.py'
      - 'canonical/runtime/livebench_legacy15_relaxed_candidate_search_v1.py'
      - 'canonical/tests/test_livebench_legacy15_contract_composer_v2.py'
      - 'canonical/tests/test_livebench_legacy15_relaxed_candidate_search_v1.py'
      - '.github/workflows/verify-livebench-zero-sentence-completeness-sol.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run targeted regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            canonical/tests/test_livebench_legacy15_contract_composer_v2.py \
            canonical/tests/test_livebench_legacy15_relaxed_candidate_search_v1.py
