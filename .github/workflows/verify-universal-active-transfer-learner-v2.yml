name: Verify universal active transfer learner v2

on:
  pull_request:
    paths:
      - "canonical/governance/UNIVERSAL_ACTIVE_TRANSFER_LEARNER_V2.json"
      - "canonical/runtime/universal_active_transfer_learner_v2.py"
      - "canonical/tests/test_universal_active_transfer_learner_v2.py"
      - "canonical/tests/test_universal_active_transfer_learner_v2_binding.py"
      - ".github/workflows/verify-universal-active-transfer-learner-v2.yml"
  push:
    paths:
      - "canonical/governance/UNIVERSAL_ACTIVE_TRANSFER_LEARNER_V2.json"
      - "canonical/runtime/universal_active_transfer_learner_v2.py"
      - "canonical/tests/test_universal_active_transfer_learner_v2.py"
      - "canonical/tests/test_universal_active_transfer_learner_v2_binding.py"
      - ".github/workflows/verify-universal-active-transfer-learner-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V2 active transfer learning tests
        run: |
          python -m unittest \
            canonical.tests.test_universal_active_transfer_learner_v2 \
            canonical.tests.test_universal_active_transfer_learner_v2_binding -v
      - name: Verify V2 fail-closed optimization boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime import universal_active_transfer_learner_v2 as v2

          root=Path('.')
          gov=json.loads((root/'canonical/governance/UNIVERSAL_ACTIVE_TRANSFER_LEARNER_V2.json').read_text())

          delta=v2.minimum_novelty_delta(
              required_facts={'syntax','types','new-mechanism'},
              verified_facts={'syntax','types'},
          )
          assert delta['missing']==['new-mechanism'], delta

          ranked=v2.rank_learning_actions([
              {'id':'slow-search','decision_gain':3,'transfer_gain':0,'proof_gain':0,'time':6,'cost':0,'risk':0},
              {'id':'safe-probe','decision_gain':2,'transfer_gain':2,'proof_gain':2,'time':1,'cost':0,'risk':0},
          ])
          assert ranked[0]['id']=='safe-probe', ranked

          stop=v2.decision_sufficient([
              {'id':'h1','plausible':True,'best_action':'A'},
              {'id':'h2','plausible':True,'best_action':'A'},
          ])
          assert stop['sufficient'] is True, stop

          skill=v2.compile_verified_skill(
              skill_id='s',
              applicability={'x'},
              dependencies={'d'},
              invalidators={'v'},
              verification_receipts={'r'},
          )
          assert skill['trusted'] is True, skill
          assert skill['acceptance_credit'] is False, skill
          assert skill['ownership_credit'] is False, skill
          assert skill['promotion_authorized'] is False, skill

          assert gov['v1_remains_authoritative_for_unknown_capture_and_promotion_safety'] is True
          assert gov['acceptance_credit_delta']==0
          assert gov['ownership_credit_delta']==0
          assert gov['execution_authority'] is False
          assert gov['promotion_authority'] is False
          assert 'NO_UNKNOWN_DOMAIN_ACCEPTANCE_CREDIT_FROM_V2_ALONE' in gov['hard_nonclaims']
          PY
