name: Verify universal active learning stack v2

on:
  pull_request:
    paths:
      - "canonical/governance/UNIVERSAL_ACTIVE_TRANSFER_LEARNER_V2.json"
      - "canonical/governance/UNIVERSAL_LEARNING_ACTIVE_ROUTER_V2.json"
      - "canonical/governance/UNIVERSAL_LEARNING_ACTIVE_V2_ACTIVATION_V1.json"
      - "canonical/runtime/universal_active_transfer_learner_v2.py"
      - "canonical/runtime/universal_learning_active_router_v2.py"
      - "canonical/tests/test_universal_active_transfer_learner_v2.py"
      - "canonical/tests/test_universal_active_transfer_learner_v2_binding.py"
      - "canonical/tests/test_universal_learning_active_router_v2.py"
      - "canonical/tests/test_universal_learning_active_router_v2_binding.py"
      - ".github/workflows/verify-universal-active-transfer-learner-v2.yml"
  push:
    paths:
      - "canonical/governance/UNIVERSAL_ACTIVE_TRANSFER_LEARNER_V2.json"
      - "canonical/governance/UNIVERSAL_LEARNING_ACTIVE_ROUTER_V2.json"
      - "canonical/governance/UNIVERSAL_LEARNING_ACTIVE_V2_ACTIVATION_V1.json"
      - "canonical/runtime/universal_active_transfer_learner_v2.py"
      - "canonical/runtime/universal_learning_active_router_v2.py"
      - "canonical/tests/test_universal_active_transfer_learner_v2.py"
      - "canonical/tests/test_universal_active_transfer_learner_v2_binding.py"
      - "canonical/tests/test_universal_learning_active_router_v2.py"
      - "canonical/tests/test_universal_learning_active_router_v2_binding.py"
      - ".github/workflows/verify-universal-active-transfer-learner-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest canonical.tests.test_universal_active_transfer_learner_v2 -v

  router-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest canonical.tests.test_universal_learning_active_router_v2 -v

  exact-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m unittest \
            canonical.tests.test_universal_active_transfer_learner_v2_binding \
            canonical.tests.test_universal_learning_active_router_v2_binding -v

  activation-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime import universal_active_transfer_learner_v2 as v2
          from canonical.runtime import universal_learning_active_router_v2 as router

          root=Path('.')
          gov=json.loads((root/'canonical/governance/UNIVERSAL_ACTIVE_TRANSFER_LEARNER_V2.json').read_text())
          router_gov=json.loads((root/'canonical/governance/UNIVERSAL_LEARNING_ACTIVE_ROUTER_V2.json').read_text())
          activation=json.loads((root/'canonical/governance/UNIVERSAL_LEARNING_ACTIVE_V2_ACTIVATION_V1.json').read_text())

          skill=v2.compile_verified_skill(
              skill_id='s',
              applicability={'x'},
              dependencies={'d'},
              invalidators={'v'},
              verification_receipts=[{
                  'receipt_id':'r',
                  'independent_verified':True,
                  'exact_byte_bound':True,
                  'conclusion':'success',
              }],
          )
          assert skill['trusted'] is True
          assert skill['promotion_authorized'] is False

          out=router.route(
              goal='new environment',
              verified_coverage=False,
              required_facts={'x'},
              verified_facts=set(),
              hypotheses=[
                  {'id':'h1','plausible':True,'best_action':'left'},
                  {'id':'h2','plausible':True,'best_action':'right'},
              ],
              actions=[],
          )
          assert out['route']=='ABSTAIN_OR_REQUEST_DISCRIMINATOR'
          assert out['trusted_execution_authorized'] is False

          assert gov['acceptance_credit_delta']==0
          assert gov['ownership_credit_delta']==0
          assert router_gov['unknown_domain_bridge']['unknown_domain_acceptance_proved'] is False
          assert activation['authoritative_entrypoint']=='canonical/runtime/universal_learning_active_router_v2.py'
          assert activation['acceptance_credit_delta']==0
          assert activation['ownership_credit_delta']==0
          PY
