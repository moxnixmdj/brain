name: Verify Opus 5.5 acceptance calibration

on:
  push:
    paths:
      - "canonical/runtime/opus55_acceptance_calibration_reducer_v1.py"
      - "canonical/tests/test_opus55_acceptance_calibration_reducer_v1.py"
      - "canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"
      - "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json"
      - "canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json"
      - ".github/workflows/verify-opus55-acceptance-calibration.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest canonical.tests.test_opus55_acceptance_calibration_reducer_v1 -v
      - name: Verify canonical calibration state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_acceptance_calibration_reducer_v1 import evaluate

          def load(p):
              return json.loads(Path(p).read_text(encoding="utf-8"))

          out = evaluate(
              load("canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"),
              load("canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json"),
              load("canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json"),
          )
          assert out["target_family_count"] == 19, out
          assert out["behavioral_pass_family_count"] == 19, out
          assert out["acceptance_calibrated_family_count"] + out["acceptance_pending_family_count"] == 19, out
          if out["acceptance_pending_family_count"]:
              assert out["pass"] is False, out
          else:
              assert out["pass"] is True, out
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
