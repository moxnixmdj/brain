name: Verify honesty load-bearing result gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/honesty_load_bearing_result_gate_v1.py"
      - "canonical/runtime/astra_runtime.py"
      - "canonical/tests/test_honesty_load_bearing_result_gate_v1.py"
      - "canonical/governance/HONESTY_LOAD_BEARING_RESULT_PROPAGATION_GATE_V1.json"
      - ".github/workflows/verify-honesty-load-bearing-result-gate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m pytest -q canonical/tests/test_honesty_load_bearing_result_gate_v1.py
