name: Verify honesty load-bearing result gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/honesty_load_bearing_result_gate_v1.py"
      - "canonical/runtime/astra_runtime.py"
      - "canonical/tests/test_honesty_load_bearing_result_gate_v1.py"
      - "canonical/governance/HONESTY_LOAD_BEARING_RESULT_PROPAGATION_GATE_V1.json"
      - ".github/workflows/verify-honesty-load-bearing-result-gate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          # Pinned to the minor series, not a patch release. The exact pin "3.12.10"
          # made setup-python fail outright on the Ubuntu 26.04 runner image
          # ("The version '3.12.10' with architecture 'x64' was not found"), so this
          # gate reported a failure without running a single test.
          python-version: "3.12"
      - run: python -m pytest -q canonical/tests/test_honesty_load_bearing_result_gate_v1.py
