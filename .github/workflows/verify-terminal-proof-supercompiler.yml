name: Verify terminal proof supercompiler
on:
  push:
    paths:
      - 'canonical/runtime/terminal_proof_supercompiler.py'
      - 'canonical/tests/test_terminal_proof_supercompiler.py'
      - 'canonical/governance/TERMINAL_PROOF_SUPERCOMPILER_ACTIVATION_V1.json'
      - '.github/workflows/verify-terminal-proof-supercompiler.yml'
  pull_request:
    paths:
      - 'canonical/runtime/terminal_proof_supercompiler.py'
      - 'canonical/tests/test_terminal_proof_supercompiler.py'
      - 'canonical/governance/TERMINAL_PROOF_SUPERCOMPILER_ACTIVATION_V1.json'
      - '.github/workflows/verify-terminal-proof-supercompiler.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest canonical.tests.test_terminal_proof_supercompiler -v
