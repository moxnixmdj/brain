name: Verify terminal progress delta gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/TERMINAL_PROGRESS_DELTA_GATE_V1.json"
      - "canonical/runtime/terminal_progress_delta_gate_v1.py"
      - "canonical/tests/test_terminal_progress_delta_gate_v1.py"
      - "canonical/action_intents/2026-10-06_INSTALL_TERMINAL_PROGRESS_DELTA_GATE_V1.json"
      - ".github/workflows/verify-terminal-progress-delta-gate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m py_compile canonical/runtime/terminal_progress_delta_gate_v1.py
      - run: python -m pytest -q canonical/tests/test_terminal_progress_delta_gate_v1.py
