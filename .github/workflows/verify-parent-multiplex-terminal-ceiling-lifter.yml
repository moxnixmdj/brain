name: Verify parent multiplex terminal ceiling lifter

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/parent_multiplex_terminal_ceiling_witness_lifter_v1.py"
      - "canonical/tests/test_parent_multiplex_terminal_ceiling_witness_lifter_v1.py"
      - ".github/workflows/verify-parent-multiplex-terminal-ceiling-lifter.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parent multiplex ceiling lifter tests
        shell: bash
        run: |
          set +e
          python -m unittest -v canonical.tests.test_parent_multiplex_terminal_ceiling_witness_lifter_v1 > /tmp/parent-multiplex-test.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/parent-multiplex-test.exit
          cat /tmp/parent-multiplex-test.log
          exit 0
      - name: Upload diagnostic test output
        uses: actions/upload-artifact@v4
        with:
          name: parent-multiplex-test-output
          path: |
            /tmp/parent-multiplex-test.log
            /tmp/parent-multiplex-test.exit
      - name: Enforce test result
        shell: bash
        run: test "$(cat /tmp/parent-multiplex-test.exit)" = "0"
