name: Verify proof atom receipt index v1
on:
  pull_request:
    paths:
      - "canonical/runtime/proof_atom_receipt_index_v1.py"
      - "canonical/tests/test_proof_atom_receipt_index_v1.py"
      - "canonical/governance/PROOF_ATOM_RECEIPT_INDEX_V1.json"
      - "canonical/runtime/canonical_proof_atom_basis_v2.py"
      - "canonical/governance/CANONICAL_PROOF_ATOM_BASIS_V2_ACTIVE_AUTHORITY_V1.json"
      - "canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json"
      - ".github/workflows/verify-proof-atom-receipt-index-v1.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run proof atom receipt index tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          python -m unittest canonical.tests.test_proof_atom_receipt_index_v1 -v > receipt-index-tests.stdout 2> receipt-index-tests.stderr
          code=$?
          echo "$code" > receipt-index-tests.exitcode
          exit 0
      - name: Execute current canonical V2 40-atom receipt index
        id: index
        continue-on-error: true
        run: |
          set +e
          python -m canonical.runtime.proof_atom_receipt_index_v1 > proof-atom-receipt-index.json 2> receipt-index.stderr
          code=$?
          echo "$code" > receipt-index.exitcode
          if [ "$code" -eq 0 ]; then
            python - <<'PY' > receipt-index-summary.json 2>> receipt-index.stderr
          import json
          p=json.load(open("proof-atom-receipt-index.json"))
          summary={
            "status":p.get("status"),
            "source_basis_schema":p.get("source_basis_schema"),
            "source_basis_refined_parent_count":p.get("source_basis_refined_parent_count"),
            "source_basis_leaf_requirement_occurrence_count":p.get("source_basis_leaf_requirement_occurrence_count"),
            "canonical_atom_count":p.get("canonical_atom_count"),
            "scanned_file_count":p.get("scanned_file_count"),
            "candidate_match_count":p.get("candidate_match_count"),
            "atoms_with_candidate_matches":p.get("atoms_with_candidate_matches"),
            "atoms_without_candidate_matches":p.get("atoms_without_candidate_matches"),
            "candidate_matches_by_source_class":p.get("candidate_matches_by_source_class"),
            "atom_ids_with_candidate_matches":p.get("atom_ids_with_candidate_matches"),
            "atom_ids_without_candidate_matches":p.get("atom_ids_without_candidate_matches")
          }
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          fi
          exit 0
      - name: Upload proof atom receipt index diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-atom-receipt-index-diagnostics
          path: |
            proof-atom-receipt-index.json
            receipt-index-summary.json
            receipt-index.stderr
            receipt-index.exitcode
            receipt-index-tests.stdout
            receipt-index-tests.stderr
            receipt-index-tests.exitcode
          if-no-files-found: warn
      - name: Enforce pass
        if: always()
        run: |
          test "$(cat receipt-index-tests.exitcode)" = "0"
          test "$(cat receipt-index.exitcode)" = "0"
          python - <<'PY'
          import json
          p=json.load(open("proof-atom-receipt-index.json"))
          assert p["status"].startswith("PASS")
          assert p["source_basis_schema"] == "PROJECT_BRAIN_CANONICAL_PROOF_ATOM_BASIS_V2"
          assert p["source_basis_refined_parent_count"] == 3
          assert p["source_basis_leaf_requirement_occurrence_count"] == 40
          assert p["canonical_atom_count"] == 40
          assert p["capability_credit_delta"] == 0
          assert p["family_credit_delta"] == 0
          PY
