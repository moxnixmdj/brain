name: H004 Public One-Shot

on:
  push:
    branches: [main]
    paths:
      - ARM_H004_PUBLIC_ONESHOT_001

permissions:
  contents: read

concurrency:
  group: h004-public-oneshot-001
  cancel-in-progress: false

jobs:
  h004:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 12
    env:
      DEBIAN_FRONTEND: noninteractive
      PROJECT_BRAIN_XAPIAN_APT_E2E_HELDOUT_004_EXECUTOR_ATTESTATION_JSON: >-
        {"executor_id":"github-public-standard-ubuntu-latest","provider":"GitHub Actions","status":"AVAILABLE","platforms":["linux"],"incremental_spend_usd":0.0,"hard_zero_spend":true,"gpu_allowed":false,"heavy_compute_allowed":false,"user_device_used":false,"hard_zero_evidence":{"source_class":"GITHUB_OFFICIAL_DOCUMENTATION","reference":"https://docs.github.com/en/actions/reference/runners/github-hosted-runners"}}

    steps:
      - name: Bootstrap checkout tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout exact arm commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce one-shot event identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -f ARM_H004_PUBLIC_ONESHOT_001
          created="$(git log --diff-filter=A --format=%H -- ARM_H004_PUBLIC_ONESHOT_001 | head -n1)"
          test -n "$created"
          test "$created" = "$GITHUB_SHA"

      - name: Install faithful Debian surface before START
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-xapian zbar-tools apt-file sudo
          apt-file update
          mkdir -p canonical/astra_runtime/evidence canonical/astra_runtime/pending_bindings canonical/astra_runtime/tmp
          python3 -c 'import xapian'
          command -v sudo
          command -v apt-cache
          command -v zbarimg

      - name: Verify metadata surface and sealed capsule before START
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys

          root=pathlib.Path(".").resolve()
          manifest_path=root/"canonical/astra_runtime/verification_capsules/H004_PUBLIC_GITHUB_ACTIONS_ONESHOT_001.json"
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))

          def git_blob_sha(path):
              raw=path.read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()

          bad=[]
          for rel,expected in manifest["sealed_files"].items():
              p=root/rel
              if not p.is_file():
                  bad.append([rel,"MISSING"])
                  continue
              actual=git_blob_sha(p)
              if actual!=expected:
                  bad.append([rel,actual,expected])
          if bad:
              raise SystemExit("SEALED_BLOB_MISMATCH:"+json.dumps(bad,sort_keys=True))

          start=root/"canonical/astra_runtime/evidence/XAPIAN-APT-E2E-INTEGRATION-HELDOUT-004__EXECUTION_START.json"
          result=root/"canonical/astra_runtime/evidence/XAPIAN-APT-E2E-INTEGRATION-HELDOUT-004__RESULT.json"
          if start.exists() or result.exists():
              raise SystemExit("H004_ALREADY_STARTED_OR_TERMINAL")

          proc=subprocess.run(
              ["apt-get","indextargets","--format","$(IDENTIFIER)\t$(FILENAME)"],
              text=True,capture_output=True,check=True
          )
          rows=[]
          for line in proc.stdout.splitlines():
              if "\t" in line:
                  ident,filename=line.split("\t",1)
                  rows.append((ident.strip(),filename.strip()))
          arch=subprocess.check_output(["dpkg","--print-architecture"],text=True).strip()
          packages=any(i.startswith("Packages") for i,_ in rows)
          translation_en=any("Translation-en" in f or ("Translation" in i and "en" in f) for i,f in rows)
          contents=[(i,f) for i,f in rows if i.startswith("Contents")]
          contents_all=any(re.search(r"Contents[-_](?:deb[-_])?all(?:\.|_|$)",f) or "Contents-all" in f for _,f in contents)
          contents_arch=any(
              re.search(r"Contents[-_](?:deb[-_])?"+re.escape(arch)+r"(?:\.|_|$)",f)
              or ("Contents-"+arch) in f
              for _,f in contents
          )
          if not packages:
              raise SystemExit("NORMAL_PACKAGES_METADATA_MISSING")
          if not translation_en:
              raise SystemExit("TRANSLATION_EN_METADATA_MISSING")
          if not contents:
              raise SystemExit("CONTENTS_METADATA_MISSING")
          if not contents_all:
              raise SystemExit("CONTENTS_ALL_METADATA_MISSING")
          if not contents_arch:
              raise SystemExit("CONTENTS_ARCH_METADATA_MISSING:"+arch)

          tags=subprocess.run(
              ["bash","-lc","apt-cache dumpavail | grep -m1 '^Tag:'"],
              text=True,capture_output=True
          )
          if tags.returncode!=0:
              raise SystemExit("DEBIAN_PACKAGE_TAG_METADATA_MISSING")

          runtime=root/"canonical/runtime"
          sys.path.insert(0,str(runtime))
          import auto_apt_cli_acquisition, executor_broker
          import verify_pending_cli_binding
          from bound_capabilities import cli_command, python_library_codec, node_library_codec, python_source_tree_codec

          print(json.dumps({
              "sealed_files":len(manifest["sealed_files"]),
              "packages_metadata":packages,
              "translation_en":translation_en,
              "contents_targets":len(contents),
              "contents_all":contents_all,
              "contents_arch":contents_arch,
              "architecture":arch,
              "xapian_import":True,
              "verifier_import_closure":True
          },sort_keys=True))
          PY

      - name: Execute frozen H004 exactly once
        shell: bash
        run: |
          set +e
          python3 canonical/experiments/run_xapian_apt_e2e_integration_heldout_004.py
          rc=$?
          echo "H004_RUNNER_RC=$rc"
          result="canonical/astra_runtime/evidence/XAPIAN-APT-E2E-INTEGRATION-HELDOUT-004__RESULT.json"
          start="canonical/astra_runtime/evidence/XAPIAN-APT-E2E-INTEGRATION-HELDOUT-004__EXECUTION_START.json"
          if [ -f "$start" ]; then
            echo "H004_START_RECEIPT_BEGIN"
            cat "$start"
            echo "H004_START_RECEIPT_END"
          fi
          if [ -f "$result" ]; then
            echo "H004_TERMINAL_RESULT_BEGIN"
            cat "$result"
            echo "H004_TERMINAL_RESULT_END"
          fi
          exit "$rc"
