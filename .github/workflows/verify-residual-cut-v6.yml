name: Verify exact residual cut v6
on:
  push:
    branches: [main]
    paths:
      - canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json
      - canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_INPUT_V6.json
      - canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_VERDICT_V6.json
      - canonical/runtime/minimum_reality_cut.py
      - .github/workflows/verify-residual-cut-v6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source binding and exact cut
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from canonical.runtime.minimum_reality_cut import solve

          inp=json.loads(Path("canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_INPUT_V6.json").read_text())
          exp=json.loads(Path("canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_VERDICT_V6.json").read_text())
          uni=json.loads(Path("canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json").read_text())

          actual_blob=subprocess.check_output(
              ["git","hash-object","canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json"],
              text=True
          ).strip()
          assert actual_blob==inp["source_universe_blob_sha"], (actual_blob,inp["source_universe_blob_sha"])
          assert actual_blob==exp["source_universe_blob_sha"]

          by_id={x["id"]:x for x in inp["observations"]}
          assert by_id["A_M0A_MATCHED_CROSS_DOMAIN_SEMANTIC_PARITY_V2"]["cost"] == uni["obligations"]["M0A"]["new_reality_units"]
          assert by_id["A_M1A_MATCHED_DRAWING_PARITY_ONLY_V2"]["cost"] == uni["obligations"]["M1A"]["new_reality_units"]
          assert by_id["A_M1B_MATCHED_GEOMETRY_COVERAGE_ONLY_V3"]["cost"] == uni["obligations"]["M1B"]["new_reality_units"]

          combined=next(x for x in uni["combined_evaluation_candidates"] if x["id"]=="A_M1_END_TO_END_DRAWING_GRAPH_AND_GEOMETRY_PARITY_V1")
          assert by_id[combined["id"]]["cost"] == combined["cost"]
          assert set(by_id[combined["id"]]["covers"]) == set(combined["covers"])

          out=solve(inp)
          print(json.dumps(out,sort_keys=True,indent=2))
          assert out["status"]=="EXACT_MINIMUM", out
          assert out["exact_minimum"] is True
          assert out["selected_observations"]==exp["selected_observations"], (out,exp)
          assert out["observation_count"]==exp["observation_count"]
          assert out["total_cost"]==exp["total_cost"]
          assert out["unresolved_distinctions"]==exp["unresolved_distinctions"]
          PY
