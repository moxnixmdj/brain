name: Diagnose P2 P3 information-safe proof v2b
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-p2-p3-information-safe-proof-v2b.yml
      - canonical/runtime/p2_p3_information_safe_proof_suites_v2.py
      - canonical/runtime/p2_p3_information_safe_candidate_v2.py
      - canonical/tests/test_p2_p3_information_safe_proof_v2.py
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests and preserve log
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m unittest -v canonical.tests.test_p2_p3_information_safe_proof_v2 > p2p3-test.log 2>&1
          code=$?
          cat p2p3-test.log
          echo "$code" > p2p3-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: p2p3-diagnostic-log
          path: |
            p2p3-test.log
            p2p3-exit.txt
