name: Root1 release chunk archive V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/release_chunk_archive_v1.py'
      - 'canonical/tests/test_release_chunk_archive_v1.py'
      - 'canonical/governance/ROOT1_RELEASE_ASSET_INTERNALIZATION_ROUTE_V1.json'
      - '.github/workflows/root1-release-chunk-archive-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release chunk archive
        run: python -m unittest canonical.tests.test_release_chunk_archive_v1 -v
