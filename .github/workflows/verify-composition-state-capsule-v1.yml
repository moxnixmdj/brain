name: Verify composition state capsule V1

on:
  push:
    branches: [main]
    paths:
      - "canonical/governance/COMPOSITION_STATE_CAPSULE_P1_P2_CONSTRUCTIVE_ROUTE_20261005_V1.json"
      - "canonical/runtime/composition_state_capsule_v1.py"
      - "canonical/runtime/composition_state_capsule_guard_v1.py"
      - "canonical/runtime/capability_planner.py"
      - "canonical/runtime/astra_runtime.py"
      - "canonical/tests/test_composition_state_capsule_v1.py"
      - "canonical/tests/test_composition_state_capsule_guard_v1.py"
      - "canonical/tests/test_composition_state_capsule_runtime_integration_v1.py"
      - "canonical/tests/test_capability_planner.py"
      - ".github/workflows/verify-composition-state-capsule-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Verify exact frozen subject blobs
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {
              "canonical/governance/COMPOSITION_STATE_CAPSULE_P1_P2_CONSTRUCTIVE_ROUTE_20261005_V1.json": "0b960324379acc9dd33669e2b780d3192dda09fd",
              "canonical/runtime/composition_state_capsule_v1.py": "6337298b4804307315308689fbeb65692c67980d",
              "canonical/runtime/composition_state_capsule_guard_v1.py": "73c7c275605e9e7bba1391256e5062f3d20257a6",
              "canonical/runtime/capability_planner.py": "629766f8a1194fd298e0809b64a5e9c5a39fa3ea",
              "canonical/runtime/astra_runtime.py": "7ca7aa3f09e45261f644ef31143dbba5fa7f823e",
              "canonical/tests/test_composition_state_capsule_v1.py": "675338b41c1154c46c2524013acf0b7edd88418a",
              "canonical/tests/test_composition_state_capsule_guard_v1.py": "e903303162f1b89bb91aa09eb808506f2d81c389",
              "canonical/tests/test_composition_state_capsule_runtime_integration_v1.py": "23ad57d3f3609cdd12f839a6d11cb7744938b5a8",
              "canonical/tests/test_capability_planner.py": "1427f25b7c2c2c37a8e619fa31c7777894a10664",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if got != want:
                  raise SystemExit(f"BLOB_DRIFT {path} {got} != {want}")
          print("EXACT_BLOBS_PASS")
      - name: Run state capsule and planner adversarial tests
        run: |
          python -m unittest -v \
            canonical.tests.test_composition_state_capsule_v1 \
            canonical.tests.test_composition_state_capsule_guard_v1 \
            canonical.tests.test_composition_state_capsule_runtime_integration_v1 \
            canonical.tests.test_capability_planner
