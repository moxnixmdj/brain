name: verify-source-aligned-semantic-edge-v1

on:
  push:
    branches:
      - source-aligned-semantic-edge-authority-v1-20261009
    paths:
      - canonical/runtime/source_aligned_semantic_edge_authority_v1.py
      - canonical/tests/test_source_aligned_semantic_edge_authority_v1.py
      - .github/workflows/verify-source-aligned-semantic-edge-v1.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/source_aligned_semantic_edge_authority_v1.py
      - canonical/tests/test_source_aligned_semantic_edge_authority_v1.py
      - .github/workflows/verify-source-aligned-semantic-edge-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile touched runtime
        run: |
          python -m py_compile \
            canonical/runtime/source_aligned_semantic_edge_authority_v1.py
      - name: Run focused semantic-edge dependency cone
        run: |
          python -m unittest -v \
            canonical.tests.test_source_aligned_semantic_edge_authority_v1 \
            canonical.tests.test_monotone_semantic_constraint_kernel_v1 \
            canonical.tests.test_semantic_relation_entailment_dag_v1 \
            canonical.tests.test_source_aligned_semantic_proof_v8
