name: verify-agent-v13-identity-v2

on:
  pull_request:
    branches: [main]
    paths:
      - execution_guard/logical_attempt_identity_v2.py
      - canonical/runtime/harbor_science_agent_v13.py
      - canonical/tests/test_harbor_science_agent_v13_claim_bound_identity.py
      - canonical/tests/test_logical_attempt_identity_v2.py
      - .github/workflows/verify-agent-v13-identity-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile identity repair
        run: |
          python3 -m py_compile             execution_guard/logical_attempt_identity_v2.py             canonical/runtime/harbor_science_agent_v13.py
      - name: Verify claim-bound identity and Agent V13
        run: |
          PYTHONPATH=. python3 -m unittest -v             canonical.tests.test_logical_attempt_identity_v2             canonical.tests.test_harbor_science_agent_v13_claim_bound_identity
