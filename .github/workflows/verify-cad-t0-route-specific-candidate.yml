name: Verify CAD T0 route-specific candidate
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/cad_t0_route_specific_candidate_v1.py
      - canonical/tests/test_cad_t0_route_specific_candidate_v1.py
      - .github/workflows/verify-cad-t0-route-specific-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - name: Run candidate and mutation tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=.:canonical/runtime python -m unittest -v canonical.tests.test_cad_t0_route_specific_candidate_v1 2>&1 | tee /tmp/cad-tests.txt
      - name: Publish deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-candidate-mutation-diagnostics
          path: /tmp/cad-tests.txt
          if-no-files-found: error
      - name: Enforce tests passed
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/cad-tests.txt').read_text()
          assert 'FAILED (' not in s and 'ERROR' not in s, s
          assert '\nOK\n' in s or s.rstrip().endswith('OK'), s
          PY
