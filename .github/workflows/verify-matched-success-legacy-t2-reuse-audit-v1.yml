name: Verify matched success legacy T2 reuse audit V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/MATCHED_SUCCESS_LEGACY_T2_REUSE_AUDIT_V1.json"
      - "canonical/runtime/matched_success_legacy_t2_reuse_audit_v1.py"
      - "canonical/tests/test_matched_success_legacy_t2_reuse_audit_v1.py"
      - ".github/workflows/verify-matched-success-legacy-t2-reuse-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m pytest -q canonical/tests/test_matched_success_legacy_t2_reuse_audit_v1.py
