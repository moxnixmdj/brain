name: Verify M1A hardening components

on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/drawing_perspective_rectification.py
      - canonical/runtime/drawing_robust_preprocess.py
      - canonical/runtime/gdt_feature_control_parser.py
      - canonical/tests/test_m1a_hardening_components.py
      - .github/workflows/verify-m1a-hardening-components.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - run: python -m unittest -v canonical.tests.test_m1a_hardening_components
