name: Shared Cognitive Basis Jev Probe V1

on:
  push:
    branches:
      - probe/shared-cognitive-basis-jev-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-laya:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Oracle mechanics self-test
        run: |
          python canonical/capabilities/cognitive_kernel/cognitive_basis_probe_v1.py \
            --cases canonical/capabilities/cognitive_kernel/cognitive_basis_probe_cases_v1.json \
            --oracle-self-test \
            --out /tmp/oracle.json

      - name: Install pinned local Simple-JEV with Laya backend
        run: |
          git clone https://github.com/featherless-ai/simple-jev.git /tmp/simple-jev
          git -C /tmp/simple-jev checkout 146d3a65cc6e52926bf136e2e29cd2d9d7108e39
          git -C /tmp/simple-jev rev-parse HEAD
          python -m pip install -e '/tmp/simple-jev/hf-server[laya]'

      - name: Start pinned Laya Typed-Decisions server
        env:
          USE_TF: "0"
        run: |
          nohup simple-jev \
            --backend laya \
            --model convaiinnovations/laya \
            --subfolder typed-decisions \
            --revision 458d7563c5cab85ff9f7f6e06cf2dd166fb697e2 \
            --device cpu \
            --max-model-len 1024 \
            > /tmp/simple-jev-laya.log 2>&1 &
          echo $! > /tmp/simple-jev-laya.pid
          for i in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/simple-jev-laya.log
          exit 1

      - name: Run unchanged shared-decision cases on Laya
        run: |
          python canonical/capabilities/cognitive_kernel/cognitive_basis_probe_v1.py \
            --cases canonical/capabilities/cognitive_kernel/cognitive_basis_probe_cases_v1.json \
            --endpoint http://127.0.0.1:8000 \
            --model convaiinnovations/laya \
            --delay 0 \
            --out cognitive_basis_probe_laya_result_v1.json

      - name: Preserve server log
        if: always()
        run: cp /tmp/simple-jev-laya.log simple_jev_laya_server_v1.log 2>/dev/null || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-basis-probe-laya-v1
          path: |
            cognitive_basis_probe_laya_result_v1.json
            simple_jev_laya_server_v1.log
          if-no-files-found: ignore
