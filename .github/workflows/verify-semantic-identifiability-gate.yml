name: Verify semantic identifiability gate
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/semantic_identifiability_gate.py
      - canonical/tests/test_semantic_identifiability_gate.py
      - .github/workflows/verify-semantic-identifiability-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_semantic_identifiability_gate
