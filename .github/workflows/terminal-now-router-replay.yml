name: Terminal Now Router Replay

on:
  push:
    branches: [main]
    paths:
      - 'canonical/runtime/certificate_gated_selected_route_router_v1.py'
      - 'canonical/runtime/astra_runtime.py'
      - 'canonical/tests/test_certificate_gated_selected_route_router_v1.py'
      - 'canonical/tests/test_astra_certificate_gated_route_binding_v1.py'
      - 'canonical/governance/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_RUNTIME_20261007_V1.json'
      - '.github/workflows/terminal-now-router-replay.yml'
  pull_request:
    paths:
      - 'canonical/runtime/certificate_gated_selected_route_router_v1.py'
      - 'canonical/runtime/astra_runtime.py'
      - 'canonical/tests/test_certificate_gated_selected_route_router_v1.py'
      - 'canonical/tests/test_astra_certificate_gated_route_binding_v1.py'
      - 'canonical/governance/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_RUNTIME_20261007_V1.json'
      - '.github/workflows/terminal-now-router-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-now-router-replay-${{ github.sha }}
  cancel-in-progress: false

# Landing on main goes through the front door (pull request + signed referee check);
# .github/scripts/land_on_main.sh needs the Brain Automation app to open that pull request.
env:
  AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
  AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
jobs:
  exact-byte-router-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Compile exact production seam
        run: |
          set -euo pipefail
          python3 -m py_compile \
            canonical/runtime/certificate_gated_selected_route_router_v1.py \
            canonical/runtime/astra_runtime.py \
            canonical/runtime/root3_production_astra_launcher_v1.py

      - name: Run ASTRA binding regression tests
        run: |
          set -euo pipefail
          python3 -m unittest -v canonical.tests.test_astra_certificate_gated_route_binding_v1

      - name: Exercise Root3 to ASTRA certificate-gated selection seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from canonical.runtime.root3_production_astra_launcher_v1 import load_astra_after_root3_install

          astra = load_astra_after_root3_install()

          from pathlib import Path
          import hashlib

          repo_root = Path.cwd()
          route_path = "canonical/runtime/certificate_gated_selected_route_router_v1.py"
          adequacy_path = "canonical/governance/K6_POSITIVE_ADEQUACY_COVER_CERTIFICATE_THEOREM_20261006_V1.json"
          admission_path = "canonical/governance/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_SOUNDNESS_REDUCTION_20261007_V1.json"

          def git_blob(rel):
              raw = (repo_root / rel).read_bytes()
              return hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\x00" + raw).hexdigest()

          route_sha = git_blob(route_path)
          adequacy_sha = git_blob(adequacy_path)
          admission_sha = git_blob(admission_path)
          bindings = {
              route_sha: route_path,
              adequacy_sha: adequacy_path,
              admission_sha: admission_path,
          }

          def receipt(*, admitted=True, context="ctx-terminal-now-v1", route="route-a", cell="cell-a", a=None, q=None, r=None):
              return {
                  "context_digest": context,
                  "cell_id": cell,
                  "route_id": route,
                  "route_blob_sha": route_sha,
                  "adequacy_certificate_blob_sha": adequacy_sha,
                  "admission_certificate_blob_sha": admission_sha,
                  "admitted": admitted,
              }

          step = {
              "id": "certificate-gated-route-selection",
              "adapter": "certificate_gated_route_select",
              "actual_context_digest": "ctx-terminal-now-v1",
              "content_address_bindings": bindings,
              "admission_receipts": [
                  receipt(admitted=False, a="0"),
                  receipt(route="route-b", cell="cell-b", a="4", q="5", r="6"),
                  receipt(route="route-a", cell="cell-a", a="1", q="2", r="3"),
              ],
          }
          chosen = astra.execute_step(step, mission={})
          assert chosen["schema"] == "PROJECT_BRAIN_CERTIFICATE_GATED_DEPLOYED_ROUTE_SELECTION_V1"
          assert chosen["route_id"] == "route-a"
          assert chosen["admitted"] is True
          assert chosen["content_address_binding_verified"] is True
          assert chosen["selection_only"] is True
          assert chosen["downstream_route_execution_performed"] is False
          assert chosen["execution_authority"] is False
          assert chosen["promotion_authority"] is False
          assert chosen["terminal_results_observed"] == 0
          assert chosen["terminal_credit_delta"] == 0

          denied = False
          try:
              astra.execute_step({
                  "id": "certificate-gated-route-selection-uncovered",
                  "adapter": "certificate_gated_route_select",
                  "actual_context_digest": "ctx-uncovered",
                  "content_address_bindings": bindings,
                  "admission_receipts": [receipt()],
              }, mission={})
          except astra.Blocker as exc:
              assert "NO_CERTIFIED_ROUTE_FOR_ACTUAL_CONTEXT" in str(exc)
              denied = True
          assert denied

          print(json.dumps({
              "root3_production_bootstrap_loaded": True,
              "astra_execute_step_binding_observed": True,
              "positive_context_bound_selection": True,
              "deterministic_selected_route": chosen["route_id"],
              "uncovered_context_fail_closed": True,
              "downstream_route_execution_performed": False,
              "terminal_credit_delta": 0,
          }, sort_keys=True))
          PY

      - name: Persist exact main replay receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p canonical/verification
          ROUTER_BLOB="$(git rev-parse HEAD:canonical/runtime/certificate_gated_selected_route_router_v1.py)"
          ASTRA_BLOB="$(git rev-parse HEAD:canonical/runtime/astra_runtime.py)"
          ROUTER_TEST_BLOB="$(git rev-parse HEAD:canonical/tests/test_certificate_gated_selected_route_router_v1.py)"
          ASTRA_TEST_BLOB="$(git rev-parse HEAD:canonical/tests/test_astra_certificate_gated_route_binding_v1.py)"
          GOVERNANCE_BLOB="$(git rev-parse HEAD:canonical/governance/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_RUNTIME_20261007_V1.json)"
          OUT="canonical/verification/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_GITHUB_REPLAY_${RUN_ID}_V2.json"
          LATEST="canonical/verification/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_GITHUB_REPLAY_LATEST_V2.json"
          python3 - "$OUT" "$ROUTER_BLOB" "$ASTRA_BLOB" "$ROUTER_TEST_BLOB" "$ASTRA_TEST_BLOB" "$GOVERNANCE_BLOB" <<'PY'
          import datetime as dt
          import json
          import os
          import sys

          out, router_blob, astra_blob, router_test_blob, astra_test_blob, governance_blob = sys.argv[1:]
          doc = {
              "schema": "PROJECT_BRAIN_CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_GITHUB_REPLAY_V2",
              "date": dt.datetime.now(dt.timezone.utc).date().isoformat(),
              "status": "PASS__EXACT_MAIN_ROOT3_ASTRA_CERTIFICATE_GATED_SELECTION_SEAM_OBSERVED__ZERO_TERMINAL_CREDIT",
              "github": {
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
                  "git_sha": os.environ["GIT_SHA"],
              },
              "exact_blobs": {
                  "canonical/runtime/certificate_gated_selected_route_router_v1.py": router_blob,
                  "canonical/runtime/astra_runtime.py": astra_blob,
                  "canonical/tests/test_certificate_gated_selected_route_router_v1.py": router_test_blob,
                  "canonical/tests/test_astra_certificate_gated_route_binding_v1.py": astra_test_blob,
                  "canonical/governance/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_RUNTIME_20261007_V1.json": governance_blob,
              },
              "replay": {
                  "runtime_compile": True,
                  "root3_production_bootstrap_loaded": True,
                  "astra_execute_step_binding_observed": True,
                  "positive_context_bound_selection": True,
                  "deterministic_content_addressed_tie_break": True,
                  "uncovered_context_fail_closed": True,
                  "downstream_route_execution_performed": False,
              },
              "truth_effect": {
                  "deployed_router_selection_binding_observed": True,
                  "downstream_route_execution_observed": False,
                  "per_cell_admission_semantics_closed": False,
                  "per_cell_adequacy_closed": False,
                  "selected_cover_complete": False,
                  "abc_closed": False,
                  "d_finality_closed": False,
                  "terminal": False,
              },
              "accounting": {
                  "incremental_spend_usd": 0,
                  "terminal_credit_delta": 0,
              },
          }
          with open(out, "w", encoding="utf-8") as f:
              json.dump(doc, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          git config user.name "Project Brain Terminal Replay"
          git config user.email "project-brain-terminal-replay@users.noreply.github.com"
          cp "$OUT" "$LATEST"
          git add "$OUT" "$LATEST"
          git commit -m "Record exact Root3-ASTRA router replay receipt"
          git pull --rebase origin main
          bash .github/scripts/land_on_main.sh
