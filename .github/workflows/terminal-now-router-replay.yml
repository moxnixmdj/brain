# forced replay trigger 2026-10-07T02:40Z
name: Terminal Now Router Replay

on:
  push:
    branches: [main]
    paths:
      - 'canonical/runtime/certificate_gated_selected_route_router_v1.py'
      - 'canonical/tests/test_certificate_gated_selected_route_router_v1.py'
      - 'canonical/governance/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_RUNTIME_20261007_V1.json'
      - '.github/workflows/terminal-now-router-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-now-router-replay-${{ github.sha }}
  cancel-in-progress: false

jobs:
  exact-byte-router-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Compile exact runtime
        run: |
          set -euo pipefail
          python3 -m py_compile canonical/runtime/certificate_gated_selected_route_router_v1.py

      - name: Exercise positive selection and fail-closed boundary
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from canonical.runtime.certificate_gated_selected_route_router_v1 import (
              AdmissionReceipt,
              RouterFailClosed,
              select_certified_route,
          )

          r1 = AdmissionReceipt(
              context_digest="ctx-terminal-now-v1",
              cell_id="cell-a",
              route_id="route-a",
              route_blob_sha="3"*40,
              adequacy_certificate_blob_sha="2"*40,
              admission_certificate_blob_sha="1"*40,
              admitted=True,
          )
          r2 = AdmissionReceipt(
              context_digest="ctx-terminal-now-v1",
              cell_id="cell-b",
              route_id="route-b",
              route_blob_sha="6"*40,
              adequacy_certificate_blob_sha="5"*40,
              admission_certificate_blob_sha="4"*40,
              admitted=True,
          )
          chosen = select_certified_route(
              actual_context_digest="ctx-terminal-now-v1",
              receipts=[r2, r1],
          )
          assert chosen.route_id == "route-a"
          assert chosen.admitted is True

          denied = False
          try:
              select_certified_route(
                  actual_context_digest="ctx-uncovered",
                  receipts=[r1, r2],
              )
          except RouterFailClosed as exc:
              assert str(exc) == "NO_CERTIFIED_ROUTE_FOR_ACTUAL_CONTEXT"
              denied = True
          assert denied

          print(json.dumps({
              "positive_selection_pass": True,
              "deterministic_selected_route": chosen.route_id,
              "uncovered_context_fail_closed_pass": True,
          }, sort_keys=True))
          PY

      - name: Persist exact replay receipt
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p canonical/verification
          RUNTIME_BLOB="$(git rev-parse HEAD:canonical/runtime/certificate_gated_selected_route_router_v1.py)"
          TEST_BLOB="$(git rev-parse HEAD:canonical/tests/test_certificate_gated_selected_route_router_v1.py)"
          GOVERNANCE_BLOB="$(git rev-parse HEAD:canonical/governance/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_RUNTIME_20261007_V1.json)"
          OUT="canonical/verification/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_GITHUB_REPLAY_${RUN_ID}_V1.json"
          python3 - "$OUT" "$RUNTIME_BLOB" "$TEST_BLOB" "$GOVERNANCE_BLOB" <<'PY'
          import datetime as dt
          import json
          import os
          import sys

          out, runtime_blob, test_blob, governance_blob = sys.argv[1:]
          doc = {
              "schema": "PROJECT_BRAIN_CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_GITHUB_REPLAY_V1",
              "date": dt.datetime.now(dt.timezone.utc).date().isoformat(),
              "status": "PASS__EXACT_MAIN_GITHUB_RUNNER_REPLAY__DEPLOYED_EXECUTION_SEAM_OBSERVED__ZERO_TERMINAL_CREDIT",
              "github": {
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
                  "git_sha": os.environ["GIT_SHA"],
              },
              "exact_blobs": {
                  "canonical/runtime/certificate_gated_selected_route_router_v1.py": runtime_blob,
                  "canonical/tests/test_certificate_gated_selected_route_router_v1.py": test_blob,
                  "canonical/governance/CERTIFICATE_GATED_SELECTED_ROUTE_ROUTER_RUNTIME_20261007_V1.json": governance_blob,
              },
              "replay": {
                  "runtime_compile": True,
                  "positive_context_bound_selection": True,
                  "deterministic_content_addressed_tie_break": True,
                  "uncovered_context_fail_closed": True,
              },
              "truth_effect": {
                  "deployed_runtime_execution_observed": True,
                  "per_cell_admission_semantics_closed": False,
                  "per_cell_adequacy_closed": False,
                  "selected_cover_complete": False,
                  "abc_closed": False,
                  "d_finality_closed": False,
                  "terminal": False,
              },
              "accounting": {
                  "incremental_spend_usd": 0,
                  "terminal_credit_delta": 0,
              },
          }
          with open(out, "w", encoding="utf-8") as f:
              json.dump(doc, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          git config user.name "Project Brain Terminal Replay"
          git config user.email "project-brain-terminal-replay@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Record exact terminal-now router replay receipt"
          git push origin HEAD:main
