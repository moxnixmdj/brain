name: Verify blinded unknown-mechanism proof surface
on:
  pull_request:
    paths:
      - canonical/runtime/blinded_unknown_mechanism_suite.py
      - canonical/tests/test_blinded_unknown_mechanism_suite.py
      - canonical/governance/MYSTERYMECHANISM_SCOPE_EQUIVALENT_PROOF_SURFACE_V1.json
      - .github/workflows/verify-blinded-unknown-mechanism-suite.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v canonical.tests.test_blinded_unknown_mechanism_suite
