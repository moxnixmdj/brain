name: Verify H100 UniChart storage feasibility V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/h100_unichart_storage_feasibility_v1.py'
      - 'canonical/tests/test_h100_unichart_storage_feasibility_v1.py'
      - 'canonical/governance/H100_UNICHART_STORAGE_FEASIBILITY_CANDIDATE_V1.json'
      - 'canonical/verification/H100_UNICHART_STORAGE_FEASIBILITY_CONNECTOR_VERIFICATION_20261005_V1.json'
      - '.github/workflows/verify-h100-unichart-storage-feasibility-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused tests
        run: python -m pytest canonical/tests/test_h100_unichart_storage_feasibility_v1.py -q
      - name: Run storage audit
        run: python canonical/runtime/h100_unichart_storage_feasibility_v1.py > h100_unichart_storage_audit.json
      - name: Assert zero-credit conditional pass
        run: |
          python - <<'PY'
          import json
          d=json.load(open("h100_unichart_storage_audit.json"))
          assert d["status"]=="CONDITIONAL_STORAGE_FEASIBILITY_PASS", d
          assert d["total_candidate_bytes"]==84341436, d
          assert d["margin_bytes"]==15658564, d
          assert d["h100_credit_delta"]==0, d
          assert d["execution_authority"] is False, d
          assert d["promotion_authority"] is False, d
          print(json.dumps({
            "status":d["status"],
            "total_candidate_bytes":d["total_candidate_bytes"],
            "margin_bytes":d["margin_bytes"],
            "h100_credit_delta":d["h100_credit_delta"]
          },indent=2,sort_keys=True))
          PY
