name: Verify multiplex terminal instrumentation reducer
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/multiplex_terminal_instrumentation_reducer_v1.py
      - canonical/tests/test_multiplex_terminal_instrumentation_reducer_v1.py
      - .github/workflows/verify-multiplex-terminal-instrumentation-reducer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_multiplex_terminal_instrumentation_reducer_v1
