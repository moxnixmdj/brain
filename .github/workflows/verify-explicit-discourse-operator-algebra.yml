name: Verify explicit discourse operator algebra
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/explicit_discourse_operator_algebra.py
      - canonical/tests/test_explicit_discourse_operator_algebra.py
      - .github/workflows/verify-explicit-discourse-operator-algebra.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_explicit_discourse_operator_algebra
