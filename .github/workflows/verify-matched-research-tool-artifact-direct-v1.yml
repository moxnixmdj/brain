name: Verify direct research tool artifact V1
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/matched_research_tool_artifact_direct_v1.py"
      - "canonical/tests/test_matched_research_tool_artifact_direct_v1.py"
      - "canonical/governance/MATCHED_RESEARCH_TOOL_ARTIFACT_DIRECT_20261007_V1.json"
      - ".github/workflows/verify-matched-research-tool-artifact-direct-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m pytest -q canonical/tests/test_matched_research_tool_artifact_direct_v1.py
      - run: python canonical/runtime/matched_research_tool_artifact_direct_v1.py
