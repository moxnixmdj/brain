name: Classify zero-spend Opus capacity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-spend-opus-capacity-classifier.yml'
  workflow_dispatch:

permissions:
  contents: write

# Landing on main goes through the front door (pull request + signed referee check);
# .github/scripts/land_on_main.sh needs the Brain Automation app to open that pull request.
env:
  AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
  AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Classify metadata-only capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical/verification
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          def get(url, headers):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      try: body=json.loads(r.read().decode("utf-8","replace"))
                      except Exception: body=None
                      return r.status,body
              except urllib.error.HTTPError as e:
                  return e.code,None
              except Exception:
                  return "NETWORK_ERROR",None

          def bearer(url,key):
              if not key:return None,None
              return get(url,{"Authorization":"Bearer "+key})

          def credit(body):
              d=body.get("data") if isinstance(body,dict) else None
              if not isinstance(d,dict):return None
              t,u=d.get("total_credits"),d.get("total_usage")
              return t-u if isinstance(t,(int,float)) and isinstance(u,(int,float)) else None

          def ids(body):
              d=body.get("data") if isinstance(body,dict) else None
              return [x.get("id") for x in d if isinstance(x,dict) and isinstance(x.get("id"),str)] if isinstance(d,list) else []

          def has55(xs):
              return any(x=="claude-opus-5-5" or ("opus" in x.lower() and ("5.5" in x.lower() or "5-5" in x.lower())) for x in xs)

          api=os.environ.get("OPENROUTER_API_KEY","")
          mgmt=os.environ.get("OPENROUTER_MANAGEMENT_API_KEY","")
          ant=os.environ.get("ANTHROPIC_API_KEY","")

          _,ca=bearer("https://openrouter.ai/api/v1/credits",api)
          _,cm=bearer("https://openrouter.ai/api/v1/credits",mgmt)
          sm,om=bearer("https://openrouter.ai/api/v1/models",api)
          cs=[x for x in (credit(cm),credit(ca)) if isinstance(x,(int,float))]
          or_ok=bool(cs and max(cs)>0 and sm==200 and has55(ids(om)))

          if ant:
              sa,am=get("https://api.anthropic.com/v1/models",{"x-api-key":ant,"anthropic-version":"2023-06-01"})
              an_ok=bool(sa==200 and has55(ids(am)))
          else:
              an_ok=False

          if or_ok and an_ok: mode="BOTH_OPENROUTER_PREEXISTING_CREDIT_AND_ANTHROPIC_MODEL_ACCESS"
          elif or_ok: mode="OPENROUTER_PREEXISTING_CREDIT_AND_OPUS55_MODEL_ACCESS"
          elif an_ok: mode="ANTHROPIC_OPUS55_MODEL_ACCESS_ONLY"
          else: mode="NO_USABLE_CANDIDATE_OBSERVED"

          out={"schema":"PROJECT_BRAIN_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_MODE_V1","status":mode}
          p="canonical/verification/OPUS55_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_MODE.json"
          with open(p,"w",encoding="utf-8") as f:
              json.dump(out,f,separators=(",",":"),sort_keys=True);f.write("\n")
          print(mode)
          PY
      - name: Commit fixed classification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Brain Capacity Classifier"
          git config user.email "project-brain-capacity-classifier@users.noreply.github.com"
          git add canonical/verification/OPUS55_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_MODE.json
          git diff --cached --quiet && exit 0
          git commit -m "Classify private zero-spend Opus capacity"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            bash .github/scripts/land_on_main.sh && exit 0
            sleep 2
          done
          exit 1
