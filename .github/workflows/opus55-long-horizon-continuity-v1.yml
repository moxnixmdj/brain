name: Opus55 Long Horizon Continuity V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/action_intents/2026-09-30_PROMOTE_OPUS55_LONG_HORIZON_CONTINUITY_V1.json'
      - 'canonical/verification/run_long_horizon_continuity_v1.py'
      - 'canonical/runtime/same_identity_supervisor.py'
      - 'canonical/tests/test_same_identity_supervisor.py'
      - 'canonical/runtime/root3_production_astra_launcher_v1.py'
      - 'canonical/runtime/root3_strict_current_bootstrap_v2.py'
      - 'canonical/runtime/astra_runtime.py'
      - '.github/workflows/opus55-long-horizon-continuity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify current exact supervisor across forced process boundary
        shell: bash
        run: |
          set -euo pipefail
          python canonical/verification/run_long_horizon_continuity_v1.py /tmp/LONG_HORIZON_CONTINUITY_REPORT.json
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opus55-long-horizon-continuity-v1
          path: /tmp/LONG_HORIZON_CONTINUITY_REPORT.json
          if-no-files-found: error
