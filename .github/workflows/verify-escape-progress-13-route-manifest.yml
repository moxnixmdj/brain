name: Verify escape-progress 13 route manifest

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/ESCAPE_PROGRESS_13_REACHED_STATE_ROUTE_MANIFEST_20261010_V1.json
      - canonical/governance/ESCAPE_PROGRESS_TOTALITY_FROZEN_13_CLAIM_20261010_V3.json
      - canonical/runtime/escape_progress_13_route_manifest_v1.py
      - canonical/tests/test_escape_progress_13_route_manifest_v1.py
      - .github/workflows/verify-escape-progress-13-route-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator and tests
        run: |
          python -m py_compile canonical/runtime/escape_progress_13_route_manifest_v1.py
          python -m py_compile canonical/tests/test_escape_progress_13_route_manifest_v1.py
      - name: Run focused manifest tests
        run: python -m unittest canonical.tests.test_escape_progress_13_route_manifest_v1 -v
      - name: Emit fail-closed manifest status
        run: python canonical/runtime/escape_progress_13_route_manifest_v1.py
