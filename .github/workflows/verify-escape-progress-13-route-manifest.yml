name: Verify escape-progress 13 route manifest

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/ESCAPE_PROGRESS_13_REACHED_STATE_ROUTE_MANIFEST_20261010_V1.json
      - canonical/governance/ESCAPE_PROGRESS_TOTALITY_FROZEN_13_CLAIM_20261010_V3.json
      - canonical/runtime/escape_progress_13_route_manifest_v1.py
      - canonical/tests/test_escape_progress_13_route_manifest_v1.py
      - .github/workflows/verify-escape-progress-13-route-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator and tests
        run: |
          python -m py_compile canonical/runtime/escape_progress_13_route_manifest_v1.py
          python -m py_compile canonical/tests/test_escape_progress_13_route_manifest_v1.py
      - name: Run focused manifest tests
        run: python -m unittest canonical.tests.test_escape_progress_13_route_manifest_v1 -v
      - name: Emit fail-closed manifest status
        run: python canonical/runtime/escape_progress_13_route_manifest_v1.py
      - name: Run current O11 proof-instantiation search
        run: |
          python - <<'PY'
          from canonical.runtime.current_escape_o11_proof_instantiation_search_v1 import scan
          import json
          out=scan()
          summary={
              "status":out.get("status"),
              "pass":out.get("pass"),
              "current_o_count":out.get("current_o_count"),
              "current_q_count":out.get("current_q_count"),
              "candidate_count":out.get("candidate_count"),
              "proved_candidate_count":out.get("proved_candidate_count"),
              "proved_obligation_ids":out.get("proved_obligation_ids"),
              "missing_obligation_ids":out.get("missing_obligation_ids"),
              "multi_row_proof_sources":out.get("multi_row_proof_sources"),
              "near_misses":out.get("near_misses"),
              "parse_failure_count":out.get("parse_failure_count"),
          }
          print("O11_CURRENT_SEARCH_SUMMARY="+json.dumps(summary,sort_keys=True,separators=(",",":")))
          PY
