name: Verify terminal scheduling V14 post Tool Discovery
on:
  pull_request:
    paths:
      - "canonical/governance/TERMINAL_SCHEDULING_V14_POST_TOOL_DISCOVERY_CANDIDATE_V1.json"
      - "canonical/runtime/terminal_scheduling_v14_post_tool_discovery_v1.py"
      - "canonical/tests/test_terminal_scheduling_v14_post_tool_discovery_v1.py"
      - ".github/workflows/verify-terminal-scheduling-v14-post-tool-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest canonical.tests.test_terminal_scheduling_v14_post_tool_discovery_v1 -v
      - run: python canonical/runtime/terminal_scheduling_v14_post_tool_discovery_v1.py
