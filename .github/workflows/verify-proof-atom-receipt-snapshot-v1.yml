name: Build sealed proof-atom receipt snapshot candidate

on:
  push:
    branches: [main]
    paths:
      - "canonical/verification/**"
      - "canonical/capabilities/**"
      - "canonical/governance/**"
      - "canonical/runtime/proof_atom_receipt_snapshot_v1.py"
      - "canonical/runtime/proof_atom_receipt_index_v2.py"
      - "canonical/runtime/canonical_proof_atom_basis_v2.py"
      - "canonical/tests/test_proof_atom_receipt_snapshot_v1.py"
      - "canonical/tests/test_proof_atom_receipt_index_v2.py"
      - ".github/workflows/verify-proof-atom-receipt-snapshot-v1.yml"
  pull_request:
    paths:
      - "canonical/verification/**"
      - "canonical/capabilities/**"
      - "canonical/governance/**"
      - "canonical/runtime/proof_atom_receipt_snapshot_v1.py"
      - "canonical/runtime/proof_atom_receipt_index_v2.py"
      - "canonical/runtime/canonical_proof_atom_basis_v2.py"
      - "canonical/tests/test_proof_atom_receipt_snapshot_v1.py"
      - "canonical/tests/test_proof_atom_receipt_index_v2.py"
      - ".github/workflows/verify-proof-atom-receipt-snapshot-v1.yml"
  workflow_dispatch:

jobs:
  verify-and-snapshot:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run index and snapshot adversarial suites
        shell: bash
        run: |
          python -m unittest             canonical.tests.test_proof_atom_receipt_index_v2             canonical.tests.test_proof_atom_receipt_snapshot_v1 -v             2>&1 | tee /tmp/proof_atom_snapshot_diagnostic.txt
      - name: Produce sealed candidate snapshot
        shell: bash
        run: |
          python canonical/runtime/proof_atom_receipt_snapshot_v1.py             > /tmp/proof_atom_receipt_snapshot_v1.json
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("/tmp/proof_atom_receipt_snapshot_v1.json")
          snapshot = json.loads(p.read_text(encoding="utf-8"))
          assert str(snapshot.get("status", "")).startswith("PASS"), snapshot
          assert snapshot.get("capability_credit_delta") == 0, snapshot
          assert snapshot.get("family_credit_delta") == 0, snapshot
          assert snapshot.get("execution_authority") is False, snapshot
          assert snapshot.get("promotion_authority") is False, snapshot
          assert snapshot.get("index", {}).get("canonical_atom_count") == 40, snapshot
          PY
      - name: Upload candidate snapshot
        uses: actions/upload-artifact@v4
        with:
          name: proof-atom-receipt-snapshot-v1-candidate
          path: /tmp/proof_atom_receipt_snapshot_v1.json
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-atom-receipt-snapshot-v1-diagnostics
          path: /tmp/proof_atom_snapshot_diagnostic.txt
          if-no-files-found: warn
