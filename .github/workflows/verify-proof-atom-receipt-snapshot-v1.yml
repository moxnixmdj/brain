name: Verify and run sealed proof-atom receipt snapshot v1

on:
  push:
    branches: [main]
    paths:
      - "canonical/runtime/proof_atom_receipt_snapshot_v1.py"
      - "canonical/tests/test_proof_atom_receipt_snapshot_v1.py"
      - "canonical/governance/PROOF_ATOM_RECEIPT_SNAPSHOT_V1.json"
      - "canonical/runtime/proof_atom_receipt_index_v2.py"
      - "canonical/runtime/canonical_proof_atom_basis_v2.py"
      - "canonical/governance/TERMINAL_CERTIFICATE_FRONTIER_V5.json"
      - "canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json"
      - ".github/workflows/verify-proof-atom-receipt-snapshot-v1.yml"
  workflow_dispatch:

jobs:
  verify-and-snapshot:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seal clean checkout and capture diagnostics
        shell: bash
        run: |
          set +e
          T="$RUNNER_TEMP/proof_atom_snapshot_v1"
          mkdir -p "$T"
          : > "$T/proof_atom_snapshot_diagnostic.txt"
          git status --porcelain > "$T/initial_worktree.txt"

          # Critical invariant: do not create any repository-local output before
          # the snapshot runtime has checked git status and sealed HEAD.
          python -m canonical.runtime.proof_atom_receipt_snapshot_v1 \
            > "$T/proof_atom_receipt_snapshot_v1.json" \
            2>> "$T/proof_atom_snapshot_diagnostic.txt"
          echo "$?" > "$T/snapshot.exitcode"

          git status --porcelain > "$T/post_snapshot_worktree.txt"

          python -m unittest canonical.tests.test_proof_atom_receipt_snapshot_v1 -v \
            >> "$T/proof_atom_snapshot_diagnostic.txt" 2>&1
          echo "$?" > "$T/tests.exitcode"

          python -m json.tool "$T/proof_atom_receipt_snapshot_v1.json" \
            >/dev/null 2>> "$T/proof_atom_snapshot_diagnostic.txt"
          echo "$?" > "$T/json.exitcode"

          if [ -s "$T/proof_atom_receipt_snapshot_v1.json" ]; then
            SNAPSHOT_PATH="$T/proof_atom_receipt_snapshot_v1.json" \
            python - <<'PY' > "$T/proof_atom_receipt_snapshot_v1_summary.json" \
              2>> "$T/proof_atom_snapshot_diagnostic.txt"
          import json
          import os
          from pathlib import Path
          s=json.loads(Path(os.environ["SNAPSHOT_PATH"]).read_text())
          i=s.get("index",{})
          r=s.get("repository_snapshot",{})
          summary={
              "schema":s.get("schema"),
              "status":s.get("status"),
              "repository_commit_sha":r.get("repository_commit_sha"),
              "repository_tree_sha":r.get("repository_tree_sha"),
              "search_root_tree_shas":r.get("search_root_tree_shas"),
              "scanned_file_count":r.get("scanned_file_count"),
              "scanned_manifest_sha256":r.get("scanned_manifest_sha256"),
              "index_sha256":s.get("index_sha256"),
              "canonical_atom_count":i.get("canonical_atom_count"),
              "canonical_atom_manifest_sha256":i.get("canonical_atom_manifest_sha256"),
              "candidate_match_count":i.get("candidate_match_count"),
              "atoms_with_candidate_matches":i.get("atoms_with_candidate_matches"),
              "atoms_without_candidate_matches":i.get("atoms_without_candidate_matches"),
              "atom_ids_with_candidate_matches":i.get("atom_ids_with_candidate_matches"),
              "atom_ids_without_candidate_matches":i.get("atom_ids_without_candidate_matches"),
              "candidate_matches_by_source_class":i.get("candidate_matches_by_source_class"),
              "atoms_with_truncated_candidate_lists":i.get("atoms_with_truncated_candidate_lists"),
              "new_reality_units_consumed":s.get("new_reality_units_consumed"),
              "capability_credit_delta":s.get("capability_credit_delta"),
              "family_credit_delta":s.get("family_credit_delta"),
              "execution_authority":s.get("execution_authority"),
              "promotion_authority":s.get("promotion_authority"),
          }
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          fi
          exit 0
      - name: Upload sealed snapshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-atom-receipt-snapshot-v1
          path: |
            ${{ runner.temp }}/proof_atom_snapshot_v1/proof_atom_receipt_snapshot_v1.json
            ${{ runner.temp }}/proof_atom_snapshot_v1/proof_atom_receipt_snapshot_v1_summary.json
            ${{ runner.temp }}/proof_atom_snapshot_v1/proof_atom_snapshot_diagnostic.txt
            ${{ runner.temp }}/proof_atom_snapshot_v1/initial_worktree.txt
            ${{ runner.temp }}/proof_atom_snapshot_v1/post_snapshot_worktree.txt
            ${{ runner.temp }}/proof_atom_snapshot_v1/snapshot.exitcode
            ${{ runner.temp }}/proof_atom_snapshot_v1/tests.exitcode
            ${{ runner.temp }}/proof_atom_snapshot_v1/json.exitcode
          if-no-files-found: error
      - name: Enforce fail-closed result
        if: always()
        shell: bash
        run: |
          T="$RUNNER_TEMP/proof_atom_snapshot_v1"
          test "$(cat "$T/snapshot.exitcode")" = "0"
          test "$(cat "$T/tests.exitcode")" = "0"
          test "$(cat "$T/json.exitcode")" = "0"
          test ! -s "$T/initial_worktree.txt"
          test ! -s "$T/post_snapshot_worktree.txt"
          SNAPSHOT_PATH="$T/proof_atom_receipt_snapshot_v1.json" python - <<'PY'
          import json
          import os
          from pathlib import Path
          s=json.loads(Path(os.environ["SNAPSHOT_PATH"]).read_text())
          assert str(s.get("status","")).startswith("PASS"), s
          i=s["index"]
          assert i["canonical_atom_count"] == 40
          assert i["capability_credit_delta"] == 0
          assert i["family_credit_delta"] == 0
          assert s["capability_credit_delta"] == 0
          assert s["family_credit_delta"] == 0
          PY
