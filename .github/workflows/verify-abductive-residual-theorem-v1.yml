name: Verify abductive residual theorem v1

on:
  pull_request:
    paths:
      - "canonical/runtime/abductive_residual_theorem_v1.py"
      - "canonical/tests/test_abductive_residual_theorem_v1.py"
      - "canonical/governance/ABDUCTIVE_RESIDUAL_THEOREM_COMPILER_V1.json"
      - ".github/workflows/verify-abductive-residual-theorem-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run abductive residual theorem tests
        run: python -m unittest canonical.tests.test_abductive_residual_theorem_v1 -v
      - name: Assert fail-closed governance contract
        run: |
          python - <<'PY'
          import json
          p="canonical/governance/ABDUCTIVE_RESIDUAL_THEOREM_COMPILER_V1.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["capability_credit_delta"] == 0
          assert d["family_credit_delta"] == 0
          assert d["execution_authority"] is False
          assert d["promotion_authority"] is False
          assert "NO_CIRCULAR_SELF_PROOF" in d["hard_rules"]
          print("abductive residual governance: PASS")
          PY
