name: verify-postwave-proof-kernel-v1
on:
  pull_request:
    paths:
      - 'canonical/runtime/postwave_evidence_reconciler_v1.py'
      - 'canonical/tests/test_postwave_evidence_reconciler_v1.py'
      - 'canonical/governance/POSTWAVE_EVIDENCE_RECONCILIATION_INPUT_V1.json'
      - 'canonical/runtime/generated_postwave_acceptance_state_v1.py'
      - 'canonical/tests/test_generated_postwave_acceptance_state_v1.py'
      - 'canonical/governance/POSTWAVE_ACCEPTANCE_STATE_POLICY_V1.json'
      - 'canonical/governance/POSTWAVE_PROOF_KERNEL_ACTIVATION_V1.json'
      - '.github/workflows/verify-postwave-proof-kernel-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify execution-snapshot binding identities
        shell: bash
        run: |
          set -euo pipefail
          SNAP=821712c059b139f3494723dca6e8d0fc82ee59a4
          D=$(git rev-parse "$SNAP:canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json")
          P=$(git rev-parse "$SNAP:canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json")
          test "$D" = "a1e441567b132d71713ed55dfc51f01d8de112d1"
          test "$P" = "8703c6aa08227467a619a7ae90d0d61f8e54da39"
          test "$(git rev-parse HEAD:canonical/governance/DELEGATION_T2_OBJECTIVE_TERMINAL_BINDING_V1.json)" = "$D"
          test "$(git rev-parse HEAD:canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json)" = "$P"
      - name: Run adversarial unit tests
        run: |
          python -m unittest             canonical.tests.test_postwave_evidence_reconciler_v1             canonical.tests.test_generated_postwave_acceptance_state_v1 -v
      - name: Verify live postwave reconciliation and generated frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.postwave_evidence_reconciler_v1 import evaluate as reconcile
          from canonical.runtime.generated_postwave_acceptance_state_v1 import evaluate as compile_state

          root=Path('.')
          load=lambda p: json.loads((root/p).read_text(encoding='utf-8'))
          rec=reconcile(
            load('canonical/governance/POSTWAVE_EVIDENCE_RECONCILIATION_INPUT_V1.json'),
            load('canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json'),
            load('canonical/governance/OPUS55_REOPENED_OBJECTIVE_ROUTE_RESIDUAL_V1.json'),
            load('canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json'),
            load('canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json'),
          )
          assert rec['status']=='PASS', rec
          assert [x['predicate_id'] for x in rec['candidate_predicate_witnesses']] == [
            'DELEGATION_TERMINAL_SUCCESS_NONINFERIOR'
          ], rec
          assert [x['predicate_id'] for x in rec['scope_valid_terminal_evidence']] == [
            'RECOVERY_CAUSAL_LOCALIZATION_NONINFERIOR'
          ], rec

          state=compile_state(
            load('canonical/governance/POSTWAVE_ACCEPTANCE_STATE_POLICY_V1.json'),
            load('canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json'),
            load('canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json'),
            load('canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json'),
            rec,
          )
          assert state['status']=='PASS', state
          assert state['predicate_count']==38, state
          assert state['proved_predicate_count']==8, state
          assert state['unresolved_predicate_count']==30, state
          assert state['strict_closed_family_count']==3, state
          assert state['global_terminal_promotion'] is False, state
          assert state['legacy_behavioral_global_residual_live_input_authoritative'] is False, state
          print(json.dumps({
            'reconciliation': rec,
            'state_summary': {
              'predicate_count': state['predicate_count'],
              'proved_predicate_count': state['proved_predicate_count'],
              'unresolved_predicate_count': state['unresolved_predicate_count'],
              'strict_closed_family_count': state['strict_closed_family_count'],
              'terminal_family_count': state['terminal_family_count'],
              'global_terminal_promotion': state['global_terminal_promotion'],
            }
          }, indent=2))
          PY
