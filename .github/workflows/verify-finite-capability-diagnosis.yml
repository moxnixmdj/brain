name: Verify finite capability diagnosis
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/finite_capability_diagnosis.py
      - canonical/tests/test_finite_capability_diagnosis.py
      - .github/workflows/verify-finite-capability-diagnosis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_finite_capability_diagnosis
