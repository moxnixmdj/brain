name: Verify exact DOM grounding
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/exact_dom_grounding.py
      - canonical/tests/test_exact_dom_grounding.py
      - .github/workflows/verify-exact-dom-grounding.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_exact_dom_grounding
