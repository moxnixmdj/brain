name: Mine existing receipt semantic candidates

on:
  push:
    paths:
      - "canonical/runtime/existing_receipt_semantic_candidate_miner_v1.py"
      - ".github/workflows/mine-existing-receipt-semantic-candidates.yml"
      - "canonical/governance/RECEIPT_SATURATION_REQUEST_V1.json"
  workflow_dispatch:

jobs:
  mine:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile latest main and mine exact existing-receipt candidates
        run: |
          git pull --rebase origin main
          python canonical/runtime/existing_receipt_semantic_candidate_miner_v1.py > canonical/reasoning/EXISTING_RECEIPT_SEMANTIC_CANDIDATE_MINING_20261002_V1.json
          python - <<'PY'
          import json
          p=json.load(open("canonical/reasoning/EXISTING_RECEIPT_SEMANTIC_CANDIDATE_MINING_20261002_V1.json"))
          print(json.dumps({
            "status":p["status"],
            "exact_catalog_edge_candidate_count":p["exact_catalog_edge_candidate_count"],
            "targets_with_catalog_edge_candidates":p["targets_with_catalog_edge_candidates"],
            "global_exact_reuse_candidate_count":p["global_exact_reuse_candidate_count"],
            "targets_with_global_exact_reuse_candidates":p["targets_with_global_exact_reuse_candidates"],
            "contamination_pointer_count":p["contamination_pointer_count"],
          },indent=2,sort_keys=True))
          PY
      - name: Commit deterministic discovery result
        run: |
          git config user.name "project-brain-ci"
          git config user.email "project-brain-ci@users.noreply.github.com"
          git add canonical/reasoning/EXISTING_RECEIPT_SEMANTIC_CANDIDATE_MINING_20261002_V1.json
          if git diff --cached --quiet; then
            echo "No discovery result change"
            exit 0
          fi
          git commit -m "Record existing-receipt semantic candidate mining"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-candidate-mining
          path: canonical/reasoning/EXISTING_RECEIPT_SEMANTIC_CANDIDATE_MINING_20261002_V1.json
