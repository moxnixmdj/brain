name: Guarded HTTP2 Parent A Physical Execution

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  execute-once:
    if: github.head_ref == 'execute/guarded-http2-parent-a-physical-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Atomic admission then execute frozen parent
        id: guarded
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _terminal
          python execution_guard/github_actions_guarded_run_live.py \
            --plan canonical/execution_plans/2026-09-30_HTTP2_PARENT_A_GUARDED_V1.json \
            --receipt _terminal/guarded-http2-parent-a-admission.json
      - name: Preserve terminal evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _terminal/snapshot
          cp canonical/tasks/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json _terminal/snapshot/task.json
          cp canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json _terminal/snapshot/mission.json
          cp canonical/action_intents/2026-09-30_EXECUTE_GUARDED_HTTP2_PARENT_TASK_A_V1.json _terminal/snapshot/authorization.json
          if [ -d canonical/astra_runtime/evidence ]; then cp -R canonical/astra_runtime/evidence _terminal/snapshot/evidence; fi
          if [ -d canonical/astra_runtime/state ]; then cp -R canonical/astra_runtime/state _terminal/snapshot/state; fi
          if [ -f _terminal/producer.log ]; then grep -E -m20 'PROJECT_BRAIN_ASTRA_RUNTIME_BLOCKER_V1|Blocker:|CAPABILITY_ACQUISITION_REQUIRED|OPEN_ENDED_RESEARCH_|COMPOUND_GOAL_COMPLETE' _terminal/producer.log > _terminal/first_signals.txt || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-http2-parent-a-terminal
          path: _terminal/
          if-no-files-found: warn
      - name: Confirm one physical spend or fail closed
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('_terminal/guarded-http2-parent-a-admission.json')
          if not p.is_file():
              raise SystemExit('NO_ADMISSION_RECEIPT__NO_EXECUTION_CREDIT')
          r=json.loads(p.read_text())
          if r.get('child_started') is not True:
              raise SystemExit('ADMITTED_BUT_CHILD_NOT_STARTED__NO_EXECUTION_CREDIT')
          a=r.get('admission') or {}
          if a.get('status')!='CURRENT_RUN_ADMITTED':
              raise SystemExit('ADMISSION_STATUS_INVALID')
          print('PARENT_PHYSICAL_EXECUTION_RECORDED')
          print('child_returncode=',r.get('child_returncode'))
          PY
