name: Verify P1 zero-reality exhaustion gate
on:
  push:
    paths:
      - "canonical/runtime/p1_zero_reality_exhaustion_gate_v1.py"
      - "canonical/tests/test_p1_zero_reality_exhaustion_gate_v1.py"
      - "canonical/governance/P1_ZERO_REALITY_EXHAUSTION_GATE_ACTIVATION_V1.json"
      - "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json"
      - "canonical/governance/P1_TERMINAL_EXECUTION_SCOPE_MISMATCH_QUARANTINE_V1.json"
      - "canonical/verification/P1_V4_SCOPE_SAFE_RESIDUAL_DISCHARGE_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/verification/TRAJECTORY_TYPED_IR_V4_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/verification/TRAJECTORY_INFORMATION_SAFE_V2_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
  pull_request:
    paths:
      - "canonical/runtime/p1_zero_reality_exhaustion_gate_v1.py"
      - "canonical/tests/test_p1_zero_reality_exhaustion_gate_v1.py"
      - "canonical/governance/P1_ZERO_REALITY_EXHAUSTION_GATE_ACTIVATION_V1.json"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed gate tests
        run: python -m unittest canonical.tests.test_p1_zero_reality_exhaustion_gate_v1 -v
      - name: Execute live gate
        run: |
          python canonical/runtime/p1_zero_reality_exhaustion_gate_v1.py > p1-zero-reality-gate.json
          python - <<'PY'
          import json
          p=json.load(open("p1-zero-reality-gate.json"))
          assert p["status"].startswith("PASS")
          assert p["zero_reality_fixed_point_reached"] is True
          assert p["can_clear_p1_scope_quarantine"] is False
          assert set(p["residual_obligations"])=={"P1_EXPLICIT_SCOPE_FAILURE_CLASS","P1_HETEROGENEOUS_INTERVENTION_RESCUE"}
          assert p["execution_authority"] is False
          assert p["promotion_authority"] is False
          print(json.dumps(p["next_proof_cut"],indent=2,sort_keys=True))
          PY
