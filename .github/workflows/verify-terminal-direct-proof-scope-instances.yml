name: Verify terminal direct-proof scope instances
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/TERMINAL_DIRECT_PROOF_SCOPE_INSTANCES_V1.json
      - canonical/runtime/terminal_direct_proof_scope_instance_validator.py
      - canonical/tests/test_terminal_direct_proof_scope_instance_validator.py
      - canonical/runtime/contract_native_proof_suites.py
      - .github/workflows/verify-terminal-direct-proof-scope-instances.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_terminal_direct_proof_scope_instance_validator
      - run: python canonical/runtime/terminal_direct_proof_scope_instance_validator.py
