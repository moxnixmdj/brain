name: verify-terminal-minimum-causal-depth-projection-v1
on:
  pull_request:
    paths:
      - 'canonical/governance/TERMINAL_ROOT_CAUSE_STATE_V1.json'
      - 'canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json'
      - 'canonical/runtime/terminal_minimum_causal_depth_projection_guard_v1.py'
      - 'canonical/tests/test_terminal_minimum_causal_depth_projection_guard_v1.py'
      - '.github/workflows/verify-terminal-minimum-causal-depth-projection-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python canonical/runtime/terminal_minimum_causal_depth_projection_guard_v1.py
      - run: python -c "from canonical.tests.test_terminal_minimum_causal_depth_projection_guard_v1 import test_projection_guard; test_projection_guard()"
