name: Verify synthesis grounded expression V2

on:
  push:
    branches: [main]
    paths:
      - "canonical/runtime/synthesis_grounded_expression_ir_v1.py"
      - "canonical/tests/test_synthesis_grounded_expression_ir_v1.py"
      - "canonical/governance/SYNTHESIS_C2_GROUNDED_EXPRESSION_BOUNDED_ROUTE_20261005_V2.json"
      - ".github/workflows/verify-synthesis-grounded-expression-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact frozen blobs
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {
              "canonical/runtime/synthesis_grounded_expression_ir_v1.py": "0709b7d43a069eaa9eb3240df28789a9107a36db",
              "canonical/tests/test_synthesis_grounded_expression_ir_v1.py": "f28e5648e7327fdd6cba54c602016485e0eb66c5",
              "canonical/governance/SYNTHESIS_C2_GROUNDED_EXPRESSION_BOUNDED_ROUTE_20261005_V2.json": "a138e506a9488a6f268c65febed7eb9420404de5",
          }
          for p, want in expected.items():
              data = Path(p).read_bytes()
              got = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if got != want:
                  raise SystemExit(f"BLOB_DRIFT {p} {got} != {want}")
          print("EXACT_BLOBS_PASS")
      - name: Run grounded expression tests
        run: python -m unittest -v canonical.tests.test_synthesis_grounded_expression_ir_v1
