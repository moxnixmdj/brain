name: Verify terminal parent portfolio launcher

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/terminal_parent_portfolio_launcher_v1.py
      - canonical/tests/test_terminal_parent_portfolio_launcher_v1.py
      - .github/workflows/verify-terminal-parent-portfolio-launcher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-boundary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: import_direct
            module: canonical.runtime.direct_route_terminal_executors_v1
          - name: import_multiplex
            module: canonical.runtime.portfolio_multiplex_terminal_instrumentation_v1
          - name: import_cad
            module: canonical.runtime.cad_t0_route_specific_terminal_executor_v1
          - name: import_launcher
            module: canonical.runtime.terminal_parent_portfolio_launcher_v1
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -c "import ${{ matrix.module }}"

  invariant:
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_static_route_algebra_is_exact_twelve
          - test_plan_deduplicates_shared_tool_route
          - test_zero_terminal_rehearsal_full_wave_passes_with_stubbed_runners
          - test_missing_required_parent_coverage_fails_closed
          - test_beacon_mismatch_fails_closed
          - test_direct_failure_blocks_wave
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_terminal_parent_portfolio_launcher_v1.TerminalParentPortfolioLauncherTests.${{ matrix.test }}
