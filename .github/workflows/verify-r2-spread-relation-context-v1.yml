name: verify-r2-spread-relation-context-v1

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/evidence/SPREAD_RELATION_CONTEXT_SOURCE_PACK_V1.json
      - canonical/runtime/spread_relation_context_identity_v1.py
      - canonical/runtime/spread_relation_identity_truth_certificate_v1.py
      - canonical/runtime/semantic_truth_dispatch_v1.py
      - canonical/tests/test_spread_relation_context_truth_v1.py
      - .github/workflows/verify-r2-spread-relation-context-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed runtime
        run: |
          python -m py_compile             canonical/runtime/spread_relation_context_identity_v1.py             canonical/runtime/spread_relation_identity_truth_certificate_v1.py             canonical/runtime/semantic_truth_dispatch_v1.py
      - name: Run focused adversarial suite
        run: |
          python -m unittest canonical.tests.test_spread_relation_context_truth_v1 -v
      - name: Run live official-source replay
        run: |
          python - <<'PY'
          from canonical.runtime import spread_relation_context_identity_v1 as m

          cases = [
              (
                  "The spread between the bid price and the ask price widened.",
                  "spread",
                  m.BID_ASK,
              ),
              (
                  "Corporate bond spreads, measured as the difference in yields "
                  "between corporate bonds and comparable-maturity Treasury "
                  "securities, narrowed.",
                  "spreads",
                  m.CORP_TSY,
              ),
          ]
          for text, needle, expected in cases:
              start = text.casefold().index(needle.casefold())
              out = m.resolve_occurrence(
                  text,
                  start=start,
                  end=start + len(needle),
              )
              assert out.get("pass") is True, out
              assert out.get("concept_id") == expected, out
              assert out.get("source_result", {}).get("pass") is True, out
              assert out.get("terminal_authority") is False, out
              print(expected, out["status"])
          PY
