name: Verify G0 finite typed rule synthesis
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/g0_finite_typed_rule_synthesis.py
      - canonical/tests/test_g0_finite_typed_rule_synthesis.py
      - .github/workflows/verify-g0-finite-typed-rule-synthesis.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/g0_finite_typed_rule_synthesis.py
      - canonical/tests/test_g0_finite_typed_rule_synthesis.py
      - .github/workflows/verify-g0-finite-typed-rule-synthesis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_g0_finite_typed_rule_synthesis
