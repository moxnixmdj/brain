name: Verify adaptive terminal closure controller v1

on:
  push:
    paths:
      - "canonical/runtime/adaptive_terminal_closure_controller_v1.py"
      - "canonical/tests/test_adaptive_terminal_closure_controller_v1.py"
      - "canonical/governance/ADAPTIVE_TERMINAL_CLOSURE_ACTIVATION_V1.json"
      - ".github/workflows/verify-adaptive-terminal-closure-controller-v1.yml"
  pull_request:
    paths:
      - "canonical/runtime/adaptive_terminal_closure_controller_v1.py"
      - "canonical/tests/test_adaptive_terminal_closure_controller_v1.py"
      - "canonical/governance/ADAPTIVE_TERMINAL_CLOSURE_ACTIVATION_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json"
      - "canonical/governance/CURRENT_27_INFORMATION_DOMINANCE_V1.json"
      - "canonical/governance/MATCHED_SCOPE_ABDUCTIVE_RESIDUAL_INPUT_V2.json"
      - "canonical/capabilities/opus55/OPUS_5_5_CAPABILITY_OWNERSHIP_MATRIX_V1.json"
      - ".github/workflows/verify-adaptive-terminal-closure-controller-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen blob bindings
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          activation = json.loads(Path("canonical/governance/ADAPTIVE_TERMINAL_CLOSURE_ACTIVATION_V1.json").read_text())
          pairs = [
              (activation["bound_current_scheduling_authority"]["path"], activation["bound_current_scheduling_authority"]["git_blob_sha"]),
              (activation["inputs"]["current_27_information_dominance"]["path"], activation["inputs"]["current_27_information_dominance"]["git_blob_sha"]),
              (activation["inputs"]["matched_scope_abductive_residual_v2"]["path"], activation["inputs"]["matched_scope_abductive_residual_v2"]["git_blob_sha"]),
              (activation["inputs"]["ownership_matrix"]["path"], activation["inputs"]["ownership_matrix"]["git_blob_sha"]),
              (activation["controller"]["path"], activation["controller"]["git_blob_sha"]),
              (activation["tests"]["path"], activation["tests"]["git_blob_sha"]),
          ]
          bad = []
          for path, expected in pairs:
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if actual != expected:
                  bad.append((path, expected, actual))
          if bad:
              print(bad)
              sys.exit(1)
          print("exact adaptive closure blobs verified")
          PY
      - name: Run adaptive controller falsification tests
        run: python -m unittest canonical.tests.test_adaptive_terminal_closure_controller_v1 -v
      - name: Emit zero-credit live projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.adaptive_terminal_closure_controller_v1 import compile_controller

          def load(p):
              return json.loads(Path(p).read_text())

          out = compile_controller(
              load("canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json"),
              load("canonical/governance/CURRENT_27_INFORMATION_DOMINANCE_V1.json"),
              load("canonical/governance/MATCHED_SCOPE_ABDUCTIVE_RESIDUAL_INPUT_V2.json"),
              load("canonical/capabilities/opus55/OPUS_5_5_CAPABILITY_OWNERSHIP_MATRIX_V1.json"),
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          assert out["execution_authority"] is False
          assert out["promotion_authority"] is False
          assert out["fresh_reality_authority"] is False
          assert out["acceptance_credit"] == 0
          assert out["family_credit_delta"] == 0
          assert out["ownership_credit_delta"] == 0
          PY
