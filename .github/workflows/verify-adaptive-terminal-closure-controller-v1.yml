name: Verify adaptive terminal closure controller v1

on:
  push:
    paths:
      - "canonical/runtime/adaptive_terminal_closure_controller_v1.py"
      - "canonical/tests/test_adaptive_terminal_closure_controller_v1.py"
      - "canonical/governance/ADAPTIVE_TERMINAL_CLOSURE_ACTIVATION_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json"
      - ".github/workflows/verify-adaptive-terminal-closure-controller-v1.yml"
  pull_request:
    paths:
      - "canonical/runtime/adaptive_terminal_closure_controller_v1.py"
      - "canonical/tests/test_adaptive_terminal_closure_controller_v1.py"
      - "canonical/governance/ADAPTIVE_TERMINAL_CLOSURE_ACTIVATION_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json"
      - ".github/workflows/verify-adaptive-terminal-closure-controller-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact V13 V5 frontier
        run: |
          python canonical/runtime/adaptive_terminal_closure_controller_v1.py > ADAPTIVE_TERMINAL_CLOSURE_RESULT.json
          python - <<'PY'
          import json
          x=json.load(open("ADAPTIVE_TERMINAL_CLOSURE_RESULT.json"))
          assert x["pass"] is True,x
          assert x["live_world"]["proved_predicates"]==11,x
          assert x["live_world"]["unresolved_predicates"]==27,x
          assert x["live_world"]["active_zero_reality_requirements"]==17,x
          assert x["live_world"]["active_nondominated_certificates"]==14,x
          assert x["live_world"]["zero_reality_covered_predicates"]==25,x
          assert x["live_world"]["primitive_zero_reality_work_units"]==31,x
          assert x["live_world"]["matched_primitive_child_facts"]==16,x
          assert len(x["acceptance_work_units"])==31,x
          assert len(x["first_resource_priority_work_unit_ids"])==16,x
          assert len(x["ownership_reconciliation_work_units"])==2,x
          td=[r for r in x["acceptance_work_units"] if "TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR" in r["target_predicates"]]
          assert len(td)==1,x
          assert td[0]["mandatory_tool_discovery_v5_gate"] is True,x
          assert td[0]["source_hints"][0]=="MANDATORY_TOOL_DISCOVERY_V5_OVER_VERIFIED_V4_OVER_VERIFIED_V3_OVER_VERIFIED_V2_RETRIEVAL_GATE",x
          assert x["execution_policy"]["tool_discovery_v5_gate_mandatory"] is True,x
          assert x["execution_authority"] is False,x
          assert x["promotion_authority"] is False,x
          assert x["fresh_reality_authority"] is False,x
          PY
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adaptive V13 V5 unit tests
        run: python -m unittest canonical.tests.test_adaptive_terminal_closure_controller_v1 -v
