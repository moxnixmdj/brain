name: Verify matched success finite-scope reducer V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/matched_success_finite_scope_reducer_v1.py"
      - "canonical/tests/test_matched_success_finite_scope_reducer_v1.py"
      - "canonical/governance/MATCHED_SUCCESS_FINITE_SCOPE_REDUCER_V1.json"
      - ".github/workflows/verify-matched-success-finite-scope-reducer-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m py_compile canonical/runtime/matched_success_finite_scope_reducer_v1.py
      - run: python -m pytest -q canonical/tests/test_matched_success_finite_scope_reducer_v1.py
