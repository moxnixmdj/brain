name: Verify callout geometry association
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/callout_geometry_association.py
      - canonical/tests/test_callout_geometry_association.py
      - .github/workflows/verify-callout-geometry-association.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_callout_geometry_association
