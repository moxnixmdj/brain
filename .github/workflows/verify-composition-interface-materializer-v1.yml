name: Verify composition interface materializer v1
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/composition_interface_materializer_v1.py"
      - "canonical/tests/test_composition_interface_materializer_v1.py"
      - "canonical/governance/COMPOSITION_COMPONENT_INTERFACES_V1.json"
      - "canonical/governance/COMPOSITION_INTERFACE_MATERIALIZER_ACTIVATION_V1.json"
      - ".github/workflows/verify-composition-interface-materializer-v1.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest canonical.tests.test_composition_interface_materializer_v1 -v
