name: Verify Root3 single Popen chokepoint V1

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/root3_single_popen_chokepoint_v1.py
      - canonical/tests/test_root3_single_popen_chokepoint_v1.py
      - canonical/governance/ROOT3_SINGLE_POPEN_CHOKEPOINT_20261005_V1.json
      - .github/workflows/verify-root3-single-popen-chokepoint-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Run focused tests
        run: python -m unittest -v canonical.tests.test_root3_single_popen_chokepoint_v1
      - name: Run structural audit
        run: python canonical/runtime/root3_single_popen_chokepoint_v1.py
