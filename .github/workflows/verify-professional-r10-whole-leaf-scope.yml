name: Verify Professional R10 whole-leaf scope
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/PROFESSIONAL_QUALITY_R10_EXECUTION_WHOLE_LEAF_SCOPE_CERTIFICATE_20261010_V1.json
      - canonical/tests/test_professional_quality_r10_execution_whole_leaf_scope_certificate_v1.py
      - canonical/runtime/professional_quality_whole_leaf_scope_certificate_v1.py
      - canonical/tests/test_professional_quality_whole_leaf_scope_certificate_v1.py
      - .github/workflows/verify-professional-r10-whole-leaf-scope.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile canonical/runtime/professional_quality_whole_leaf_scope_certificate_v1.py
      - run: python -m unittest -v canonical.tests.test_professional_quality_whole_leaf_scope_certificate_v1 canonical.tests.test_professional_quality_r10_execution_whole_leaf_scope_certificate_v1
