name: Internalize DINOv2 ViT-S14 checkpoint

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internalize-dinov2-vits14
  cancel-in-progress: false

jobs:
  internalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Acquire raw checkpoint without executing it
        shell: bash
        run: |
          set -euo pipefail
          dst="canonical/capabilities/internalized/vision/dinov2_vits14"
          mkdir -p "$dst"
          url="https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth"
          tmp="$RUNNER_TEMP/dinov2_vits14_pretrain.pth"
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 "$url" -o "$tmp"
          size="$(stat -c '%s' "$tmp")"
          if [ "$size" -ge 100000000 ]; then
            echo "Checkpoint too large for guarded canonical Git storage: $size bytes" >&2
            exit 1
          fi
          sha="$(sha256sum "$tmp" | awk '{print $1}')"
          cp "$tmp" "$dst/dinov2_vits14_pretrain.pth"
          python - "$dst/INTERNALIZATION_MANIFEST.json" "$sha" "$size" <<'PY'
          import json,sys
          path,sha,size=sys.argv[1],sys.argv[2],int(sys.argv[3])
          doc={
            "schema":"PROJECT_BRAIN_INTERNALIZED_DINOV2_VITS14_V1",
            "date":"2026-10-02",
            "status":"RAW_CHECKPOINT_BYTES_INTERNALIZED__ZERO_CAPABILITY_CREDIT_UNTIL_SAFE_LOAD_AND_BINDING_VERIFICATION",
            "upstream_repository":"facebookresearch/dinov2",
            "upstream_commit":"7764ea0f912e53c92e82eb78a2a1631e92725fc8",
            "model":"dinov2_vits14 distilled backbone",
            "parameter_count_millions":21,
            "upstream_model_card_license":"Apache-2.0",
            "checkpoint_source":"https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth",
            "checkpoint_path":"canonical/capabilities/internalized/vision/dinov2_vits14/dinov2_vits14_pretrain.pth",
            "checkpoint_sha256":sha,
            "checkpoint_size_bytes":size,
            "acquisition_execution_policy":"RAW_BYTES_ONLY__NO_PICKLE_EXECUTION_DURING_ACQUISITION",
            "incremental_spend_usd":0,
            "capability_credit_delta":0,
            "family_credit_delta":0
          }
          open(path,"w",encoding="utf-8").write(json.dumps(doc,indent=2,sort_keys=True)+"\n")
          PY
          echo "checkpoint_size_bytes=$size"
          echo "checkpoint_sha256=$sha"

      - name: Commit durable internalized bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "brain-capability-internalizer"
          git config user.email "brain-capability-internalizer@users.noreply.github.com"
          git config http.postBuffer 200000000
          git add canonical/capabilities/internalized/vision/dinov2_vits14/
          if git diff --cached --quiet; then
            echo "No checkpoint delta to commit."
            exit 0
          fi
          git commit -m "Internalize checksum-bound DINOv2 ViT-S14 visual backbone"
          git push origin HEAD:main
