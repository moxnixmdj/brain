name: verify-gdpval-objective-artifact-criteria-v2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/gdpval_objective_artifact_criteria_v1.py
      - canonical/tests/test_gdpval_objective_artifact_criteria_v1.py
      - canonical/tests/test_gdpval_objective_artifact_criteria_v2.py
      - .github/workflows/verify-gdpval-objective-artifact-criteria-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-docx openpyxl python-pptx pypdf
      - run: python -m py_compile canonical/runtime/gdpval_objective_artifact_criteria_v1.py
      - run: python -m pytest -q canonical/tests/test_gdpval_objective_artifact_criteria_v1.py canonical/tests/test_gdpval_objective_artifact_criteria_v2.py
