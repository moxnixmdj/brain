name: Verify terminal route execution plan
on:
  push:
    branches: [main]
    paths:
      - canonical/governance/TERMINAL_ROUTE_EXECUTION_PLAN_V1.json
      - canonical/runtime/terminal_route_execution_plan_validator.py
      - canonical/tests/test_terminal_route_execution_plan_validator.py
      - .github/workflows/verify-terminal-route-execution-plan.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_terminal_route_execution_plan_validator
      - run: python canonical/runtime/terminal_route_execution_plan_validator.py . canonical/governance/TERMINAL_ROUTE_EXECUTION_PLAN_V1.json
