name: Verify M2 OOXML package transaction
on:
  push:
    branches: [main, obs-m2-ooxml-package-transaction-20261002]
    paths:
      - canonical/runtime/ooxml_package_transaction.py
      - canonical/tests/test_ooxml_package_transaction.py
      - .github/workflows/verify-m2-ooxml-package-transaction.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/ooxml_package_transaction.py
      - canonical/tests/test_ooxml_package_transaction.py
      - .github/workflows/verify-m2-ooxml-package-transaction.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_ooxml_package_transaction
