name: Diagnostic find TB-Science next unexposed slot

on:
  push:
    branches:
      - "diagnostic/find-tb-science-next-slot-20261010"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locate canonical schedule evidence
        run: |
          set -euo pipefail
          echo "=== DIAG CHIPSEQ REFERENCES ==="
          grep -R -n -I --include='*.json' --include='*.md' 'diag-chipseq' canonical 2>/dev/null | head -n 240 || true
          echo "=== SCHEDULE ORDER REFERENCES ==="
          grep -R -n -I --include='*.json' --include='*.md' 'frozen_manifest_schedule_order' canonical 2>/dev/null | tail -n 240 || true
          echo "=== LEDGER RANK20 REFERENCES ==="
          grep -R -n -I --include='*.json' --include='*.md' '"ledger_schedule_rank"[[:space:]]*:[[:space:]]*20' canonical 2>/dev/null | head -n 240 || true
          echo "=== TB SCIENCE SCHEDULE FILE NAMES ==="
          find canonical -type f \( -iname '*science*schedule*' -o -iname '*science*manifest*' -o -iname '*slot*ledger*' \) | sort | tail -n 240
