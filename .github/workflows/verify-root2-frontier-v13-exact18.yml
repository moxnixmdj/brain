name: Verify ROOT2 Frontier V13 Exact18
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/ROOT2_CLOSURE_V2_CURRENT_FRONTIER_V13.json"
      - "canonical/governance/TERMINAL_ROOT_CAUSE_STATE_V1.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/tests/test_root2_frontier_v13_exact18_rebind.py"
      - ".github/workflows/verify-root2-frontier-v13-exact18.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Derive exact ROOT2 set from live canonical root
        run: python canonical/tests/test_root2_frontier_v13_exact18_rebind.py
