name: Verify future matched scope nontransport v1
on:
  push:
    paths:
      - "canonical/governance/OPUS55_MATCHED_COMPARATOR_SUPERPORTFOLIO_V1.json"
      - "canonical/runtime/future_matched_scope_nontransport_v1.py"
      - "canonical/tests/test_future_matched_scope_nontransport_v1.py"
      - ".github/workflows/verify-future-matched-scope-nontransport-v1.yml"
  pull_request:
    paths:
      - "canonical/governance/OPUS55_MATCHED_COMPARATOR_SUPERPORTFOLIO_V1.json"
      - "canonical/runtime/future_matched_scope_nontransport_v1.py"
      - "canonical/tests/test_future_matched_scope_nontransport_v1.py"
      - ".github/workflows/verify-future-matched-scope-nontransport-v1.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest canonical.tests.test_future_matched_scope_nontransport_v1 -v
      - run: python canonical/runtime/future_matched_scope_nontransport_v1.py
