name: Audit LiveBench public single-checker witnesses
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/livebench_if_single_checker_solver_v1.py
      - canonical/runtime/livebench_ngram_reference_free_v1.py
      - canonical/tests/livebench_public_single_checker_exact_audit.py
      - .github/workflows/audit-livebench-public-single-checker-exact.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen checker runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -q nltk spacy emoji syllapy langdetect
          python -m spacy download en_core_web_sm
      - name: Exact public single-checker audit
        run: python canonical/tests/livebench_public_single_checker_exact_audit.py
      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-public-single-checker-exact-audit
          path: livebench_public_single_checker_exact_audit_receipt.json
          if-no-files-found: error
