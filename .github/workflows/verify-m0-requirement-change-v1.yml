name: Verify M0 requirement change V1
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/m0_requirement_change_case_v1.py"
      - "canonical/tests/test_m0_requirement_change_case_v1.py"
      - "canonical/governance/M0_REQUIREMENT_CHANGE_CASE_20261007_V1.json"
      - ".github/workflows/verify-m0-requirement-change-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m pytest -q canonical/tests/test_m0_requirement_change_case_v1.py
      - run: python canonical/runtime/m0_requirement_change_case_v1.py
