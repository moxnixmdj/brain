name: verify-terminal-minimum-causal-depth-v1

on:
  pull_request:
    paths:
      - 'canonical/governance/TERMINAL_MINIMUM_CAUSAL_DEPTH_PLAN_V1.json'
      - 'canonical/governance/ARENA_COMPARATOR_PUBLIC_SEMANTICS_RECONCILIATION_V1.json'
      - 'canonical/runtime/terminal_minimum_causal_depth_guard_v1.py'
      - 'canonical/tests/test_terminal_minimum_causal_depth_guard_v1.py'
      - '.github/workflows/verify-terminal-minimum-causal-depth-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python canonical/runtime/terminal_minimum_causal_depth_guard_v1.py
      - run: python -c "from canonical.tests.test_terminal_minimum_causal_depth_guard_v1 import test_guard_passes; test_guard_passes()"
