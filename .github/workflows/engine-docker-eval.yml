name: engine-docker-eval

# Two modes in ONE workflow file, because this repository is past GitHub's
# per-repository workflow-file limit: a newly added workflow file never gets
# registered (verified: the standalone swe-bench-pro-v2-eval.yml was pushed and
# stayed invisible to the Actions API), so the benchmark jobs live here.
#
# Mode 1 - clean-room suite reproduction (runs on every push to this branch and
# on dispatch with benchmark=none):
#   builds a fresh python:3.11-slim image with ONLY the imported package trees
#   and runs the engine suites inside the container. Zero model calls, zero
#   network at run time, zero benchmark claims.
#
# Mode 2 - official benchmark eval (dispatch only, benchmark=swe-pro-v2-*):
#   SWE-bench Pro V2 tasks in the upstream public images
#   (ghcr.io/scaleapi/swe-bench_pro-v2:<instance>) graded by each task's own
#   tests/test.sh through Harbor 0.22 -- the framework/version upstream used for
#   its V2 release gate (reference patch 642/642, empty patch 0/642). The engine
#   runs un-gated (open_model().solve(..., mode="EPISTEMIC"), allow_web=False)
#   from canonical/eval/harbor/swebench_pro_v2_agent.py.
#   This workflow MEASURES a resolve rate; it does not claim one. The `nop`
#   (empty patch) and `oracle` (reference patch) control arms run alongside, so a
#   report is interpretable only if the grader itself passes both gates
#   (nop resolves 0/N, oracle resolves N/N). Aggregate numbers are committed back
#   to this branch under canonical/eval/results/swe-bench-pro-v2/; nothing else
#   in this repo may state a score.
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Eval mode"
        type: choice
        options:
          - none
          - swe-pro-v2-smoke3
          - swe-pro-v2-hard51
        default: none
      arms:
        description: "Benchmark arms (mode 2)"
        type: choice
        options:
          - all
          - causal-only
        default: all
      n_shards:
        description: "Parallel shards per arm (1-6)"
        type: number
        default: 3
      agent_timeout_s:
        description: "Per-task engine timeout (seconds)"
        type: number
        default: 900
      commit_results:
        description: "Push the result JSON/markdown back to this branch"
        type: boolean
        default: true
  push:
    branches:
      - arena/b81b2217-brain
    paths:
      - "canonical/eval/docker/Dockerfile"
      - ".github/workflows/engine-docker-eval.yml"
      - "canonical/runtime/causal_angelic_swe_engine_v1.py"
      - "canonical/runtime/repo_component_and_cow_engine_v1.py"
      - "canonical/runtime/backward_witness_synthesizer_v1.py"
      - "canonical/runtime/instant_swe_skill_store_v1.py"
      - "canonical/runtime/universal_epistemic_kernel_v1.py"
      - "canonical/eval/harbor/*"
      - "canonical/tests/test_causal_angelic_swe_engine_v1.py"
      - "canonical/tests/test_repo_component_and_cow_engine_v1.py"
      - "canonical/tests/test_swebench_pro_v2_harbor_harness_v1.py"
      - "canonical/tests/test_workspace_shape_selects_swe_modality_and_no_patch_fails_closed_v1.py"

permissions:
  contents: read

concurrency:
  group: engine-docker-eval-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: scaleapi/SWE-bench_Pro-os
  # Pinned at the V2 (v2.0.0) release commit that carries v2/GATE.md. The run
  # fails closed if that tree's HARD-51 list drifts from our vendored copy.
  UPSTREAM_SHA: 31a20c751b0bd56db6510ce7d4d3c269c5b7c72b
  HARBOR_VERSION: "0.22.0"
  PYTHON_VERSION: "3.12"

jobs:
  docker-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the clean-room engine image
        run: docker build -f canonical/eval/docker/Dockerfile -t brain-engine-eval:ci .
      - name: Run both engine suites inside Docker
        run: docker run --rm brain-engine-eval:ci 2>&1 | tee /tmp/engine_docker_eval.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-docker-eval
          path: /tmp/engine_docker_eval.log
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Mode 2: official SWE-bench Pro V2 eval (dispatch only)
  # ------------------------------------------------------------------
  swe-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        name: Build arm x shard matrix
        env:
          ARMS: ${{ inputs.arms }}
          N_SHARDS: ${{ inputs.n_shards }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = max(1, min(6, int(os.environ.get("N_SHARDS", "3"))))
          arms = ["causal", "nop", "oracle"] if os.environ.get("ARMS") == "all" else ["causal"]
          inc = [{"arm": a, "shard": i} for a in arms for i in range(n)]
          print("matrix=" + json.dumps({"include": inc}))
          PY

  swe-eval:
    needs: swe-plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.swe-plan.outputs.matrix) }}
    env:
      ARM: ${{ matrix.arm }}
      SHARD: ${{ matrix.shard }}
      SUBSET: ${{ (inputs.benchmark == 'swe-pro-v2-hard51') && 'hard51' || 'smoke3' }}
      N_SHARDS: ${{ inputs.n_shards }}
      AGENT_TIMEOUT_S: ${{ inputs.agent_timeout_s }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: brain
          persist-credentials: false

      - name: Checkout pinned upstream benchmark tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - name: Resolve task list (fail closed on drift)
        run: |
          set -euo pipefail
          if [ ! -f upstream/v2/hard51_ids.txt ]; then
            echo "::error::pinned upstream tree has no v2/hard51_ids.txt"
            exit 1
          fi
          if [ "$SUBSET" = "hard51" ]; then
            if ! diff -u <(sort upstream/v2/hard51_ids.txt | sed '/^$/d') \
                         <(sort brain/canonical/eval/harbor/hard51_ids.txt | sed '/^$/d') > drift.diff; then
              cat drift.diff
              echo "::error::upstream HARD-51 list drifted from the vendored copy; refusing to score a moved target"
              exit 1
            fi
            echo "IDS=$GITHUB_WORKSPACE/upstream/v2/hard51_ids.txt" >> "$GITHUB_ENV"
          else
            head -n 3 upstream/v2/hard51_ids.txt > smoke3_ids.txt
            echo "IDS=$GITHUB_WORKSPACE/smoke3_ids.txt" >> "$GITHUB_ENV"
          fi
          echo "tasks in this shard run: $(grep -c '' "$IDS")" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Harbor + eval deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "harbor==${HARBOR_VERSION}" pyyaml
          python -c "import importlib.metadata as m; print('harbor', m.version('harbor'), 'ok')"

      - name: Reclaim runner disk before image pulls
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h / | tail -1

      - name: Materialize tasks and generate this shard's job config
        working-directory: brain
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE/work-$ARM-$SHARD"
          mkdir -p "$W"
          echo "W=$W" >> "$GITHUB_ENV"
          python -m canonical.eval.harbor.swe_pro_v2_ci materialize \
            --upstream "$GITHUB_WORKSPACE/upstream" \
            --ids "$IDS" \
            --dest "$W/tasks" \
            --out-manifest "$W/manifest.json"
          python -m canonical.eval.harbor.swe_pro_v2_ci job-config \
            --arm "$ARM" \
            --manifest "$W/manifest.json" \
            --jobs-dir "$W/jobs" \
            --out-dir "$W/cfgs" \
            --n-shards "$N_SHARDS" \
            --store-path "$W/store-$ARM-s$SHARD.json" \
            --agent-timeout-s "$AGENT_TIMEOUT_S"
          if [ ! -f "$W/cfgs/job-$SHARD.yaml" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "no config for shard index $SHARD (n_shards=$N_SHARDS); skipping"
          fi

      - name: Run Harbor eval
        working-directory: brain
        if: env.SKIP != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/brain
        run: |
          set -uo pipefail
          echo "--- job config ---"
          cat "$W/cfgs/job-$SHARD.yaml"
          echo "--- run ---"
          harbor run -c "$W/cfgs/job-$SHARD.yaml" -q 2>&1 | tee "$W/harbor-$ARM-s$SHARD.log"
          echo "${PIPESTATUS[0]}" > "$W/harbor-exit.txt"
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Collect shard results
        working-directory: brain
        if: always() && env.SKIP != 'true'
        run: |
          set -uo pipefail
          mkdir -p "$W/out"
          echo "harbor_exit=$(cat "$W/harbor-exit.txt" 2>/dev/null || echo NOFILE)" > "$W/out/status.env"
          python -m canonical.eval.harbor.swe_pro_v2_ci collect \
            --jobs-dir "$W/jobs" \
            --manifest "$W/manifest.json" \
            --arm "$ARM" \
            --out "$W/out/$ARM-s$SHARD.json" \
            || echo '{"arm":"'"$ARM"'","error":"COLLECT_FAILED"}' > "$W/out/$ARM-s$SHARD.json"
          cp "$W/store-$ARM-s$SHARD.json" "$W/out/store-snapshot.json" 2>/dev/null || true
          tail -c 150000 "$W/harbor-$ARM-s$SHARD.log" > "$W/out/harbor-tail.log" 2>/dev/null || true
          echo "--- collected ---"
          head -c 2000 "$W/out/$ARM-s$SHARD.json" || true

      - name: Upload shard artifact
        if: always() && env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swe-pro-v2-${{ matrix.arm }}-s${{ matrix.shard }}
          path: work-${{ matrix.arm }}-${{ matrix.shard }}/out
          if-no-files-found: warn
          retention-days: 30

  swe-aggregate:
    needs: [swe-plan, swe-eval]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.benchmark != 'none' && needs.swe-eval.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: swe-pro-v2-*
          path: dl
          merge-multiple: false

      - name: Aggregate
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          mkdir -p out
          mapfile -t reports < <(find dl -name '*-s[0-9].json' -type f 2>/dev/null | sort || true)
          if [ "${#reports[@]}" -eq 0 ]; then
            printf '%s\n' '{"schema":"brain.bench_eval_report.v1","arms":{},"note":"NO SHARD REPORTS: every shard failed before collect; this run produced no benchmark number"}' > out/report.json
            printf '%s\n' "# SWE-bench Pro V2 — engine eval" "" "No shard report was produced. This run generated **no** benchmark number." > out/report.md
            echo "RUN_FAILED=true" >> "$GITHUB_ENV"
          else
            args=()
            for f in "${reports[@]}"; do args+=(--reports "$f"); done
            python -m canonical.eval.harbor.swe_pro_v2_ci aggregate \
              "${args[@]}" \
              --out-json out/report.json --out-md out/report.md \
              --commit "${{ github.sha }}"
          fi
          echo '--- report ---'
          head -80 out/report.md

      - name: Commit results to this branch
        if: ${{ inputs.commit_results && env.RUN_FAILED != 'true' }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          dir="canonical/eval/results/swe-bench-pro-v2"
          mkdir -p "$dir"
          for ext in json md; do
            cp "out/report.$ext" "$dir/${{ inputs.benchmark }}-$ts.$ext"
            cp "out/report.$ext" "$dir/${{ inputs.benchmark }}-latest.$ext"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir"
          git commit -m "ci(eval): SWE-bench Pro V2 ${{ inputs.benchmark }} run $ts" -m "Real Harbor run (workflow run ${{ github.run_id }}), arms=${{ inputs.arms }}, shards=${{ inputs.n_shards }}. Resolve decisions come from each task's own verifier inside the official container image. Zero model calls, zero parameters stored; nop/oracle control gates recorded in the JSON."
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
