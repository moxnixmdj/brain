name: engine-docker-eval

# Two modes in ONE workflow file, because this repository is past GitHub's
# per-repository workflow-file limit: a newly added workflow file never gets
# registered (verified: the standalone swe-bench-pro-v2-eval.yml was pushed and
# stayed invisible to the Actions API), so the benchmark jobs live here.
#
# Mode 1 - clean-room suite reproduction (runs on every push to this branch and
# on dispatch with benchmark=none):
#   builds a fresh python:3.11-slim image with ONLY the imported package trees
#   and runs the engine suites inside the container. Zero model calls, zero
#   network at run time, zero benchmark claims.
#
# Mode 2 - official benchmark eval (dispatch only, benchmark=swe-pro-v2-*):
#   SWE-bench Pro V2 tasks in the upstream public images
#   (ghcr.io/scaleapi/swe-bench_pro-v2:<instance>) graded by each task's own
#   tests/test.sh through Harbor 0.22 -- the framework/version upstream used for
#   its V2 release gate (reference patch 642/642, empty patch 0/642). The engine
#   runs un-gated (open_model().solve(..., mode="EPISTEMIC"), allow_web=False)
#   from canonical/eval/harbor/swebench_pro_v2_agent.py.
#   This workflow MEASURES a resolve rate; it does not claim one. The `nop`
#   (empty patch) and `oracle` (reference patch) control arms run alongside, so a
#   report is interpretable only if the grader itself passes both gates
#   (nop resolves 0/N, oracle resolves N/N). Aggregate numbers are committed back
#   to this branch under canonical/eval/results/swe-bench-pro-v2/; nothing else
#   in this repo may state a score.
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Eval mode"
        type: choice
        options:
          - none
          - swe-pro-v2-smoke3
          - swe-pro-v2-hard51
        default: none
      arms:
        description: "Benchmark arms (mode 2)"
        type: choice
        options:
          - all
          - causal-only
        default: all
      n_shards:
        description: "Parallel shards per arm (1-6)"
        type: number
        default: 3
      agent_timeout_s:
        description: "Per-task engine timeout (seconds)"
        type: number
        default: 900
      commit_results:
        description: "Push the result JSON/markdown back to this branch"
        type: boolean
        default: true
  push:
    branches:
      - arena/b81b2217-brain
    paths:
      - "canonical/eval/docker/Dockerfile"
      - ".github/workflows/engine-docker-eval.yml"
      - "canonical/runtime/causal_angelic_swe_engine_v1.py"
      - "canonical/runtime/repo_component_and_cow_engine_v1.py"
      - "canonical/runtime/backward_witness_synthesizer_v1.py"
      - "canonical/runtime/instant_swe_skill_store_v1.py"
      - "canonical/runtime/universal_epistemic_kernel_v1.py"
      - "canonical/eval/harbor/*"
      - "canonical/eval/harbor/RUN_SWE_PRO_V2"
      - "canonical/tests/test_causal_angelic_swe_engine_v1.py"
      - "canonical/tests/test_repo_component_and_cow_engine_v1.py"
      - "canonical/tests/test_swebench_pro_v2_harbor_harness_v1.py"
      - "canonical/tests/test_workspace_shape_selects_swe_modality_and_no_patch_fails_closed_v1.py"

permissions:
  contents: read

concurrency:
  group: engine-docker-eval-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: scaleapi/SWE-bench_Pro-os
  # Pinned at the V2 (v2.0.0) release commit that carries v2/GATE.md. The run
  # fails closed if that tree's HARD-51 list drifts from our vendored copy.
  UPSTREAM_SHA: 31a20c751b0bd56db6510ce7d4d3c269c5b7c72b
  HARBOR_VERSION: "0.22.0"
  PYTHON_VERSION: "3.12"

jobs:
  docker-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the clean-room engine image
        run: docker build -f canonical/eval/docker/Dockerfile -t brain-engine-eval:ci .
      - name: Run both engine suites inside Docker
        run: docker run --rm brain-engine-eval:ci 2>&1 | tee /tmp/engine_docker_eval.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-docker-eval
          path: /tmp/engine_docker_eval.log
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Mode 2: official SWE-bench Pro V2 eval (dispatch only)
  # ------------------------------------------------------------------
  # The Arena-issued token in this sandbox can push but cannot POST a
  # workflow_dispatch (403 Resource not accessible by integration), so a run can
  # also be queued by committing the one-shot marker file
  # canonical/eval/harbor/RUN_SWE_PRO_V2 whose content is the mode
  # ("swe-pro-v2-smoke3" / "swe-pro-v2-hard51"). swe-aggregate deletes the marker
  # in the same commit that lands the results, so a push can never re-arm a
  # benchmark run. This job resolves both entry points into one set of outputs.
  swe-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      benchmark: ${{ steps.m.outputs.benchmark }}
      arms: ${{ steps.m.outputs.arms }}
      n_shards: ${{ steps.m.outputs.n_shards }}
      agent_timeout_s: ${{ steps.m.outputs.agent_timeout_s }}
      commit_results: ${{ steps.m.outputs.commit_results }}
      label: ${{ steps.m.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        name: Resolve eval mode
        env:
          EVENT: ${{ github.event_name }}
          D_BENCHMARK: ${{ inputs.benchmark }}
          D_ARMS: ${{ inputs.arms }}
          D_SHARDS: ${{ inputs.n_shards }}
          D_TIMEOUT: ${{ inputs.agent_timeout_s }}
          D_COMMIT: ${{ inputs.commit_results }}
        run: |
          set -euo pipefail
          MARKER=canonical/eval/harbor/RUN_SWE_PRO_V2
          if [ "$EVENT" = "workflow_dispatch" ]; then
            benchmark="${D_BENCHMARK:-none}"
            arms="${D_ARMS:-all}"
            n_shards="${D_SHARDS:-3}"
            agent_timeout_s="${D_TIMEOUT:-900}"
            commit_results="${D_COMMIT:-true}"
          elif [ -f "$MARKER" ]; then
            # marker format: first non-empty line = mode; further "key=value" lines
            # may override arms / shards / timeout / commit_results.
            benchmark="$(awk 'NF && $0 !~ /=/ {print; exit}' "$MARKER")"
            arms="$(awk -F= '/^arms=/{print $2}' "$MARKER" | head -1)"
            n_shards="$(awk -F= '/^shards=/{print $2}' "$MARKER" | head -1)"
            agent_timeout_s="$(awk -F= '/^agent_timeout_s=/{print $2}' "$MARKER" | head -1)"
            commit_results="$(awk -F= '/^commit_results=/{print $2}' "$MARKER" | head -1)"
            arms="${arms:-all}"; n_shards="${n_shards:-3}"
            agent_timeout_s="${agent_timeout_s:-900}"; commit_results="${commit_results:-true}"
          else
            benchmark=none
            arms=all
            n_shards=1
            agent_timeout_s=900
            commit_results=true
          fi
          case "$arms" in all|causal-only) ;; *) echo "::error::unknown arms '$arms'"; exit 1 ;; esac
          case "$benchmark" in
            swe-pro-v2-smoke3|swe-pro-v2-hard51|none) ;;
            *) echo "::error::unknown benchmark mode '$benchmark'"; exit 1 ;;
          esac
          {
            echo "benchmark=$benchmark"
            echo "arms=$arms"
            echo "n_shards=$n_shards"
            echo "agent_timeout_s=$agent_timeout_s"
            echo "commit_results=$commit_results"
            case "$benchmark" in
              swe-pro-v2-hard51) label="SWE-bench Pro V2 (HARD-51, 51 tasks)" ;;
              swe-pro-v2-smoke3) label="SWE-bench Pro V2 (smoke: 3 qutebrowser HARD-51 tasks)" ;;
              *) label="none" ;;
            esac
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          echo "mode: benchmark=$benchmark arms=$arms shards=$n_shards timeout=${agent_timeout_s}s commit=$commit_results" >> "$GITHUB_STEP_SUMMARY"

  swe-plan:
    needs: swe-mode
    if: ${{ needs.swe-mode.outputs.benchmark != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        name: Build arm x shard matrix
        env:
          ARMS: ${{ needs.swe-mode.outputs.arms }}
          N_SHARDS: ${{ needs.swe-mode.outputs.n_shards }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = max(1, min(6, int(os.environ.get("N_SHARDS", "3"))))
          arms = ["causal", "nop", "oracle"] if os.environ.get("ARMS") == "all" else ["causal"]
          inc = [{"arm": a, "shard": i} for a in arms for i in range(n)]
          print("matrix=" + json.dumps({"include": inc}))
          PY

  swe-eval:
    needs: [swe-mode, swe-plan]
    if: ${{ needs.swe-mode.outputs.benchmark != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.swe-plan.outputs.matrix) }}
    env:
      ARM: ${{ matrix.arm }}
      SHARD: ${{ matrix.shard }}
      SUBSET: ${{ (needs.swe-mode.outputs.benchmark == 'swe-pro-v2-hard51') && 'hard51' || 'smoke3' }}
      N_SHARDS: ${{ needs.swe-mode.outputs.n_shards }}
      AGENT_TIMEOUT_S: ${{ needs.swe-mode.outputs.agent_timeout_s }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: brain
          persist-credentials: false

      - name: Checkout pinned upstream benchmark tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - name: Resolve task list (fail closed on drift)
        run: |
          set -euo pipefail
          if [ ! -f upstream/v2/hard51_ids.txt ]; then
            echo "::error::pinned upstream tree has no v2/hard51_ids.txt"
            exit 1
          fi
          if [ "$SUBSET" = "hard51" ]; then
            if ! diff -u <(sort upstream/v2/hard51_ids.txt | sed '/^$/d') \
                         <(sort brain/canonical/eval/harbor/hard51_ids.txt | sed '/^$/d') > drift.diff; then
              cat drift.diff
              echo "::error::upstream HARD-51 list drifted from the vendored copy; refusing to score a moved target"
              exit 1
            fi
            echo "IDS=$GITHUB_WORKSPACE/upstream/v2/hard51_ids.txt" >> "$GITHUB_ENV"
          else
            # Smoke subset: three qutebrowser tasks -- real Python source, the
            # smallest images in the HARD-51 set, and same-repo variety for the
            # memory-ablation arm to have something to differ on.
            grep -E '^instance_qutebrowser__' upstream/v2/hard51_ids.txt | head -n 3 > smoke3_ids.txt
            echo "IDS=$GITHUB_WORKSPACE/smoke3_ids.txt" >> "$GITHUB_ENV"
          fi
          echo "tasks in this shard run: $(grep -c '' "$IDS")" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Harbor + eval deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "harbor==${HARBOR_VERSION}" pyyaml
          python -c "import importlib.metadata as m; print('harbor', m.version('harbor'), 'ok')"

      - name: Reclaim runner disk before image pulls
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h / | tail -1

      - name: Materialize tasks and generate this shard's job config
        working-directory: brain
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE/work-$ARM-$SHARD"
          mkdir -p "$W"
          echo "W=$W" >> "$GITHUB_ENV"
          python -m canonical.eval.harbor.swe_pro_v2_ci materialize \
            --upstream "$GITHUB_WORKSPACE/upstream" \
            --ids "$IDS" \
            --dest "$W/tasks" \
            --out-manifest "$W/manifest.json"
          python -m canonical.eval.harbor.swe_pro_v2_ci job-config \
            --arm "$ARM" \
            --manifest "$W/manifest.json" \
            --jobs-dir "$W/jobs" \
            --out-dir "$W/cfgs" \
            --n-shards "$N_SHARDS" \
            --store-path "$W/store-$ARM-s$SHARD.json" \
            --agent-timeout-s "$AGENT_TIMEOUT_S"
          if [ ! -f "$W/cfgs/job-$SHARD.yaml" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "no config for shard index $SHARD (n_shards=$N_SHARDS); skipping"
          fi

      - name: Run Harbor eval
        working-directory: brain
        if: env.SKIP != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/brain
        run: |
          # Opt out of the runner's `bash -e` on the FIRST line: before this, the diagnostic
          # commands above the harbor call could themselves have killed the step and taken
          # the shard's evidence with them.
          set +e
          set -uo pipefail
          echo "--- harbor CLI surface (for diagnosing usage errors) ---"
          harbor --help 2>&1 | head -40 || true
          harbor run --help 2>&1 | head -60 || true
          echo "--- job config ---"
          cat "$W/cfgs/job-$SHARD.yaml"
          echo "--- run ---"
          # GitHub runs every step under `bash -e`, so a nonzero harbor exit aborted the step
          # before its exit code was recorded: the shard produced no report and the run lost those
          # tasks' verdicts for a reason the report could not name (measured: nop shard 2 failed
          # exactly this way). A transient pull failure is retried once; either way the code is
          # recorded and the shard artifacts survive to the aggregate.
          set +e
          harbor run -c "$W/cfgs/job-$SHARD.yaml" -q 2>&1 | tee "$W/harbor-$ARM-s$SHARD.log"
          hx=${PIPESTATUS[0]}
          if [ "$hx" != "0" ]; then
            echo "::warning::harbor exited $hx for $ARM shard $SHARD; retrying this shard once"
            echo "=== RETRY after exit $hx ===" >> "$W/harbor-$ARM-s$SHARD.log"
            harbor run -c "$W/cfgs/job-$SHARD.yaml" -q 2>&1 | tee -a "$W/harbor-$ARM-s$SHARD.log"
            hx2=${PIPESTATUS[0]}
            if [ "$hx2" = "0" ]; then hx=0; else hx="$hx,$hx2"; fi
          fi
          set -e
          echo "$hx" > "$W/harbor-exit.txt"
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Collect shard results
        working-directory: brain
        if: always() && env.SKIP != 'true'
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$W/out"
          echo "harbor_exit=$(cat "$W/harbor-exit.txt" 2>/dev/null || echo NOFILE)" > "$W/out/status.env"
          # Record the real on-disk shape of the jobs tree. Two runs of this harness
          # produced "no trial data" while harbor's own summary reported trials and
          # rewards, so the collector's assumption about the layout — not the
          # benchmark — is the suspect. This file is committed under diagnostics/.
          {
            echo "W=$W"
            find "$W/jobs" -maxdepth 3 2>/dev/null | head -80
            echo "--- result.json files ---"
            find "$W/jobs" -name result.json 2>/dev/null | head -20
            echo "--- keys of the first result.json found ---"
            for f in $(find "$W/jobs" -name result.json 2>/dev/null | head -4); do
              echo "## $f"
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(sorted(d) if isinstance(d,dict) else type(d))' "$f" 2>&1 | head -5
              # the VALUES the collector keys on, verbatim: names and reward only
              python3 - "$f" <<'VALS'
          import json, pathlib, sys
          d = json.loads(pathlib.Path(sys.argv[1]).read_text())
          rows = d.get("trial_results") or [d]
          for r in rows[:4]:
              if not isinstance(r, dict):
                  continue
              print("  task_name=", repr(r.get("task_name")))
              print("  trial_name=", repr(r.get("trial_name")))
              print("  task_id=", repr(r.get("task_id")))
              print("  verifier_result=", json.dumps(r.get("verifier_result"))[:200])
          VALS
            done
            echo "--- manifest ids (first 3) ---"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); ids=[t["instance_id"] for t in d.get("tasks",[])]; print(ids[:3])' "$W/manifest.json" 2>&1 | head -3
          } > "$W/out/$ARM-s$SHARD.layout.txt" 2>&1 || true
          # Every argument on one logical line: the three --note lines below lost their
          # trailing backslashes, so `collect` ran without --out, exited 2, and `bash -e`
          # aborted the step before the fallback could write -- which is how run
          # 45663363378 published zero reports while harbor had exited 0 with 9 trials.
          python -m canonical.eval.harbor.swe_pro_v2_ci collect \
            --jobs-dir "$W/jobs" \
            --manifest "$W/manifest.json" \
            --arm "$ARM" \
            --note engine_timeout_s="$AGENT_TIMEOUT_S" \
            --note n_shards="$N_SHARDS" \
            --note eval_commit="$GITHUB_SHA" \
            --out "$W/out/$ARM-s$SHARD.json"
          cx=$?
          if [ "$cx" != "0" ] || [ ! -s "$W/out/$ARM-s$SHARD.json" ]; then
            echo "::error::collect failed (exit $cx) for $ARM shard $SHARD"
            printf '{"arm":"%s","error":"COLLECT_FAILED","exit_code":"%s"}\n' "$ARM" "$cx" \
              > "$W/out/$ARM-s$SHARD.json"
          fi
          cp "$W/store-$ARM-s$SHARD.json" "$W/out/store-snapshot.json" 2>/dev/null || true
          tail -c 150000 "$W/harbor-$ARM-s$SHARD.log" > "$W/out/harbor-tail.log" 2>/dev/null || true
          # Machine-readable diagnostics: the exit code plus the last lines of the
          # run, committed with the report, because a green job can still mean
          # "harbor never started a trial" -- that distinction must be readable.
          python3 - "$W/out/$ARM-s$SHARD.meta.json" "$(cat "$W/harbor-exit.txt" 2>/dev/null || echo NOFILE)" "$W/harbor-$ARM-s$SHARD.log" <<'DIAG'
          import json, pathlib, sys
          out, exit_code, log = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          tail = []
          if log.is_file():
              tail = log.read_text(errors="replace").splitlines()[-120:]
          pathlib.Path(out).write_text(json.dumps({
              "harbor_exit_code": exit_code,
              "harbor_log_last_lines": tail,
              "harbor_log_line_count": len(tail),
          }, indent=2), encoding="utf-8")
          DIAG
          echo "--- collected ---"
          head -c 2000 "$W/out/$ARM-s$SHARD.json" || true
          # The evidence is published, so the step may now report the failure honestly
          # instead of dying before it. Exit codes are for humans; the artifact is for truth.
          if grep -q COLLECT_FAILED "$W/out/$ARM-s$SHARD.json" 2>/dev/null; then exit 1; fi
          exit 0

      - name: Upload shard artifact
        if: always() && env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swe-pro-v2-${{ matrix.arm }}-s${{ matrix.shard }}
          path: work-${{ matrix.arm }}-${{ matrix.shard }}/out
          if-no-files-found: warn
          retention-days: 30

  swe-aggregate:
    needs: [swe-mode, swe-plan, swe-eval]
    if: always() && needs.swe-mode.outputs.benchmark != 'none' && needs.swe-eval.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: swe-pro-v2-*
          path: dl
          merge-multiple: false

      - name: Aggregate
        env:
          SWE_BENCHMARK: ${{ needs.swe-mode.outputs.benchmark }}
          SWE_ARMS: ${{ needs.swe-mode.outputs.arms }}
          SWE_N_SHARDS: ${{ needs.swe-mode.outputs.n_shards }}
          SWE_AGENT_TIMEOUT_S: ${{ needs.swe-mode.outputs.agent_timeout_s }}
          SWE_COMMIT_RESULTS: ${{ needs.swe-mode.outputs.commit_results }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          mkdir -p out
          mapfile -t reports < <(find dl -name '*-s[0-9].json' -type f 2>/dev/null | sort || true)
          if [ "${#reports[@]}" -eq 0 ]; then
            printf '%s\n' '{"schema":"brain.bench_eval_report.v1","arms":{},"run_produced_number":false,"run_failed":true,"note":"NO SHARD REPORTS: every shard failed before collect; this run produced no benchmark number"}' > out/report.json
            printf '%s\n' "# SWE-bench Pro V2 — engine eval" "" "No shard report was produced. This run generated **no** benchmark number." > out/report.md
            echo "RUN_FAILED=true" >> "$GITHUB_ENV"
            export RUN_FAILED=true
          else
            args=()
            for f in "${reports[@]}"; do args+=(--reports "$f"); done
            metas=( $(find dl -name '*.meta.json' -type f 2>/dev/null | sort || true) )
            meta_args=()
            for f in "${metas[@]}"; do meta_args+=(--meta "$f"); done
            python -m canonical.eval.harbor.swe_pro_v2_ci aggregate \
              "${args[@]}" "${meta_args[@]}" \
              --out-json out/report.json --out-md out/report.md \
              --benchmark "${{ needs.swe-mode.outputs.label }}" \
              --commit "${{ github.sha }}"
          fi
          # The claim decision is produced here, by CI, from the same rows — not by a
          # human reading the table afterwards.
          python -m canonical.tools.swe_pro_v2_run_receipt_v1 \
            --report out/report.json --out out/receipt.json \
            --date "$(date -u +%Y-%m-%d)" || echo "RECEIPT_FAILED=true" >> "$GITHUB_ENV"
          python3 -c 'import json;d=json.load(open("out/receipt.json"));print(json.dumps({"claimable":d["claimable_as_a_benchmark_number"],"authority":d["authority"],"why":d["why_not_claimable"]},indent=1))' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          # A shard that errored qualifies the run; it must not void the other 17.
          failed_shards=""
          for f in $(find dl -name '*-s*.json' -type f 2>/dev/null | sort); do
            grep -q '"error": *"COLLECT_FAILED"' "$f" 2>/dev/null && failed_shards="$failed_shards $(basename "$f" .json)"
          done
          if [ -n "$failed_shards" ]; then
            python3 - "$failed_shards" <<'INCOMPLETE'
          import json, pathlib, sys
          names = [s for s in sys.argv[1].split() if s]
          path = pathlib.Path("out/report.json")
          d = json.loads(path.read_text(encoding="utf-8"))
          d["incomplete_shards"] = names
          path.write_text(json.dumps(d, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          INCOMPLETE
            { echo ""; echo "## Incomplete shards in this run"; echo ""; echo "These shard artifacts reported a collection error, so their tasks are counted as missing rather than resolved — the run is qualified, not discarded:"; echo ""; for s in $failed_shards; do echo "- \`$s\`"; done; } >> out/report.md
          fi
          python3 - <<'DECISIONS'
          import json, os, pathlib
          path = pathlib.Path("out/report.json")
          d = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          d["mode_inputs"] = {
              "benchmark": os.environ.get("SWE_BENCHMARK"),
              "arms": os.environ.get("SWE_ARMS"),
              "n_shards": os.environ.get("SWE_N_SHARDS"),
              "agent_timeout_s": os.environ.get("SWE_AGENT_TIMEOUT_S"),
              "commit_results": os.environ.get("SWE_COMMIT_RESULTS"),
              "run_failed": os.environ.get("RUN_FAILED", ""),
              "n_shard_reports_found": len([str(x) for x in pathlib.Path("dl").rglob("*-s[0-9].json")]) if pathlib.Path("dl").is_dir() else 0,
          }
          path.write_text(json.dumps(d, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          DECISIONS
          echo '--- report ---'
          head -80 out/report.md
          mkdir -p out/diagnostics
          for f in $(find dl -name '*.meta.json' -o -name 'status.env' -o -name '*.layout.txt' 2>/dev/null | sort); do cp "$f" out/diagnostics/ 2>/dev/null || true; done
          for f in $(find dl -name 'harbor-tail.log' 2>/dev/null | sort); do tail -c 40000 "$f" > "out/diagnostics/$(basename $(dirname "$f"))-$(basename "$f")" 2>/dev/null || true; done
          ls out/diagnostics 2>/dev/null | head -20 || true

      # A run that produced nothing is still a fact about this branch, and the only
      # channel back to this sandbox is a committed file (Actions logs live on hosts the
      # sandbox cannot reach: results-receiver.actions.githubusercontent.com and
      # *.blob.core.windows.net both EOF). So nothing is ever silently skipped — the
      # report says "no number" and the receipt refuses to certify it.
      - name: Commit results to this branch
        if: ${{ needs.swe-mode.outputs.commit_results == 'true' }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          dir="canonical/eval/results/swe-bench-pro-v2"
          mkdir -p "$dir"
          mode="${{ needs.swe-mode.outputs.benchmark }}"
          mkdir -p "$dir/diagnostics"
          cp -r out/diagnostics/. "$dir/diagnostics/" 2>/dev/null || true
          for ext in json md; do
            cp "out/report.$ext" "$dir/$mode-$ts.$ext"
            cp "out/report.$ext" "$dir/$mode-latest.$ext"
          done
          if [ -f out/receipt.json ]; then
            cp out/receipt.json "$dir/$mode-receipt.json"
            git add "$dir/$mode-receipt.json" || true
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            # one-shot marker: consumed by the run it armed
            git rm -q --ignore-unmatch canonical/eval/harbor/RUN_SWE_PRO_V2 || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir"
          git commit -m "ci(eval): SWE-bench Pro V2 ${{ needs.swe-mode.outputs.benchmark }} run $ts" -m "Real Harbor run (workflow run ${{ github.run_id }}), arms=${{ needs.swe-mode.outputs.arms }}, shards=${{ needs.swe-mode.outputs.n_shards }}. Resolve decisions come from each task's own verifier inside the official container image. Zero model calls, zero parameters stored; nop/oracle control gates recorded in the JSON."
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
