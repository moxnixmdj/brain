name: Verify terminal scope quarantine propagation

on:
  push:
    paths:
      - "canonical/runtime/terminal_scope_quarantine_propagation_v1.py"
      - "canonical/tests/test_terminal_scope_quarantine_propagation_v1.py"
      - "canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json"
      - "canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json"
      - "canonical/verification/P1_TERMINAL_EXECUTION_SCOPE_AUDIT_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - ".github/workflows/verify-terminal-scope-quarantine-propagation.yml"
  pull_request:
    paths:
      - "canonical/runtime/terminal_scope_quarantine_propagation_v1.py"
      - "canonical/tests/test_terminal_scope_quarantine_propagation_v1.py"
      - ".github/workflows/verify-terminal-scope-quarantine-propagation.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run propagation tests
        run: python -m unittest canonical.tests.test_terminal_scope_quarantine_propagation_v1 -v
      - name: Run live propagation
        run: python canonical/runtime/terminal_scope_quarantine_propagation_v1.py
