name: Verify raw drawing primitives

on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/raw_drawing_primitives.py
      - canonical/tests/test_raw_drawing_primitives.py
      - .github/workflows/verify-raw-drawing-primitives.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input numpy opencv-python-headless
      - run: python -m unittest -v canonical.tests.test_raw_drawing_primitives
