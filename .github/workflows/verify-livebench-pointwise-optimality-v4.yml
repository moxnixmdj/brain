name: Verify LiveBench pointwise optimality V4

on:
  pull_request:
    paths:
      - "canonical/runtime/livebench_legacy15_pointwise_candidate_planner_v1.py"
      - "canonical/runtime/livebench_legacy15_pointwise_exact_synthetic_audit_v4.py"
      - "canonical/runtime/livebench_legacy15_slot_feasibility_v1.py"
      - "canonical/runtime/livebench_legacy15_joint_candidate_generator_v1.py"
      - "canonical/runtime/livebench_pointwise_optimality_certificate_v1.py"
      - "canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py"
      - "canonical/tests/test_livebench_legacy15_pointwise_candidate_planner_v1.py"
      - ".github/workflows/verify-livebench-pointwise-optimality-v4.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact frozen checker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest nltk==3.9.2 langdetect==1.0.9 immutabledict==4.2.1
          python - <<'PY'
          import nltk
          for name in ["punkt", "punkt_tab"]:
              nltk.download(name, quiet=True)
          PY

      - name: Run pointwise planner unit tests
        run: |
          pytest -q canonical/tests/test_livebench_legacy15_pointwise_candidate_planner_v1.py

      - name: Checkout exact frozen LiveBench scorer
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091

      - name: Run exact pointwise-optimality audit
        run: |
          mkdir -p /tmp/receipt
          python canonical/runtime/livebench_legacy15_pointwise_exact_synthetic_audit_v4.py \
            --livebench-root /tmp/livebench \
            --output /tmp/receipt/livebench-pointwise-optimality-v4.json

      - name: Upload pointwise audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-pointwise-optimality-v4
          path: /tmp/receipt/livebench-pointwise-optimality-v4.json
          if-no-files-found: error
