name: Verify P3 grounded numeric front door V7

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/p3_real_context_v3_admission_v7.py
      - canonical/tests/test_p3_real_context_v3_admission_v7.py
      - .github/workflows/verify-p3-grounded-numeric-front-door-v7.yml
  push:
    branches: [main]
    paths:
      - canonical/runtime/p3_real_context_v3_admission_v7.py
      - canonical/tests/test_p3_real_context_v3_admission_v7.py
      - .github/workflows/verify-p3-grounded-numeric-front-door-v7.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run P3 grounded numeric front-door regressions
        id: regressions
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m unittest -v canonical.tests.test_p3_real_context_v3_admission_v7 > p3_v7_test_output.txt 2>&1
          code=$?
          cat p3_v7_test_output.txt
          exit $code
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-v7-diagnostic
          path: p3_v7_test_output.txt
          if-no-files-found: error
