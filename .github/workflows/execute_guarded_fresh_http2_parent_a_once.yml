name: Execute Guarded Fresh HTTP2 Parent A Once

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  execute-once:
    if: github.head_ref == 'execute/guarded-http2-parent-a-20260930-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Fail-closed prestart without spending parent freshness
        run: |
          set -euo pipefail
          mkdir -p _terminal
          python - <<'PY'
          import hashlib, json, pathlib, sys
          sys.path.insert(0, "execution_guard")
          from actions_admission import FrozenExecution, problem_sha256

          plan = json.loads(pathlib.Path("guarded_http2_parent_a_plan.json").read_text())
          if plan.get("schema") != "BRAIN_GUARDED_LAUNCH_PLAN_V1":
              raise SystemExit("PLAN_SCHEMA_INVALID")
          frozen = FrozenExecution(**plan["frozen"])
          frozen.validate()
          if problem_sha256(plan["goal_text"]) != plan["frozen"]["problem_sha256"]:
              raise SystemExit("PROBLEM_IDENTITY_MISMATCH")

          for pin in plan["pinned_files"]:
              p = pathlib.Path(pin["path"])
              if not p.is_file():
                  raise SystemExit("PIN_FILE_MISSING:" + pin["path"])
              raw = p.read_bytes()
              got = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
              if got != pin["git_blob_sha1"]:
                  raise SystemExit("PIN_GIT_BLOB_MISMATCH:" + pin["path"])
          print("PIN_PREFLIGHT_PASS")
          PY

          grep -Fq '"exactly_one_execution": true' canonical/tasks/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
          grep -Fq '"no_same_task_replay": true' canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
          grep -Fq '"model_planner_disabled": true' canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json
          grep -Fq '"status": "AUTHORIZED_PENDING_GUARDED_EXECUTION"' canonical/action_intents/2026-09-30_EXECUTE_GUARDED_HTTP2_PARENT_TASK_A_V1.json

          python -m py_compile \
            execution_guard/actions_admission.py \
            execution_guard/github_ref_store_live.py \
            execution_guard/github_actions_guarded_run_live.py \
            canonical/runtime/astra_runtime.py \
            canonical/runtime/bound_capabilities/broad_objective_decompose.py \
            canonical/runtime/bound_capabilities/open_research_source_frontend.py \
            canonical/runtime/bound_capabilities/objective_claim_operand_binding.py \
            canonical/runtime/bound_capabilities/generic_evidence_claim_relation.py

          python canonical/tests/test_objective_claim_operand_binding.py | tee _terminal/claim_binding_tests.log
          git rev-parse HEAD | tee _terminal/checkout_head.txt
          printf '%s\n' 'PARENT_PRESTART_QUALIFIED_UNSPENT' | tee _terminal/prestart_report.txt

      - name: Atomically admit once and execute frozen parent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python execution_guard/github_actions_guarded_run_live.py --plan guarded_http2_parent_a_plan.json --receipt _terminal/execution-guard-launch-receipt.json

      - name: Preserve terminal evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _terminal/snapshot
          cp guarded_http2_parent_a_plan.json _terminal/snapshot/
          cp canonical/action_intents/2026-09-30_EXECUTE_GUARDED_HTTP2_PARENT_TASK_A_V1.json _terminal/snapshot/
          cp canonical/tasks/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json _terminal/snapshot/task.json
          cp canonical/astra_runtime/missions/PARENT-OPENENDED-HTTP2-FLOW-CONTROL-LIMITS-REAL-TASK-20260930-003.json _terminal/snapshot/mission.json
          if [ -d canonical/astra_runtime/evidence ]; then cp -R canonical/astra_runtime/evidence _terminal/snapshot/evidence; fi
          if [ -d canonical/astra_runtime/state ]; then cp -R canonical/astra_runtime/state _terminal/snapshot/state; fi
          if [ -f _terminal/producer.log ]; then
            grep -E -m20 'PROJECT_BRAIN_ASTRA_RUNTIME_BLOCKER_V1|Blocker:|CAPABILITY_ACQUISITION_REQUIRED|OPEN_ENDED_RESEARCH_|COMPOUND_GOAL_COMPLETE' _terminal/producer.log > _terminal/first_signals.txt || true
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-fresh-http2-parent-a-terminal
          path: _terminal/
          if-no-files-found: error
