name: Zero-model SWE-bench Pro V2 HARD-51 purpose runner

# WHY THIS WORKFLOW EXISTS
#
# Iteration 9 answered the harness-authority question but returned three 0.0
# Terminal-Bench 4.1 reward vectors. This workflow answers the next narrow,
# honest question: can a Brain-owned zero-inference purpose compiler turn only
# instruction-supplied finite transformations and visible repository evidence
# into a non-empty patch on fresh HARD-51 tasks, without hidden-test leakage,
# borrowed outputs or model calls? It runs three run-id-seeded tasks from the
# pinned SWE-bench Pro V2 release and regrades the captured patch in a fresh
# container using the release's own PatchReplayAgent. It does not register a
# capability, claim an aggregate benchmark score, change terminal truth, merge,
# or satisfy section 6.
#
# The local producer never writes the authoritative receipt. This distinct
# GitHub Actions OIDC verifier binds its claims to the workflow run and commits
# only the sanitized receipt, receipt sidecar and reward log on push.

on:
  push:
    branches: [arena/6f8ac9ce-brain]
    paths:
      - ".github/workflows/zero-model-swe-pro-v2-hard51-runner-v1.yml"
      - "canonical/harbor/brain_zero_model_purpose_policy_v2.py"
      - "canonical/harbor/brain_zero_model_purpose_agent_v2.py"
      - "canonical/harbor/select_swe_pro_v2_hard51_tasks_v1.py"
      - "canonical/tests/test_brain_zero_model_swe_pro_v2_purpose_v1.py"

concurrency:
  group: zero-model-swe-pro-v2-hard51-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  WORKSPACE: ${{ github.workspace }}
  HARBOR_VERSION: "0.27.0"
  SWE_TAG: "v2.0.0"
  SWE_RELEASE_SHA: "66f92766bba642462d4bbe5479e83f91f9211862"
  SWE_REPO_SHA256SUMS_SHA256: "9d84f8507c89241d42d8b3ef911600a1ec75dbbb32687ce9b45b93318502c0bd"
  SWE_HARD51_IDS_SHA256: "6e35e84708a26443e1746ae928940555a3188654c90f3a2eb691f4f699482bd1"
  SWE_PATCH_REPLAY_SHA256: "5c8b344de37164e9723f1724c2573013957fb644c3913a64c12c1718c737d876"
  SWE_RELEASE_ASSET_SHA256SUMS_SHA256: "2377c1a2462a911cca428611494d2595a17bd9ddf5af2e476c77566b0b40ed9a"
  SWE_RELEASE_TASKS_ZIP_SHA256: "1b4e97502e7c73c6c96d86fd72ae3b67cb081af1796784157fe3097b34406947"
  AGENT_IMPORT_PATH: "canonical.harbor.brain_zero_model_purpose_agent_v2:ZeroModelBrainPurposeAgentV2"
  REPLAY_AGENT_IMPORT_PATH: "patch_replay:PatchReplayAgent"
  TASK_COUNT: "3"
  JOB_NAME: "brain-no-inference-swe-pro-v2-hard51"
  SWE_ROOT: "/tmp/swe_pro_v2"
  SWE_SUBSET: "/tmp/swe_hard51_subset"
  INITIAL_JOBS_DIR: "/tmp/harbor_initial_jobs"
  REGRADE_JOBS_DIR: "/tmp/harbor_regrade_jobs"

jobs:
  hard_benchmark_attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision pinned Harbor and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --disable-pip-version-check "harbor==${HARBOR_VERSION}"
          python3 -c "import importlib.metadata as m; v=m.version('harbor'); assert v=='${HARBOR_VERSION}', v; print('HARBOR_VERSION_PASS', v)"
          docker --version
          docker compose version
          docker info >/dev/null
          echo "DOCKER_READY_PASS"
      - name: Bind exact Brain-owned source bytes and audit no-inference surface
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${WORKSPACE}/out"
          python3 - <<'PY'
          import ast, hashlib, json, os, pathlib, sys
          root = pathlib.Path(os.environ["WORKSPACE"])
          out = root / "out"
          expected = {
              "canonical/harbor/brain_zero_model_purpose_policy_v2.py": "b44e7532fd2513efd015e9943d48f996c3f0e025c0cdd7e4486d89bcae0c0fc2",
              "canonical/harbor/brain_zero_model_purpose_agent_v2.py": "84e25ae93154b09cf8f1eeb0d55d092479b62abdaca5ec346fea5975434de0cb",
              "canonical/harbor/select_swe_pro_v2_hard51_tasks_v1.py": "d5a4c988fa8b9f6178780ebb9107873de5cfc34e5382bb350bf40883ae15afe7",
              "canonical/tests/test_brain_zero_model_swe_pro_v2_purpose_v1.py": "316e17723c0607596e377b7139858348194ed684f28801d6d0a52234b94bd62f",
          }
          observed = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in expected}
          if observed != expected:
              raise SystemExit("EXACT_SOURCE_SHA256_BINDING_FAIL " + json.dumps({"expected": expected, "observed": observed}, sort_keys=True))
          forbidden = {"urllib", "requests", "httpx", "socket", "http", "openai", "anthropic", "litellm", "transformers", "torch", "tensorflow", "boto3", "subprocess", "intake"}
          imports = {}
          marked_imports = []
          for rel in expected:
              tree = ast.parse((root / rel).read_text(encoding="utf-8"))
              mods = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods.update(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      mods.add(node.module)
              roots = sorted({item.split(".")[0] for item in mods})
              imports[rel] = roots
              marked = sorted(set(roots) & forbidden)
              if marked:
                  marked_imports.append({"path": rel, "marked": marked})
          if marked_imports:
              raise SystemExit("FORBIDDEN_IMPORT_IN_BRAIN_AGENT_SURFACE " + repr(marked_imports))
          known_task_names = ("math-eval-grader", "html-js-filter", "bun-sourcemap-leak", "batched-eval-parity", "layout-config-recreation", "data-anonymization", "takens-embedding-lean", "fin-saccr-rwa", "hof-topology-interpenetration")
          for rel in ("canonical/harbor/brain_zero_model_purpose_policy_v2.py", "canonical/harbor/brain_zero_model_purpose_agent_v2.py", "canonical/harbor/select_swe_pro_v2_hard51_tasks_v1.py"):
              lowered = (root / rel).read_text(encoding="utf-8").casefold()
              leaked = [name for name in known_task_names if name in lowered]
              if leaked:
                  raise SystemExit("TASK_SPECIFIC_ANSWER_LEAK " + repr(leaked))
          selector_source = (root / "canonical/harbor/select_swe_pro_v2_hard51_tasks_v1.py").read_text(encoding="utf-8").casefold()
          hidden_readers = ("instruction.md", "tests/test.sh", "solution/gold_patch.diff", "verifier/test.sh")
          if any(marker in selector_source for marker in hidden_readers):
              raise SystemExit("SELECTOR_READS_HIDDEN_TASK_CONTENT")
          agent_source = (root / "canonical/harbor/brain_zero_model_purpose_agent_v2.py").read_text(encoding="utf-8")
          if "model_name=None" not in agent_source or "model.patch" not in agent_source:
              raise SystemExit("AGENT_MODEL_OR_PATCH_CAPTURE_CONTRACT_MISSING")
          sys.path.insert(0, str(root))
          from canonical.harbor import brain_zero_model_purpose_policy_v2 as policy
          scan = policy.scan_command()
          if not policy.scan_is_safe(scan) or "-prune" not in scan:
              raise SystemExit("UNSAFE_SCAN_COMMAND")
          generic = policy.plan("Create `/app/result.txt` with `hello`.", "/app/input.txt\n")
          if generic["goal_family"] != "WRITE_QUOTED_FILE" or len(generic["commands"]) != 1 or not all(policy.command_is_safe(c) for c in generic["commands"]):
              raise SystemExit("GENERIC_PURPOSE_PLAN_FAIL")
          refusal = policy.plan("Fix the failing parser so edge cases behave correctly and add the missing behavior.", "/app/input.txt\n")
          if refusal["goal_family"] != "UNRESOLVED_PURPOSE" or refusal["commands"]:
              raise SystemExit("UNRESOLVED_PURPOSE_DID_NOT_REFUSE")
          binding = {"schema": "BRAIN_SWE_PRO_V2_PURPOSE_SOURCE_BINDING_V1", "expected": expected, "observed": observed, "equal": True}
          audit = {"schema": "BRAIN_SWE_PRO_V2_PURPOSE_STATIC_AUDIT_V1", "imports": imports, "marked_imports": marked_imports, "known_task_names_absent_from_agent_policy_selector": True, "selector_reads_hidden_task_content": False, "agent_model_name_none": True, "agent_patch_capture_present": True, "scan_is_safe": True, "generic_plan_is_safe": True, "unresolved_purpose_refused": True}
          (out / "blob_bindings.json").write_text(json.dumps(binding, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (out / "static_audit.json").write_text(json.dumps(audit, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("EXACT_SOURCE_SHA256_BINDING_PASS", len(expected), "marked_imports", marked_imports)
          PY
      - name: Checkout and verify pinned SWE-bench Pro V2 release
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf "${SWE_ROOT}"
          git clone --depth 1 --branch "${SWE_TAG}" https://github.com/scaleapi/SWE-bench_Pro-os.git "${SWE_ROOT}"
          actual_sha="$(git -C "${SWE_ROOT}" rev-parse HEAD)"
          if [ "${actual_sha}" != "${SWE_RELEASE_SHA}" ]; then
            echo "SWE_RELEASE_SHA_FAIL expected=${SWE_RELEASE_SHA} observed=${actual_sha}" >&2
            exit 1
          fi
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 10 \
            "https://api.github.com/repos/scaleapi/SWE-bench_Pro-os/releases/tags/${SWE_TAG}" \
            -o /tmp/swe_v2_release.json
          (cd "${SWE_ROOT}/v2" && sha256sum -c SHA256SUMS > /tmp/swe_v2_sha_check.log)
          mkdir -p "${WORKSPACE}/out"
          cp /tmp/swe_v2_release.json "${WORKSPACE}/out/release_metadata.json"
          python3 - <<'PY'
          import ast, hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["WORKSPACE"])
          swe = pathlib.Path(os.environ["SWE_ROOT"])
          out = root / "out"
          release = json.loads(pathlib.Path("/tmp/swe_v2_release.json").read_text(encoding="utf-8"))
          assets = {row.get("name"): str(row.get("digest") or "") for row in release.get("assets") or []}
          def digest(rel):
              return hashlib.sha256((swe / rel).read_bytes()).hexdigest()
          task_dirs = sorted(p for p in (swe / "v2/tasks").iterdir() if p.is_dir())
          hard_ids = [x for x in (swe / "v2/hard51_ids.txt").read_text(encoding="utf-8").splitlines() if x.strip()]
          checks = {
              "release_tag": release.get("tag_name") == os.environ["SWE_TAG"],
              "git_head_sha": os.environ["SWE_RELEASE_SHA"] == "66f92766bba642462d4bbe5479e83f91f9211862",
              "release_asset_sha256sums_digest": assets.get("SHA256SUMS") == "sha256:" + os.environ["SWE_RELEASE_ASSET_SHA256SUMS_SHA256"],
              "release_asset_tasks_zip_digest": assets.get("swe-bench-pro-v2.0.0-tasks.zip") == "sha256:" + os.environ["SWE_RELEASE_TASKS_ZIP_SHA256"],
              "repo_sha256sums_file": digest("v2/SHA256SUMS") == os.environ["SWE_REPO_SHA256SUMS_SHA256"],
              "hard51_ids_file": digest("v2/hard51_ids.txt") == os.environ["SWE_HARD51_IDS_SHA256"],
              "patch_replay_agent_file": digest("v2/tooling/patch_replay.py") == os.environ["SWE_PATCH_REPLAY_SHA256"],
              "task_dir_count": len(task_dirs) == 642,
              "hard51_count": len(hard_ids) == 51,
              "sha256sums_check_pass": all(line.endswith(": OK") for line in pathlib.Path("/tmp/swe_v2_sha_check.log").read_text(encoding="utf-8").splitlines() if line),
              "sha256sums_check_count": sum(1 for line in pathlib.Path("/tmp/swe_v2_sha_check.log").read_text(encoding="utf-8").splitlines() if line.endswith(": OK")) == 6436,
          }
          failed = sorted(k for k, v in checks.items() if not v)
          if failed:
              raise SystemExit("SWE_PRO_V2_SOURCE_VERIFICATION_FAIL " + repr(failed))
          replay_source = (swe / "v2/tooling/patch_replay.py").read_text(encoding="utf-8")
          tree = ast.parse(replay_source)
          roots = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  roots.update(alias.name.split(".")[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  roots.add(node.module.split(".")[0])
          forbidden = {"urllib", "requests", "httpx", "socket", "openai", "anthropic", "litellm", "transformers", "torch", "subprocess"}
          upstream_marked = sorted(roots & forbidden)
          if upstream_marked:
              raise SystemExit("UPSTREAM_REPLAY_AGENT_FORBIDDEN_IMPORT " + repr(upstream_marked))
          audit_path = out / "static_audit.json"
          audit = json.loads(audit_path.read_text(encoding="utf-8")) if audit_path.is_file() else {"schema": "BRAIN_SWE_PRO_V2_PURPOSE_STATIC_AUDIT_V1"}
          audit["upstream_replay_agent_imports"] = sorted(roots)
          audit["upstream_replay_agent_marked_imports"] = upstream_marked
          audit["upstream_replay_agent_is_model_free"] = True
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          payload = {
              "schema": "BRAIN_SWE_PRO_V2_SOURCE_VERIFICATION_V1",
              "release_tag": os.environ["SWE_TAG"],
              "release_sha": os.environ["SWE_RELEASE_SHA"],
              "release_asset_digests": {
                  "SHA256SUMS": os.environ["SWE_RELEASE_ASSET_SHA256SUMS_SHA256"],
                  "swe-bench-pro-v2.0.0-tasks.zip": os.environ["SWE_RELEASE_TASKS_ZIP_SHA256"],
              },
              "repo_sha256sums_sha256": os.environ["SWE_REPO_SHA256SUMS_SHA256"],
              "hard51_ids_sha256": os.environ["SWE_HARD51_IDS_SHA256"],
              "patch_replay_sha256": os.environ["SWE_PATCH_REPLAY_SHA256"],
              "task_dir_count": len(task_dirs),
              "hard51_count": len(hard_ids),
              "sha256sums_check_count": 6436,
              "checks": checks,
              "raw_tasks_saved_in_workspace": False,
          }
          (out / "source_verification.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("SWE_PRO_V2_SOURCE_AND_RELEASE_VERIFICATION_PASS", json.dumps(checks, sort_keys=True))
          PY
      - name: Select fresh run-id-seeded HARD-51 subset
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf "${SWE_SUBSET}"
          python3 "${WORKSPACE}/canonical/harbor/select_swe_pro_v2_hard51_tasks_v1.py" \
            --swe-root "${SWE_ROOT}" \
            --out-dir "${SWE_SUBSET}" \
            --run-id "${GITHUB_RUN_ID}" \
            --count "${TASK_COUNT}" | tee "${WORKSPACE}/out/selection.log"
          cp "${SWE_SUBSET}/selection.json" "${WORKSPACE}/out/selection.json"
          cp "${SWE_SUBSET}/task_ids.txt" "${WORKSPACE}/out/task_ids.txt"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["WORKSPACE"])
          selection = json.loads((root / "out/selection.json").read_text(encoding="utf-8"))
          count = int(os.environ["TASK_COUNT"])
          rows = selection.get("tasks") or []
          checks = {
              "selected_count": selection.get("selected_task_count") == count == len(rows),
              "hard51_count": selection.get("hard51_count") == 51,
              "task_count": selection.get("task_count") == 642,
              "selection_seed": selection.get("selection_seed") == "sha256(run_id:task_id)",
              "release_sha": selection.get("release_sha") == os.environ["SWE_RELEASE_SHA"],
              "no_seen_task_ids": selection.get("excluded_seen_task_ids") == [],
              "metadata_checks_pass": all(bool(v) for v in (selection.get("checks") or {}).values()),
              "no_instruction_content_read": selection.get("source_reads_instruction_content") is False,
              "no_solution_or_test_content_read": selection.get("source_reads_solution_or_test_content") is False,
              "no_raw_tasks_in_workspace": selection.get("raw_benchmark_tasks_saved_in_workspace") is False,
              "hidden_boundaries": selection.get("hidden_test_reading") is False and selection.get("borrowed_outputs") is False,
              "model_and_network_free": selection.get("model_calls") == 0 and selection.get("runtime_network_calls") == 0,
          }
          failed = sorted(k for k, v in checks.items() if not v)
          if failed:
              raise SystemExit("FRESH_HARD51_SELECTION_CHECK_FAIL " + repr(failed))
          (root / "out/selection_check.json").write_text(json.dumps(checks, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("FRESH_HARD51_SELECTION_PASS", [row["task_id"] for row in rows])
          PY
      - name: Resolve and pin exact GHCR image digests
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ["WORKSPACE"])
          out = root / "out"
          subset = pathlib.Path(os.environ["SWE_SUBSET"])
          tags = [x.strip() for x in (subset / "unpinned_tags.txt").read_text(encoding="utf-8").splitlines() if x.strip()]
          ids = [x.strip() for x in (subset / "task_ids.txt").read_text(encoding="utf-8").splitlines() if x.strip()]
          if len(tags) != len(ids) or len(tags) != int(os.environ["TASK_COUNT"]):
              raise SystemExit("IMAGE_PIN_INPUT_COUNT_FAIL")
          rows = []
          refs = []
          for task_id, tag in zip(ids, tags):
              subprocess.run(["docker", "pull", "--platform", "linux/amd64", tag], check=True)
              raw = subprocess.check_output(["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", tag], text=True)
              repo_digests = json.loads(raw)
              image_name = tag.split(":", 1)[0]
              candidates = sorted(x for x in repo_digests if x.startswith(image_name + "@sha256:"))
              if not candidates:
                  raise SystemExit("GHCR_DIGEST_RESOLUTION_FAIL " + tag)
              digest_ref = candidates[0]
              subprocess.run(["docker", "pull", "--platform", "linux/amd64", digest_ref], check=True)
              config_path = subset / "tasks" / task_id / "task.toml"
              text = config_path.read_text(encoding="utf-8")
              old_line = 'docker_image = "' + tag + '"'
              new_line = 'docker_image = "' + digest_ref + '"'
              if text.count(old_line) != 1:
                  raise SystemExit("TASK_TOML_IMAGE_TAG_BINDING_FAIL " + task_id)
              config_path.write_text(text.replace(old_line, new_line, 1), encoding="utf-8")
              config = tomllib.loads(config_path.read_text(encoding="utf-8"))
              if ((config.get("environment") or {}).get("docker_image") or "") != digest_ref:
                  raise SystemExit("TASK_TOML_DIGEST_WRITE_FAIL " + task_id)
              rows.append({"task_id": task_id, "image_tag": tag, "digest_ref": digest_ref})
              refs.append(digest_ref)
          (out / "pinned_refs.txt").write_text("\n".join(refs) + "\n", encoding="utf-8")
          (out / "pulled_images.json").write_text(json.dumps({"schema": "BRAIN_SWE_PRO_V2_PINNED_IMAGE_PULLS_V1", "count": len(refs), "refs": refs}, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          checks = {
              "pin_count": len(refs) == int(os.environ["TASK_COUNT"]),
              "all_digest_pinned": all("@sha256:" in ref for ref in refs),
              "all_task_toml_digest_bound": all((((tomllib.loads((subset / "tasks" / row["task_id"] / "task.toml").read_text(encoding="utf-8")).get("environment") or {}).get("docker_image") or "") == row["digest_ref"]) for row in rows),
              "no_unpinned_tag_in_task_toml": all("ghcr.io/scaleapi/swe-bench_pro-v2:" not in (subset / "tasks" / row["task_id"] / "task.toml").read_text(encoding="utf-8") for row in rows),
          }
          failed = sorted(k for k, v in checks.items() if not v)
          if failed:
              raise SystemExit("IMAGE_PIN_CHECK_FAIL " + repr(failed))
          payload = {"schema": "BRAIN_SWE_PRO_V2_IMAGE_PIN_BINDINGS_V1", "rows": rows, "checks": checks, "model_calls": 0, "runtime_network_calls_in_agent_phase": 0, "raw_tasks_saved_in_workspace": False}
          (out / "image_pin_bindings.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("GHCR_DIGEST_PIN_PASS", len(refs))
          PY
      - name: Run initial Harbor phase with the Brain-owned zero-inference purpose agent
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "${INITIAL_JOBS_DIR}" "${WORKSPACE}/out"
          : > "${WORKSPACE}/out/initial_harbor_stdout.log"
          : > "${WORKSPACE}/out/initial_harbor_stderr.log"
          PYTHONPATH="${WORKSPACE}:/tmp/swe_pro_v2/v2/tooling${PYTHONPATH:+:${PYTHONPATH}}" harbor run \
            -p "${SWE_SUBSET}/tasks" \
            -e docker \
            -a "${AGENT_IMPORT_PATH}" \
            -o "${INITIAL_JOBS_DIR}" \
            --job-name "${JOB_NAME}" \
            -n 1 \
            --quiet \
            --no-export-traces \
            --disable-verification \
            > "${WORKSPACE}/out/initial_harbor_stdout.log" 2> "${WORKSPACE}/out/initial_harbor_stderr.log"
          code=$?
          echo "${code}" > "${WORKSPACE}/out/initial_harbor_exit_code.txt"
          set -e
          echo "INITIAL_HARBOR_RUN_EXIT_CODE ${code}"
          [ "${code}" -eq 0 ]
      - name: Regrade captured patches in fresh containers with upstream PatchReplayAgent
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "${REGRADE_JOBS_DIR}" "${WORKSPACE}/out"
          : > "${WORKSPACE}/out/regrade_harbor_stdout.log"
          : > "${WORKSPACE}/out/regrade_harbor_stderr.log"
          PYTHONPATH="${WORKSPACE}:/tmp/swe_pro_v2/v2/tooling${PYTHONPATH:+:${PYTHONPATH}}" harbor run \
            -p "${SWE_SUBSET}/tasks" \
            -e docker \
            -a "${REPLAY_AGENT_IMPORT_PATH}" \
            --ak "source_job=${INITIAL_JOBS_DIR}/${JOB_NAME}" \
            -o "${REGRADE_JOBS_DIR}" \
            --job-name "${JOB_NAME}-regrade" \
            -n 1 \
            --quiet \
            --no-export-traces \
            > "${WORKSPACE}/out/regrade_harbor_stdout.log" 2> "${WORKSPACE}/out/regrade_harbor_stderr.log"
          code=$?
          echo "${code}" > "${WORKSPACE}/out/regrade_harbor_exit_code.txt"
          set -e
          echo "REGRADE_HARBOR_RUN_EXIT_CODE ${code}"
          [ "${code}" -eq 0 ]
      - name: Parse official fresh-container reward vectors and zero-model purpose decisions
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["WORKSPACE"])
          out = root / "out"
          initial_jobs = pathlib.Path(os.environ["INITIAL_JOBS_DIR"])
          regrade_jobs = pathlib.Path(os.environ["REGRADE_JOBS_DIR"])
