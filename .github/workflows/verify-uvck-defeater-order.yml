name: verify-uvck-defeater-order
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/assurance_closure_compiler_v1.py
      - canonical/tests/test_assurance_closure_compiler_v1.py
      - .github/workflows/verify-uvck-defeater-order.yml
permissions:
  contents: read
jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo runner-ok
  checkout-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: test -f canonical/runtime/assurance_closure_compiler_v1.py
  python-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python --version
  compile-system-python:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile canonical/runtime/assurance_closure_compiler_v1.py canonical/tests/test_assurance_closure_compiler_v1.py
