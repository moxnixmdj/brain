name: Verify shared residual contract gate
on:
  push:
    branches: [obs-shared-residual-contract-gate-20261002]
    paths:
      - canonical/runtime/shared_residual_contract_gate.py
      - canonical/tests/test_shared_residual_contract_gate.py
      - .github/workflows/verify-shared-residual-contract-gate.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/shared_residual_contract_gate.py
      - canonical/tests/test_shared_residual_contract_gate.py
      - .github/workflows/verify-shared-residual-contract-gate.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_shared_residual_contract_gate
