name: verify-reached-escape-no-bypass

on:
  pull_request:
    paths:
      - "canonical/runtime/**"
      - "canonical/tests/test_reached_escape_live_no_bypass_guard_v1.py"
      - "canonical/tests/test_certified_reached_escape_state_constructor_v2.py"
      - "canonical/tests/test_reached_escape_repair_cycle_v1.py"
      - "canonical/tests/test_reached_escape_construction_invariant_boundary_v1.py"
      - ".github/workflows/verify-reached-escape-no-bypass.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-no-bypass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run repository-local reached-state census
        run: python canonical/runtime/reached_escape_live_no_bypass_guard_v1.py
      - name: Run no-bypass regression suite
        run: python -m unittest -v canonical.tests.test_reached_escape_live_no_bypass_guard_v1

  constructor-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest -v canonical.tests.test_certified_reached_escape_state_constructor_v2

  repair-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest -v canonical.tests.test_reached_escape_repair_cycle_v1

  live-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest -v canonical.tests.test_reached_escape_construction_invariant_boundary_v1
