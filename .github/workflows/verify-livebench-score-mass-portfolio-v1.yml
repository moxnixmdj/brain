name: verify-livebench-score-mass-portfolio-v1

on:
  push:
    branches:
      - breakthrough/livebench-score-mass-portfolio-v1-20261004
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact score-mass portfolio tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest canonical.tests.test_livebench_score_mass_portfolio_compiler_v1 -v
