name: verify-live-brain-real-task-probes-v1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/tests/test_live_brain_real_task_probe_v1.py"
      - ".github/workflows/verify-live-brain-real-task-probes-v1.yml"
      - "canonical/runtime/unified_cognitive_fabric_v1.py"
      - "canonical/runtime/live_brain_runtime_v1.py"
      - "canonical/runtime/general_adequate_decision_fixed_point_v2.py"
      - "canonical/runtime/autonomous_verified_self_improvement_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run heterogeneous real-task probes
        run: python -m unittest canonical.tests.test_live_brain_real_task_probe_v1 -v
