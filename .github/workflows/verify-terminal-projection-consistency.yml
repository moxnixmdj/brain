name: Verify terminal projection consistency

on:
  push:
    paths:
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json"
      - "canonical/capabilities/opus55/OPUS_5_5_CAPABILITY_OWNERSHIP_MATRIX_V1.json"
      - "canonical/governance/ABSOLUTE_DOMINANCE_SCOPE_COMPLETENESS_RECONCILIATION_V1.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"
      - "canonical/governance/OPUS55_MATERIAL_CONDITION_REGISTRY_V1.json"
      - "canonical/governance/OPUS55_MATERIAL_CONDITION_EVIDENCE_BINDINGS_V1.json"
      - "canonical/runtime/material_condition_closure_v1.py"
      - "canonical/tests/test_material_condition_closure_v1.py"
      - "canonical/governance/OPUS55_MATERIAL_CONDITION_REGISTRY_V1.json"
      - "canonical/governance/OPUS55_MATERIAL_CONDITION_EVIDENCE_BINDINGS_V1.json"
      - "canonical/runtime/material_condition_closure_v1.py"
      - "canonical/tests/test_material_condition_closure_v1.py"
      - "canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"
      - "canonical/verification/TERMINAL_SCOPE_QUARANTINE_PROPAGATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/runtime/terminal_projection_consistency_v1.py"
      - "canonical/tests/test_terminal_projection_consistency_v1.py"
      - "canonical/governance/TERMINAL_PROJECTION_CONSISTENCY_V1.json"
      - "canonical/governance/TERMINAL_PROJECTION_CONSISTENCY_V3.json"
      - "canonical/governance/TERMINAL_PROJECTION_CONSISTENCY_V3.json"
      - ".github/workflows/verify-terminal-projection-consistency.yml"
  pull_request:
    paths:
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json"
      - "canonical/capabilities/opus55/OPUS_5_5_CAPABILITY_OWNERSHIP_MATRIX_V1.json"
      - "canonical/governance/ABSOLUTE_DOMINANCE_SCOPE_COMPLETENESS_RECONCILIATION_V1.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_REGISTRY_V2.json"
      - "canonical/capabilities/opus55/OPUS_5_5_USEFUL_CAPABILITY_ENVELOPE_V1.json"
      - "canonical/verification/TERMINAL_SCOPE_QUARANTINE_PROPAGATION_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/runtime/terminal_projection_consistency_v1.py"
      - "canonical/tests/test_terminal_projection_consistency_v1.py"
      - "canonical/governance/TERMINAL_PROJECTION_CONSISTENCY_V1.json"
      - ".github/workflows/verify-terminal-projection-consistency.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run material condition closure tests
        run: python -m unittest canonical.tests.test_material_condition_closure_v1 -v
      - name: Run projection consistency adversarial tests
        run: python -m unittest canonical.tests.test_terminal_projection_consistency_v1 -v
      - name: Verify live current projection
        run: python canonical/runtime/terminal_projection_consistency_v1.py
