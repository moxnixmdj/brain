name: Verify dominance sufficiency V4

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/dominance_binding_v2.py"
      - "canonical/runtime/dominance_semantic_binding_v3.py"
      - "canonical/runtime/dominance_semantic_binding_v4.py"
      - "canonical/runtime/dominance_sufficiency_v1.py"
      - "canonical/runtime/dominance_sufficiency_v2.py"
      - "canonical/runtime/dominance_sufficiency_v3.py"
      - "canonical/runtime/dominance_sufficiency_v4.py"
      - "canonical/runtime/dominance_first_learning_router_v4.py"
      - "canonical/tests/test_dominance_sufficiency_v1.py"
      - "canonical/tests/test_dominance_sufficiency_v2.py"
      - "canonical/tests/test_dominance_sufficiency_v3.py"
      - "canonical/tests/test_dominance_sufficiency_v4.py"
      - "canonical/governance/DOMINANCE_SUFFICIENCY_V4.json"
      - ".github/workflows/verify-dominance-sufficiency-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile V4 runtime
        run: |
          python -m py_compile \
            canonical/runtime/dominance_semantic_binding_v4.py \
            canonical/runtime/dominance_sufficiency_v4.py \
            canonical/runtime/dominance_first_learning_router_v4.py
      - name: Run dominance falsification stack
        run: |
          python -m pytest -q \
            canonical/tests/test_dominance_sufficiency_v1.py \
            canonical/tests/test_dominance_sufficiency_v2.py \
            canonical/tests/test_dominance_sufficiency_v3.py \
            canonical/tests/test_dominance_sufficiency_v4.py
