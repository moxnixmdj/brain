name: H100 zero-learned role induction V1

on:
  push:
    branches:
      - research/h100-zero-learned-role-induction-v1
    paths:
      - 'canonical/governance/H100_ZERO_LEARNED_ROLE_INDUCTION_PREEXPOSURE_V1.json'
      - 'canonical/governance/H100_ZERO_LEARNED_ROLE_INDUCTION_CANDIDATE_V1.json'
      - 'canonical/runtime/h100_zero_learned_role_induction_v1.py'
      - 'canonical/tests/test_h100_zero_learned_role_induction_v1.py'
      - '.github/workflows/h100-zero-learned-role-induction-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/H100_ZERO_LEARNED_ROLE_INDUCTION_PREEXPOSURE_V1.json'
      - 'canonical/governance/H100_ZERO_LEARNED_ROLE_INDUCTION_CANDIDATE_V1.json'
      - 'canonical/runtime/h100_zero_learned_role_induction_v1.py'
      - 'canonical/tests/test_h100_zero_learned_role_induction_v1.py'
      - '.github/workflows/h100-zero-learned-role-induction-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run role induction tests
        run: PYTHONPATH="$PWD" python -m unittest canonical.tests.test_h100_zero_learned_role_induction_v1 -v
