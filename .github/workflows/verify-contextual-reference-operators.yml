name: Verify bounded contextual reference operators
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/contextual_reference_operators.py
      - canonical/tests/test_contextual_reference_operators.py
      - .github/workflows/verify-contextual-reference-operators.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v canonical.tests.test_contextual_reference_operators
