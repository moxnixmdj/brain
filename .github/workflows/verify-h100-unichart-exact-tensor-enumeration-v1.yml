name: Verify H100 UniChart exact tensor enumeration V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/h100_unichart_safetensors_header_audit_v1.py'
      - 'canonical/tests/test_h100_unichart_safetensors_header_audit_v1.py'
      - 'canonical/governance/H100_UNICHART_EXACT_TENSOR_ENUMERATION_CANDIDATE_V1.json'
      - '.github/workflows/verify-h100-unichart-exact-tensor-enumeration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run parser unit tests
        run: python -m unittest canonical.tests.test_h100_unichart_safetensors_header_audit_v1 -v

      - name: Verify exact Hugging Face checkpoint lineage
        shell: bash
        run: |
          set -euo pipefail
          API='https://huggingface.co/api/models/ahmed-masry/unichart-base-960/revision/baa206a05372f8c49778313abb7091e1d0c8e474?blobs=true'
          curl -fsSL --max-filesize 1048576 "$API" -o /tmp/hf.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/hf.json'))
          assert d['sha']=='baa206a05372f8c49778313abb7091e1d0c8e474'
          s={x['rfilename']:x for x in d['siblings']}
          b=s['pytorch_model.bin']
          q=s['model.safetensors']
          assert b['blobId']=='1b9577b9f0ec249a6487d465e570fe30fb98b2d0'
          assert b['size']==809199995
          assert b['lfs']['sha256']=='d238d25a8f1aef1fb4670145854354090e72ec68cca6d526b963e7184b8f0ceb'
          assert q['blobId']=='9c9438ef6f01105bb3b0a348e5dada60fbf07d00'
          assert q['size']==809095376
          assert q['lfs']['sha256']=='2faf9ef1ac62a290ea58c80e9e2454db4e3613579e7cb6167cb934a03c09664e'
          print('CHECKPOINT_LINEAGE_PASS')
          PY

      - name: Fetch only safetensors header by HTTP range
        shell: bash
        run: |
          set -euo pipefail
          URL='https://huggingface.co/ahmed-masry/unichart-base-960/resolve/baa206a05372f8c49778313abb7091e1d0c8e474/model.safetensors?download=true'

          curl -fsSL --range 0-7 --max-filesize 65536 "$URL" -o /tmp/first8.bin
          test "$(stat -c%s /tmp/first8.bin)" -eq 8

          HEADER_LEN="$(python - <<'PY'
          import struct
          b=open('/tmp/first8.bin','rb').read()
          print(struct.unpack('<Q',b)[0])
          PY
          )"
          test "$HEADER_LEN" -gt 0
          test "$HEADER_LEN" -lt 16000000

          END="$((7 + HEADER_LEN))"
          MAX="$((8 + HEADER_LEN))"
          curl -fsSL --range "0-$END" --max-filesize "$MAX" "$URL" -o /tmp/unichart_header.bin
          test "$(stat -c%s /tmp/unichart_header.bin)" -eq "$MAX"

      - name: Enumerate exact stored tensors
        run: |
          python canonical/runtime/h100_unichart_safetensors_header_audit_v1.py             --header-file /tmp/unichart_header.bin             --expected-file-size 809095376             > h100_unichart_exact_tensor_enumeration.json
          cat h100_unichart_exact_tensor_enumeration.json

      - name: Assert zero-credit exact enumeration
        run: |
          python - <<'PY'
          import json
          d=json.load(open('h100_unichart_exact_tensor_enumeration.json'))
          assert d['status']=='PASS__EXACT_SAFETENSORS_HEADER_ENUMERATION',d
          assert d['exact_file_size_from_header']==809095376,d
          assert d['tensor_count']>0,d
          assert d['total_stored_elements']>0,d
          assert d['h100_credit_delta']==0,d
          assert d['execution_authority'] is False,d
          print(json.dumps({
            'status':d['status'],
            'tensor_count':d['tensor_count'],
            'total_stored_elements':d['total_stored_elements'],
            'floating_stored_elements':d['floating_stored_elements'],
            'dtype_elements':d['dtype_elements'],
            'tensor_payload_bytes':d['tensor_payload_bytes'],
          },indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: h100-unichart-exact-tensor-enumeration-v1
          path: h100_unichart_exact_tensor_enumeration.json
          if-no-files-found: error
