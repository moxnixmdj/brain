name: Verify source-grounded coreference candidates
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/source_grounded_coreference.py
      - canonical/tests/test_source_grounded_coreference.py
      - .github/workflows/verify-source-grounded-coreference.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_source_grounded_coreference
