name: Saturate existing proof-atom receipts V1

on:
  push:
    paths:
      - ".github/workflows/saturate-existing-proof-atom-receipts-v1.yml"
      - "canonical/governance/RECEIPT_SATURATION_REQUEST_V1.json"
  workflow_dispatch:

jobs:
  saturate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute exact current proof-atom receipt index
        run: |
          python canonical/runtime/proof_atom_receipt_index_v4.py > canonical/reasoning/PROOF_ATOM_RECEIPT_SCAN_20261006_V4.json
          python - <<'PY'
          import json
          p=json.load(open("canonical/reasoning/PROOF_ATOM_RECEIPT_SCAN_20261006_V4.json"))
          assert str(p.get("status","")).startswith("PASS"), p
          assert p.get("canonical_atom_count") == 40, p
          print(json.dumps({
            "status":p["status"],
            "scanned_file_count":p["scanned_file_count"],
            "candidate_match_count":p["candidate_match_count"],
            "atoms_with_candidate_matches":p["atoms_with_candidate_matches"],
            "atoms_without_candidate_matches":p["atoms_without_candidate_matches"],
            "index_fingerprint_sha256":p["index_fingerprint_sha256"],
            "scanned_corpus_manifest_sha256":p["scanned_corpus_manifest_sha256"],
          },indent=2,sort_keys=True))
          PY
      - name: Commit deterministic zero-credit scan
        run: |
          git config user.name "project-brain-ci"
          git config user.email "project-brain-ci@users.noreply.github.com"
          git add canonical/reasoning/PROOF_ATOM_RECEIPT_SCAN_20261006_V4.json
          if git diff --cached --quiet; then
            echo "No scan result change"
            exit 0
          fi
          git commit -m "Record current V4 proof-atom receipt saturation scan"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: proof-atom-receipt-saturation-v4
          path: canonical/reasoning/PROOF_ATOM_RECEIPT_SCAN_20261006_V4.json
