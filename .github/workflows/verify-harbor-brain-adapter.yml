name: Verify Harbor Brain adapter
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/coding_control_kernel_v1.py
      - canonical/runtime/harbor_brain_agent.py
      - canonical/runtime/harbor_science_planner_v1.py
      - canonical/runtime/harbor_science_agent_v1.py
      - canonical/tests/test_harbor_brain_agent.py
      - canonical/tests/test_harbor_science_planner_v1.py
      - canonical/tests/test_harbor_science_agent_v1.py
      - .github/workflows/verify-harbor-brain-adapter.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Harbor probe - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            command: python --version
          - name: kernel
            command: python -c "import canonical.runtime.coding_control_kernel_v1"
          - name: astra
            command: python -c "import canonical.runtime.astra_runtime"
          - name: transport
            command: python -c "import canonical.runtime.harbor_environment_transport"
          - name: policy
            command: python -c "import canonical.runtime.harbor_command_policy"
          - name: agent
            command: python -c "import canonical.runtime.harbor_brain_agent"
          - name: science-planner
            command: python -c "import canonical.runtime.harbor_science_planner_v1"
          - name: science-agent
            command: python -c "import canonical.runtime.harbor_science_agent_v1"
          - name: tests
            command: python -c "import canonical.tests.test_harbor_brain_agent"
          - name: science-tests
            command: python -c "import canonical.tests.test_harbor_science_agent_v1; import canonical.tests.test_harbor_science_planner_v1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ${{ matrix.command }}
  verify:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_harbor_brain_agent canonical.tests.test_harbor_science_planner_v1 canonical.tests.test_harbor_science_agent_v1
