name: Verify Harbor Brain adapter
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/coding_control_kernel_v1.py
      - canonical/runtime/harbor_brain_agent.py
      - canonical/tests/test_harbor_brain_agent.py
      - .github/workflows/verify-harbor-brain-adapter.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Harbor diagnostic - ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_command_gate_blocks_external_acquisition
          - test_command_gate_allows_local_task_actions
          - test_configuration_is_durable_and_load_bearing
          - test_finish_gate_rejects_model_only_completion
          - test_bounded_goal_verified_exec_diff_then_finish
          - test_premature_finish_is_rejected_but_run_can_recover
          - test_failed_verification_cannot_authorize_finish
          - test_max_cycles_never_force_model_finalization
          - test_rejects_non_allowlisted_planner_action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_harbor_brain_agent.HarborBrainAdapterTests.${{ matrix.test }}
  verify:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_harbor_brain_agent
