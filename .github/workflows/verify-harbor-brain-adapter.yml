name: Verify Harbor Brain adapter
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/harbor_brain_agent.py
      - canonical/tests/test_harbor_brain_agent.py
      - .github/workflows/verify-harbor-brain-adapter.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_harbor_brain_agent
