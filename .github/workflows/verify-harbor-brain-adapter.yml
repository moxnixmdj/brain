name: Verify Harbor Brain adapter
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/coding_control_kernel_v1.py
      - canonical/runtime/harbor_brain_agent.py
      - canonical/tests/test_harbor_brain_agent.py
      - .github/workflows/verify-harbor-brain-adapter.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Harbor adapter tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest -v canonical.tests.test_harbor_brain_agent > harbor-test-output.txt 2>&1
          code=$?
          cat harbor-test-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Harbor test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-brain-adapter-test-output
          path: harbor-test-output.txt
          if-no-files-found: error
      - name: Enforce test verdict
        shell: bash
        run: exit "${{ steps.tests.outputs.exit_code }}"
