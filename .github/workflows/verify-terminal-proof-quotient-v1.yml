name: Verify terminal proof quotient v1

on:
  pull_request:
    paths:
      - "canonical/runtime/terminal_proof_quotient_v1.py"
      - "canonical/runtime/composition_receipt_autobinder_v1.py"
      - "canonical/governance/TERMINAL_PROOF_QUOTIENT_MANIFEST_V1.json"
      - "canonical/governance/TERMINAL_PROOF_QUOTIENT_ACTIVATION_CANDIDATE_V1.json"
      - "canonical/tests/test_terminal_proof_quotient_v1.py"
      - ".github/workflows/verify-terminal-proof-quotient-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact quotient and autobinder
        run: python canonical/tests/test_terminal_proof_quotient_v1.py
