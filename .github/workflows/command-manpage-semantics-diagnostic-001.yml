name: Command Manpage Semantics Diagnostic 001

on:
  push:
    branches:
      - diagnostic/command-manpage-semantics-v1-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove canonical runtime unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD -- canonical/runtime/)"
      - name: Run metadata-only manpage semantics diagnostic
        run: python canonical/experiments/run_command_manpage_semantics_diagnostic_001.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: command-manpage-semantics-diagnostic-001
          path: canonical/astra_runtime/evidence/COMMAND_MANPAGE_SEMANTICS_DIAGNOSTIC_001__RESULT.json
          if-no-files-found: error
