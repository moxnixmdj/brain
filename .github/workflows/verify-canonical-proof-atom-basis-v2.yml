name: Verify canonical proof atom basis v2
on:
  pull_request:
    paths:
      - "canonical/runtime/canonical_proof_atom_basis_v2.py"
      - "canonical/tests/test_canonical_proof_atom_basis_v2.py"
      - "canonical/governance/CANONICAL_PROOF_ATOM_BASIS_V2_ACTIVATION_V1.json"
      - "canonical/governance/PROOF_ATOM_REFINEMENT_OVERLAY_V1.json"
      - ".github/workflows/verify-canonical-proof-atom-basis-v2.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run v2 proof atom basis tests
        run: python -m unittest canonical.tests.test_canonical_proof_atom_basis_v2 -v
      - name: Execute live v2 projection
        run: |
          python -m canonical.runtime.canonical_proof_atom_basis_v2 > /tmp/basis-v2.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/basis-v2.json"))
          assert p["status"].startswith("PASS"), p
          assert p["global_unresolved_predicate_count"] == 31
          assert p["refined_parent_count"] == 3
          assert p["leaf_requirement_occurrence_count"] == 40
          assert p["leaf_atom_count"] == 40
          assert p["exact_duplicate_savings"] == 0
          assert p["max_structural_target_fanout"] == 3
          assert p["capability_credit_delta"] == 0
          assert p["family_credit_delta"] == 0
          assert p["execution_authority"] is False
          assert p["promotion_authority"] is False
          print("canonical proof atom basis v2: PASS")
          PY
