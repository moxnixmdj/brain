name: Verify M2 DOCX run-span replacement
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/docx_run_span_replace.py
      - canonical/tests/test_docx_run_span_replace.py
      - .github/workflows/verify-m2-docx-run-span-replace.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_docx_run_span_replace
