name: Project Brain Astra Hidden Distinct Adjudicator
on:
  push:
    branches: [main]
    paths: ['canonical/astra/HIDDEN_RESULT.json']
permissions: {contents: write}
jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python canonical/runtime/astra_hidden_verifier.py
      - name: Persist adjudication
        run: |
          git config user.name 'Project Brain Astra Verifier'
          git config user.email 'project-brain-astra-verifier@users.noreply.github.com'
          git add canonical/astra/HIDDEN_ADJUDICATION.json
          git commit -m 'Independently adjudicate Astra hidden one-shot'
          git push
