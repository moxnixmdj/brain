name: Verify M3 structured effect induction
on:
  push:
    branches: [obs-m3-effect-induction-20261002]
    paths:
      - canonical/runtime/m3_structured_effect_induction.py
      - canonical/tests/test_m3_structured_effect_induction.py
      - .github/workflows/verify-m3-structured-effect-induction.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/m3_structured_effect_induction.py
      - canonical/tests/test_m3_structured_effect_induction.py
      - .github/workflows/verify-m3-structured-effect-induction.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_m3_structured_effect_induction
