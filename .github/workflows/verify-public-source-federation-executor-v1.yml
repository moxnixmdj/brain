name: Verify public source federation executor V1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/public_source_federation_executor_v1.py
      - canonical/tests/test_public_source_federation_executor_v1.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v canonical.tests.test_public_source_federation_executor_v1
