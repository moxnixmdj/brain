name: Verify terminal scheduling V13 candidate

on:
  push:
    paths:
      - "canonical/governance/TERMINAL_SCHEDULING_V13_ACTIVE_AUTHORITY_CANDIDATE_V1.json"
      - "canonical/runtime/verify_terminal_scheduling_v13_candidate_v1.py"
      - "canonical/tests/test_terminal_scheduling_v13_candidate_v1.py"
      - ".github/workflows/verify-terminal-scheduling-v13-candidate.yml"
  pull_request:
    paths:
      - "canonical/governance/TERMINAL_SCHEDULING_V13_ACTIVE_AUTHORITY_CANDIDATE_V1.json"
      - "canonical/runtime/verify_terminal_scheduling_v13_candidate_v1.py"
      - "canonical/tests/test_terminal_scheduling_v13_candidate_v1.py"
      - ".github/workflows/verify-terminal-scheduling-v13-candidate.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact V13 candidate
        run: python canonical/runtime/verify_terminal_scheduling_v13_candidate_v1.py
      - name: Run V13 candidate test
        run: python -m canonical.tests.test_terminal_scheduling_v13_candidate_v1
