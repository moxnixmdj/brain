# Exact-head V13 verification
name: Verify terminal scheduling V13 candidate

on:
  push:
    paths:
      - "canonical/governance/TERMINAL_SCHEDULING_V13_ACTIVE_AUTHORITY_CANDIDATE_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_V13_ACTIVE_AUTHORITY_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V13_CANDIDATE_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json"
      - "canonical/verification/TERMINAL_SCHEDULING_V13_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
      - "canonical/verification/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V13_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
      - ".github/workflows/verify-terminal-scheduling-v13-candidate.yml"
  pull_request:
    paths:
      - "canonical/governance/TERMINAL_SCHEDULING_V13_ACTIVE_AUTHORITY_CANDIDATE_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_V13_ACTIVE_AUTHORITY_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V13_CANDIDATE_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json"
      - "canonical/verification/TERMINAL_SCHEDULING_V13_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
      - "canonical/verification/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V13_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
      - ".github/workflows/verify-terminal-scheduling-v13-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate independently verified V13 authority chain
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path(".")
          def blob(p):
              raw=(root/p).read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          def load(p): return json.loads((root/p).read_text())
          expected={
            "canonical/governance/TERMINAL_SCHEDULING_V13_ACTIVE_AUTHORITY_CANDIDATE_V1.json":"2b597ea1840196623a2d7e31f9c613cd993ec6ba",
            "canonical/governance/TERMINAL_SCHEDULING_V13_ACTIVE_AUTHORITY_V1.json":"d6546a99a62c77b79ae0b169e822ca4f636eea72",
            "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V13_CANDIDATE_V1.json":"9ae934eb9971d59bf205823317f44e97709fa618",
            "canonical/verification/TERMINAL_SCHEDULING_V13_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json":"407313a62efa87c5f0fced98e25732b973b78baf",
            "canonical/verification/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V13_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json":"328c13b409777c3ac9130a38de7b5a852eb0fc11",
            "canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json":"0d25e2481e195c413d8c47bb5340921b7825f5cb",
          }
          for p,h in expected.items(): assert blob(p)==h,(p,blob(p),h)
          r=load("canonical/verification/TERMINAL_SCHEDULING_V13_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          p=load("canonical/verification/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V13_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json")
          cur=load("canonical/governance/TERMINAL_SCHEDULING_CURRENT_AUTHORITY_V1.json")
          assert r["independent_runner"]["conclusion"]=="success"
          assert p["independent_runner"]["conclusion"]=="success"
          assert p["verified"]["mutation_fail_closed"] is True
          assert cur["status"].startswith("ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS__V13_CURRENT")
          assert cur["live_world"]["proved_predicates"]==11
          assert cur["live_world"]["unresolved_predicates"]==27
          assert cur["live_world"]["active_zero_reality_requirements"]==17
          assert cur["live_world"]["primitive_zero_reality_work_units"]==31
          assert cur["mandatory_tool_discovery_retrieval"]["authority"]=="V5_OVER_VERIFIED_V4_OVER_VERIFIED_V3_OVER_VERIFIED_V2_BASE"
          assert cur["fresh_reality_authority"] is False
          assert cur["execution_authority"] is False
          assert cur["promotion_authority"] is False
          print("V13 independent authority chain verified")
          PY
