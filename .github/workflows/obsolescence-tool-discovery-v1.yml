name: Obsolescence Tool Discovery V1

on:
  push:
    branches:
      - research/obsolescence-tool-discovery-v1-20260928
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-learn-execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify frozen mission and absence of prebound graph supplier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          mission=pathlib.Path('canonical/astra_runtime/missions/ASTRA_OBSOLESCENCE_TOOL_DISCOVERY_GRAPH_001.json')
          assert hashlib.sha256(mission.read_bytes()).hexdigest()=='cd60aeb5a8c37bee88efc964dc619ac9d77b80fdaedb8ff7e257ffcd495fba08'
          m=json.loads(mission.read_text())
          assert 'graphviz' not in m['goal'].lower()
          assert m['constraints']['prebound_graph_tool_capability_forbidden'] is True
          registry=json.loads(pathlib.Path('canonical/runtime/BOUND_CAPABILITY_REGISTRY_V1.json').read_text())['capabilities']
          blob=json.dumps(registry,sort_keys=True).lower()
          assert 'graphviz' not in blob
          print(json.dumps({'mission_sha256':hashlib.sha256(mission.read_bytes()).hexdigest(),'prebound_graphviz':False},sort_keys=True))
          PY

      - name: Create same-identity checkpoint
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python canonical/runtime/same_identity_supervisor.py             --agent-id SUPERWORKER-OBSOLESCENCE-1             --task canonical/same_identity_worker/tasks/SI_OBSOLESCENCE_TOOL_DISCOVERY_GRAPH_001.json             > OBS_TOOL_CHECKPOINT_STDOUT.json 2> OBS_TOOL_CHECKPOINT_STDERR.txt
          rc=$?
          set -e
          cat OBS_TOOL_CHECKPOINT_STDOUT.json
          cat OBS_TOOL_CHECKPOINT_STDERR.txt >&2 || true
          test "$rc" -eq 75

      - name: Execute frozen mission with external-tool relay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,multiprocessing,os,pathlib,subprocess,sys,time,traceback
          agent='SUPERWORKER-OBSOLESCENCE-1'
          task_id='SI-OBSOLESCENCE-TOOL-DISCOVERY-GRAPH-001'
          task='canonical/same_identity_worker/tasks/SI_OBSOLESCENCE_TOOL_DISCOVERY_GRAPH_001.json'
          bridge=pathlib.Path('canonical/same_identity_worker/external_tool_bridge')/task_id
          bridge.mkdir(parents=True,exist_ok=True)
          relay_log=pathlib.Path('OBS_TOOL_RELAY.jsonl')

          def relay_loop():
              from canonical.runtime import external_tool_relay as relay
              try:
                  while True:
                      written=relay.service_pending(bridge,agent,task_id)
                      if written:
                          with relay_log.open('a',encoding='utf-8') as fh:
                              fh.write(json.dumps({'epoch':time.time(),'responses':written,'serviced':len(written)},sort_keys=True)+'\n')
                      time.sleep(0.02)
              except BaseException as exc:
                  with relay_log.open('a',encoding='utf-8') as fh:
                      fh.write(json.dumps({'epoch':time.time(),'fatal':type(exc).__name__+':'+str(exc),'traceback':traceback.format_exc()[-6000:]},sort_keys=True)+'\n')
                  raise

          relay=multiprocessing.Process(target=relay_loop,daemon=True)
          relay.start()
          env=os.environ.copy()
          env['PROJECT_BRAIN_EXTERNAL_TOOL_WAIT_SECONDS']='90'
          t0=time.monotonic()
          try:
              worker=subprocess.Popen(
                  [sys.executable,'canonical/runtime/same_identity_supervisor.py',
                   '--agent-id',agent,'--task',task],
                  text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env
              )
              deadline=time.monotonic()+900
              while worker.poll() is None:
                  if not relay.is_alive() or time.monotonic()>=deadline:
                      worker.terminate(); break
                  time.sleep(0.1)
              try:
                  stdout,stderr=worker.communicate(timeout=10)
              except subprocess.TimeoutExpired:
                  worker.kill(); stdout,stderr=worker.communicate()
          finally:
              if relay.is_alive(): relay.terminate()
              relay.join(timeout=5)
          elapsed=time.monotonic()-t0
          pathlib.Path('OBS_TOOL_RUNTIME_STDOUT.txt').write_text(stdout,encoding='utf-8')
          pathlib.Path('OBS_TOOL_RUNTIME_STDERR.txt').write_text(stderr,encoding='utf-8')
          pathlib.Path('OBS_TOOL_RUNTIME_RC.txt').write_text(str(worker.returncode)+'\n',encoding='utf-8')
          pathlib.Path('OBS_TOOL_RUNTIME_WALL_S.txt').write_text(f'{elapsed:.6f}\n',encoding='utf-8')
          print(stdout)
          if stderr: print(stderr,file=sys.stderr)
          print(json.dumps({'runtime_returncode':worker.returncode,'wall_s':elapsed},sort_keys=True))
          PY

      - name: Classify observed outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          out=pathlib.Path('OBS_TOOL_RUNTIME_STDOUT.txt').read_text(errors='replace') if pathlib.Path('OBS_TOOL_RUNTIME_STDOUT.txt').exists() else ''
          err=pathlib.Path('OBS_TOOL_RUNTIME_STDERR.txt').read_text(errors='replace') if pathlib.Path('OBS_TOOL_RUNTIME_STDERR.txt').exists() else ''
          rc=int(pathlib.Path('OBS_TOOL_RUNTIME_RC.txt').read_text().strip()) if pathlib.Path('OBS_TOOL_RUNTIME_RC.txt').exists() else -999
          state_path=pathlib.Path('canonical/same_identity_worker/state/SI-OBSOLESCENCE-TOOL-DISCOVERY-GRAPH-001.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else None
          evidence_text='\n'.join([out,err])
          markers=re.findall(r'(?:Blocker|Failure|Error|FAILED|UNSUPPORTED|UNRESOLVED|REQUIRED|PENDING)[^\n]{0,1000}',evidence_text,re.I)
          result={
            'schema':'PROJECT_BRAIN_OBSOLESCENCE_TOOL_DISCOVERY_ATTEMPT_V1',
            'runtime_returncode':rc,
            'terminal_state':state.get('status') if state else None,
            'artifact_exists':pathlib.Path('canonical/astra_runtime/artifacts/OBSOLESCENCE_TOOL_DISCOVERY_GRAPH.svg').is_file(),
            'observed_markers':markers[-20:],
            'promotion_claim':False,
            'obsolescence_claim':False,
            'incremental_spend_usd':0
          }
          pathlib.Path('OBS_TOOL_ATTEMPT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obsolescence-tool-discovery-attempt
          path: |
            OBS_TOOL_CHECKPOINT_STDOUT.json
            OBS_TOOL_CHECKPOINT_STDERR.txt
            OBS_TOOL_RUNTIME_STDOUT.txt
            OBS_TOOL_RUNTIME_STDERR.txt
            OBS_TOOL_RUNTIME_RC.txt
            OBS_TOOL_RUNTIME_WALL_S.txt
            OBS_TOOL_RELAY.jsonl
            OBS_TOOL_ATTEMPT.json
            canonical/same_identity_worker/state/SI-OBSOLESCENCE-TOOL-DISCOVERY-GRAPH-001.json
            canonical/astra_runtime/evidence
            canonical/astra_runtime/artifacts/OBSOLESCENCE_TOOL_DISCOVERY_GRAPH.svg
          if-no-files-found: warn
