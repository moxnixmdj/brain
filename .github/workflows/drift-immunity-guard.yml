name: Drift Immunity Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - governance/drift-immunity-v1-20260928
      - main
    paths:
      - 'canonical/governance/OBS_DEPENDENCY_FRESHNESS_V1.json'
      - 'canonical/runtime/continuous_obs_runtime.py'
      - 'canonical/runtime/test_continuous_obs_runtime.py'
      - 'canonical/runtime/astra_runtime.py'
      - 'canonical/runtime/same_identity_supervisor.py'
      - 'canonical/tests/test_executor_broker.py'
      - 'canonical/runtime/EXECUTOR_POLICY_V1.json'
      - 'canonical/runtime/executor_broker.py'
      - '.github/workflows/superworker-signed-command-relay.yml'
      - '.github/workflows/drift-immunity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  continuous-obs-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Compile OBS-enforced runtime choke points
        run: |
          python3 -m py_compile \
            canonical/runtime/continuous_obs_runtime.py \
            canonical/runtime/astra_runtime.py \
            canonical/runtime/same_identity_supervisor.py \
            canonical/runtime/executor_broker.py
      - name: Verify continuous OBS fail-closed behavior
        run: |
          python3 -m unittest -v canonical.runtime.test_continuous_obs_runtime
          python3 -m unittest -v canonical.tests.test_executor_broker

  guard:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve trusted validator
        run: cp canonical/runtime/enforce_goal_hierarchy.py /tmp/trusted_drift_guard.py
      - name: Resolve comparison
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=pr-head" >> "$GITHUB_OUTPUT"
            git checkout --detach pr-head
          else
            git fetch origin main
            BASE="$(git merge-base origin/main HEAD)"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce terminal-goal hierarchy and blocker lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          python /tmp/trusted_drift_guard.py --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}"
