name: Drift Immunity Guard
# AUTO_MAIN_PUSH_QUARANTINED_2026-10-02: private Brain Actions jobs are failing before runner assignment; PR/manual verification remains available.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: drift-immunity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  continuous-obs-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Compile OBS-enforced runtime choke points
        run: |
          python3 -m py_compile \
            canonical/runtime/continuous_obs_runtime.py \
            canonical/runtime/astra_runtime.py \
            canonical/runtime/same_identity_supervisor.py \
            canonical/runtime/executor_broker.py \
            canonical/runtime/current_state_obs_reducer.py
      - name: Verify continuous OBS fail-closed behavior
        run: |
          python3 -m unittest -v canonical.runtime.test_continuous_obs_runtime
          python3 -m unittest -v canonical.tests.test_executor_broker
          python3 canonical/runtime/current_state_obs_reducer.py

  guard:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve trusted validator
        run: |
          set -euo pipefail
          # The validator resolves its repo root as Path(__file__).parents[2],
          # so the trusted copy must sit exactly two directories below the
          # workspace root (a flat /tmp copy crashes with IndexError and has
          # silently failed every guard job since this pattern was introduced).
          mkdir -p "$GITHUB_WORKSPACE/.guard_trusted/runtime"
          cp canonical/runtime/enforce_goal_hierarchy.py "$GITHUB_WORKSPACE/.guard_trusted/runtime/enforce_goal_hierarchy.py"
          cp execution_guard/v22_prewrite_admission.py "$GITHUB_WORKSPACE/.guard_trusted/trusted_v22_prewrite_admission.py"
      - name: Resolve comparison
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=pr-head" >> "$GITHUB_OUTPUT"
            git checkout --detach pr-head
          else
            git fetch origin main
            BASE="$(git merge-base origin/main HEAD)"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce terminal-goal hierarchy and blocker lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/.guard_trusted" python "$GITHUB_WORKSPACE/.guard_trusted/runtime/enforce_goal_hierarchy.py" --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}"
