name: Verify ownership promotion independently
on:
  push:
    branches: [verify-ownership-hosted-20261003-sol]
permissions:
  contents: read
jobs:
  verify-independent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute independent implementation
        run: python canonical/runtime/ownership_promotion_independent_verifier_v1.py > ownership_verdict.json
      - name: Show verdict
        run: cat ownership_verdict.json
      - uses: actions/upload-artifact@v4
        with:
          name: ownership-promotion-independent-verdict
          path: ownership_verdict.json
          if-no-files-found: error
