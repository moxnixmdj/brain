name: Verify Root3 seven-class one-substrate policy V1

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/ROOT3_SEVEN_CLASS_ONE_SUBSTRATE_POLICY_20261005_V1.json
      - canonical/governance/ROOT3_SUBPROCESS_EFFECT_CLASS_REGISTRY_20261005_V1.json
      - canonical/runtime/root3_seven_class_one_substrate_policy_v1.py
      - canonical/tests/test_root3_seven_class_one_substrate_policy_v1.py
      - .github/workflows/verify-root3-seven-class-one-substrate-policy-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile reducer
        run: python -m py_compile canonical/runtime/root3_seven_class_one_substrate_policy_v1.py
      - name: Run reducer tests
        run: python -m unittest -v canonical.tests.test_root3_seven_class_one_substrate_policy_v1
      - name: Run exact repository audit
        run: python canonical/runtime/root3_seven_class_one_substrate_policy_v1.py
