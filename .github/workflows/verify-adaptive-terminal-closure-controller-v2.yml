name: Verify adaptive terminal closure controller v2

on:
  pull_request:
    paths:
      - "canonical/runtime/adaptive_terminal_closure_controller_v2.py"
      - "canonical/tests/test_adaptive_terminal_closure_controller_v2.py"
      - "canonical/governance/ADAPTIVE_TERMINAL_CLOSURE_ACTIVATION_V2.json"
      - ".github/workflows/verify-adaptive-terminal-closure-controller-v2.yml"
  push:
    paths:
      - "canonical/runtime/adaptive_terminal_closure_controller_v2.py"
      - "canonical/tests/test_adaptive_terminal_closure_controller_v2.py"
      - "canonical/governance/ADAPTIVE_TERMINAL_CLOSURE_ACTIVATION_V2.json"
      - ".github/workflows/verify-adaptive-terminal-closure-controller-v2.yml"
  workflow_dispatch:

permissions:
  contents: read


jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python - <<'PY'
          from canonical.runtime import adaptive_terminal_closure_controller_v2 as v
          for p,h in v.PINNED.items(): assert v._blob(p)==h,(p,v._blob(p),h)
          PY

  v13:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python - <<'PY'
          from canonical.runtime import adaptive_terminal_closure_controller_v2 as v
          s=v._load(v.PATHS["scheduling"])
          assert str(s.get("status","")).startswith("ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS__V13_CURRENT"),s
          assert s.get("fresh_reality_authority") is False,s
          r=s.get("mandatory_tool_discovery_retrieval") or {}
          assert r.get("authority")=="V5_OVER_V4_OVER_V3_OVER_VERIFIED_V2_BASE",r
          assert r.get("gate_git_blob_sha")=="c3324e574c1fafb6aaab443f49b7a9600966e754",r
          for k in ("direct_bypass_allowed","failed_or_partial_source_cell_consumes_epoch","consumed_source_epoch_replay_allowed","no_result_means_nonexistence"):
              assert r.get(k) is False,(k,r)
          PY

  post-dual:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python - <<'PY'
          from canonical.runtime import adaptive_terminal_closure_controller_v2 as v
          p=v._load(v.PATHS["post_dual"]); pv=v._load(v.PATHS["post_dual_v"])
          x=pv["verified"]; e=p["expected"]
          assert str(pv["status"]).startswith("INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert (x["current_zero_reality_requirements"],x["current_nondominated_zero_reality_certificates"],x["primitive_zero_reality_work_units"],x["matched_priority_child_facts"])==(17,14,31,16),x
          assert (e["current_zero_reality_requirements"],e["current_nondominated_zero_reality_certificates"],e["primitive_zero_reality_work_units"],e["matched_priority_child_facts"])==(17,14,31,16),e
          assert x["current_global_fresh_reality_authority"] is False
          PY

  dual-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python - <<'PY'
          from canonical.runtime import adaptive_terminal_closure_controller_v2 as v
          d=v._load(v.PATHS["dual_source_v"]); x=d["verified"]
          assert str(d["status"]).startswith("INDEPENDENT_PUBLIC_RUNNER_PASS")
          assert set(x["discharged_requirements"])==v.DISCHARGED,x
          assert x["direct_oracle_leaves_executed"] is False,x
          assert x["global_fresh_reality_authority"] is False,x
          PY

  inner-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python - <<'PY'
          import copy
          from canonical.runtime import adaptive_terminal_closure_controller_v2 as v
          s=v._load(v.PATHS["scheduling"]); r=s["mandatory_tool_discovery_retrieval"]
          c=copy.deepcopy(s)
          c["status"]="ACTIVE_INDEPENDENT_PUBLIC_RUNNER_PASS__V10_CURRENT__V2_COMPATIBILITY_VIEW"
          c["mandatory_tool_discovery_retrieval"]={
            "mandatory":True,
            "v3_activation_git_blob_sha":r.get("v5_activation_git_blob_sha"),
            "pre_v3_epoch_exhaustion_allowed":False,
            "consumed_source_epoch_replay_allowed":False,
          }
          out=v.v1.evaluate(v._load(v.PATHS["registry"]),v._load(v.PATHS["evidence"]),v._load(v.PATHS["frontier"]),v._load(v.PATHS["dominance"]),v._load(v.PATHS["dominance_v"]),v._load(v.PATHS["matched"]),v._load(v.PATHS["matched_v"]),v._load(v.PATHS["ownership"]),v._load(v.PATHS["authority"]),c)
          assert out.get("pass") is True,out
          assert len(out.get("acceptance_work_units") or [])==33,out
          PY

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [pins, v13, post-dual, dual-source, inner-v1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest canonical.tests.test_adaptive_terminal_closure_controller_v2 -v
      - run: python canonical/runtime/adaptive_terminal_closure_controller_v2.py > result.json
      - run: |
          python - <<'PY'
          import json
          x=json.load(open("result.json"))
          assert x["pass"] is True,x
          assert len(x["acceptance_work_units"])==31,x
          assert x["action_refinement"]["primitive_acceptance_work_units"]==31,x
          assert x["fresh_reality_authority"] is False,x
          PY
