name: Qualify Brain mini-SWE Superpowers composed package
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - canonical/capabilities/internalized/software_engineering/mini_swe_superpowers_v1/**
      - canonical/action_intents/2026-09-30_COMPOSE_MINI_SWE_SUPERPOWERS_V1.json
      - canonical/reasoning/2026-09-30_COMPOSE_MINI_SWE_SUPERPOWERS_V1.json
      - .github/workflows/qualify-mini-swe-superpowers-package.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact component pins and deterministic overlay
        run: |
          set +e
          python canonical/capabilities/internalized/software_engineering/mini_swe_superpowers_v1/verify_package.py > qualification.log 2>&1
          rc=$?
          cat qualification.log
          printf '%s\n' "$rc" > qualification.exit_code
          exit "$rc"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-swe-superpowers-qualification
          path: |
            qualification.log
            qualification.exit_code
          if-no-files-found: error
