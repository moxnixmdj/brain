name: Verify witness target binding totalizer

on:
  push:
    paths:
      - "canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V1.json"
      - "canonical/governance/OPUS55_BRAIN_WITNESS_NORMALIZATION_V1.json"
      - "canonical/runtime/witness_target_binding_totalizer_v1.py"
      - "canonical/tests/test_witness_target_binding_totalizer_v1.py"
      - ".github/workflows/verify-witness-target-binding-totalizer.yml"
  pull_request:
    paths:
      - "canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_PROVENANCE_V1.json"
      - "canonical/governance/OPUS55_BRAIN_WITNESS_NORMALIZATION_V1.json"
      - "canonical/runtime/witness_target_binding_totalizer_v1.py"
      - "canonical/tests/test_witness_target_binding_totalizer_v1.py"
      - ".github/workflows/verify-witness-target-binding-totalizer.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run totalization tests
        run: python -m unittest canonical.tests.test_witness_target_binding_totalizer_v1 -v
      - name: Compile live binding surface
        run: python canonical/runtime/witness_target_binding_totalizer_v1.py
