name: Guarded HTTP2 Parent Task A Once

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  execute-once:
    if: github.head_ref == 'execute/guarded-http2-parent-a-physical-20260930-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Brain carrier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout proven execution guard bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: moxnixmdj/verification-capsule-runner
          ref: b1d5ada6b827098e24d795c41c02545c12fd8fc1
          path: _guard_src
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Atomically admit once, then execute frozen parent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python _guard_src/execution_guard/github_actions_guarded_run_live.py
          --plan guarded_http2_parent_a_plan.json
          --workspace .
          --receipt guarded-http2-parent-a-admission.json

      - name: Preserve guarded terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-http2-parent-a-terminal
          path: |
            guarded-http2-parent-a-admission.json
            guarded_http2_parent_a_plan.json
            _terminal/
          if-no-files-found: warn
