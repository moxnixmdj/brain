name: Verify Root3 direct urllib network mediator V1

on:
  push:
    branches:
      - main
    paths:
      - "canonical/runtime/astra_runtime.py"
      - "canonical/tests/test_external_tool_bridge.py"
      - ".github/workflows/verify-root3-direct-urllib-network-mediator-v1.yml"

permissions:
  contents: write

# Landing on main goes through the front door (pull request + signed referee check);
# .github/scripts/land_on_main.sh needs the Brain Automation app to open that pull request.
env:
  AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
  AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exact mediation tests
        run: |
          set -euo pipefail
          python -m unittest canonical.tests.test_external_tool_bridge -v

      - name: Emit content-addressed zero-credit verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, os, pathlib
          def blob(path):
              return subprocess.check_output(["git","rev-parse","HEAD:"+path], text=True).strip()
          payload={
            "schema":"PROJECT_BRAIN_ROOT3_DIRECT_URLOPEN_NETWORK_MEDIATOR_PUBLIC_RUNNER_VERIFICATION_V1",
            "date":"2026-10-06",
            "status":"PUBLIC_RUNNER_PASS__DIRECT_URLOPEN_FALLBACK_MEDIATED_AND_RECEIPTED__ZERO_TERMINAL_CREDIT",
            "subject":{
              "commit":os.environ["GITHUB_SHA"],
              "astra_runtime":{"path":"canonical/runtime/astra_runtime.py","git_blob_sha":blob("canonical/runtime/astra_runtime.py")},
              "tests":{"path":"canonical/tests/test_external_tool_bridge.py","git_blob_sha":blob("canonical/tests/test_external_tool_bridge.py")}
            },
            "verified":[
              "DIRECT_URLOPEN_FALLBACK_REQUIRES_BOUND_CONTINUOUS_OBS_MISSION_CONTEXT",
              "DIRECT_URLOPEN_FALLBACK_ACCEPTS_ONLY_HTTP_OR_HTTPS_URLS",
              "DIRECT_URLOPEN_FALLBACK_EMITS_ATTEMPT_AND_OPENED_EFFECT_RECEIPTS",
              "RAW_ORIGINAL_URLOPEN_IS_NOT_CALLED_FOR_UNBOUND_CONTEXT_OR_NON_HTTP_S_URLS",
              "TASK_SCOPED_EXTERNAL_TOOL_BRIDGE_REMAINS_PREFERRED_WHEN_CONFIGURED"
            ],
            "hard_nonclaims":[
              "NO_CLAIM_DIRECT_SOCKET_APIS_ARE_MEDIATED",
              "NO_CLAIM_CHILD_PROCESS_NETWORK_EFFECTS_ARE_MEDIATED",
              "NO_CLAIM_EXTERNAL_TOOL_RESPONSE_SEMANTICS_ARE_TOTAL",
              "NO_ROOT3_EFFECT_TOTALITY_CLOSURE",
              "NO_TERMINAL_ACCEPTANCE_CAPABILITY_OR_OWNERSHIP_CREDIT"
            ],
            "accounting":{"incremental_spend_usd":0,"terminal_credit_delta":0}
          }
          p=pathlib.Path("canonical/verification/ROOT3_DIRECT_URLOPEN_NETWORK_MEDIATOR_PUBLIC_RUNNER_VERIFICATION_20261006_V1.json")
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

      - name: Persist verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "project-brain-ci"
          git config user.email "project-brain-ci@users.noreply.github.com"
          git add canonical/verification/ROOT3_DIRECT_URLOPEN_NETWORK_MEDIATOR_PUBLIC_RUNNER_VERIFICATION_20261006_V1.json
          git commit -m "Verify Root3 direct urllib network mediation"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if bash .github/scripts/land_on_main.sh; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 52
