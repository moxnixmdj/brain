name: Verify SA-CCR active-contract preflight
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/saccr_active_contract_proof_v1.py
      - canonical/runtime/saccr_active_contract_candidate_v1.py
      - canonical/runtime/saccr_credit_kernel.py
      - canonical/tests/test_saccr_active_contract_proof_v1.py
      - .github/workflows/verify-saccr-active-contract-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest -v canonical.tests.test_saccr_active_contract_proof_v1
