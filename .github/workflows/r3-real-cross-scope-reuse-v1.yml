name: verify-r3-real-cross-scope-reuse-v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/tests/test_r3_real_cross_scope_reuse_v1.py
      - .github/workflows/r3-real-cross-scope-reuse-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest canonical.tests.test_r3_real_cross_scope_reuse_v1 -v
