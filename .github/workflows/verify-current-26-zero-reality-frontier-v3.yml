name: Verify current 26 zero reality frontier v3
on:
  push:
    branches: ["brain/current-frontier-v3-benchmark-gate-20261003-sol"]
    paths:
      - "canonical/governance/CURRENT_26_ZERO_REALITY_FRONTIER_V3.json"
      - "canonical/runtime/current_26_zero_reality_frontier_v3.py"
      - "canonical/tests/test_current_26_zero_reality_frontier_v3.py"
      - "canonical/governance/CURRENT_26_ZERO_REALITY_FRONTIER_V2.json"
      - "canonical/governance/EXTERNAL_BENCHMARK_DOMINANCE_GATE_V1.json"
      - "canonical/verification/EXTERNAL_BENCHMARK_DOMINANCE_V1_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
      - "canonical/governance/LIVEBENCH_IF_COMPARATOR_ROUTE_RECONCILIATION_V2.json"
      - ".github/workflows/verify-current-26-zero-reality-frontier-v3.yml"
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/CURRENT_26_ZERO_REALITY_FRONTIER_V3.json"
      - "canonical/runtime/current_26_zero_reality_frontier_v3.py"
      - "canonical/tests/test_current_26_zero_reality_frontier_v3.py"
      - "canonical/governance/CURRENT_26_ZERO_REALITY_FRONTIER_V2.json"
      - "canonical/governance/EXTERNAL_BENCHMARK_DOMINANCE_GATE_V1.json"
      - "canonical/verification/EXTERNAL_BENCHMARK_DOMINANCE_V1_PUBLIC_RUNNER_VERIFICATION_20261003_V1.json"
      - "canonical/governance/LIVEBENCH_IF_COMPARATOR_ROUTE_RECONCILIATION_V2.json"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pytest -q canonical/tests/test_current_26_zero_reality_frontier_v3.py
      - run: python canonical/runtime/current_26_zero_reality_frontier_v3.py
