name: Build H100 UniChart real packed subject V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/h100_unichart_real_pack_v1.py'
      - 'canonical/tests/test_h100_unichart_real_pack_v1.py'
      - 'canonical/governance/H100_UNICHART_REAL_PACK_CANDIDATE_V1.json'
      - '.github/workflows/build-h100-unichart-real-pack-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3
      - name: Run packer unit tests
        run: python -m unittest canonical.tests.test_h100_unichart_real_pack_v1 -v
      - name: Download and verify exact UniChart safetensors
        shell: bash
        run: |
          set -euo pipefail
          URL='https://huggingface.co/ahmed-masry/unichart-base-960/resolve/baa206a05372f8c49778313abb7091e1d0c8e474/model.safetensors?download=true'
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 900 "$URL" -o /tmp/model.safetensors
          test "$(stat -c%s /tmp/model.safetensors)" -eq 809095376
          echo '2faf9ef1ac62a290ea58c80e9e2454db4e3613579e7cb6167cb934a03c09664e  /tmp/model.safetensors' | sha256sum -c -
      - name: Download exact ancillary bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unichart_ancillary
          REV='baa206a05372f8c49778313abb7091e1d0c8e474'
          BASE="https://huggingface.co/ahmed-masry/unichart-base-960/resolve/$REV"
          for F in .gitattributes README.md added_tokens.json config.json generation_config.json preprocessor_config.json sentencepiece.bpe.model special_tokens_map.json tokenizer.json tokenizer_config.json; do
            curl -fL --retry 3 --connect-timeout 30 --max-time 180 "$BASE/$F?download=true" -o "/tmp/unichart_ancillary/$F"
          done
          python - <<'PY'
          from pathlib import Path
          expected={
            ".gitattributes":1477,"README.md":4909,"added_tokens.json":235,"config.json":4941,
            "generation_config.json":186,"preprocessor_config.json":420,
            "sentencepiece.bpe.model":1296245,"special_tokens_map.json":355,
            "tokenizer.json":4008718,"tokenizer_config.json":510,
          }
          root=Path('/tmp/unichart_ancillary')
          observed={p.name:p.stat().st_size for p in root.iterdir() if p.is_file()}
          assert observed==expected,(observed,expected)
          print('ANCILLARY_BUNDLE_PASS',sum(observed.values()))
          PY
      - name: Build actual sub-100MB package
        run: |
          python canonical/runtime/h100_unichart_real_pack_v1.py             --source /tmp/model.safetensors             --ancillary-dir /tmp/unichart_ancillary             --output-dir /tmp/unichart_h100_pack_v1             > h100_unichart_real_pack_receipt.json
          cat h100_unichart_real_pack_receipt.json
      - name: Assert real-byte H100 storage gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('h100_unichart_real_pack_receipt.json'))
          assert d['status']=='PASS__REAL_PACKED_SUBJECT_UNDER_100MB__CAPABILITY_PRESERVATION_UNPROVED',d
          assert d['package_bytes']<=100_000_000,d
          assert d['margin_bytes']>0,d
          assert d['source_f32_elements']==201_858_168,d
          assert d['source_i64_elements']==200_000,d
          assert d['h100_credit_delta']==0,d
          print(json.dumps({
            'package_bytes':d['package_bytes'],'margin_bytes':d['margin_bytes'],
            'weights_sha256':d['weights_sha256'],'manifest_sha256':d['manifest_sha256'],
            'quantization_rmse':d['quantization_rmse'],
            'quantization_global_max_abs_error':d['quantization_global_max_abs_error'],
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h100-unichart-real-packed-subject-v1
          path: |
            /tmp/unichart_h100_pack_v1
            h100_unichart_real_pack_receipt.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
