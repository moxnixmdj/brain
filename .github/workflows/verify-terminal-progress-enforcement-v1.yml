name: Verify terminal progress enforcement V1\n\non:\n  pull_request_target:\n    types: [opened, synchronize, reopened, ready_for_review]\n    paths:\n      - "canonical/action_intents/**"\n      - "canonical/governance/**"\n      - "canonical/runtime/**"\n      - "execution_guard/**"\n      - ".github/workflows/**"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - name: Checkout trusted base\n        uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - name: Preserve trusted terminal progress validators\n        run: |\n          cp canonical/runtime/terminal_progress_delta_gate_v1.py /tmp/trusted_terminal_progress_delta_gate.py\n          cp execution_guard/terminal_progress_enforcement.py /tmp/trusted_terminal_progress_enforcement.py\n          cp execution_guard/enforce_terminal_progress_pr_v1.py /tmp/trusted_terminal_progress_pr.py\n      - name: Resolve and checkout PR\n        id: refs\n        shell: bash\n        run: |\n          set -euo pipefail\n          git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"\n          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"\n          echo "head=pr-head" >> "$GITHUB_OUTPUT"\n          git checkout --detach pr-head\n      - name: Enforce canonical terminal progress classification\n        run: |\n          PYTHONPATH=/tmp python /tmp/trusted_terminal_progress_pr.py --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}"\n