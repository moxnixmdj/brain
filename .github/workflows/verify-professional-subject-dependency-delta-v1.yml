name: verify-professional-subject-dependency-delta-v1

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/professional_quality_subject_dependency_delta_v1.py
      - canonical/tests/test_professional_quality_subject_dependency_delta_v1.py
      - canonical/action_intents/PROFESSIONAL_QUALITY_SUBJECT_DEPENDENCY_DELTA_INTENT_20261010_V1.json
      - canonical/runtime/professional_quality_p1_router_v6.py
      - canonical/runtime/goal_to_decision_binding_authority_v1.py
      - canonical/runtime/professional_quality_p1_router_v4.py
      - canonical/runtime/professional_quality_p1_router_v3.py
      - canonical/runtime/professional_quality_p1_router_v2.py
      - canonical/runtime/professional_quality_leaf_binder_v2.py
      - canonical/runtime/professional_quality_same_subject_composition_gate_v1.py
      - canonical/runtime/python_transitive_runtime_closure_v1.py
      - canonical/governance/PROFESSIONAL_QUALITY_P1_V5_DECLARED_SYSTEM_SUBJECT_20261010_V4.json
      - canonical/governance/PROFESSIONAL_QUALITY_SUBJECT_DEPENDENCY_CLOSURE_WORKLIST_20261010_V1.json
      - .github/workflows/verify-professional-subject-dependency-delta-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest canonical.tests.test_professional_quality_subject_dependency_delta_v1 -v
