name: Verify LiveBench root-state transport
on:
  push:
    branches: [main]
    paths:
      - 'VERIFY_LIVEBENCH_ROOT_STATE_TRANSPORT'
      - 'canonical/runtime/verify_livebench_root_state_transport_v1.py'
      - 'canonical/governance/TERMINAL_ROOT_CAUSE_STATE_V1.json'
      - 'canonical/governance/LIVEBENCH_ROOT_PARTITION_PROJECTION_V1.json'
      - 'canonical/governance/LIVEBENCH_LOCAL_ROOT_RECLASSIFICATION_V1.json'
      - '.github/workflows/verify-livebench-root-state-transport-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python canonical/runtime/verify_livebench_root_state_transport_v1.py
