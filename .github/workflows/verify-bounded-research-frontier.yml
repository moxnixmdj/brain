name: Verify bounded research frontier
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/bounded_research_frontier.py
      - canonical/tests/test_bounded_research_frontier.py
      - .github/workflows/verify-bounded-research-frontier.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_bounded_research_frontier
