name: Verify terminal replacement wave guard
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/terminal_replacement_wave.py
      - canonical/tests/test_terminal_replacement_wave_guard.py
      - .github/workflows/verify-terminal-replacement-wave-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_terminal_replacement_wave_guard
