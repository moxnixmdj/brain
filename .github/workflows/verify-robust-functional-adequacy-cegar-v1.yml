name: Verify robust functional adequacy CEGAR v1
on:
  push:
    branches:
      - research/mysterymechanism-functional-cegar-20261008-v1
    paths:
      - canonical/runtime/robust_functional_adequacy_cegar_v1.py
      - canonical/tests/test_robust_functional_adequacy_cegar_v1.py
      - canonical/governance/MYSTERYMECHANISM_ROBUST_FUNCTIONAL_ADEQUACY_CEGAR_20261008_V1.json
      - .github/workflows/verify-robust-functional-adequacy-cegar-v1.yml
  pull_request:
    paths:
      - canonical/runtime/robust_functional_adequacy_cegar_v1.py
      - canonical/tests/test_robust_functional_adequacy_cegar_v1.py
      - canonical/governance/MYSTERYMECHANISM_ROBUST_FUNCTIONAL_ADEQUACY_CEGAR_20261008_V1.json
      - .github/workflows/verify-robust-functional-adequacy-cegar-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest -v canonical.tests.test_robust_functional_adequacy_cegar_v1 > /tmp/robust-functional-cegar-tests.txt 2>&1
          code=$?
          cat /tmp/robust-functional-cegar-tests.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload verifier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robust-functional-cegar-verifier-output
          path: /tmp/robust-functional-cegar-tests.txt
