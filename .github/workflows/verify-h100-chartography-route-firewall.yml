name: Verify H100 Chartography route firewall

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/H100_CHARTOGRAPHY_ROUTE_FIREWALL_V1.json'
      - 'canonical/tests/test_h100_chartography_route_firewall_v1.py'
      - '.github/workflows/verify-h100-chartography-route-firewall.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pytest canonical/tests/test_h100_chartography_route_firewall_v1.py -q
