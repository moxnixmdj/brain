name: Verify structured method multiplex binding v2
on:
  push:
    branches: [main]
    paths:
      - canonical/governance/STRUCTURED_METHOD_PORTFOLIO_MULTIPLEX_TERMINAL_BINDING_V1.json
      - canonical/runtime/verify_structured_method_multiplex_binding_v1.py
      - canonical/tests/test_structured_method_multiplex_binding_v1.py
      - .github/workflows/verify-structured-method-multiplex-binding-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evaluate live binding directly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.verify_structured_method_multiplex_binding_v1 import evaluate
          out=evaluate(Path("."))
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["pass"], out
          PY
      - name: Run mutation regressions
        run: python -m unittest -v canonical.tests.test_structured_method_multiplex_binding_v1
