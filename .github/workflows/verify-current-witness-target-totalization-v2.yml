name: Verify current witness-target totalization V2

on:
  pull_request:
    paths:
      - "canonical/runtime/current_witness_target_totalization_v2.py"
      - "canonical/tests/test_current_witness_target_totalization_v2.py"
      - "canonical/governance/CURRENT_WITNESS_TARGET_TOTALIZATION_V2_CANDIDATE.json"
      - ".github/workflows/verify-current-witness-target-totalization-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run fail-closed tests
        run: python -m pytest -q canonical/tests/test_current_witness_target_totalization_v2.py
      - name: Execute current totalization
        run: |
          python canonical/runtime/current_witness_target_totalization_v2.py > /tmp/current_witness_target_totalization_v2.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/current_witness_target_totalization_v2.json"))
          assert p["pass"] is True, p
          assert p["target_count"] == 8, p
          assert p["witness_count"] == 12, p
          assert p["pair_count"] == 96, p
          assert p["target_atom_occurrence_count"] == 37, p
          assert p["target_metric_occurrence_count"] == 7, p
          assert p["positive_atom_binding_count"] == 0, p
          assert p["positive_metric_binding_count"] == 0, p
          assert p["positive_semantic_edge_count"] == 0, p
          assert p["closed_target_count"] == 0, p
          assert p["residual_target_count"] == 8, p
          print(json.dumps({
            "status": p["status"],
            "target_count": p["target_count"],
            "witness_count": p["witness_count"],
            "pair_count": p["pair_count"],
            "closed_target_count": p["closed_target_count"],
            "residual_target_count": p["residual_target_count"],
          }, indent=2, sort_keys=True))
          PY
