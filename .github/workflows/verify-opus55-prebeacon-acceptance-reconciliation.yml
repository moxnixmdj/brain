name: Verify prebeacon Opus acceptance authority reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/opus55_prebeacon_acceptance_authority_reconciliation_v1.py'
      - 'canonical/tests/test_opus55_prebeacon_acceptance_authority_reconciliation_v1.py'
      - '.github/workflows/verify-opus55-prebeacon-acceptance-reconciliation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed tests
        run: python -m pytest -q canonical/tests/test_opus55_prebeacon_acceptance_authority_reconciliation_v1.py
      - name: Compute live reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.opus55_prebeacon_acceptance_authority_reconciliation_v1 import evaluate
          paths=[
            "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json",
            "canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json",
            "canonical/governance/TERMINAL_FAMILY_ADJUDICATION_POLICY_V1.json",
            "canonical/verification/TERMINAL_FAMILY_ADJUDICATION_V1_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json",
            "canonical/governance/GLOBAL_TERMINAL_SURFACE_DOMINANCE_INPUT_V6.json",
            "canonical/verification/GLOBAL_TERMINAL_SURFACE_DOMINANCE_V6_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json",
            "canonical/verification/TERMINAL_V3_POSTWAVE_CONTRACT_AND_FAMILY_REDUCTION_20261002_V1.json",
            "canonical/verification/GLOBAL_OWNERSHIP_POSTCONDITIONS_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json",
          ]
          d=[json.loads(Path(p).read_text()) for p in paths]
          out=evaluate(*d)
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out["pass"] is True,out
          assert out["effective_acceptance_closed_count"]==19,out
          assert out["effective_acceptance_open_count"]==0,out
          assert out["score_inheritance"] is False,out
          assert out["terminal_replay_required"] is False,out
          PY
