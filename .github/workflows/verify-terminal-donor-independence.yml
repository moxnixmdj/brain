name: Verify terminal donor independence

on:
  push:
    paths:
      - "canonical/runtime/terminal_candidate_donor_independence_audit_v1.py"
      - ".github/workflows/verify-terminal-donor-independence.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve exact current audit and checkout frozen terminal snapshot
        run: |
          set -euo pipefail
          cp canonical/runtime/terminal_candidate_donor_independence_audit_v1.py /tmp/terminal_candidate_donor_independence_audit_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/terminal_candidate_donor_independence_audit_v1.py')
          b=p.read_bytes()
          got=hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()
          assert got=='0ed69641693538f15b7e1658f5ac5e80031afb26',got
          PY
          git checkout --detach 821712c059b139f3494723dca6e8d0fc82ee59a4
          test "$(git rev-parse HEAD)" = "821712c059b139f3494723dca6e8d0fc82ee59a4"
      - name: Run fail-closed donor-independence audit on frozen V3 candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('/tmp/terminal_candidate_donor_independence_audit_v1.py')
          spec=importlib.util.spec_from_file_location('donor_audit',p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          out=mod.evaluate(Path('.').resolve())
          assert out['pass'] is True,out
          assert out['target_capability_donor_runtime_dependencies']==[],out
          assert out['network_provider_dependencies']==[],out
          assert out['undeclared_dependency_count']==0,out
          assert out['repository_owned_dependency_file_count']==22,out
          print('TERMINAL_V3_STATIC_DONOR_INDEPENDENCE_PASS')
          PY
