name: verify-terminal-minimum-causal-depth-v2

on:
  pull_request:
    paths:
      - 'canonical/governance/TERMINAL_MINIMUM_CAUSAL_DEPTH_PLAN_V2.json'
      - 'canonical/governance/TERMINAL_MINIMUM_CAUSAL_DEPTH_V2_CANDIDATE.json'
      - 'canonical/governance/ROOT2_BLIND_THRESHOLD_RECEIPT_ACTIVATION_V1.json'
      - 'canonical/governance/TERMINAL_MINIMUM_CAUSAL_DEPTH_ACTIVATION_V1.json'
      - 'canonical/governance/ARENA_COMPARATOR_PUBLIC_SEMANTICS_RECONCILIATION_V1.json'
      - 'canonical/runtime/terminal_minimum_causal_depth_guard_v2.py'
      - 'canonical/tests/test_terminal_minimum_causal_depth_guard_v2.py'
      - '.github/workflows/verify-terminal-minimum-causal-depth-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V2 guard and test with persistent failure diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python canonical/runtime/terminal_minimum_causal_depth_guard_v2.py >/tmp/v2-guard.out 2>&1
          GUARD_CODE=$?
          python -c "from canonical.tests.test_terminal_minimum_causal_depth_guard_v2 import test_guard_passes; test_guard_passes()" >/tmp/v2-test.out 2>&1
          TEST_CODE=$?
          {
            echo "# Terminal minimum causal depth V2 diagnostic"
            echo
            echo "- run: ${GITHUB_RUN_ID}"
            echo "- guard_exit: ${GUARD_CODE}"
            echo "- test_exit: ${TEST_CODE}"
            echo
            echo "## guard"
            echo '~~~text'
            cat /tmp/v2-guard.out
            echo '~~~'
            echo
            echo "## test"
            echo '~~~text'
            cat /tmp/v2-test.out
            echo '~~~'
          } >/tmp/v2-diagnostic.md
          cat /tmp/v2-diagnostic.md
          if [ "$GUARD_CODE" -ne 0 ] || [ "$TEST_CODE" -ne 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Terminal minimum causal depth V2 diagnostic ${GITHUB_RUN_ID}" --body-file /tmp/v2-diagnostic.md
            exit 1
          fi
