name: verify-general-adequate-decision-fixed-point-v2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/general_adequate_decision_fixed_point_v2.py
      - canonical/runtime/r2_source_bound_regcap_identity_direct_adequacy_v1.py
      - canonical/runtime/r2_direct_end_to_end_adequacy_v19.py
      - canonical/tests/test_r2_source_bound_regcap_identity_direct_adequacy_v1.py
      - canonical/runtime/r2_direct_end_to_end_adequacy_v1.py
      - canonical/runtime/r2_direct_end_to_end_adequacy_v2.py
      - canonical/runtime/r2_direct_end_to_end_adequacy_v3.py
      - canonical/runtime/r2_finance_explicit_definition_unless_direct_adequacy_v1.py
      - canonical/runtime/finance_explicit_definition_unless_branch_v1.py
      - canonical/runtime/finance_explicit_definition_unless_verify_v1.py
      - canonical/runtime/explicit_definition_reference_graph.py
      - canonical/runtime/r2_finance_normalized_if_direct_adequacy_v1.py
      - canonical/runtime/finance_normalized_if_branch_v1.py
      - canonical/runtime/finance_normalized_if_verify_v1.py
      - canonical/runtime/r2_docx_direct_adequacy_v1.py
      - canonical/runtime/goal_compiler.py
      - canonical/runtime/raw_goal_exact_literal_acceptance_v1.py
      - canonical/governance/ROOT2_SINGLE_PRIMITIVE_WAKE_CUT_20261008_V4.json
      - canonical/runtime/raw_goal_literal_json_acceptance_v1.py
      - canonical/tests/test_r2_direct_end_to_end_adequacy_v1.py
      - canonical/tests/test_r2_finance_normalized_if_direct_adequacy_v1.py
      - canonical/tests/test_r2_finance_explicit_definition_unless_direct_adequacy_v1.py
      - canonical/tests/test_r2_docx_direct_adequacy_v1.py
      - canonical/tests/test_goal_compiler.py
      - canonical/tests/test_raw_goal_exact_literal_acceptance_v1.py
      - canonical/tests/test_raw_goal_literal_json_acceptance_v1.py
      - canonical/runtime/live_brain_runtime_v1.py
      - canonical/tests/test_general_adequate_decision_fixed_point_v2.py
      - canonical/tests/test_live_brain_runtime_v1.py
      - canonical/runtime/unified_cognitive_fabric_v1.py
      - canonical/tests/test_unified_cognitive_fabric_v1.py
      - canonical/governance/R2_GENERAL_ADEQUATE_DECISION_FIXED_POINT_ACTIVATION_20261008_V2.json
      - .github/workflows/verify-general-adequate-decision-fixed-point-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run R2 V2 falsification suite
        run: |
          set -o pipefail
          python3 -m unittest canonical.tests.test_r2_source_bound_regcap_identity_direct_adequacy_v1 canonical.tests.test_r2_docx_direct_adequacy_v1 canonical.tests.test_r2_direct_end_to_end_adequacy_v1 canonical.tests.test_r2_finance_normalized_if_direct_adequacy_v1 canonical.tests.test_r2_finance_explicit_definition_unless_direct_adequacy_v1 canonical.tests.test_general_adequate_decision_fixed_point_v2 canonical.tests.test_live_brain_runtime_v1 canonical.tests.test_unified_cognitive_fabric_v1 -v 2>&1 | tee r2-v2-test-output.txt
      - name: Publish verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-general-adequate-decision-fixed-point-v2-test-output
          path: r2-v2-test-output.txt
          if-no-files-found: warn
