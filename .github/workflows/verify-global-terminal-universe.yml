name: Verify global terminal universe
# AUTO_MAIN_PUSH_QUARANTINED_2026-10-02: private Brain Actions jobs are failing before runner assignment; PR/manual verification remains available.

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/global_terminal_universe.py"
      - "canonical/tests/test_global_terminal_universe.py"
      - "canonical/governance/GLOBAL_TERMINAL_UNIVERSE_V1.json"
      - "canonical/governance/EXACT_FOUR_PORTFOLIO_PREQUALIFICATION_V1.json"
      - "canonical/governance/GLOBAL_TERMINAL_PROOF_CUT_V1.json"
      - "canonical/governance/GLOBAL_TERMINAL_OBLIGATION_GRAPH_V1.json"
      - "canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json"
      - "canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json"
      - "canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_VERDICT_V6.json"
      - ".github/workflows/verify-global-terminal-universe.yml"
  workflow_dispatch:

concurrency:
  group: global-terminal-universe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify outer universe and evidence guard
        run: PYTHONPATH=. python canonical/tests/test_global_terminal_universe.py
