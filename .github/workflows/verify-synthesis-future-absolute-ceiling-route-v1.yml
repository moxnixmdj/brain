name: Verify synthesis future absolute ceiling route v1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/SYNTHESIS_FUTURE_ABSOLUTE_CEILING_ROUTE_V1.json"
      - "canonical/runtime/synthesis_future_absolute_ceiling_route_v1.py"
      - "canonical/tests/test_synthesis_future_absolute_ceiling_route_v1.py"
      - ".github/workflows/verify-synthesis-future-absolute-ceiling-route-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify future-only comparator elimination route
        run: |
          python -m py_compile canonical/runtime/synthesis_future_absolute_ceiling_route_v1.py
          python -m unittest canonical.tests.test_synthesis_future_absolute_ceiling_route_v1 -v
          python canonical/runtime/synthesis_future_absolute_ceiling_route_v1.py
