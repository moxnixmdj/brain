name: Verify LiveBench legacy15 joint witness V1

on:
  pull_request:
    paths:
      - "canonical/runtime/livebench_legacy15_joint_witness_v1.py"
      - "canonical/runtime/livebench_legacy15_joint_witness_exact_synthetic_audit_v1.py"
      - "canonical/tests/test_livebench_legacy15_joint_witness_v1.py"
      - ".github/workflows/verify-livebench-legacy-joint-witness-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact legacy checker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest nltk==3.9.2 langdetect==1.0.9 immutabledict==4.2.1
          python - <<'PY'
          import nltk
          for name in ["punkt", "punkt_tab"]:
              nltk.download(name, quiet=True)
          PY

      - name: Checkout frozen LiveBench scorer
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091

      - name: Run focused unit tests
        run: |
          pytest -q canonical/tests/test_livebench_legacy15_joint_witness_v1.py

      - name: Run exhaustive public synthetic composition audit
        run: |
          mkdir -p /tmp/receipt
          python canonical/runtime/livebench_legacy15_joint_witness_exact_synthetic_audit_v1.py \
            --livebench-root /tmp/livebench \
            --output /tmp/receipt/livebench-legacy15-joint-witness-v1.json

      - name: Upload exact audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy15-joint-witness-v1
          path: /tmp/receipt/livebench-legacy15-joint-witness-v1.json
