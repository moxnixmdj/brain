name: Verify universal learning open world router v4

on:
  pull_request:
    paths:
      - "canonical/governance/UNIVERSAL_LEARNING_OPEN_WORLD_ROUTER_V4.json"
      - "canonical/action_intents/2026-10-04_UNIVERSAL_LEARNING_V4.json"
      - "canonical/runtime/goal_dependency_delta_v4.py"
      - "canonical/runtime/open_world_hypothesis_guard_v4.py"
      - "canonical/runtime/universal_learning_open_world_router_v4.py"
      - "canonical/tests/test_universal_learning_open_world_router_v4.py"
      - ".github/workflows/verify-universal-learning-open-world-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run learning stack and V4 falsification tests
        run: |
          python -m unittest \
            canonical.tests.test_universal_learning_contract_v1 \
            canonical.tests.test_universal_active_transfer_learner_v2 \
            canonical.tests.test_universal_learning_active_router_v2 \
            canonical.tests.test_universal_learning_decision_router_v3 \
            canonical.tests.test_universal_learning_open_world_router_v4 -v
      - name: Verify exact V4 blob bindings and zero-credit boundary
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path(".")
          gov=json.loads((root/"canonical/governance/UNIVERSAL_LEARNING_OPEN_WORLD_ROUTER_V4.json").read_text())
          for path, expected in gov["exact_bound_components"].items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert got==expected,(path,got,expected)
          assert gov["acceptance_credit_delta"]==0
          assert gov["ownership_credit_delta"]==0
          assert gov["fresh_reality_authority"] is False
          assert "NO_UNKNOWN_DOMAIN_ACCEPTANCE_CREDIT" in gov["hard_nonclaims"]
          PY
