name: Verify R2 regcap context atom V2
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/source_aligned_regcap_context_proof_v2.py
      - canonical/runtime/regcap_context_atom_truth_certificate_v2.py
      - canonical/runtime/semantic_truth_dispatch_v1.py
      - canonical/tests/test_regcap_context_atom_truth_certificate_v2.py
      - canonical/tests/test_semantic_truth_dispatch_regcap_context_v2.py
      - canonical/tests/test_semantic_truth_dispatch_v1.py
      - .github/workflows/verify-r2-regcap-context-atom-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed modules
        run: |
          python -m py_compile             canonical/runtime/source_aligned_regcap_context_proof_v2.py             canonical/runtime/regcap_context_atom_truth_certificate_v2.py             canonical/runtime/semantic_truth_dispatch_v1.py
      - name: Run strict regcap context truth suites
        run: |
          python -m unittest -v             canonical.tests.test_regcap_context_atom_truth_certificate_v2             canonical.tests.test_semantic_truth_dispatch_regcap_context_v2             canonical.tests.test_semantic_truth_dispatch_v1
