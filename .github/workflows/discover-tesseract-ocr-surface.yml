name: Discover Tesseract OCR execution surface
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-tesseract-ocr-surface.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set -euxo pipefail
          sudo apt-get update
          apt-cache policy tesseract-ocr tesseract-ocr-eng
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tesseract --version
          dpkg-query -W -f='${Package} ${Version}\n' tesseract-ocr tesseract-ocr-eng libtesseract5 libleptonica-dev || true
          find /usr/share/tesseract-ocr -type f -name 'eng.traineddata' -print -exec sha256sum {} \;
