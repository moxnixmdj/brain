name: Verify action hypergraph evidence guard

on:
  pull_request:
    paths:
      - 'canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json'
      - 'canonical/verification/CURRENT_OBJECTIVE_BINDINGS_PUBLIC_RUNNER_VERIFICATION_20261002_V2.json'
      - 'canonical/runtime/action_hypergraph_evidence_guard_v1.py'
      - 'canonical/tests/test_action_hypergraph_evidence_guard_v1.py'
      - 'canonical/governance/ACTION_HYPERGRAPH_EVIDENCE_GUARD_V1.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run guard unit tests
        run: python -m unittest canonical.tests.test_action_hypergraph_evidence_guard_v1 -v
      - name: Verify live hypergraph derived evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.action_hypergraph_evidence_guard_v1 import evaluate
          root=Path('.')
          doc=json.loads((root/'canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json').read_text())
          out=evaluate(root,doc)
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out['pass'], out
          PY
