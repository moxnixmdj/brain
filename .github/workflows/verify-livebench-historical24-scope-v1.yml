name: Verify LiveBench historical24 scope V1

on:
  pull_request:
    paths:
      - "canonical/runtime/livebench_historical24_scope_superset_v1.py"
      - "canonical/tests/test_livebench_historical24_scope_superset_v1.py"
      - "canonical/runtime/livebench_historical24_composition_space_v1.py"
      - "canonical/tests/test_livebench_historical24_composition_space_v1.py"
      - "canonical/runtime/livebench_historical24_exact_postvalidator_v1.py"
      - "canonical/tests/test_livebench_historical24_exact_postvalidator_v1.py"
      - "canonical/runtime/livebench_historical24_special_pointwise_v1.py"
      - "canonical/tests/test_livebench_historical24_special_pointwise_v1.py"
      - ".github/workflows/verify-livebench-historical24-scope-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout exact public historical generator
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/LiveBench/LiveBench.git /tmp/livebench-historical
          git -C /tmp/livebench-historical fetch --quiet --depth=1 origin 686be1e78a0ba8036d7e355bc406e1a265da5292
          git -C /tmp/livebench-historical checkout --quiet --detach 686be1e78a0ba8036d7e355bc406e1a265da5292
          test "$(git -C /tmp/livebench-historical rev-parse HEAD)" = "686be1e78a0ba8036d7e355bc406e1a265da5292"

      - name: Checkout exact pinned scorer registry
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/LiveBench/LiveBench.git /tmp/livebench-pinned
          git -C /tmp/livebench-pinned fetch --quiet --depth=1 origin 8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench-pinned checkout --quiet --detach 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/livebench-pinned rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"

      - name: Run fail-closed unit guards
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest==8.4.2 nltk==3.10.3 langdetect==1.0.9 immutabledict==4.2.2
          python -m pytest -q \
            canonical/tests/test_livebench_historical24_scope_superset_v1.py \
            canonical/tests/test_livebench_historical24_composition_space_v1.py \
            canonical/tests/test_livebench_historical24_exact_postvalidator_v1.py \
            canonical/tests/test_livebench_historical24_special_pointwise_v1.py

      - name: Verify exact 13,750-set historical24 structural reduction
        run: |
          python canonical/runtime/livebench_historical24_composition_space_v1.py > /tmp/historical24-structure.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/historical24-structure.json",encoding="utf-8"))
          assert x["compatible_structural_set_count"] == 13750, x
          assert x["active15_structural_set_count"] == 928, x
          assert x["sets_containing_at_least_one_extra9_family"] == 12822, x
          assert x["counts_by_route"]["GENERAL"] == 13721, x
          print(json.dumps(x, sort_keys=True))
          PY

      - name: Exact-postvalidate all 29 special structures
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "/tmp/livebench-pinned/livebench/if_runner")
          from instruction_following_eval import instructions_registry
          from canonical.runtime import livebench_historical24_composition_space_v1 as space
          from canonical.runtime import livebench_historical24_exact_postvalidator_v1 as exact
          from canonical.runtime import livebench_historical24_special_pointwise_v1 as special

          def c(iid, **slots):
              return {"instruction_id": iid, "slots": slots, "parameter_complete": True}

          def build(ids, comma_repeat=False):
              out=[]
              for iid in ids:
                  if iid=="keywords:existence":
                      out.append(c(iid, keywords=["alpha","beta"]))
                  elif iid=="keywords:forbidden_words":
                      out.append(c(iid, forbidden_words=["gamma","delta"]))
                  elif iid=="combination:repeat_prompt":
                      out.append(c(iid, prompt_to_repeat=("Write a compact note, please." if comma_repeat else "Write a compact note.")))
                  else:
                      out.append(c(iid))
              return out

          special_sets=[x for x in space.enumerate_compatible_sets() if space.route(x)!="GENERAL"]
          assert len(special_sets)==29
          full=0
          collision=0
          for ids in special_sets:
              rows=build(ids, False)
              plan=special.solve_special(rows)
              assert plan["status"]=="CANDIDATE_POINTWISE_OPTIMAL_SPECIAL_ROUTE", (ids,plan)
              flags=exact.evaluate_with_registry(plan["response"], rows, instructions_registry.INSTRUCTION_DICT)["checker_results"]
              assert sum(flags)==len(ids), (ids,plan,flags)
              full+=1

              if space.route(ids)=="REPEAT_PROMPT" and "punctuation:no_comma" in ids:
                  rows=build(ids, True)
                  plan=special.solve_special(rows)
                  flags=exact.evaluate_with_registry(plan["response"], rows, instructions_registry.INSTRUCTION_DICT)["checker_results"]
                  assert sum(flags)==len(ids)-1, (ids,plan,flags)
                  assert flags[[r["instruction_id"] for r in rows].index("combination:repeat_prompt")] is False
                  assert flags[[r["instruction_id"] for r in rows].index("punctuation:no_comma")] is True
                  collision+=1

          assert full==29
          assert collision==4
          print({"special_structures_exact_full":full,"repeat_comma_collision_structures_exact_one_loss":collision})
          PY

      - name: Prove exact source-bound historical24 scope superset
        run: |
          mkdir -p /tmp/receipt
          printf '%s\n' '{"historical_root":"/tmp/livebench-historical","pinned_scorer_root":"/tmp/livebench-pinned"}'             | python canonical/runtime/livebench_historical24_scope_superset_v1.py             > /tmp/receipt/livebench-historical24-scope-v1.json
          python - <<'PY'
          import json
          p="/tmp/receipt/livebench-historical24-scope-v1.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["status"].startswith("PASS__SOURCE_BOUND_HISTORICAL24_"), x
          assert x["generator_semantics"]["pool_count"] == 24, x
          assert x["generator_semantics"]["draw_minimum"] == 2, x
          assert x["generator_semantics"]["draw_maximum_default"] == 5, x
          assert x["generator_semantics"]["without_replacement"] is True, x
          assert x["generator_semantics"]["deconfliction_removal_only"] is True, x
          assert x["paper_scope_truth_repair"]["visible_checkmarked_id_count"] == 15, x
          assert x["paper_scope_truth_repair"]["declared_textual_count"] == 16, x
          assert x["breakthrough"]["additional_family_count"] == 9, x
          assert x["terminal_rows_read"] == 0, x
          print(json.dumps({
              "status": x["status"],
              "generator_pool": x["generator_semantics"]["pool_count"],
              "paper_visible": x["paper_scope_truth_repair"]["visible_checkmarked_id_count"],
              "paper_declared": x["paper_scope_truth_repair"]["declared_textual_count"],
              "additional_families": x["breakthrough"]["additional_family_count"],
          }, sort_keys=True))
          PY

      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-historical24-scope-v1
          path: /tmp/receipt/livebench-historical24-scope-v1.json
          if-no-files-found: error
