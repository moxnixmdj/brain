name: Verify Bytes canonicalization V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/laws/RESOURCE_BOUNDED_CAPABILITY_BYTES_LAW_V1.md"
      - "canonical/laws/WHITE_BOX_CAPABILITY_HARVESTING_LAW_V2.md"
      - "canonical/laws/CAPABILITY_ACQUISITION_ENGINE_LAW_V8.md"
      - "canonical/laws/CAPABILITY_INTERNALIZATION_ARBITRAGE_STRATEGY_V8.md"
      - "canonical/laws/FRONTIER_KNOWLEDGE_CAPABILITY_INTERNALIZATION_MISSION_LOCK_V9.md"
      - "canonical/governance/WHITE_BOX_CAPABILITY_CAPSULE_SCHEMA_V2.json"
      - "canonical/obsolescence/BYTES_RESEARCH_CHECKPOINT_20261009_V1.json"
      - "canonical/runtime/verified_mechanism_cover_optimizer.py"
      - "canonical/CANONICAL_POINTER.json"
      - "tests/test_verified_mechanism_cover_optimizer.py"
      - "tests/test_bytes_canonical_wiring.py"
      - ".github/workflows/verify-bytes-canonicalization-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact finite-library byte-cover optimizer
        run: python tests/test_verified_mechanism_cover_optimizer.py
      - name: Verify Bytes canonical wiring and non-promotion guard
        run: python tests/test_bytes_canonical_wiring.py
