name: Frontier Pro V2 smoke evaluation

# Manual only. GitHub exposes workflow_dispatch only once this workflow file
# exists on the default branch; choosing --ref still selects the branch version.
on:
  workflow_dispatch:
    inputs:
      task_offset:
        description: Number of initial HARD-51 tasks to skip (0-50)
        default: '0'
        type: string
      task_limit:
        description: Number of HARD-51 tasks to run in file order (1-51)
        required: true
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  pro-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Validate task limit
        shell: bash
        env:
          TASK_OFFSET: ${{ inputs.task_offset || '0' }}
          TASK_LIMIT: ${{ inputs.task_limit || '3' }}
        run: |
          set -euo pipefail
          if [[ ! "$TASK_LIMIT" =~ ^([1-9]|[1-4][0-9]|5[01])$ ]]; then
            echo 'task_limit must be an integer from 1 through 51' >&2
            exit 1
          fi
          if [[ ! "$TASK_OFFSET" =~ ^(0|[1-9]|[1-4][0-9]|50)$ ]] || (( TASK_LIMIT + TASK_OFFSET > 51 )); then
            echo 'Requested slice is not within HARD-51' >&2
            exit 1
          fi
          echo "TASK_OFFSET=$TASK_OFFSET" >> "$GITHUB_ENV"
          echo "TASK_LIMIT=$TASK_LIMIT" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/runs/jobs"
          {
            echo "Brain revision: ${{ github.sha }}"
            echo 'Harbor revision: 39c2219a41b3caa7a689cef1882263b5a93ae93f'
            echo 'SWE-bench Pro revision: 66f92766bba642462d4bbe5479e83f91f9211862'
            echo 'Terminal-Bench 4.1 revision: 4070d6cef56a7d20cb5dc98d5e10ada88a6b9440'
            echo "HARD-51 slice: offset=$TASK_OFFSET count=$TASK_LIMIT"
            echo 'Producer configuration: cold Harbor route, allowlisted code and empty external store.'
            echo 'First task: public verifier test names previously disclosed.'
            echo 'Producer and replay results are not independently reviewed.'
          } > "$GITHUB_WORKSPACE/runs/jobs/smoke_metadata.txt"
          echo 'The first HARD-51 task has disclosed public verifier test names; it is not blind.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This run is an unverified smoke test, not an independently established benchmark score.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check out requested Brain revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: brain
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Harbor and prepare selected Pro tasks
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker compose version
          python -m pip install 'git+https://github.com/harbor-framework/harbor.git@39c2219a41b3caa7a689cef1882263b5a93ae93f'
          git clone --no-checkout https://github.com/scaleapi/SWE-bench_Pro-os.git "$GITHUB_WORKSPACE/swe-pro"
          git -C "$GITHUB_WORKSPACE/swe-pro" checkout --detach 66f92766bba642462d4bbe5479e83f91f9211862
          (cd "$GITHUB_WORKSPACE/swe-pro/v2" && sha256sum -c SHA256SUMS > "$GITHUB_WORKSPACE/runs/jobs/pro-checksums.log")
          sed -n "$((TASK_OFFSET + 1)),$((TASK_OFFSET + TASK_LIMIT))p" "$GITHUB_WORKSPACE/swe-pro/v2/hard51_ids.txt" > "$GITHUB_WORKSPACE/runs/jobs/selected_hard51_ids.txt"
          [[ "$(wc -l < "$GITHUB_WORKSPACE/runs/jobs/selected_hard51_ids.txt")" -eq "$TASK_LIMIT" ]]
          python "$GITHUB_WORKSPACE/swe-pro/v2/tooling/make_subset.py" \
            "$GITHUB_WORKSPACE/swe-pro/v2/tasks" \
            "$GITHUB_WORKSPACE/runs/jobs/selected_hard51_ids.txt" \
            "$GITHUB_WORKSPACE/hard51-smoke"
          cat > "$GITHUB_WORKSPACE/brain-no-network-compose.yaml" <<'YAML'
          services:
            main:
              network_mode: none
              ipc: private
              cap_drop: [ALL]
              security_opt: ["no-new-privileges:true"]
          YAML
          # Stage only the executable cold route. The original checkout and all
          # benchmark manifests, solutions and old results stay on the host.
          (cd "$GITHUB_WORKSPACE/brain" && python -m canonical.tools.stage_harbor_runtime_v1 \
            "$GITHUB_WORKSPACE/producer") > "$GITHUB_WORKSPACE/runs/jobs/producer-files.json"
          printf '%s\n' music-harmony sound-change-cascade > "$GITHUB_WORKSPACE/runs/jobs/selected_tb41_ids.txt"
          echo "BRAIN=$GITHUB_WORKSPACE/producer" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/brain:$GITHUB_WORKSPACE/swe-pro/v2/tooling" >> "$GITHUB_ENV"

      - name: Run experimental Brain producer
        id: producer
        working-directory: runs
        shell: bash
        env:
          BRAIN_ALLOW_EXTERNAL_HARBOR_VM_EVAL: '1'
        run: |
          set -euo pipefail
          BRAIN_MOUNTS="$(python -c 'import json,os; print(json.dumps([{"type":"bind","source":os.environ["BRAIN"],"target":"/opt/brain-ro","read_only":True}]))')"
          harbor run -p "$GITHUB_WORKSPACE/hard51-smoke" -e docker -n 1 \
            -a canonical.runtime.harbor_epistemic_agent_v1:HarborEpistemicAgent \
            --ak suite=pro-v2 --ak repo_root=/app --ak "brain_source=$BRAIN" \
            --mounts "$BRAIN_MOUNTS" \
            --extra-docker-compose "$GITHUB_WORKSPACE/brain-no-network-compose.yaml" \
            --disable-verification --job-name brain-pro-smoke

      - name: Replay captured patches in pristine task images
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (steps.producer.outcome == 'success' || steps.producer.outcome == 'failure') }}
        working-directory: runs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GITHUB_WORKSPACE/runs/jobs/brain-pro-smoke" ]]; then
            echo 'Producer job directory is absent; no patches can be replayed.' >&2
            exit 1
          fi
          harbor run -p "$GITHUB_WORKSPACE/hard51-smoke" -e docker -n 1 \
            -a patch_replay:PatchReplayAgent -m replay \
            --ak "source_job=$GITHUB_WORKSPACE/runs/jobs/brain-pro-smoke" \
            --job-name brain-pro-smoke-regrade

      - name: Run official Terminal-Bench 4.1 Harbor Docker smoke (suite=terminal-bench-4)
        id: tb4_smoke
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: runs
        shell: bash
        env:
          BRAIN_ALLOW_EXTERNAL_HARBOR_VM_EVAL: '1'
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/harbor-framework/terminal-bench.git "$GITHUB_WORKSPACE/tb4-repo"
          git -C "$GITHUB_WORKSPACE/tb4-repo" checkout --detach 4070d6cef56a7d20cb5dc98d5e10ada88a6b9440
          mkdir -p "$GITHUB_WORKSPACE/tb4-smoke"
          while IFS= read -r tname; do
            cp -R "$GITHUB_WORKSPACE/tb4-repo/tasks/$tname" "$GITHUB_WORKSPACE/tb4-smoke/$tname"
          done < "$GITHUB_WORKSPACE/runs/jobs/selected_tb41_ids.txt"
          BRAIN_MOUNTS="$(python -c 'import json,os; print(json.dumps([{"type":"bind","source":os.environ["BRAIN"],"target":"/opt/brain-ro","read_only":True}]))')"
          harbor run -p "$GITHUB_WORKSPACE/tb4-smoke" -e docker -n 1 \
            -a canonical.runtime.harbor_epistemic_agent_v1:HarborEpistemicAgent \
            --ak suite=terminal-bench-4 --ak repo_root=/app --ak "brain_source=$BRAIN" \
            --mounts "$BRAIN_MOUNTS" \
            --extra-docker-compose "$GITHUB_WORKSPACE/brain-no-network-compose.yaml" \
            --job-name brain-tb4-smoke

      - name: Reject unsafe artifact paths
        id: artifact_safety
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/runs/jobs" ]] && \
             find -P "$GITHUB_WORKSPACE/runs/jobs" \( -type l -o -type p -o -type s -o -type b -o -type c \) -print -quit | grep -q .; then
            echo 'Refusing to upload task outputs containing symlinks or special files.' >&2
            exit 1
          fi

      - name: Audit trial and replay artifacts
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.artifact_safety.outcome == 'success' }}
        working-directory: runs
        shell: bash
        run: |
          set -euo pipefail
          python -m canonical.tools.harbor_smoke_audit_v1 jobs

      - name: Upload smoke results, including partial failures
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-pro-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          # Do not redistribute verifier logs, hidden test contents or task inputs.
          path: |
            runs/jobs/*_audit.json
            runs/jobs/selected_*_ids.txt
            runs/jobs/smoke_metadata.txt
            runs/jobs/producer-files.json
          if-no-files-found: warn
          retention-days: 1
