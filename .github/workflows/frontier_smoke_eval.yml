name: Frontier 2x2 Docker smoke evaluation

# The push trigger is confined to the current session branch and this file;
# manual dispatch remains available from the default branch.
on:
  push:
    branches: ["arena/8e7b5375-brain"]
    paths: [".github/workflows/frontier_smoke_eval.yml"]
  workflow_dispatch:
    inputs:
      task_limit:
        description: Number of HARD-51 tasks to run in file order (1-51); release launch uses 2
        required: true
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  two-by-two-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Validate inputs and record metadata
        shell: bash
        env:
          TASK_LIMIT: ${{ inputs.task_limit || '2' }}
        run: |
          set -euo pipefail
          if [[ ! "$TASK_LIMIT" =~ ^([1-9]|[1-4][0-9]|5[01])$ ]]; then
            echo 'task_limit must be an integer from 1 through 51' >&2
            exit 1
          fi
          echo "TASK_LIMIT=$TASK_LIMIT" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/runs/jobs"
          cat > "$GITHUB_WORKSPACE/runs/jobs/selected_terminal_bench4_ids.txt" <<'TASKS'
          interleaved-vigenere
          session-window-debug
          TASKS
          {
            echo 'Brain revision: ${{ github.sha }}'
            echo 'Harbor revision: 39c2219a41b3caa7a689cef1882263b5a93ae93f'
            echo 'SWE-bench Pro revision: 66f92766bba642462d4bbe5479e83f91f9211862'
            echo 'Terminal-Bench dataset: terminal-bench/terminal-bench@4.0.0'
            echo 'Selected Terminal-Bench 4 tasks: interleaved-vigenere, session-window-debug'
            echo "Selected Pro task count: $TASK_LIMIT"
            echo 'First Pro task: public verifier test names previously disclosed.'
            echo 'Producer and replay results are not independently reviewed.'
          } > "$GITHUB_WORKSPACE/runs/jobs/smoke_metadata.txt"
          echo 'The first HARD-51 task has disclosed public verifier test names; it is not blind.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This run is an unverified smoke test, not an independently established benchmark score.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check out requested Brain revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: brain
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Harbor and prepare selected Pro tasks
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker compose version
          python -m pip install 'git+https://github.com/harbor-framework/harbor.git@39c2219a41b3caa7a689cef1882263b5a93ae93f'
          git clone --no-checkout https://github.com/scaleapi/SWE-bench_Pro-os.git "$GITHUB_WORKSPACE/swe-pro"
          git -C "$GITHUB_WORKSPACE/swe-pro" checkout --detach 66f92766bba642462d4bbe5479e83f91f9211862
          (cd "$GITHUB_WORKSPACE/swe-pro/v2" && sha256sum -c SHA256SUMS > "$GITHUB_WORKSPACE/runs/jobs/pro-checksums.log")
          head -n "$TASK_LIMIT" "$GITHUB_WORKSPACE/swe-pro/v2/hard51_ids.txt" > "$GITHUB_WORKSPACE/runs/jobs/selected_hard51_ids.txt"
          [[ "$(wc -l < "$GITHUB_WORKSPACE/runs/jobs/selected_hard51_ids.txt")" -eq "$TASK_LIMIT" ]]
          python "$GITHUB_WORKSPACE/swe-pro/v2/tooling/make_subset.py" \
            "$GITHUB_WORKSPACE/swe-pro/v2/tasks" \
            "$GITHUB_WORKSPACE/runs/jobs/selected_hard51_ids.txt" \
            "$GITHUB_WORKSPACE/hard51-smoke"
          cat > "$GITHUB_WORKSPACE/brain-no-network-compose.yaml" <<'YAML'
          services:
            main:
              network_mode: none
              ipc: private
              cap_drop: [ALL]
              security_opt: ["no-new-privileges:true"]
          YAML
          echo "BRAIN=$GITHUB_WORKSPACE/brain" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/brain:$GITHUB_WORKSPACE/swe-pro/v2/tooling" >> "$GITHUB_ENV"

      - name: Run experimental Brain Pro producer
        id: producer-pro
        working-directory: runs
        shell: bash
        env:
          BRAIN_ALLOW_EXTERNAL_HARBOR_VM_EVAL: '1'
        run: |
          set -euo pipefail
          BRAIN_MOUNTS="$(python -c 'import json,os; print(json.dumps([{"type":"bind","source":os.environ["BRAIN"],"target":"/opt/brain-ro","read_only":True}]))')"
          harbor run -p "$GITHUB_WORKSPACE/hard51-smoke" -e docker -n 1 \
            -a canonical.runtime.harbor_epistemic_agent_v1:HarborEpistemicAgent \
            --ak suite=pro-v2 --ak repo_root=/app --ak "brain_source=$BRAIN" \
            --mounts "$BRAIN_MOUNTS" \
            --extra-docker-compose "$GITHUB_WORKSPACE/brain-no-network-compose.yaml" \
            --disable-verification --job-name brain-pro-smoke

      - name: Run experimental Brain Terminal-Bench 4 producer
        id: producer-terminal-bench-4
        working-directory: runs
        shell: bash
        env:
          BRAIN_ALLOW_EXTERNAL_HARBOR_VM_EVAL: '1'
        run: |
          set -euo pipefail
          BRAIN_MOUNTS="$(python -c 'import json,os; print(json.dumps([{"type":"bind","source":os.environ["BRAIN"],"target":"/opt/brain-ro","read_only":True}]))')"
          harbor run -d terminal-bench/terminal-bench@4.0.0 -e docker -n 1 \
            -i terminal-bench/interleaved-vigenere \
            -i terminal-bench/session-window-debug \
            -l 2 \
            -a canonical.runtime.harbor_epistemic_agent_v1:HarborEpistemicAgent \
            --ak suite=terminal-bench-4 --ak repo_root=/app --ak "brain_source=$BRAIN" \
            --mounts "$BRAIN_MOUNTS" \
            --extra-docker-compose "$GITHUB_WORKSPACE/brain-no-network-compose.yaml" \
            --job-name brain-tb4-smoke

      - name: Replay captured Pro patches in pristine task images
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (steps.producer-pro.outcome == 'success' || steps.producer-pro.outcome == 'failure') }}
        working-directory: runs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GITHUB_WORKSPACE/runs/jobs/brain-pro-smoke" ]]; then
            echo 'Producer job directory is absent; no patches can be replayed.' >&2
            exit 1
          fi
          harbor run -p "$GITHUB_WORKSPACE/hard51-smoke" -e docker -n 1 \
            -a patch_replay:PatchReplayAgent -m replay \
            --ak "source_job=$GITHUB_WORKSPACE/runs/jobs/brain-pro-smoke" \
            --job-name brain-pro-smoke-regrade

      - name: Reject unsafe artifact paths
        id: artifact_safety
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/runs/jobs" ]] && \
             find -P "$GITHUB_WORKSPACE/runs/jobs" \( -type l -o -type p -o -type s -o -type b -o -type c \) -print -quit | grep -q .; then
            echo 'Refusing to upload task outputs containing symlinks or special files.' >&2
            exit 1
          fi

      - name: Audit trial, replay, and verifier artifacts
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.artifact_safety.outcome == 'success' }}
        working-directory: runs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          jobs = Path('jobs').resolve()
          pro_ids = (jobs / 'selected_hard51_ids.txt').read_text().splitlines()
          tb_ids = (jobs / 'selected_terminal_bench4_ids.txt').read_text().splitlines()
          issues = []
          rows = []

          def trials(job):
              out = {}
              # Harbor creates one child directory per trial. Do not assume a
              # suite-specific prefix (Pro task directories can be instance_*,
              # while dataset package trials use the task name plus Harbor's
              # generated suffix). Follow no symlinks here.
              for child in sorted((jobs / job).iterdir()) if (jobs / job).is_dir() else []:
                  if child.is_symlink() or not child.is_dir():
                      continue
                  path = child / 'result.json'
                  if path.is_symlink() or not path.is_file():
                      continue
                  try:
                      result = json.loads(path.read_text())
                      name = result['task_name'].split('/')[-1]
                      if name in out:
                          issues.append(f'{job}:duplicate:{name}')
                      out[name] = (path.parent, result)
                  except (OSError, ValueError, TypeError, KeyError, AttributeError):
                      issues.append(f'{job}:invalid_result:{child.name}')
              return out

          def read_trace(src_dir):
              trace_path = src_dir / 'agent' / 'brain_epistemic_trace.json'
              return json.loads(trace_path.read_text())

          def last_envelope(trace):
              entries = trace.get('trace') if isinstance(trace.get('trace'), list) else []
              return entries[-1] if entries else {}

          def trace_actions(trace):
              envelope = last_envelope(trace)
              actions = envelope.get('proposed_actions')
              if not isinstance(actions, list) and isinstance(trace.get('proposed_actions'), list):
                  actions = trace['proposed_actions']
              return actions

          def imported_diag(trace):
              envelope = last_envelope(trace)
              diag = envelope.get('imported_engine')
              return diag if isinstance(diag, dict) else {}

          def verifier_rewards(result):
              verifier = result.get('verifier_result')
              if isinstance(verifier, dict) and isinstance(verifier.get('rewards'), dict):
                  return verifier['rewards']
              return None

          pro_producers = trials('brain-pro-smoke')
          pro_replays = trials('brain-pro-smoke-regrade')
          for task in pro_ids:
              row = {'suite': 'pro-v2', 'task': task,
                     'producer_present': task in pro_producers,
                     'replay_present': task in pro_replays}
              rows.append(row)
              if task not in pro_producers or task not in pro_replays:
                  issues.append(f'{task}:missing_trial')
                  continue
              src_dir, src = pro_producers[task]
              dst_dir, dst = pro_replays[task]
              if src.get('exception_info') is not None or dst.get('exception_info') is not None:
                  issues.append(f'{task}:trial_exception')
              patch = src_dir / 'agent' / 'model.patch'
              replay_path = dst_dir / 'agent' / 'replay.json'
              try:
                  trace = read_trace(src_dir)
                  replay = json.loads(replay_path.read_text())
                  row['proposed_actions'] = trace_actions(trace)
                  row['imported_engine'] = imported_diag(trace)
                  row['patch_bytes'] = patch.stat().st_size
                  if trace.get('patch_emitted') is not True or trace.get('external_harbor_vm_eval_status') != 'EXPERIMENTAL_DISPATCH__UNVERIFIED':
                      issues.append(f'{task}:producer_did_not_publish_patch')
                  if row['patch_bytes']:
                      if replay.get('apply_rc') != 0 or Path(replay.get('patch', '')).resolve() != patch.resolve():
                          issues.append(f'{task}:patch_not_replayed')
                  elif replay.get('patch') is not None:
                      issues.append(f'{task}:empty_patch_replay_mismatch')
              except (OSError, ValueError, TypeError, AttributeError):
                  issues.append(f'{task}:missing_or_invalid_agent_artifact')
              row['verifier_rewards'] = verifier_rewards(dst)
              if not row['verifier_rewards']:
                  issues.append(f'{task}:verifier_result_missing')

          tb_producers = trials('brain-tb4-smoke')
          for task in tb_ids:
              row = {'suite': 'terminal-bench-4', 'task': task,
                     'producer_present': task in tb_producers}
              rows.append(row)
              if task not in tb_producers:
                  issues.append(f'{task}:missing_trial')
                  continue
              src_dir, src = tb_producers[task]
              if src.get('exception_info') is not None:
                  issues.append(f'{task}:trial_exception')
              try:
                  trace = read_trace(src_dir)
                  diag = imported_diag(trace)
                  row['proposed_actions'] = trace_actions(trace)
                  row['model_status'] = last_envelope(trace).get('model_status')
                  row['imported_engine'] = diag
                  row['engine_status'] = diag.get('engine_status')
                  row['doc_compiler'] = diag.get('doc_compiler')
                  row['world_model'] = diag.get('world_model')
                  row['diff_bytes'] = diag.get('diff_bytes')
                  if trace.get('task_completion_claimed') is not False:
                      issues.append(f'{task}:invalid_completion_claim')
              except (OSError, ValueError, TypeError, AttributeError):
                  issues.append(f'{task}:missing_or_invalid_agent_artifact')
              row['verifier_rewards'] = verifier_rewards(src)
              if not row['verifier_rewards']:
                  issues.append(f'{task}:verifier_result_missing')

          report = {'selected_pro_count': len(pro_ids),
                    'selected_terminal_bench4_count': len(tb_ids),
                    'rows': rows, 'issues': issues,
                    'note': 'Artifact completeness only; no capability or benchmark success claim.'}
          (jobs / 'smoke_audit.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          for row in rows:
              print('::notice title=' + row['suite'] + ' ' + row['task'] + '::' + json.dumps(row, sort_keys=True, default=str))
          if issues or len(pro_ids) != 2 or len(tb_ids) != 2:
              sys.exit(1)
          PY

      - name: Upload smoke results, including partial failures
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-two-by-two-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/jobs/
          if-no-files-found: warn
          retention-days: 1
