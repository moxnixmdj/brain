name: Verify 12-contract terminal prequalification reducer
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/terminal_prequalification_reducer.py
      - canonical/tests/test_terminal_prequalification_reducer.py
      - .github/workflows/verify-terminal-prequalification-basis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_terminal_prequalification_reducer
