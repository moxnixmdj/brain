name: Zero-spend Opus capacity probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-spend-opus-capacity-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe metadata-only capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical/verification
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read().decode("utf-8", "replace")
                      try: body = json.loads(raw)
                      except Exception: body = None
                      return {"status": r.status, "json": body}
              except urllib.error.HTTPError as e:
                  return {"status": e.code, "json": None}
              except Exception as e:
                  return {"status": "NETWORK_ERROR", "json": None, "error_type": type(e).__name__}

          api = os.environ.get("OPENROUTER_API_KEY", "")
          mgmt = os.environ.get("OPENROUTER_MANAGEMENT_API_KEY", "")
          anthropic = os.environ.get("ANTHROPIC_API_KEY", "")

          def bearer(url, token):
              if not token: return {"present": False, "status": None, "json": None}
              x = get(url, {"Authorization": "Bearer " + token}); x["present"] = True; return x

          kp = bearer("https://openrouter.ai/api/v1/key", api)
          ca = bearer("https://openrouter.ai/api/v1/credits", api)
          cm = bearer("https://openrouter.ai/api/v1/credits", mgmt)
          orm = bearer("https://openrouter.ai/api/v1/models", api)
          if anthropic:
              am = get("https://api.anthropic.com/v1/models", {
                  "x-api-key": anthropic,
                  "anthropic-version": "2023-06-01",
              })
              am["present"] = True
          else:
              am = {"present": False, "status": None, "json": None}

          def safe_key(x):
              d = (x.get("json") or {}).get("data") if isinstance(x.get("json"), dict) else None
              if not isinstance(d, dict): return None
              return {k:d.get(k) for k in ("is_free_tier","is_management_key","limit","limit_remaining","limit_reset","usage","expires_at")}

          def safe_credits(x):
              d = (x.get("json") or {}).get("data") if isinstance(x.get("json"), dict) else None
              if not isinstance(d, dict): return None
              total, used = d.get("total_credits"), d.get("total_usage")
              rem = total-used if isinstance(total,(int,float)) and isinstance(used,(int,float)) else None
              return {"total_credits":total,"total_usage":used,"remaining_credits":rem}

          def ids(x):
              d = (x.get("json") or {}).get("data") if isinstance(x.get("json"), dict) else None
              if not isinstance(d, list): return []
              return sorted(row["id"] for row in d if isinstance(row,dict) and isinstance(row.get("id"),str))

          def opus55(xs):
              return [x for x in xs if x == "claude-opus-5-5" or ("opus" in x.lower() and ("5.5" in x.lower() or "5-5" in x.lower() or "5_5" in x.lower()))]

          k = safe_key(kp); c1 = safe_credits(ca); c2 = safe_credits(cm)
          credit = next((x for x in (c2,c1) if isinstance(x,dict) and isinstance(x.get("remaining_credits"),(int,float))), None)
          or55, an55 = opus55(ids(orm)), opus55(ids(am))
          positive_credit = bool(credit and credit["remaining_credits"] > 0)
          candidate = bool((positive_credit and orm.get("status")==200 and or55) or (am.get("status")==200 and an55))

          out = {
              "schema":"PROJECT_BRAIN_ZERO_SPEND_PRIVATE_BRAIN_OPUS_CAPACITY_PROBE_V3",
              "date":"2026-10-07",
              "status":"EXECUTED_NONSPENDING_PRIVATE_BRAIN_CAPACITY_PROBE",
              "carrier":{"repository":os.environ.get("GITHUB_REPOSITORY"),"workflow":os.environ.get("GITHUB_WORKFLOW"),"run_id":os.environ.get("GITHUB_RUN_ID"),"trigger_sha":os.environ.get("GITHUB_SHA")},
              "probe_contract":{"model_inference_requests":0,"purchases_or_topups":0,"secret_values_emitted":False,"metadata_only":True},
              "credential_presence":{"openrouter_api_key":bool(api),"openrouter_management_api_key":bool(mgmt),"anthropic_api_key":bool(anthropic)},
              "openrouter":{"key_http_status":kp.get("status"),"safe_key_metadata":k,"credits_via_api_key_http_status":ca.get("status"),"credits_via_api_key":c1,"credits_via_management_key_http_status":cm.get("status"),"credits_via_management_key":c2,"models_http_status":orm.get("status"),"opus55_model_ids_visible":or55},
              "anthropic":{"models_http_status":am.get("status"),"opus55_model_ids_visible":an55},
              "interpretation":{"positive_preexisting_openrouter_credit_observed":positive_credit,"zero_spend_exact_comparator_candidate_exists":candidate,"exact_comparator_inference_authorized_by_this_receipt":False,"reason":"METADATA_ONLY_PROBE_DOES_NOT_AUTHORIZE_INFERENCE_OR_PROVE_ZERO_COST_PER_REQUEST"},
              "accounting":{"incremental_spend_usd":0,"model_inference_requests":0,"terminal_credit_delta":0},
          }
          with open("canonical/verification/OPUS55_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_PROBE_LATEST.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,sort_keys=True); f.write("\n")
          status = {
              "schema":"PROJECT_BRAIN_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_STATUS_V1",
              "status":"CANDIDATE_CAPACITY_PRESENT" if candidate else "NO_CANDIDATE_CAPACITY_OBSERVED"
          }
          with open("canonical/verification/OPUS55_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_STATUS.json","w",encoding="utf-8") as f:
              json.dump(status,f,separators=(",",":"),sort_keys=True); f.write("\n")
          print(json.dumps({"credential_presence":out["credential_presence"],"interpretation":out["interpretation"],"openrouter_models_status":orm.get("status"),"anthropic_models_status":am.get("status")},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zero-spend-opus-capacity-probe
          path: |
            canonical/verification/OPUS55_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_PROBE_LATEST.json
            canonical/verification/OPUS55_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_STATUS.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit sanitized probe receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Brain Capacity Probe"
          git config user.email "project-brain-capacity-probe@users.noreply.github.com"
          git add canonical/verification/OPUS55_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_PROBE_LATEST.json canonical/verification/OPUS55_ZERO_SPEND_PRIVATE_BRAIN_CAPACITY_STATUS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record private zero-spend Opus capacity probe"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

# terminal-now deterministic status self-report 2026-10-07
