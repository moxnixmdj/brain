name: Zero-spend Opus capacity probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-spend-opus-capacity-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/zero-spend-opus-capacity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Probe non-spending credential capacity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          def get(url, token):
              if not token:
                  return {"present":False,"status":None,"json":None}
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read().decode("utf-8","replace")
                      try: body=json.loads(raw)
                      except Exception: body=None
                      return {"present":True,"status":r.status,"json":body}
              except urllib.error.HTTPError as e:
                  return {"present":True,"status":e.code,"json":None}
              except Exception as e:
                  return {"present":True,"status":"NETWORK_ERROR","json":None,"error_type":type(e).__name__}
          api=os.environ.get("OPENROUTER_API_KEY","")
          mgmt=os.environ.get("OPENROUTER_MANAGEMENT_API_KEY","")
          anthropic=os.environ.get("ANTHROPIC_API_KEY","")
          kp=get("https://openrouter.ai/api/v1/key",api)
          ca=get("https://openrouter.ai/api/v1/credits",api)
          cm=get("https://openrouter.ai/api/v1/credits",mgmt)
          def safe_key(x):
              d=(x.get("json") or {}).get("data") if isinstance(x.get("json"),dict) else None
              if not isinstance(d,dict): return None
              return {k:d.get(k) for k in ("is_free_tier","is_management_key","limit","limit_remaining","limit_reset","usage","expires_at")}
          def safe_credits(x):
              d=(x.get("json") or {}).get("data") if isinstance(x.get("json"),dict) else None
              if not isinstance(d,dict): return None
              total,used=d.get("total_credits"),d.get("total_usage")
              rem=(total-used) if isinstance(total,(int,float)) and isinstance(used,(int,float)) else None
              return {"total_credits":total,"total_usage":used,"remaining_credits":rem}
          k=safe_key(kp); c1=safe_credits(ca); c2=safe_credits(cm)
          credit=next((x for x in (c2,c1) if isinstance(x,dict) and isinstance(x.get("remaining_credits"),(int,float))),None)
          out={
            "schema":"PROJECT_BRAIN_ZERO_SPEND_OPUS_CAPACITY_PROBE_V1",
            "zero_inference_requests":True,
            "incremental_spend_usd":0,
            "secret_values_emitted":False,
            "credential_presence":{"openrouter_api_key":bool(api),"openrouter_management_api_key":bool(mgmt),"anthropic_api_key":bool(anthropic)},
            "openrouter":{"current_key_http_status":kp.get("status"),"current_key":k,"credits_via_api_key_http_status":ca.get("status"),"credits_via_api_key":c1,"credits_via_management_key_http_status":cm.get("status"),"credits_via_management_key":c2},
            "interpretation":{"authenticated_openrouter_capacity_snapshot_observed":bool(kp.get("status")==200 and (k is not None or credit is not None)),"positive_preexisting_credit_observed":bool(credit and credit.get("remaining_credits",0)>0),"exact_opus_comparator_authorized":False}
          }
          with open("zero_spend_opus_capacity_probe.json","w",encoding="utf-8") as f: json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zero-spend-opus-capacity-probe
          path: zero_spend_opus_capacity_probe.json
          if-no-files-found: error
          retention-days: 7
