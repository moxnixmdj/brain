name: V10 full private current-main regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v10-full-private-current-main-regression.yml"
      - "canonical/**"
      - "execution_guard/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-full-private-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record exact source identity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          python --version

      - name: Compile canonical runtime and tests
        run: |
          set -euo pipefail
          python -m compileall -q canonical/runtime canonical/tests

      - name: Run full canonical test suite
        run: |
          set -euo pipefail
          python -m unittest discover -s canonical/tests -p 'test*.py' -v
