name: Verify M1B continuous geometry compiler
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/m1b_continuous_geometry_compiler.py
      - canonical/tests/test_m1b_continuous_geometry_compiler.py
      - canonical/runtime/cad_partspec.py
      - canonical/runtime/cad_partspec_generator.py
      - canonical/runtime/cad_partspec_validator.py
      - .github/workflows/verify-m1b-continuous-geometry.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" "cadquery==2.6.1"
      - run: PYTHONPATH=canonical/runtime python -m unittest -v canonical.tests.test_m1b_continuous_geometry_compiler
