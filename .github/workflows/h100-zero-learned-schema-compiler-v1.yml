name: H100 zero-learned schema compiler V1

on:
  push:
    branches:
      - research/h100-proposal-measurement-current-v1
    paths:
      - 'canonical/governance/H100_ZERO_LEARNED_SCHEMA_STRESS_PREEXPOSURE_V1.json'
      - 'canonical/governance/H100_ZERO_LEARNED_SCHEMA_COMPILER_CANDIDATE_V1.json'
      - 'canonical/runtime/h100_zero_learned_schema_compiler_v1.py'
      - 'canonical/tests/test_h100_zero_learned_schema_compiler_v1.py'
      - '.github/workflows/h100-zero-learned-schema-compiler-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/H100_ZERO_LEARNED_SCHEMA_STRESS_PREEXPOSURE_V1.json'
      - 'canonical/governance/H100_ZERO_LEARNED_SCHEMA_COMPILER_CANDIDATE_V1.json'
      - 'canonical/runtime/h100_zero_learned_schema_compiler_v1.py'
      - 'canonical/tests/test_h100_zero_learned_schema_compiler_v1.py'
      - '.github/workflows/h100-zero-learned-schema-compiler-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h100-zero-learned-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run schema compiler tests
        run: python -m unittest canonical.tests.test_h100_zero_learned_schema_compiler_v1 -v
