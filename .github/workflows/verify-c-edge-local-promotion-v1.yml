name: Verify edge-local C promotion invariant V1
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/c_edge_local_promotion_gate_v1.py"
      - "canonical/tests/test_c_edge_local_promotion_gate_v1.py"
      - "canonical/runtime/c_current_credited_direct_proof_graph_v1.py"
      - "canonical/tests/test_c_current_credited_direct_proof_graph_v1.py"
      - "canonical/runtime/c_acceptance_ledger_transport_gate_v1.py"
      - "canonical/tests/test_c_acceptance_ledger_transport_gate_v1.py"
      - "canonical/runtime/c_current_acceptance_ledger_gate_v1.py"
      - "canonical/tests/test_c_current_acceptance_ledger_gate_v1.py"
      - "canonical/governance/C_EDGE_LOCAL_PROMOTION_INVARIANT_20261007_V1.json"
      - ".github/workflows/verify-c-edge-local-promotion-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m pytest -q canonical/tests/test_c_edge_local_promotion_gate_v1.py canonical/tests/test_c_current_credited_direct_proof_graph_v1.py canonical/tests/test_c_acceptance_ledger_transport_gate_v1.py canonical/tests/test_c_current_acceptance_ledger_gate_v1.py
      - run: python canonical/runtime/c_current_credited_direct_proof_graph_v1.py
      - run: python canonical/runtime/c_current_acceptance_ledger_gate_v1.py
