name: Verify finite complete-verifier search bypass

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/finite_verifier_search.py"
      - "canonical/verification/test_finite_verifier_search.py"
      - ".github/workflows/verify-finite-verifier-search.yml"
  push:
    branches: [main]
    paths:
      - "canonical/runtime/finite_verifier_search.py"
      - "canonical/verification/test_finite_verifier_search.py"
      - ".github/workflows/verify-finite-verifier-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bounded verifier search tests
        run: PYTHONPATH=. python -m unittest -v canonical.verification.test_finite_verifier_search
      - name: Run runtime self-test
        run: PYTHONPATH=. python canonical/runtime/finite_verifier_search.py
