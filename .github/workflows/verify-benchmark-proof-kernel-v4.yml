name: Verify benchmark proof kernel v4

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/benchmark_witness_elimination_compiler_v4.py"
      - "canonical/runtime/benchmark_proof_evidence_adapter_v1.py"
      - "canonical/tests/test_benchmark_witness_elimination_compiler_v4.py"
      - "canonical/tests/test_benchmark_proof_evidence_adapter_v1.py"
      - "canonical/governance/BENCHMARK_PROOF_POLICY_V1.json"
      - ".github/workflows/verify-benchmark-proof-kernel-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: |
          python -m py_compile canonical/runtime/benchmark_witness_elimination_compiler_v4.py
          python -m py_compile canonical/runtime/benchmark_proof_evidence_adapter_v1.py
      - name: Run successor tests
        run: |
          python -m pytest -q \
            canonical/tests/test_benchmark_witness_elimination_compiler_v3.py \
            canonical/tests/test_proof_carrying_scope_cover_v1.py \
            canonical/tests/test_benchmark_witness_elimination_compiler_v4.py \
            canonical/tests/test_benchmark_proof_evidence_adapter_v1.py
