name: Verify drawing normalization router
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/drawing_normalization_router.py
      - canonical/tests/test_drawing_normalization_router.py
      - canonical/runtime/drawing_view_registration.py
      - canonical/runtime/drawing_perspective_registration.py
      - canonical/runtime/calibrated_dense_warp_rectifier.py
      - canonical/runtime/drawing_preprocess_consensus.py
      - .github/workflows/verify-drawing-normalization-router.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-input numpy opencv-python-headless
      - run: python -m unittest -v canonical.tests.test_drawing_normalization_router
