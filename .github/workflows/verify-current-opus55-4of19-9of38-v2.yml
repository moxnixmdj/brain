name: Verify current Opus55 4-of-19 and 9-of-38

on:
  push:
    paths:
      - "canonical/tests/test_opus55_acceptance_calibration_reducer_v2.py"
      - "canonical/tests/test_current_opus55_acceptance_residual_v10.py"
      - ".github/workflows/verify-current-opus55-4of19-9of38-v2.yml"
  pull_request:
    paths:
      - "canonical/tests/test_opus55_acceptance_calibration_reducer_v2.py"
      - "canonical/tests/test_current_opus55_acceptance_residual_v10.py"
      - ".github/workflows/verify-current-opus55-4of19-9of38-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute live acceptance calibration
        run: python -m unittest canonical.tests.test_opus55_acceptance_calibration_reducer_v2 -v
      - name: Recompute live atomic residual
        run: python -m unittest canonical.tests.test_current_opus55_acceptance_residual_v10 -v
