name: Verify task acceptance route fiber partition V1

on:
  pull_request:
    paths:
      - "canonical/governance/OPUS55_TASK_ACCEPTANCE_ROUTE_FIBER_PARTITION_CONSTRUCTOR_20261005_V1.json"
      - "canonical/runtime/opus55_task_acceptance_route_fiber_partition_v1.py"
      - "canonical/tests/test_opus55_task_acceptance_route_fiber_partition_v1.py"
      - ".github/workflows/verify-opus55-task-acceptance-route-fiber-partition-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Parse governance JSON
        run: python -m json.tool canonical/governance/OPUS55_TASK_ACCEPTANCE_ROUTE_FIBER_PARTITION_CONSTRUCTOR_20261005_V1.json > /dev/null
      - name: Verify four-fiber constructor
        run: python -m unittest canonical.tests.test_opus55_task_acceptance_route_fiber_partition_v1 -v
