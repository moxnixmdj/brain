name: Verify bounded semantic graph synthesizer
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/bounded_semantic_graph_synthesizer.py
      - canonical/tests/test_bounded_semantic_graph_synthesizer.py
      - .github/workflows/verify-bounded-semantic-graph-synthesizer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_bounded_semantic_graph_synthesizer
