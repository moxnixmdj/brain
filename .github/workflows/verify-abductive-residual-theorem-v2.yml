name: Verify abductive residual theorem v2
on:
  pull_request:
    paths:
      - "canonical/runtime/abductive_residual_theorem_v2.py"
      - "canonical/tests/test_abductive_residual_theorem_v2.py"
      - "canonical/governance/ABDUCTIVE_RESIDUAL_THEOREM_V2_CANDIDATE.json"
      - ".github/workflows/verify-abductive-residual-theorem-v2.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V2 adversarial tests
        run: python -m unittest canonical.tests.test_abductive_residual_theorem_v2 -v
      - name: Shadow current matched-scope cut
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.abductive_residual_theorem_v2 import evaluate
          d=json.loads(Path("canonical/governance/MATCHED_SCOPE_ABDUCTIVE_RESIDUAL_INPUT_V1.json").read_text())
          out=evaluate({"targets":d["targets"],"baseline_facts":d["baseline_facts"],"implications":d["implications"]})
          assert out["exact"] is True, out
          assert out["bounded_incomplete"] is False, out
          assert out["minimum_joint_residual_size"] == 22, out
          print(json.dumps({"status":out["status"],"joint":out["minimum_joint_residual_size"]},indent=2))
          PY
