name: Verify LiveBench NTH dual-loss closure V1

on:
  pull_request:
    paths:
      - "canonical/runtime/livebench_legacy15_nth_dual_loss_closure_v1.py"
      - "canonical/runtime/livebench_legacy15_contract_composer_v2.py"
      - "canonical/runtime/livebench_legacy15_pointwise_optimal_v1.py"
      - "canonical/runtime/livebench_legacy15_slot_feasibility_v1.py"
      - "canonical/runtime/livebench_legacy15_composition_archetypes_v1.py"
      - "canonical/runtime/livebench_legacy15_lexical_slot_quotient_v1.py"
      - "canonical/runtime/livebench_legacy15_numeric_quotient_v1.py"
      - "canonical/governance/LIVEBENCH_NTH_DUAL_LOSS_CLOSURE_PRECOMMIT_20261005_V1.json"
      - ".github/workflows/verify-livebench-nth-dual-loss-closure-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install exact runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            nltk==3.10.3 langdetect==1.0.9 immutabledict==4.3.1

      - name: Checkout exact frozen LiveBench
        run: |
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench fetch --quiet --depth=1 origin \
            8f8e5c381a16e3f24257776edd53471fe86f8091
          git -C /tmp/livebench checkout --quiet --detach \
            8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C /tmp/livebench rev-parse HEAD)" = \
            "8f8e5c381a16e3f24257776edd53471fe86f8091"

      - name: Exhaust NTH dual-loss quotient
        run: |
          mkdir -p /tmp/receipt
          python canonical/runtime/livebench_legacy15_nth_dual_loss_closure_v1.py \
            --livebench-root /tmp/livebench \
            --output /tmp/receipt/livebench-nth-dual-loss-closure-v1.json

      - name: Require exact precommitted pass
        run: |
          python - <<'PY'
          import json
          p="/tmp/receipt/livebench-nth-dual-loss-closure-v1.json"
          x=json.load(open(p, encoding="utf-8"))
          assert x["status"] == "PASS__92160_NTH_DUAL_LOSS_QUOTIENT_CASES_EXACT_POINTWISE_CLOSED", x
          assert x["quotient_basis"]["expected_cases"] == 92160, x
          assert x["coverage"]["cases"] == 92160, x
          assert x["coverage"]["pointwise_exact_max_match"] == 92160, x
          assert x["failure_count"] == 0, x
          assert x["terminal_rows_read"] == 0, x
          assert x["target_scores_read"] == 0, x
          print(json.dumps({
              "status": x["status"],
              "cases": x["coverage"]["cases"],
              "pointwise_exact_max_match": x["coverage"]["pointwise_exact_max_match"],
              "loss_histogram": x["coverage"]["loss_histogram"],
          }, sort_keys=True))
          PY

      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-nth-dual-loss-closure-v1
          path: /tmp/receipt/livebench-nth-dual-loss-closure-v1.json
          if-no-files-found: error
