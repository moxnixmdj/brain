name: Verify finite population proof

on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/finite_population_proof.py
      - canonical/tests/test_finite_population_proof.py
      - .github/workflows/verify-finite-population-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_finite_population_proof
