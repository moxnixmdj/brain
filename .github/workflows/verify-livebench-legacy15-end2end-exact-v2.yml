name: Verify LiveBench legacy15 end-to-end exact V2

on:
  pull_request:
    paths:
      - "canonical/runtime/livebench_legacy15_joint_witness_v1.py"
      - "canonical/runtime/livebench_frozen_active_legacy15_v1.py"
      - "canonical/runtime/livebench_legacy_visible_constraint_compiler_v1.py"
      - "canonical/runtime/livebench_legacy_visible_constraint_compiler_v4.py"
      - "canonical/runtime/livebench_legacy15_composition_archetypes_v1.py"
      - "canonical/runtime/livebench_legacy15_end2end_exact_synthetic_audit_v2.py"
      - ".github/workflows/verify-livebench-legacy15-end2end-exact-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen legacy checker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nltk==3.9.2 langdetect==1.0.9 immutabledict==4.2.1
          python - <<'PY'
          import nltk
          for name in ["punkt", "punkt_tab"]:
              nltk.download(name, quiet=True)
          PY

      - name: Checkout exact frozen LiveBench scorer
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091

      - name: Run exhaustive active15 end-to-end exact audit and preserve diagnostics
        shell: bash
        run: |
          mkdir -p /tmp/receipt
          set +e
          set -o pipefail
          python canonical/runtime/livebench_legacy15_end2end_exact_synthetic_audit_v2.py             --livebench-root /tmp/livebench             --output /tmp/receipt/livebench-legacy15-end2end-exact-v2.json             2>&1 | tee /tmp/receipt/audit.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > /tmp/receipt/exit_code.txt
          {
            echo "python=$(python --version 2>&1)"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "head_sha=${GITHUB_SHA:-unknown}"
          } > /tmp/receipt/environment.txt
          exit 0

      - name: Upload exact audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livebench-legacy15-end2end-exact-v2
          path: /tmp/receipt
          if-no-files-found: error

      - name: Enforce audit result after diagnostics upload
        if: always()
        shell: bash
        run: |
          test -f /tmp/receipt/exit_code.txt
          test "$(cat /tmp/receipt/exit_code.txt)" = "0"
