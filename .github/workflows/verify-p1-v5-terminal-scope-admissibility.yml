name: Verify P1 V5 terminal scope admissibility
on:
  push:
    paths:
      - "canonical/runtime/p1_v5_terminal_scope_admissibility_v1.py"
      - "canonical/tests/test_p1_v5_terminal_scope_admissibility_v1.py"
      - "canonical/governance/P1_V5_TERMINAL_SCOPE_RELATIONS_V1.json"
      - "canonical/governance/P1_V5_TERMINAL_SCOPE_ADMISSIBILITY_ACTIVATION_V1.json"
      - "canonical/governance/P1_TYPED_INTERVENTION_ENVELOPE_V5_ACTIVATION_V1.json"
      - "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json"
  pull_request:
    paths:
      - "canonical/runtime/p1_v5_terminal_scope_admissibility_v1.py"
      - "canonical/tests/test_p1_v5_terminal_scope_admissibility_v1.py"
      - "canonical/governance/P1_V5_TERMINAL_SCOPE_RELATIONS_V1.json"
      - "canonical/governance/P1_V5_TERMINAL_SCOPE_ADMISSIBILITY_ACTIVATION_V1.json"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed scope transport tests
        run: python -m unittest canonical.tests.test_p1_v5_terminal_scope_admissibility_v1 -v
      - name: Execute live admissibility gate
        run: |
          python canonical/runtime/p1_v5_terminal_scope_admissibility_v1.py > p1-v5-scope.json
          python - <<'PY'
          import json
          p=json.load(open("p1-v5-scope.json"))
          assert p["status"].startswith("PASS")
          assert p["verified_v5_preflight_active"] is True
          assert p["open_surface_count"]==3
          assert p["scope_transport_admissible"] is False
          assert p["p1_scope_quarantine_clearable"] is False
          assert p["new_reality_units_consumed"]==0
          print(json.dumps(p["surface_relations"],indent=2,sort_keys=True))
          PY
