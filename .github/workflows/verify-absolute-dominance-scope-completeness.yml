name: Verify absolute-dominance scope completeness firewall

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/acceptance_proof_transmuter_v1.py'
      - 'canonical/tests/test_acceptance_proof_transmuter_v1.py'
      - 'canonical/governance/ABSOLUTE_DOMINANCE_SCOPE_COMPLETENESS_RECONCILIATION_V1.json'
      - '.github/workflows/verify-absolute-dominance-scope-completeness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run transmuter regression tests
        run: python -m unittest -v canonical.tests.test_acceptance_proof_transmuter_v1
      - name: Recompute live acceptance transmutation
        run: |
          python canonical/runtime/acceptance_proof_transmuter_v1.py             canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json             --evidence canonical/governance/OPUS55_ACCEPTANCE_PROOF_TRANSMUTATION_INPUT_V1.json
