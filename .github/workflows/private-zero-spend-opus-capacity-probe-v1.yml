name: Private zero-spend Opus capacity probe

on:
  push:
    paths:
      - ".github/workflows/private-zero-spend-opus-capacity-probe-v1.yml"
  pull_request:
    paths:
      - ".github/private-zero-spend-opus-capacity-probe.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe credential presence and nonspending OpenRouter account metadata
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          out = {
              "schema": "PROJECT_BRAIN_PRIVATE_ZERO_SPEND_OPUS_CAPACITY_PROBE_V1",
              "model_inference_requests": 0,
              "purchases_or_topups": 0,
              "secret_values_emitted": False,
              "openrouter_api_key_present": bool(os.getenv("OPENROUTER_API_KEY")),
              "openrouter_management_api_key_present": bool(os.getenv("OPENROUTER_MANAGEMENT_API_KEY")),
              "anthropic_api_key_present": bool(os.getenv("ANTHROPIC_API_KEY")),
              "openrouter_key_metadata": None,
              "openrouter_credit_metadata": None,
          }
          def get_json(url, token):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "User-Agent": "project-brain-zero-spend-capacity-probe/1"}, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return {"http_status": resp.status, "json": json.loads(resp.read().decode("utf-8", "replace"))}
              except urllib.error.HTTPError as e:
                  return {"http_status": e.code, "error": "HTTP_ERROR"}
              except Exception as e:
                  return {"error": type(e).__name__}
          api = os.getenv("OPENROUTER_API_KEY")
          mgmt = os.getenv("OPENROUTER_MANAGEMENT_API_KEY")
          if api:
              r = get_json("https://openrouter.ai/api/v1/key", api)
              data = r.get("json", {}).get("data", {}) if isinstance(r.get("json"), dict) else {}
              out["openrouter_key_metadata"] = {
                  "http_status": r.get("http_status"), "error": r.get("error"),
                  "is_free_tier": data.get("is_free_tier"), "limit": data.get("limit"),
                  "limit_remaining": data.get("limit_remaining"), "usage": data.get("usage")
              }
          token = mgmt or api
          if token:
              r = get_json("https://openrouter.ai/api/v1/credits", token)
              data = r.get("json", {}).get("data", {}) if isinstance(r.get("json"), dict) else {}
              out["openrouter_credit_metadata"] = {
                  "http_status": r.get("http_status"), "error": r.get("error"),
                  "total_credits": data.get("total_credits"), "total_usage": data.get("total_usage")
              }
          print(json.dumps(out, sort_keys=True))
          PY
