name: Verify Root3 zero ambient authority carrier V1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/root3_zero_ambient_authority_carrier_probe_v1.py"
      - ".github/workflows/verify-root3-zero-ambient-authority-carrier-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile probe
        run: python -m py_compile canonical/runtime/root3_zero_ambient_authority_carrier_probe_v1.py
      - name: Run live zero-ambient carrier probe
        run: |
          python canonical/runtime/root3_zero_ambient_authority_carrier_probe_v1.py \
            --output root3_zero_ambient_authority_carrier_probe_v1_receipt.json
      - name: Validate and expose receipt
        run: |
          python -m json.tool root3_zero_ambient_authority_carrier_probe_v1_receipt.json
          python - <<'PY'
          import json
          p="root3_zero_ambient_authority_carrier_probe_v1_receipt.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["status"].startswith("PASS"), d
          assert d["host_sentinel_unchanged"] is True
          assert d["broker_fail_closed_negative_canaries"] is True
          assert d["theorem_premise_effect"]["zero_ambient_authority_cut_empirically_exercised"] is True
          assert d["theorem_premise_effect"]["single_typed_broker_positive_path_exercised"] is True
          assert all(d["checks"].values()), d["checks"]
          print("ROOT3_ZERO_AMBIENT_AUTHORITY_CARRIER_V1=PASS")
          PY
