name: Verify interval information frontier v1

on:
  pull_request:
    paths:
      - canonical/runtime/interval_information_frontier_v1.py
      - canonical/tests/test_interval_information_frontier_v1.py
      - canonical/governance/MYSTERYMECHANISM_INTERVAL_INFORMATION_FRONTIER_20261008_V1.json
      - .github/workflows/verify-interval-information-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_interval_information_frontier_v1
