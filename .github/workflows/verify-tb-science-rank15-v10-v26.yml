name: Verify TB-Science Rank15 V10 V26 governance

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/TB_SCIENCE_RANK15_V6_ROBUST_ONE_SLOT_EXECUTION_AUTHORITY_20261009_V10.json"
      - "canonical/governance/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261009_V26.json"
      - "canonical/verification/TB_SCIENCE_RANK15_V6_ROBUST_RUNTIME_AUTHORITY_VERIFICATION_20261009_V1.json"
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY.json"
      - ".github/workflows/verify-tb-science-rank15-v10-v26.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact governance graph and zero-exposure accounting
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          R=pathlib.Path(".")
          def blob(path):
              raw=(R/path).read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          ap="canonical/governance/TB_SCIENCE_RANK15_V6_ROBUST_ONE_SLOT_EXECUTION_AUTHORITY_20261009_V10.json"
          lp="canonical/governance/TB_SCIENCE_CURRENT_SLOT_LEDGER_RECONCILIATION_20261009_V26.json"
          vp="canonical/verification/TB_SCIENCE_RANK15_V6_ROBUST_RUNTIME_AUTHORITY_VERIFICATION_20261009_V1.json"
          cp="canonical/governance/CURRENT_TERMINAL_AUTHORITY.json"
          a=json.loads((R/ap).read_text()); l=json.loads((R/lp).read_text()); v=json.loads((R/vp).read_text()); c=json.loads((R/cp).read_text())
          assert v["status"].startswith("PASS__")
          assert a["verification"]["git_blob_sha"] == blob(vp)
          assert l["rank15"]["authority_v10"]["git_blob_sha"] == blob(ap)
          assert l["current_counts"]["consumed_slots"] == 14
          assert l["rank15"]["task_read"] is False
          assert l["rank15"]["task_started"] is False
          assert l["rank15"]["benchmark_trials_consumed"] == 0
          r=c["tb_science_v26_projection_reconciliation"]
          assert r["current_authority_git_blob_sha"] == blob(ap)
          assert r["current_ledger_git_blob_sha"] == blob(lp)
          assert r["task_read"] is False and r["task_started"] is False
          assert c["authoritative_sources"]["tb_science_rank15_v6_robust_authority_v10"]["git_blob_sha"] == blob(ap)
          assert c["authoritative_sources"]["tb_science_current_slot_ledger_v26"]["git_blob_sha"] == blob(lp)
          assert a["public_execution_surface"]["workflow_git_blob_sha"] == "225ad2cadd536bdae94bbb5c3b7e79216438feb9"
          assert a["public_execution_surface"]["final_behavior_candidate_git_blob_sha"] == "7ec35ed0464cec7407174a3742c4a61e8b0c7c27"
          assert a["task_read_authority"] is False
          assert a["state"]["task_read"] is False
          assert a["state"]["task_started"] is False
          PY
