name: Verify P1 composite proof role

on:
  push:
    paths:
      - "canonical/governance/P1_COMPOSITE_PROOF_ROLE_RECONCILIATION_V1.json"
      - "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json"
      - "canonical/verification/TRAJECTORY_TYPED_IR_V4_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/runtime/trajectory_failure_typed_ir_proof_v4.py"
      - "canonical/tests/test_trajectory_failure_typed_ir_v4.py"
      - "canonical/runtime/contract_native_proof_suites.py"
      - "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json"
      - "canonical/runtime/p1_terminal_execution_scope_audit_v1.py"
      - "canonical/governance/P1_TERMINAL_EXECUTION_SCOPE_MISMATCH_QUARANTINE_V1.json"
      - "canonical/runtime/p1_composite_proof_role_verifier_v1.py"
      - "canonical/tests/test_p1_composite_proof_role_verifier_v1.py"
      - ".github/workflows/verify-p1-composite-proof-role.yml"
  pull_request:
    paths:
      - "canonical/governance/P1_COMPOSITE_PROOF_ROLE_RECONCILIATION_V1.json"
      - "canonical/runtime/p1_composite_proof_role_verifier_v1.py"
      - "canonical/tests/test_p1_composite_proof_role_verifier_v1.py"
      - ".github/workflows/verify-p1-composite-proof-role.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adversarial tests
        run: python -m unittest canonical.tests.test_p1_composite_proof_role_verifier_v1 -v
      - name: Evaluate live P1 composite role candidate
        run: python canonical/runtime/p1_composite_proof_role_verifier_v1.py
