name: Verify P1 composite proof role

on:
  push:
    paths:
      - "canonical/governance/P1_COMPOSITE_PROOF_ROLE_RECONCILIATION_V1.json"
      - "canonical/governance/P1_TRAJECTORY_T0_T2_MULTIPLEX_TERMINAL_BINDING_V1.json"
      - "canonical/verification/TRAJECTORY_TYPED_IR_V4_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/runtime/trajectory_failure_typed_ir_proof_v4.py"
      - "canonical/tests/test_trajectory_failure_typed_ir_v4.py"
      - "canonical/runtime/contract_native_proof_suites.py"
      - "canonical/verification/TERMINAL_V3_ONE_SHOT_WAVE_RESULT_20261002_V1.json"
      - "canonical/runtime/p1_terminal_execution_scope_audit_v1.py"
      - "canonical/governance/P1_TERMINAL_EXECUTION_SCOPE_MISMATCH_QUARANTINE_V1.json"
      - "canonical/runtime/p1_composite_proof_role_verifier_v1.py"
      - "canonical/tests/test_p1_composite_proof_role_verifier_v1.py"
      - ".github/workflows/verify-p1-composite-proof-role.yml"
  pull_request:
    paths:
      - "canonical/governance/P1_COMPOSITE_PROOF_ROLE_RECONCILIATION_V1.json"
      - "canonical/runtime/p1_composite_proof_role_verifier_v1.py"
      - "canonical/tests/test_p1_composite_proof_role_verifier_v1.py"
      - ".github/workflows/verify-p1-composite-proof-role.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adversarial tests
        run: python -m unittest canonical.tests.test_p1_composite_proof_role_verifier_v1 -v
      - name: Reproduce fail-closed live P1 composite quarantine
        run: |
          python - <<'PY'
          import json
          from canonical.runtime.p1_composite_proof_role_verifier_v1 import evaluate
          out=evaluate()
          assert out["pass"] is False, out
          assert out["quarantine_lift_eligible"] is False, out
          assert "V4_DROP_PROVENANCE_MUTATION_SURVIVES_SCORER" in out["errors"], out
          assert "V4_UNFALSIFIABLE_DIAGNOSIS_MUTATION_SURVIVES_SCORER" in out["errors"], out
          assert out["v4_drop_provenance_counterexample"]["counterexample_holds"] is True, out
          assert out["v4_unfalsifiable_diagnosis_counterexample"]["counterexample_holds"] is True, out
          assert out["terminal_results_replayed"] == 0, out
          assert out["new_reality_units_consumed"] == 0, out
          assert out["capability_credit_delta"] == 0, out
          assert out["family_credit_delta"] == 0, out
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
