                  "harness_verified_trials": len(harness_verified),
                  "unverified_trials": sum(1 for row in rows if row.get("reward_valid") is not True),
                  "failed_trials": sum(1 for row in rows if row.get("exception_types")),
                  "pinned_images_pulled": pulled_images.get("count", 0),
