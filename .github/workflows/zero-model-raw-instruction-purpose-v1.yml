name: Zero-model raw-instruction purpose bridge and hard falsifier

# WHY THIS WORKFLOW EXISTS
#
# Iteration 14 composes one finite raw-instruction purpose binder, one external
# editable finite template grammar, the exact-EVPI goal-directed sufficient-
# knowing kernel, a Brain-owned zero-model Harbor adapter and the existing
# run-id-seeded Terminal-Bench 4.1 selector. Job 1 is a distinct OIDC-attested
# finite replay with exact Git blob/SHA-256 bindings, stdlib-only import audit,
# 21 contract tests, one CLI binding, one exact-EVPI composition, external-store
# removal and zero model/network/parameter writes. Job 2 needs job 1, then runs
# fresh unseen CPU-only hard tasks through official Harbor and records runner-
# owned reward diagnostics. The runner lands both receipts and the reward log;
# the producer never writes the authoritative receipts. No hidden test,
# solution, verifier output, borrowed answer, raw task body, aggregate score,
# capability credit, PR, merge, section 6 verification or terminal truth change
# is made.

on:
  push:
    branches: [arena/6f8ac9ce-brain]
    paths:
      - ".github/workflows/zero-model-raw-instruction-purpose-v1.yml"
      - "canonical/runtime/raw_instruction_purpose_binder_v1.py"
      - "canonical/harbor/raw_instruction_purpose_policy_v1.py"
      - "canonical/harbor/raw_instruction_purpose_agent_v1.py"
      - "canonical/astra_runtime/state/RAW_INSTRUCTION_PURPOSE_TEMPLATE_STORE_V1.json"
      - "canonical/tests/test_raw_instruction_purpose_binder_v1.py"
      - "canonical/tests/test_raw_instruction_purpose_harbor_policy_v1.py"
      - "canonical/verification/check_raw_instruction_purpose_workflow_v1.py"
  workflow_dispatch:

concurrency:
  group: zero-model-raw-instruction-purpose-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  WORKSPACE: ${{ github.workspace }}
  HARBOR_VERSION: "0.27.0"
  TB_TAG: "v4.1.0"
  TB_SOURCE_SHA: "4070d6cef56a7d20cb5dc98d5e10ada88a6b9440"
  PREBUILT_MANIFEST_SHA256: "49a2b9ce70dbbb957f3eaf74c737ccb8c6d68b3167d4ccfb5c58762a9726b289"
  PREBUILT_TAR_SHA256: "c8bc0fea10af116061069248595c820d6da927652df1049ec834c6d98a6c12aa"
  AGENT_IMPORT_PATH: "canonical.harbor.raw_instruction_purpose_agent_v1:RawInstructionPurposeAgent"
  TASK_COUNT: "3"
  JOB_NAME: "brain-raw-instruction-purpose-tb41-cpu"
  FINITE_RECEIPT: "RAW_INSTRUCTION_PURPOSE_FINITE_REPLAY_RECEIPT_20261124_V1.json"
  HARD_RECEIPT: "RAW_INSTRUCTION_PURPOSE_TERMINAL_BENCH_4_1_RUNNER_RECEIPT_20261124_V1.json"
  REWARD_LOG: "RAW_INSTRUCTION_PURPOSE_TERMINAL_BENCH_4_1_REWARD_LOG_20261124_V1.json"

jobs:
  contract_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact frozen blobs and audit the zero-model source surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORKSPACE}/out"
          python3 - <<'PY'
          import ast, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["WORKSPACE"])
          out = root / "out"
          expected_git_blob = {
            "canonical/astra_runtime/state/RAW_INSTRUCTION_PURPOSE_TEMPLATE_STORE_V1.json": "4f4525e878f613133b7b377d55578c7c0f3bec49",
            "canonical/harbor/raw_instruction_purpose_agent_v1.py": "00f2f3a57979ed81fe9eadee2501da7a6c15fe01",
            "canonical/harbor/raw_instruction_purpose_policy_v1.py": "e7eaf0cbeda2b6938f7d3aeb5029906496f0a96e",
            "canonical/runtime/raw_instruction_purpose_binder_v1.py": "404d97482eae75fc48b88de7c29841dc20e4bd86",
            "canonical/tests/test_raw_instruction_purpose_binder_v1.py": "3f9797f699e0e0c1c0d78e5c7efbb7b9cd4a11ed",
            "canonical/tests/test_raw_instruction_purpose_harbor_policy_v1.py": "21ed2a90d7c2ee5e659ee9a57bff6cefc3a53a68"
          }
          expected_sha256 = {
            "canonical/astra_runtime/state/RAW_INSTRUCTION_PURPOSE_TEMPLATE_STORE_V1.json": "9d733bd875d3012893096f520d5a8aa5744272ee64c699fee7280d2a9ce37b64",
            "canonical/harbor/raw_instruction_purpose_agent_v1.py": "19a36977629b2cda0bcf8e7158f2bf5d15ef151a028650511cbf6e99910299b4",
            "canonical/harbor/raw_instruction_purpose_policy_v1.py": "58b35e8a6c7aa9661332051c0d2c1378ac4fda77e4985a846c75210e74ad42cd",
            "canonical/runtime/raw_instruction_purpose_binder_v1.py": "ef2f8e239142ed08d23985b7582b481f66b54c6658a84c1d72b85e6c1e3d389a",
            "canonical/tests/test_raw_instruction_purpose_binder_v1.py": "f35a8dbdf9235e93d83450bdf14b813594d1e6802a65855f0fd515bc4ce32723",
            "canonical/tests/test_raw_instruction_purpose_harbor_policy_v1.py": "0b6c5028baf30fc2fb458508bed71a6a06f4df4387af5164accb97555bb54beb"
          }
          observed_git_blob = {p: subprocess.check_output(["git", "hash-object", p], cwd=root, text=True).strip() for p in expected_git_blob}
          observed_sha256 = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in expected_sha256}
          if observed_git_blob != expected_git_blob or observed_sha256 != expected_sha256:
              raise SystemExit("EXACT_BLOB_BINDING_FAIL " + json.dumps({"expected_git_blob": expected_git_blob, "observed_git_blob": observed_git_blob, "expected_sha256": expected_sha256, "observed_sha256": observed_sha256}, sort_keys=True))
          forbidden = {"urllib", "requests", "httpx", "socket", "http", "openai", "anthropic", "litellm", "transformers", "torch", "tensorflow", "boto3", "subprocess", "huggingface_hub", "docker", "yaml", "selenium", "playwright", "intake"}
          audits = {}
          marked_all = []
          for rel in expected_git_blob:
              if not rel.endswith(".py"):
                  continue
              tree = ast.parse((root / rel).read_text(encoding="utf-8"), filename=rel)
              mods = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods.update(alias.name.split(".")[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      mods.add(node.module.split(".")[0])
              marked = sorted(mods & forbidden)
              audits[rel] = {"imports": sorted(mods), "marked": marked}
              if marked:
                  marked_all.append({"path": rel, "marked": marked})
          if marked_all:
              raise SystemExit("FORBIDDEN_IMPORT_IN_FROZEN_CONTRACT " + repr(marked_all))
          binder = (root / "canonical/runtime/raw_instruction_purpose_binder_v1.py").read_text(encoding="utf-8")
          policy = (root / "canonical/harbor/raw_instruction_purpose_policy_v1.py").read_text(encoding="utf-8")
          agent = (root / "canonical/harbor/raw_instruction_purpose_agent_v1.py").read_text(encoding="utf-8")
          gdsk_source = (root / "canonical/runtime/goal_directed_sufficient_knowing_v1.py").read_text(encoding="utf-8")
          for marker in ("EXACT_EVPI", "DISTINCT_VERIFIER_MISSING"):
              if marker not in gdsk_source:
                  raise SystemExit("EXACT_EVPI_OR_DISTINCT_VERIFIER_GUARD_ABSENT")
          for marker in ("deliberately not a natural-language interpreter", "BindingRefused", "EXTERNAL_EDITABLE_NOT_ASSERTED"):
              if marker not in binder:
                  raise SystemExit("BINDER_GUARD_ABSENT:" + marker)
          for marker in ("not a universal natural-language parser", "NO_FINITE_TYPED_TEMPLATE_MATCH", "hidden_test_reading"):
              if marker not in policy:
                  raise SystemExit("POLICY_GUARD_ABSENT:" + marker)
          if "model_name=None" not in agent:
              raise SystemExit("AGENT_MODEL_DEPENDENCY_GUARD_ABSENT")
          known_task_names = ("math-eval-grader", "html-js-filter", "bun-sourcemap-leak", "batched-eval-parity", "layout-config-recreation", "data-anonymization")
          for rel in ("canonical/runtime/raw_instruction_purpose_binder_v1.py", "canonical/harbor/raw_instruction_purpose_policy_v1.py", "canonical/harbor/raw_instruction_purpose_agent_v1.py"):
              lowered = (root / rel).read_text(encoding="utf-8").casefold()
              leaked = [name for name in known_task_names if name in lowered]
              if leaked:
                  raise SystemExit("TASK_SPECIFIC_ANSWER_LEAK " + repr(leaked))
          store = json.loads((root / "canonical/astra_runtime/state/RAW_INSTRUCTION_PURPOSE_TEMPLATE_STORE_V1.json").read_text(encoding="utf-8"))
          if store.get("schema") != "BRAIN_EXTERNAL_PURPOSE_TEMPLATE_STORE_V1" or store.get("external_editable") is not True or store.get("facts_or_skills_in_parameters") is not False:
              raise SystemExit("EXTERNAL_STORE_CONTRACT_INVALID")
          if len(store.get("templates") or []) < 2:
              raise SystemExit("EXTERNAL_TEMPLATE_GRAMMAR_NOT_NONTRIVIAL")
          bindings = {"expected_git_blob": expected_git_blob, "observed_git_blob": observed_git_blob, "expected_sha256": expected_sha256, "observed_sha256": observed_sha256, "equal": True}
          (out / "blob_bindings.json").write_text(json.dumps(bindings, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (out / "static_audit.json").write_text(json.dumps({"audits": audits, "marked": marked_all, "known_task_names_absent": True, "external_store_editable": True, "finite_grammar_templates": len(store["templates"])}, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("EXACT_BLOB_BINDING_PASS", len(expected_git_blob), "marked", marked_all)
          PY
      - name: Replay frozen contracts, CLI binding, exact EVPI and store removal from /tmp
        shell: bash
        working-directory: /tmp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["WORKSPACE"])
          request = {
              "schema": "BRAIN_TYPED_PURPOSE_BINDING_REQUEST_V1",
              "raw_instruction": "Create `/app/result.txt` with `hello` in a bounded file workspace.",
              "template_id": "create_literal_file",
              "quoted_slots": {"path": "/app/result.txt", "literal": "hello"},
              "environment_evidence": {"source": "BOUNDED_ENVIRONMENT_SCAN", "scope": {"closed_world": True, "bounded_enumerated": True}, "evidence_ref": "bounded-file-name-scan:finite-replay", "falsifier": "file-name scan omits a visible atom or includes a forbidden hidden path"},
              "distinct_verifier": {"source": "DISTINCT_VERIFIER", "scope": {"closed_world": True, "bounded_enumerated": True}, "evidence_ref": "github-actions-oidc:finite-replay", "falsifier": "official bounded state check differs from the typed success predicate"},
              "distinct_from_producer": True,
              "visible_scan_atoms": ["/app/input.txt"],
              "domain": "software_repository",
              "action_universe_complete": True,
              "hypothesis_model": [
                  {"id": "v_safe", "probability": 0.5, "utilities": {"A1": 1.0, "A2": 0.0}},
                  {"id": "v_unsafe", "probability": 0.5, "utilities": {"A1": 0.0, "A2": 1.0}},
              ],
              "unknown_evidence": {"label": "K1_SCOPED_FACT", "decision_relevant": True, "source": {"source": "BOUNDED_ENVIRONMENT_SCAN", "scope": {"closed_world": True, "bounded_enumerated": True}, "evidence_ref": "bounded-file-name-scan:finite-replay", "falsifier": "typed target presence changes action ordering"}, "distinct_from_producer": False, "evidence_ref": "bounded-file-name-scan:finite-replay", "falsifier": "typed target presence changes action ordering"},
              "query_cost": 0.0,
          }
          pathlib.Path("/tmp/raw_instruction_purpose_request.json").write_text(json.dumps(request, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("TYPED_REQUEST_WRITTEN")
          PY
          python3 -I -B "${WORKSPACE}/canonical/runtime/raw_instruction_purpose_binder_v1.py" \
            --request /tmp/raw_instruction_purpose_request.json \
            --store "${WORKSPACE}/canonical/astra_runtime/state/RAW_INSTRUCTION_PURPOSE_TEMPLATE_STORE_V1.json" \
            --out "${WORKSPACE}/out/cli_binding.json"
          PYTHONPATH="${WORKSPACE}" python3 -B -m unittest -v canonical.tests.test_raw_instruction_purpose_binder_v1 canonical.tests.test_raw_instruction_purpose_harbor_policy_v1 2>&1 | tee "${WORKSPACE}/out/contract_tests.log"
          python3 -I -B - <<'PY'
          import copy, json, os, pathlib, sys
          root = pathlib.Path(os.environ["WORKSPACE"])
          out = root / "out"
          sys.path.insert(0, str(root))
          from canonical.runtime import goal_directed_sufficient_knowing_v1 as gdsk
          from canonical.runtime import raw_instruction_purpose_binder_v1 as binder
          from canonical.harbor import raw_instruction_purpose_policy_v1 as policy
          cli = json.loads((out / "cli_binding.json").read_text(encoding="utf-8"))
          packet = cli["packet"]
          decision = gdsk.evaluate(packet)
          query = decision["selected_queries"][0] if decision["selected_queries"] else {}
          plan = policy.plan("Create `/app/result.txt` with `hello`.", "/app/input.txt\n")
          refusal = policy.plan("Repair the unknown system.", "/app/input.txt\n")
          store = binder.load_external_store(root / "canonical/astra_runtime/state/RAW_INSTRUCTION_PURPOSE_TEMPLATE_STORE_V1.json")
          edited = copy.deepcopy(store)
          edited["templates"] = [row for row in edited["templates"] if row["template_id"] == "copy_visible_file"]
          temp_store = pathlib.Path("/tmp/raw_instruction_purpose_removed_store.json")
          temp_store.write_text(json.dumps(edited, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          removed = policy.plan("Create `/app/result.txt` with `hello`.", "/app/input.txt\n", store_path=temp_store)
          unbounded = policy.plan("Understand anything in the repository.", "/app/input.txt\n")
          (out / "policy_decision.json").write_text(json.dumps({"bound": plan, "refusal": refusal, "removed_store": removed, "unbounded": unbounded}, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          tests = (out / "contract_tests.log").read_text(encoding="utf-8")
          measurement_checks = {
              "test_count": "Ran 21 tests" in tests and "OK" in tests,
              "cli_bound": cli.get("status") == "BOUND__TYPED_ACTION_QUOTIENT",
              "cli_packet_schema": packet.get("schema") == binder.GDSK_PACKET_SCHEMA,
              "cli_exact_evpi_basis": query.get("value_of_information_basis") == "EXACT_EVPI",
              "cli_question_derived": query.get("question_source") == "DERIVED_FROM_ACTION_PARTITION",
              "cli_minimal_query_count": decision.get("selected_query_count") == 1,
              "cli_distinct_verifier": decision.get("distinct_verifier_present") is True,
              "policy_bound": plan.get("status") == "BOUND__HARBOR_HARNESS_ACTION_AUTHORIZED",
              "policy_one_safe_command": len(plan.get("commands") or []) == 1 and policy.command_is_safe(plan["commands"][0]),
              "policy_gdsk_ready": plan.get("gdsk_decision", {}).get("decision") == gdsk.READY_FOR_DISTINCT_VERIFIER,
              "policy_refuses_unmatched": refusal.get("status") == "REFUSED__NO_ENVIRONMENT_ACTION" and not refusal.get("commands"),
              "store_removal_changes_behavior": removed.get("status") == "REFUSED__NO_ENVIRONMENT_ACTION" and not removed.get("commands"),
              "unbounded_purpose_refused": unbounded.get("status") == "REFUSED__NO_ENVIRONMENT_ACTION" and not unbounded.get("commands"),
              "zero_model_calls": cli.get("model_calls") == 0 and plan.get("model_calls") == 0,
              "zero_runtime_network_calls": cli.get("runtime_network_calls") == 0 and plan.get("runtime_network_calls") == 0,
              "zero_parameter_writes": cli.get("parameters_written") == 0 and plan.get("parameters_written") == 0,
              "no_trajectory_or_world_fact_warehouse": cli.get("trajectory_saved") is False and cli.get("world_fact_warehouse") is False and plan.get("trajectory_saved") is False,
              "no_execution_authority_in_kernel": decision.get("execution_authority") is False,
              "no_benchmark_score_authority": decision.get("benchmark_score_authority") is False,
              "section_6_not_met": decision.get("truth", {}).get("section_6") == "NOT_MET",
          }
          failed = sorted(k for k, v in measurement_checks.items() if not v)
          if failed:
              raise SystemExit("FROZEN_BRIDGE_REPLAY_MEASUREMENTS_FAIL " + repr(failed))
          (out / "measurement_checks.json").write_text(json.dumps(measurement_checks, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("FROZEN_BRIDGE_REPLAY_PASS", 21, "tests", len(measurement_checks), "checks")
          PY
      - name: Bind first runner-owned OIDC receipt for the finite replay
        if: success()
        shell: bash
        env:
          OIDC_AUDIENCE: https://github.com/${{ github.repository }}
          TOKEN_JSON: /tmp/oidc_finite_token.json
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" > "${TOKEN_JSON}"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["WORKSPACE"])
          out = root / "out"
          token = json.loads(pathlib.Path(os.environ["TOKEN_JSON"]).read_text(encoding="utf-8"))["value"]
          part = token.split(".")[1]
          part += "=" * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          audience = os.environ["OIDC_AUDIENCE"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          workflow_path = ".github/workflows/zero-model-raw-instruction-purpose-v1.yml"
          checks = {
              "issuer": str(claims.get("iss")) == "https://token.actions.githubusercontent.com",
              "audience": str(claims.get("aud")) == audience,
              "repository": str(claims.get("repository")) == os.environ["GITHUB_REPOSITORY"],
              "run_id": int(claims.get("run_id", -1)) == run_id,
              "event_name": str(claims.get("event_name")) in {"push", "workflow_dispatch", "pull_request"},
              "workflow_path": workflow_path in str(claims.get("workflow_ref")),
              "github_hosted": str(claims.get("runner_environment")) == "github-hosted",
          }
          if "run_attempt" in claims:
              checks["run_attempt"] = int(claims["run_attempt"]) == run_attempt
          if "sha" in claims:
              checks["sha"] = str(claims["sha"]) == os.environ["GITHUB_SHA"]
          if "ref" in claims:
              checks["ref"] = str(claims["ref"]) == os.environ["GITHUB_REF"]
          failed = sorted(k for k, v in checks.items() if not v)
          if failed:
              raise SystemExit("OIDC_RUN_REFERENCE_BINDING_FAIL " + repr(failed))
          keep = ("iss", "aud", "repository", "repository_id", "workflow_ref", "job_workflow_ref", "run_id", "run_attempt", "event_name", "head_ref", "ref", "sha", "actor", "actor_id", "jti", "runner_environment")
          oidc_claims = {k: claims.get(k) for k in keep}
          bindings = json.loads((out / "blob_bindings.json").read_text(encoding="utf-8"))
          audit = json.loads((out / "static_audit.json").read_text(encoding="utf-8"))
          measurements = json.loads((out / "measurement_checks.json").read_text(encoding="utf-8"))
          cli = json.loads((out / "cli_binding.json").read_text(encoding="utf-8"))
          policy = json.loads((out / "policy_decision.json").read_text(encoding="utf-8"))
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          verifier_identity = "github-actions-oidc:" + str(claims.get("workflow_ref")) + "#job-contract_replay-run-" + str(run_id)
          receipt = {
              "schema": "BRAIN_RAW_INSTRUCTION_PURPOSE_FINITE_REPLAY_RECEIPT_20261124_V1",
              "date": "2026-11-24",
              "status": "RUNNER_OWNED_OIDC_ATTESTED_FINITE_RAW_INSTRUCTION_PURPOSE_REPLAY__ZERO_CREDIT__SECTION_6_NOT_MET",
              "authority": "GITHUB_ACTIONS_OIDC_ATTESTED_FINITE_CONTRACT_REPLAY__NO_CAPABILITY_OR_TERMINAL_CREDIT",
              "scope": "RAW_INSTRUCTION_PURPOSE_BINDER_V1_FINITE_CONTRACT_ONLY",
              "independent_verified": True,
              "producer_id": "arena-agent:arena/6f8ac9ce-brain",
              "verifier_id": verifier_identity,
              "workflow_run_id": run_id,
              "workflow_run_attempt": run_attempt,
              "workflow_run_url": run_url,
              "workflow_path": workflow_path,
              "workflow_job": "contract_replay",
              "head_sha": os.environ.get("GITHUB_SHA"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "runner_environment": claims.get("runner_environment"),
              "github_repository": os.environ.get("GITHUB_REPOSITORY"),
              "oidc_claims": oidc_claims,
              "oidc_jti": claims.get("jti"),
              "pinned_blob_binding": bindings,
              "static_audit": audit,
              "measurement_checks": measurements,
              "cli_decision": cli.get("status"),
              "policy_decision": policy.get("bound", {}).get("status"),
              "numeric_measurements": {
                  "pinned_blobs": len(bindings["expected_git_blob"]),
                  "contract_tests": 21,
                  "measurement_checks": len(measurements),
                  "selected_queries": 1,
                  "model_calls": 0,
                  "runtime_network_calls": 0,
                  "parameters_written": 0,
                  "environment_actions_executed": 0,
                  "hard_benchmark_tasks_consumed": 0,
              },
              "verified": ["EXACT_PINNED_BLOBS_BOUND", "ZERO_MODEL_ZERO_NETWORK_STDLIB_IMPORT_SURFACE", "EXTERNAL_EDITABLE_FINITE_TEMPLATE_GRAMMAR", "TWENTY_ONE_FROZEN_CONTRACT_TESTS_PASS", "EXACT_EVPI_MINIMAL_QUESTION_SELECTION", "POLICY_FAILS_CLOSED_ON_UNMATCHED_AND_UNBOUNDED_PURPOSE", "STORE_REMOVAL_CHANGES_BEHAVIOR_WITHOUT_RETRAINING", "OIDC_RUN_REFERENCE_BOUND", "NO_CAPABILITY_OR_TERMINAL_CREDIT"],
              "not_verified": ["OSWorld 2.1 tasks", "SWE-bench Pro V2 or HARD-51 tasks", "Terminal-Bench 4.1 tasks", "arbitrary natural-language purpose understanding", "authored repair content", "GUI or browser computer use", "section 6 terminal capability"],
              "capability_credit_delta": 0,
              "family_credit_delta": 0,
              "terminal_credit_delta": 0,
              "new_reality_units_consumed": 0,
              "incremental_spend_usd": 0,
              "benchmark_score_authority": False,
              "execution_authority": False,
              "promotion_authority": False,
              "section_6_verifications": 0,
              "truth": {"achieved": False, "section_6": "NOT_MET"},
              "rule": "VERIFICATION_APPLIES_ONLY_TO_EXACT_LISTED_BLOBS_AND_MEASUREMENTS__ANY_SEMANTIC_BYTE_CHANGE_REQUIRES_REVERIFICATION",
          }
          receipt_path = out / os.environ["FINITE_RECEIPT"]
          data = json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False).encode("utf-8") + b"\n"
          receipt_path.write_bytes(data)
          (out / (os.environ["FINITE_RECEIPT"] + ".sha256")).write_text(hashlib.sha256(data).hexdigest() + "\n", encoding="utf-8")
          print("FINITE_OIDC_RUN_REFERENCE_BOUND", run_id, run_attempt)
          print("FINITE_RECEIPT_SHA256", hashlib.sha256(data).hexdigest())
