          receipt_path = out / os.environ["HARD_RECEIPT"]
          data = json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False).encode("utf-8") + b"\n"
          receipt_path.write_bytes(data)
          (out / (os.environ["HARD_RECEIPT"] + ".sha256")).write_text(
              hashlib.sha256(data).hexdigest() + "\n", encoding="utf-8"
          )
          receipt_blob = subprocess.check_output(["git", "hash-object", str(receipt_path)], cwd=root, text=True).strip()
          print("OIDC_RUN_REFERENCE_BOUND", run_id, run_attempt)
          print("RUNNER_RECEIPT_SHA256", hashlib.sha256(data).hexdigest())
          print("RUNNER_RECEIPT_GIT_BLOB", receipt_blob)
          print(json.dumps({"status": receipt["status"], "verified": len(verified), "unverified": len(unverified), "failed": len(failed), "truth": receipt["truth"]}, sort_keys=True))
          PY
          cat "${WORKSPACE}/out/RAW_INSTRUCTION_PURPOSE_TERMINAL_BENCH_4_1_RUNNER_RECEIPT_20261124_V1.json"
      - name: Land runner-owned receipt and reward log on the active branch
        if: always() && steps.oidc_receipt.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/arena/6f8ac9ce-brain' && github.repository == 'moxnixmdj/brain'
        shell: bash
        run: |
          set -euo pipefail
          cd "${WORKSPACE}"
          cp "out/finite/${FINITE_RECEIPT}" \
             "canonical/verification/${FINITE_RECEIPT}"
          cp "out/finite/${FINITE_RECEIPT}.sha256" \
             "canonical/verification/${FINITE_RECEIPT}.sha256"
          cp "out/${HARD_RECEIPT}" \
             "canonical/verification/${HARD_RECEIPT}"
          cp "out/${HARD_RECEIPT}.sha256" \
             "canonical/verification/${HARD_RECEIPT}.sha256"
          cp "out/${REWARD_LOG}" \
             "canonical/verification/${REWARD_LOG}"
          git config user.name "project-brain-zero-model-raw-instruction-purpose-runner"
          git config user.email "project-brain-zero-model-raw-instruction-purpose-runner@users.noreply.github.com"
          git add "canonical/verification/${FINITE_RECEIPT}" \
                  "canonical/verification/${FINITE_RECEIPT}.sha256" \
                  "canonical/verification/${HARD_RECEIPT}" \
                  "canonical/verification/${HARD_RECEIPT}.sha256" \
                  "canonical/verification/${REWARD_LOG}"
          if git diff --cached --quiet; then
            echo "NO_RUNNER_RECEIPT_CHANGE"
            exit 0
          fi
          git commit -m "Record runner-owned raw-instruction-purpose TB4.1 harness attempt"
          git pull --rebase origin arena/6f8ac9ce-brain
          git push origin HEAD:arena/6f8ac9ce-brain
      - name: Upload runner-owned sanitized hard-benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-model-raw-instruction-purpose-runner
          path: out/
          if-no-files-found: warn
          retention-days: 90
