                  "model_cli_args": 0,
              },
              "finite_replay": {"receipt_sha256": finite_sha, "workflow_run_id": finite_receipt.get("workflow_run_id"), "contract_tests": finite_receipt.get("numeric_measurements", {}).get("contract_tests"), "status": finite_receipt.get("status")},
              "source_binding": bindings,
