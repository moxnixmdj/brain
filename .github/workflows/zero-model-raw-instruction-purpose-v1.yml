      - name: Bind exact Brain-owned source bytes and audit no-inference surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORKSPACE}/out"
          python3 - <<'PY'
          import ast, hashlib, json, os, pathlib, sys
          root = pathlib.Path(os.environ["WORKSPACE"])
          out = root / "out"
          expected = {
            "canonical/astra_runtime/state/RAW_INSTRUCTION_PURPOSE_TEMPLATE_STORE_V1.json": "9d733bd875d3012893096f520d5a8aa5744272ee64c699fee7280d2a9ce37b64",
            "canonical/harbor/raw_instruction_purpose_agent_v1.py": "19a36977629b2cda0bcf8e7158f2bf5d15ef151a028650511cbf6e99910299b4",
            "canonical/harbor/raw_instruction_purpose_policy_v1.py": "58b35e8a6c7aa9661332051c0d2c1378ac4fda77e4985a846c75210e74ad42cd",
            "canonical/harbor/select_tb41_cpu_tasks_v1.py": "190a5786c41b3f6470228013e57943fcc4984a2205c8f71296ca9e66d176f4c9",
            "canonical/runtime/goal_directed_sufficient_knowing_v1.py": "cbdc8db87e756d36587fcdadc91b54e0cf14500263aa37857689b1c3ff38ad5f",
            "canonical/runtime/raw_instruction_purpose_binder_v1.py": "ef2f8e239142ed08d23985b7582b481f66b54c6658a84c1d72b85e6c1e3d389a",
            "canonical/tests/test_raw_instruction_purpose_binder_v1.py": "f35a8dbdf9235e93d83450bdf14b813594d1e6802a65855f0fd515bc4ce32723",
            "canonical/tests/test_raw_instruction_purpose_harbor_policy_v1.py": "0b6c5028baf30fc2fb458508bed71a6a06f4df4387af5164accb97555bb54beb"
          }
          observed = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in expected}
          if observed != expected:
              raise SystemExit("EXACT_SOURCE_SHA256_BINDING_FAIL " + json.dumps({"expected": expected, "observed": observed}, sort_keys=True))
          forbidden = {"urllib", "requests", "httpx", "socket", "http", "openai", "anthropic", "litellm", "transformers", "torch", "tensorflow", "boto3", "subprocess", "intake"}
          imports = {}
          marked_imports = []
          for rel in expected:
              tree = ast.parse((root / rel).read_text(encoding="utf-8"))
              mods = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods.update(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      mods.add(node.module)
              roots = sorted({item.split(".")[0] for item in mods})
              imports[rel] = roots
              marked = sorted(set(roots) & forbidden)
              if marked:
                  marked_imports.append({"path": rel, "marked": marked})
          if marked_imports:
              raise SystemExit("FORBIDDEN_IMPORT_IN_BRAIN_AGENT_SURFACE " + repr(marked_imports))
          known_task_names = ("math-eval-grader", "html-js-filter", "bun-sourcemap-leak", "batched-eval-parity", "layout-config-recreation", "data-anonymization")
          for rel in ("canonical/harbor/raw_instruction_purpose_policy_v1.py", "canonical/harbor/raw_instruction_purpose_agent_v1.py", "canonical/runtime/raw_instruction_purpose_binder_v1.py"):
              lowered = (root / rel).read_text(encoding="utf-8").casefold()
              leaked = [name for name in known_task_names if name in lowered]
              if leaked:
                  raise SystemExit("TASK_SPECIFIC_ANSWER_LEAK " + repr(leaked))
          selector_source = (root / "canonical/harbor/select_tb41_cpu_tasks_v1.py").read_text(encoding="utf-8").casefold()
          if "instruction.md" in selector_source or "tests/test.sh" in selector_source:
              raise SystemExit("SELECTOR_READS_HIDDEN_TASK_CONTENT")
          sys.path.insert(0, str(root))
          from canonical.harbor import raw_instruction_purpose_policy_v1 as policy
          scan = policy.scan_command()
          if not policy.scan_is_safe(scan) or "-prune" not in scan:
              raise SystemExit("UNSAFE_SCAN_COMMAND")
          generic = policy.plan("Create `/app/result.txt` with `hello`.", "/app/input.txt\n")
          if generic["status"] != "BOUND__HARBOR_HARNESS_ACTION_AUTHORIZED" or len(generic["commands"]) != 1 or not all(policy.command_is_safe(c) for c in generic["commands"]):
              raise SystemExit("GENERIC_POLICY_PLAN_FAIL")
          refusal = policy.plan("Repair the unknown system.", "/app/input.txt\n")
          if refusal["status"] != "REFUSED__NO_ENVIRONMENT_ACTION" or refusal["commands"]:
              raise SystemExit("UNRESOLVED_PURPOSE_DID_NOT_REFUSE")
          binding = {"schema": "BRAIN_RAW_INSTRUCTION_PURPOSE_SOURCE_BINDING_V1", "expected": expected, "observed": observed, "equal": True}
          audit = {"schema": "BRAIN_RAW_INSTRUCTION_PURPOSE_STATIC_AUDIT_V1", "imports": imports, "marked_imports": marked_imports, "known_task_names_absent_from_agent_and_policy": True, "scan_is_safe": True, "generic_plan_is_safe": True, "unresolved_purpose_refused": True, "selector_reads_hidden_task_content": False}
          (out / "blob_bindings.json").write_text(json.dumps(binding, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (out / "static_audit.json").write_text(json.dumps(audit, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("EXACT_SOURCE_SHA256_BINDING_PASS", len(expected), "marked_imports", marked_imports)
          PY
      - name: Checkout and verify pinned Terminal-Bench 4.1 release
