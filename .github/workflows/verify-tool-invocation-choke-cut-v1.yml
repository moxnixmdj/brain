name: Verify tool invocation choke-point cut V1

on:
  push:
    branches:
      - tool-discovery-owned-gateway-v1-20261003
    paths:
      - 'canonical/runtime/**'
      - 'canonical/tests/test_tool_invocation_choke_point_cut_v1.py'
      - 'canonical/governance/TOOL_INVOCATION_CHOKE_POINT_CUT_V1.json'
      - '.github/workflows/verify-tool-invocation-choke-cut-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run choke-point cut tests
        run: python -m unittest canonical.tests.test_tool_invocation_choke_point_cut_v1 -v
      - name: Emit exact invocation surface inventory
        run: python canonical/runtime/tool_invocation_choke_point_cut_v1.py
