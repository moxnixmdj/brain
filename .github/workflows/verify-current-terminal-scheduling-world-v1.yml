name: Verify current terminal scheduling world v1

on:
  push:
    paths:
      - "canonical/runtime/current_terminal_scheduling_world_v1.py"
      - "canonical/tests/test_current_terminal_scheduling_world_v1.py"
      - ".github/workflows/verify-current-terminal-scheduling-world-v1.yml"
  pull_request:
    paths:
      - "canonical/runtime/current_terminal_scheduling_world_v1.py"
      - "canonical/tests/test_current_terminal_scheduling_world_v1.py"
      - ".github/workflows/verify-current-terminal-scheduling-world-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run fail-closed scheduling world tests
        run: python -m unittest canonical.tests.test_current_terminal_scheduling_world_v1 -v
      - name: Compile live world and compare to current authority
        run: |
          python canonical/runtime/current_terminal_scheduling_world_v1.py > CURRENT_TERMINAL_SCHEDULING_WORLD_RESULT.json
          python - <<'PY'
          import json
          x=json.load(open("CURRENT_TERMINAL_SCHEDULING_WORLD_RESULT.json"))
          a=json.load(open("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"))
          af=a["atomic_acceptance_frontier"]
          assert x["pass"] is True,x
          assert x["registry_predicate_count"]==af["total"],x
          assert x["proved_predicate_count"]==af["proved"],x
          assert x["unresolved_predicate_count"]==af["unresolved"],x
          assert x["live_action_coverage_count"]==af["unresolved"],x
          assert x["uncovered_predicates"]==[],x
          assert "TOOL_LEARNING_SUCCESS_ROUTE_NONINFERIOR" in x["unresolved_predicates"],x
          for pid in ("DELEGATION_TERMINAL_SUCCESS_NONINFERIOR","RECOVERY_CAUSAL_LOCALIZATION_NONINFERIOR","RECOVERY_TERMINAL_NONINFERIOR","RECOVERY_ZERO_CRITICAL_FAIL_CLOSED_MISSES"):
              assert pid in x["proved_predicates"],(pid,x)
              assert pid not in x["unresolved_predicates"],(pid,x)
          assert x["new_reality_units_consumed"]==0,x
          assert x["execution_authority"] is False,x
          assert x["promotion_authority"] is False,x
          print("live receipt-derived scheduling world verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-terminal-scheduling-world-v1
          path: CURRENT_TERMINAL_SCHEDULING_WORLD_RESULT.json
          if-no-files-found: error
