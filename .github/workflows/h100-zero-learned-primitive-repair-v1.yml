name: H100 zero-learned primitive repair V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/governance/H100_ZERO_LEARNED_PRIMITIVE_REPAIR_PREEXPOSURE_V1.json'
      - 'canonical/governance/H100_ZERO_LEARNED_PRIMITIVE_REPAIR_CANDIDATE_V1.json'
      - 'canonical/runtime/h100_zero_learned_parametric_unary_v1.py'
      - 'canonical/tests/test_h100_zero_learned_parametric_unary_v1.py'
      - 'canonical/runtime/h100_zero_learned_primitive_repair_v1.py'
      - 'canonical/tests/test_h100_zero_learned_primitive_repair_v1.py'
      - '.github/workflows/h100-zero-learned-primitive-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h100-zero-learned-primitive-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-test:
    name: candidate-${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sine-fresh
            selector: canonical.tests.test_h100_zero_learned_parametric_unary_v1.H100ZeroLearnedParametricUnaryTests.test_unseen_frequency_linear_trend_sinusoid
          - id: exp-fresh
            selector: canonical.tests.test_h100_zero_learned_parametric_unary_v1.H100ZeroLearnedParametricUnaryTests.test_unseen_exp_abs_rate
          - id: step-fresh
            selector: canonical.tests.test_h100_zero_learned_parametric_unary_v1.H100ZeroLearnedParametricUnaryTests.test_observed_threshold_step
          - id: cubic-negative
            selector: canonical.tests.test_h100_zero_learned_parametric_unary_v1.H100ZeroLearnedParametricUnaryTests.test_nonmatching_cubic_fails_closed
          - id: zero-accounting
            selector: canonical.tests.test_h100_zero_learned_parametric_unary_v1.H100ZeroLearnedParametricUnaryTests.test_accounting_is_zero_learned
          - id: phase2-freeze
            selector: canonical.tests.test_h100_zero_learned_primitive_repair_v1.H100ZeroLearnedPrimitiveRepairTests.test_phase2_is_frozen_to_exact_three_phase1_failures
          - id: unary-guard
            selector: canonical.tests.test_h100_zero_learned_primitive_repair_v1.H100ZeroLearnedPrimitiveRepairTests.test_route_rejects_multivariable_input
          - id: phase2-accounting
            selector: canonical.tests.test_h100_zero_learned_primitive_repair_v1.H100ZeroLearnedPrimitiveRepairTests.test_phase2_route_is_zero_learned_by_contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest "${{ matrix.selector }}" -v

  phase2:
    name: phase2-${{ matrix.task }}
    needs: candidate-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [PERIODIC_SINE, EXPONENTIAL, SIGN_STEP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >
          python canonical/runtime/h100_zero_learned_primitive_repair_v1.py
          --task "${{ matrix.task }}"
          --require-useful
