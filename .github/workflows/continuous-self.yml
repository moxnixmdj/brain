name: continuous self survives a kill
# The gate is the SIGKILL test: a process killed mid-task must come back as the same identity and
# report the in-flight work as INTERRUPTED. A process that loses an attempt silently has amnesia
# with a fresh timestamp, which is the opposite of continuity.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest
      - name: A kill must not become amnesia
        run: python -m pytest canonical/tests/test_continuous_self_survives_a_kill_v1.py -q
