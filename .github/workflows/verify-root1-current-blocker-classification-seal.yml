name: Verify Root1 current blocker classification seal
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/root1_current_blocker_classification_seal_v1.py"
      - "canonical/tests/test_root1_current_blocker_classification_seal_v1.py"
      - "canonical/governance/ROOT1_CURRENT_BLOCKER_CLASSIFICATION_SEAL_V1.json"
      - ".github/workflows/verify-root1-current-blocker-classification-seal.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile canonical/runtime/root1_current_blocker_classification_seal_v1.py
      - run: |
          export PYTHONPATH=.
          python -m unittest canonical.tests.test_root1_current_blocker_classification_seal_v1 -v
