name: verify-unified-live-brain-r1
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - canonical/runtime/live_brain_runtime_v1.py
      - canonical/runtime/bound_capability_problem_compiler_v1.py
      - canonical/governance/LIVE_BRAIN_RUNTIME_V1_ACTIVATION_20261008_V1.json
      - canonical/tests/test_live_brain_runtime_v1.py
      - canonical/tests/test_bound_capability_problem_compiler_v1.py
      - .github/workflows/verify-unified-live-brain-r1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python -m unittest -v
          canonical.tests.test_bound_capability_problem_compiler_v1
          canonical.tests.test_live_brain_runtime_v1
