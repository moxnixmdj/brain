name: Full private current-main regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/full-private-current-main-regression.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-private-current-main-regression.yml"
  workflow_dispatch:

concurrency:
  group: full-private-current-main-regression-latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: [self-hosted, Linux, X64, brain-regression]
    timeout-minutes: 30
    env:
      EXPECTED_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact test runner
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/brain-regression-venv"
          python -m venv --clear "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check pytest==9.1.1 numpy "pydantic>=2,<3" python-docx Pillow opencv-python-headless langdetect cadquery==2.6.1 pypdf==6.19.0 sympy==1.14.0 mpmath==1.3.0 lark==1.3.1
          printf '%s\n' "${venv}/bin" >> "${GITHUB_PATH}"

      - name: Record exact subject
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/brain-regression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}"
          git rev-parse HEAD | tee "${root}/subject_sha.txt"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SUBJECT_SHA}"
          printf '%s\n' "${GITHUB_RUN_ID}" > "${root}/run_id.txt"
          printf '%s\n' "${GITHUB_RUN_ATTEMPT}" > "${root}/run_attempt.txt"
          python --version | tee "${root}/python_version.txt"
          python -m pytest --version | tee "${root}/pytest_version.txt"
          printf '%s\n' "${RUNNER_NAME}" | tee "${root}/runner_name.txt"

      - name: Compile assurance and professional load-bearing runtimes
        run: |
          python -m py_compile \
            canonical/runtime/assurance_closure_compiler_v1.py \
            canonical/runtime/assurance_closure_reference_checker_v1.py \
            canonical/runtime/assurance_closure_adversary_v1.py \
            canonical/runtime/professional_semantic_v10_totality_compiler_v1.py

      - name: Full private current-main full-system regression
        id: full
        shell: bash
        run: |
          set +e
          root="${RUNNER_TEMP}/brain-regression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'started\n' > "${root}/pytest_started.txt"
          python -m pytest -q canonical/tests \
            --disable-warnings \
            --junitxml="${root}/pytest.xml" \
            > "${root}/pytest.txt" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "${root}/pytest_rc.txt"
          printf 'completed\n' > "${root}/pytest_completed.txt"
          tail -n 250 "${root}/pytest.txt"
          exit "$rc"

      - name: Focused assurance differential replay
        if: always()
        shell: bash
        run: |
          set +e
          root="${RUNNER_TEMP}/brain-regression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${root}"
          printf 'started\n' > "${root}/assurance_started.txt"
          python -m unittest \
            canonical.tests.test_assurance_closure_compiler_v1 \
            canonical.tests.test_assurance_closure_independent_adversary_v1 \
            -v > "${root}/assurance.txt" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "${root}/assurance_rc.txt"
          printf 'completed\n' > "${root}/assurance_completed.txt"
          tail -n 100 "${root}/assurance.txt"
          exit "$rc"

      - name: Build regression receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/f"brain-regression-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          def read(name):
              p=root/name
              return p.read_text(errors="replace") if p.exists() else ""
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          expected=os.environ["EXPECTED_SUBJECT_SHA"]
          recorded=read("subject_sha.txt").strip()
          pytest_out=read("pytest.txt")
          assurance_out=read("assurance.txt")
          pytest_rc=int((read("pytest_rc.txt") or "999").strip())
          assurance_rc=int((read("assurance_rc.txt") or "999").strip())
          subject_binding=bool(recorded) and recorded==sha==expected
          pytest_started=read("pytest_started.txt").strip()=="started"
          pytest_completed=read("pytest_completed.txt").strip()=="completed"
          assurance_started=read("assurance_started.txt").strip()=="started"
          assurance_completed=read("assurance_completed.txt").strip()=="completed"
          tests_executed=0
          xml_path=root/"pytest.xml"
          if subject_binding and pytest_started and pytest_completed and xml_path.exists():
              doc=ET.parse(xml_path).getroot()
              suites=[doc] if doc.tag=="testsuite" else list(doc.findall("testsuite"))
              tests_executed=sum(int(s.attrib.get("tests","0")) for s in suites)
          passed=(subject_binding and pytest_started and pytest_completed and assurance_started and assurance_completed and tests_executed>0 and pytest_rc==0 and assurance_rc==0)
          receipt={
            "schema":"PROJECT_BRAIN_FULL_PRIVATE_CURRENT_MAIN_FULL_SYSTEM_REGRESSION_V2",
            "subject_commit_sha":sha,
            "expected_subject_sha":expected,
            "subject_binding":subject_binding,
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "python_version":read("python_version.txt").strip(),
            "pytest_version":read("pytest_version.txt").strip(),
            "runner_name":read("runner_name.txt").strip(),
            "pytest_started":pytest_started,
            "pytest_completed":pytest_completed,
            "full_pytest_command":"python -m pytest -q canonical/tests --disable-warnings --junitxml=<isolated-run-root>/pytest.xml",
            "pytest_tests_executed":tests_executed,
            "pytest_returncode":pytest_rc,
            "pytest_output_sha256":hashlib.sha256(pytest_out.encode()).hexdigest(),
            "assurance_started":assurance_started,
            "assurance_completed":assurance_completed,
            "assurance_command":"python -m unittest canonical.tests.test_assurance_closure_compiler_v1 canonical.tests.test_assurance_closure_independent_adversary_v1 -v",
            "assurance_returncode":assurance_rc,
            "assurance_output_sha256":hashlib.sha256(assurance_out.encode()).hexdigest(),
            "full_private_current_main_regression_pass":passed,
            "artifact_upload_required_for_validity":False,
            "quality_authority":False,
            "acceptance_authority":False,
            "terminal_authority":False
          }
          summary=json.dumps(receipt,sort_keys=True)
          (root/"receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("REGRESSION_RECEIPT_JSON="+summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("Full private current-main regression receipt\n\n")
              f.write(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          if not passed:
              raise SystemExit(1)
          PY

# carrier: isolated-self-hosted-linux-x64-low-ram-exact-subject-20261011-v4
# receipt: log-and-check-summary-authoritative-for-canonicalization__artifact-storage-not-required
