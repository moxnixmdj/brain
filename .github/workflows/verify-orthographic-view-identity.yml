name: Verify orthographic view identity
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/orthographic_view_identity.py
      - canonical/tests/test_orthographic_view_identity.py
      - .github/workflows/verify-orthographic-view-identity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_orthographic_view_identity
