name: Verify current terminal parent launcher

on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/terminal_parent_portfolio_launcher_v1.py
      - canonical/tests/test_terminal_parent_portfolio_launcher_v1.py
      - canonical/runtime/saccr_route_specific_terminal_executor_v1.py
      - canonical/runtime/root3_broker_rpc_v1.py
      - canonical/tests/test_root3_broker_rpc_v1.py
      - canonical/runtime/root3_admin_persistence_driver_v1.py
      - canonical/runtime/root3_parent_driver_registry_v1.py
      - canonical/tests/test_root3_parent_driver_registry_v1.py
      - canonical/runtime/root3_parent_broker_server_v1.py
      - canonical/tests/test_root3_parent_broker_server_v1.py
      - canonical/runtime/zero_ambient_namespace_brokered_launcher_v2.py
      - canonical/tests/test_zero_ambient_namespace_brokered_launcher_v2.py
      - canonical/runtime/root3_production_astra_brokered_launcher_v2.py
      - canonical/tests/test_root3_production_astra_brokered_launcher_v2.py
      - canonical/runtime/astra_runtime.py
      - canonical/tests/test_astra_runtime_root3_admin_broker_v1.py
      - canonical/governance/ROOT3_ADMIN_PERSISTENCE_DRIVER_CONTRACT_20261007_V1.json
      - canonical/governance/ROOT3_PARENT_BROKER_CUT_20261007_V1.json
      - .github/workflows/verify-current-terminal-parent-launcher.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/terminal_parent_portfolio_launcher_v1.py
      - canonical/tests/test_terminal_parent_portfolio_launcher_v1.py
      - canonical/runtime/saccr_route_specific_terminal_executor_v1.py
      - canonical/runtime/root3_broker_rpc_v1.py
      - canonical/tests/test_root3_broker_rpc_v1.py
      - canonical/runtime/root3_admin_persistence_driver_v1.py
      - canonical/runtime/root3_parent_driver_registry_v1.py
      - canonical/tests/test_root3_parent_driver_registry_v1.py
      - canonical/runtime/root3_parent_broker_server_v1.py
      - canonical/tests/test_root3_parent_broker_server_v1.py
      - canonical/runtime/zero_ambient_namespace_brokered_launcher_v2.py
      - canonical/tests/test_zero_ambient_namespace_brokered_launcher_v2.py
      - canonical/runtime/root3_production_astra_brokered_launcher_v2.py
      - canonical/tests/test_root3_production_astra_brokered_launcher_v2.py
      - canonical/runtime/astra_runtime.py
      - canonical/tests/test_astra_runtime_root3_admin_broker_v1.py
      - canonical/governance/ROOT3_ADMIN_PERSISTENCE_DRIVER_CONTRACT_20261007_V1.json
      - canonical/governance/ROOT3_PARENT_BROKER_CUT_20261007_V1.json
      - .github/workflows/verify-current-terminal-parent-launcher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy_parent_launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_terminal_parent_portfolio_launcher_v1

  root3_broker_rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          if [ -f canonical/tests/test_root3_broker_rpc_v1.py ]; then
            python -m unittest -v canonical.tests.test_root3_broker_rpc_v1
          else
            echo "Root3 candidate absent; skipped."
          fi

  root3_driver_registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          if [ -f canonical/tests/test_root3_parent_driver_registry_v1.py ]; then
            python -m unittest -v canonical.tests.test_root3_parent_driver_registry_v1
          else
            echo "Root3 candidate absent; skipped."
          fi

  root3_parent_server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          if [ -f canonical/tests/test_root3_parent_broker_server_v1.py ]; then
            python -m unittest -v canonical.tests.test_root3_parent_broker_server_v1
          else
            echo "Root3 candidate absent; skipped."
          fi

  root3_namespace_v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          if [ -f canonical/tests/test_zero_ambient_namespace_brokered_launcher_v2.py ]; then
            python -m unittest -v canonical.tests.test_zero_ambient_namespace_brokered_launcher_v2
          else
            echo "Root3 candidate absent; skipped."
          fi

  root3_astra_admin_bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          if [ -f canonical/tests/test_astra_runtime_root3_admin_broker_v1.py ]; then
            python -m unittest -v canonical.tests.test_astra_runtime_root3_admin_broker_v1
          else
            echo "Root3 candidate absent; skipped."
          fi

  root3_production_v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          if [ -f canonical/tests/test_root3_production_astra_brokered_launcher_v2.py ]; then
            python -m unittest -v canonical.tests.test_root3_production_astra_brokered_launcher_v2
          else
            echo "Root3 candidate absent; skipped."
          fi
