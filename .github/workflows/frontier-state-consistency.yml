name: Frontier State Consistency
# Mirrors are projections of CURRENT_TERMINAL_AUTHORITY. A mutually stale set
# of mirrors must not be able to pass this check.
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/CANONICAL_POINTER.json"
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json"
      - "canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json"
      - "canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json"
      - "canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json"
      - ".github/workflows/frontier-state-consistency.yml"
  workflow_dispatch:
concurrency:
  group: frontier-state-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify mirrors derive from current terminal authority
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          L=lambda p: json.loads(Path(p).read_text())
          t=L("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")
          h=L("canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json")
          u=L("canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json")
          p=L("canonical/CANONICAL_POINTER.json")
          s=L("canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json")
          o=L("canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json")

          assert t["truth"]["achieved"] is False
          m=re.fullmatch(r"(\d+)/(\d+)_PASS__(\d+)/(\d+)_OPEN", t["truth"]["opus55_acceptance"])
          assert m and m.group(2)==m.group(4)
          accepted,total,open_count=map(int,(m.group(1),m.group(2),m.group(3)))
          proved=int(t["atomic_acceptance_frontier"]["proved"])
          unresolved=int(t["atomic_acceptance_frontier"]["unresolved"])
          atom_total=int(t["atomic_acceptance_frontier"]["total"])
          assert accepted + open_count == total
          assert proved + unresolved == atom_total

          n=t["next"]
          b=f"TERMINAL_FALSE__{open_count}_OF_{total}_FAMILIES_OPEN__{unresolved}_OF_{atom_total}_ATOMIC_PREDICATES_UNRESOLVED__SEE_CURRENT_TERMINAL_AUTHORITY_NEXT_FOR_EXACT_ACTIVE_ROUTE"
          e="CURRENT_TERMINAL_AUTHORITY_NEXT_PASS_OR_FALSIFICATION__OR_ANOTHER_CAUSALLY_BOUND_ZERO_REALITY_DELTA__NO_TERMINAL_PROMOTION_WITHOUT_SEPARATE_INDEPENDENT_REDUCTION"

          if "control_plane_precedence" not in h:
              assert h["current_parent_blocker"] == b
              assert h["next_required_action_class"] == n
              assert h["next_progress_event_target"] == e
          else:
              assert h["active_capability_target"] == "GENERAL_REUSABLE_PROBLEM_SOLVING_CAPABILITY_FRONTIER"

          assert p["current_frontier"]["critical_blocker"] == b
          assert p["current_frontier"]["highest_leverage_capability_gap"] == b
          assert p["current_frontier"]["next_step"] == n

          af=s["active_frontier_accounting"]
          assert af["residual_gap"] == b
          assert af["current_parent_blocker"] == b
          assert af["next_required_action"] == n
          assert s["next_required_action"] == n
          assert s["next_progress_event_target"] == e
          ca=s["canonical_acceptance_truth"]
          assert (ca["accepted_families"],ca["open_families"],ca["total_families"]) == (accepted,open_count,total)
          assert (ca["proved_atomic_predicates"],ca["unresolved_atomic_predicates"],ca["total_atomic_predicates"]) == (proved,unresolved,atom_total)

          assert o["residual_gap"] == b
          assert o["current_atomic_blocker"] == b
          assert o["next_action"] == n
          assert o["current_atomic_next_action"] == n
          assert o["next_progress_event_target"] == e
          oa=o["acceptance_truth"]
          assert (oa["accepted_families"],oa["total_families"]) == (accepted,total)
          assert (oa["proved_atomic_predicates"],oa["unresolved_atomic_predicates"],oa["total_atomic_predicates"]) == (proved,unresolved,atom_total)
          assert oa["achieved"] is False

          rm=h["residual_action_universe_v2"]
          assert rm["status"] == u["status"]
          assert rm["exact_cut_ready"] == u["exact_cut_ready"]
          assert rm["blocking_obligations"] == u["blocking_obligations"]
          assert rm["blocking_obligations"] == [] and rm["exact_cut_ready"] is True
          assert u["blocking_obligations"] == [] and u["exact_cut_ready"] is True

          assert h["execution_latency_control"]["status"] == "ACTIVE"
          assert p["boot_requirements"]["atomic_frontier_transaction_required"] is True

          v=L("canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_VERDICT_V6.json")
          assert v["status"].startswith("VERIFIED_EXACT_MINIMUM")
          assert v["observation_count"] == 2 and v["total_cost"] == 2
          print("FRONTIER_MIRRORS_DERIVE_FROM_CURRENT_TERMINAL_AUTHORITY")
          PY
