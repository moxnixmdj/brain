name: Frontier State Consistency
# Canonical deterministic mirror check. Every mirror is anchored to
# CURRENT_TERMINAL_AUTHORITY, so a mutually stale mirror set cannot pass.
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/CANONICAL_POINTER.json"
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json"
      - "canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json"
      - "canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json"
      - "canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json"
      - ".github/workflows/frontier-state-consistency.yml"
  workflow_dispatch:
concurrency:
  group: frontier-state-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify frontier mirrors derive from current terminal authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          L=lambda p: json.loads(Path(p).read_text())
          t=L("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")
          h=L("canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json")
          u=L("canonical/governance/RESIDUAL_ACTION_UNIVERSE_V2.json")
          p=L("canonical/CANONICAL_POINTER.json")
          s=L("canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json")
          o=L("canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json")
          cp=t["control_projection"]; b=cp["current_parent_blocker"]; n=cp["next_required_action"]; e=cp["next_progress_event_target"]

          assert t["next"] == n
          assert t["truth"]["opus55_acceptance"] == "3/19_PASS__16/19_OPEN"
          assert t["atomic_acceptance_frontier"]["proved"] == cp["proved_atomic_predicates"] == 8
          assert t["atomic_acceptance_frontier"]["unresolved"] == cp["unresolved_atomic_predicates"] == 30
          assert t["atomic_acceptance_frontier"]["total"] == cp["total_atomic_predicates"] == 38

          assert h["current_parent_blocker"] == b and h["next_required_action_class"] == n and h["next_progress_event_target"] == e
          assert p["current_frontier"]["critical_blocker"] == b and p["current_frontier"]["highest_leverage_capability_gap"] == b and p["current_frontier"]["next_step"] == n

          af=s["active_frontier_accounting"]
          assert af["residual_gap"] == b and af["current_parent_blocker"] == b and af["next_required_action"] == n
          assert s["next_required_action"] == n and s["next_progress_event_target"] == e
          assert s["canonical_acceptance_truth"]["accepted_families"] == cp["accepted_families"] == 3
          assert s["canonical_acceptance_truth"]["open_families"] == cp["open_families"] == 16
          assert s["canonical_acceptance_truth"]["proved_atomic_predicates"] == cp["proved_atomic_predicates"] == 8
          assert s["canonical_acceptance_truth"]["unresolved_atomic_predicates"] == cp["unresolved_atomic_predicates"] == 30

          assert o["residual_gap"] == b and o["current_atomic_blocker"] == b
          assert o["next_action"] == n and o["current_atomic_next_action"] == n and o["next_progress_event_target"] == e
          assert o["acceptance_truth"]["accepted_families"] == cp["accepted_families"]
          assert o["acceptance_truth"]["proved_atomic_predicates"] == cp["proved_atomic_predicates"]
          assert o["acceptance_truth"]["unresolved_atomic_predicates"] == cp["unresolved_atomic_predicates"]

          m=h["residual_action_universe_v2"]
          assert m["status"] == u["status"] and m["exact_cut_ready"] == u["exact_cut_ready"] and m["blocking_obligations"] == u["blocking_obligations"]
          assert m["blocking_obligations"] == [] and m["exact_cut_ready"] is True
          assert u["blocking_obligations"] == [] and u["exact_cut_ready"] is True
          assert h["execution_latency_control"]["status"] == "ACTIVE"
          assert p["boot_requirements"]["atomic_frontier_transaction_required"] is True

          v=L("canonical/governance/RESIDUAL_MINIMUM_REALITY_CUT_VERDICT_V6.json")
          assert v["status"].startswith("VERIFIED_EXACT_MINIMUM") and v["observation_count"] == 2 and v["total_cost"] == 2
          print("FRONTIER_STATE_CONSISTENT_WITH_CURRENT_TERMINAL_AUTHORITY")
          PY
