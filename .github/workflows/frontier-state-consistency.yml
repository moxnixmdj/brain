name: Frontier State Consistency
on:
  push:
    branches: [main]
    paths:
      - canonical/CANONICAL_POINTER.json
      - canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json
      - canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json
      - canonical/governance/GLOBAL_TERMINAL_OBLIGATION_GRAPH_V1.json
      - canonical/capabilities/FRONTIER_CAPABILITY_OBSOLESCENCE_QUEUE_V1.json
      - canonical/capabilities/frontier/**
      - canonical/runtime/frontier_state_consistency.py
      - .github/workflows/frontier-state-consistency.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/CANONICAL_POINTER.json
      - canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json
      - canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json
      - canonical/governance/GLOBAL_TERMINAL_OBLIGATION_GRAPH_V1.json
      - canonical/capabilities/FRONTIER_CAPABILITY_OBSOLESCENCE_QUEUE_V1.json
      - canonical/capabilities/frontier/**
      - canonical/runtime/frontier_state_consistency.py
      - .github/workflows/frontier-state-consistency.yml
  workflow_dispatch:
concurrency:
  group: frontier-state-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m py_compile canonical/runtime/frontier_state_consistency.py
      - run: python canonical/runtime/frontier_state_consistency.py
