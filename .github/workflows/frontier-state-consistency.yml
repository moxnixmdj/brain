name: Frontier State Consistency

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json"
      - "canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json"
      - "canonical/CANONICAL_POINTER.json"
      - "canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json"
      - "canonical/capabilities/FRONTIER_CAPABILITY_OBSOLESCENCE_QUEUE_V1.json"
      - "canonical/governance/CAUSAL_CUT_ADMISSION_GATE_V2_ACTIVE_AUTHORITY_V1.json"
      - ".github/workflows/frontier-state-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-anchored-mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify every live scheduling mirror derives from current terminal authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def L(path):
              return json.loads(Path(path).read_text())

          t=L("canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json")
          h=L("canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json")
          o=L("canonical/capabilities/frontier/OPUS_5_5_USEFUL_CAPABILITY_OWNERSHIP_V1.json")
          p=L("canonical/CANONICAL_POINTER.json")
          s=L("canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json")
          q=L("canonical/capabilities/FRONTIER_CAPABILITY_OBSOLESCENCE_QUEUE_V1.json")
          c=L("canonical/governance/CAUSAL_CUT_ADMISSION_GATE_V2_ACTIVE_AUTHORITY_V1.json")

          cp=t["control_projection"]
          assert cp["status"].startswith("TRUTH_PRESERVING_CURRENT_TERMINAL_AUTHORITY_PROJECTION")
          blocker=cp["current_parent_blocker"]
          next_action=cp["next_required_action"]
          event=cp["next_progress_event_target"]

          assert t["next"] == next_action
          assert t["truth"]["opus55_acceptance"] == (
              f'{cp["accepted_families"]}/{cp["total_families"]}_PASS__'
              f'{cp["open_families"]}/{cp["total_families"]}_OPEN'
          )
          af=t["atomic_acceptance_frontier"]
          assert af["proved"] == cp["proved_atomic_predicates"]
          assert af["unresolved"] == cp["unresolved_atomic_predicates"]
          assert af["total"] == cp["total_atomic_predicates"]

          assert h["current_parent_blocker"] == blocker
          assert h["next_required_action_class"] == next_action
          assert h["next_progress_event_target"] == event

          assert o["residual_gap"] == blocker
          assert o["current_atomic_blocker"] == blocker
          assert o["next_action"] == next_action
          assert o["current_atomic_next_action"] == next_action
          assert o["next_progress_event_target"] == event
          assert o["acceptance_truth"]["accepted_families"] == cp["accepted_families"]
          assert o["acceptance_truth"]["proved_atomic_predicates"] == cp["proved_atomic_predicates"]
          assert o["acceptance_truth"]["unresolved_atomic_predicates"] == cp["unresolved_atomic_predicates"]

          cf=p["current_frontier"]
          assert cf["critical_blocker"] == blocker
          assert cf["highest_leverage_capability_gap"] == blocker
          assert cf["next_step"] == next_action

          sf=s["active_frontier_accounting"]
          assert sf["residual_gap"] == blocker
          assert sf["current_parent_blocker"] == blocker
          assert sf["next_required_action"] == next_action
          assert s["next_required_action"] == next_action
          assert s["next_progress_event_target"] == event
          cat=s["canonical_acceptance_truth"]
          assert cat["accepted_families"] == cp["accepted_families"]
          assert cat["open_families"] == cp["open_families"]
          assert cat["proved_atomic_predicates"] == cp["proved_atomic_predicates"]
          assert cat["unresolved_atomic_predicates"] == cp["unresolved_atomic_predicates"]

          iq=q["immediate_frontier"]
          assert iq["exact_blocker"] == blocker
          assert iq["next_action"] == next_action
          assert iq["next_progress_event_target"] == event

          assert c["next"] == next_action

          # Fail if any live scheduling surface resurrects the closed post-delegation
          # recompile or the already-completed V4 private-corpus scan.
          forbidden=("INDEPENDENTLY_VERIFY_POST_DELEGATION_TERMINAL_FRONTIER",
                     "FREEZE_ONE_CLEAN_CONTENT_ADDRESSED_FULL_BRAIN_CORPUS_SCAN")
          live_values=[
              h["next_required_action_class"],o["next_action"],cf["next_step"],
              s["next_required_action"],iq["next_action"],c["next"],
          ]
          assert all(not any(old in value for old in forbidden) for value in live_values)

          print("CURRENT_TERMINAL_AUTHORITY_MIRRORS_CONSISTENT")
          PY
