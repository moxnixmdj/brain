name: Verify terminal route executor compiler

on:
  pull_request:
    paths:
      - canonical/runtime/terminal_route_executor_compiler.py
      - canonical/tests/test_terminal_route_executor_compiler.py
      - canonical/governance/TERMINAL_ROUTE_EXECUTOR_COMPILER_V1.json
      - canonical/governance/TERMINAL_ROUTE_SPECIFIC_EXECUTOR_MANIFEST_V1.json
      - canonical/governance/GLOBAL_TERMINAL_REPLACEMENT_POPULATION_PROTOCOL_V2.json
      - canonical/governance/ACTIVE_TERMINAL_PROOF_BASIS_V1.json
      - canonical/governance/BEHAVIORAL_CONTRACT_REGISTRY_V1.json
      - canonical/governance/TERMINAL_WAVE_EXECUTION_AUTHORITY_V1.json
      - .github/workflows/verify-terminal-route-executor-compiler.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest -v canonical.tests.test_terminal_route_executor_compiler 2>&1 | tee /tmp/unit-tests.txt
      - name: Compile live route plan without consuming terminal evidence
        id: live
        continue-on-error: true
        run: |
          python canonical/runtime/terminal_route_executor_compiler.py . --output /tmp/terminal-route-plan.json > /tmp/compiler-stdout.txt 2>&1
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-route-compiler-diagnostics
          path: |
            /tmp/unit-tests.txt
            /tmp/terminal-route-plan.json
            /tmp/compiler-stdout.txt
          if-no-files-found: warn
      - name: Verify invariants and expose exact live state
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          unit = pathlib.Path('/tmp/unit-tests.txt').read_text() if pathlib.Path('/tmp/unit-tests.txt').exists() else ''
          assert 'FAILED (' not in unit and 'ERROR' not in unit, unit
          p=json.load(open('/tmp/terminal-route-plan.json'))
          assert p['terminal_results_observed']==0
          assert p['fresh_terminal_evidence_consumed']==0
          assert p['active_contract_count']==12
          assert len(p['contracts'])==12
          assert p['unresolved_contracts']==[], p
          print(json.dumps({
            'status':p['status'],
            'structural_ready':p['structural_ready'],
            'launch_ready':p['launch_ready'],
            'direct_population_count':p['direct_population_count'],
            'multiplex_instrumentation_count':p['multiplex_instrumentation_count'],
            'unbound_executor_contracts':p['unbound_executor_contracts'],
            'errors':p['errors'],
          },sort_keys=True))
          PY
