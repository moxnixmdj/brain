name: Verify OOXML package integrity
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/ooxml_package_integrity.py
      - canonical/tests/test_ooxml_package_integrity.py
      - .github/workflows/verify-ooxml-package-integrity.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_ooxml_package_integrity
