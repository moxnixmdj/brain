name: Verify M2 DOCX text edit transaction
on:
  push:
    branches: [obs-m2-docx-text-transaction-20261002]
    paths:
      - canonical/runtime/docx_text_edit_transaction.py
      - canonical/tests/test_docx_text_edit_transaction.py
      - .github/workflows/verify-m2-docx-text-edit-transaction.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/docx_text_edit_transaction.py
      - canonical/tests/test_docx_text_edit_transaction.py
      - .github/workflows/verify-m2-docx-text-edit-transaction.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_docx_text_edit_transaction
