name: Obsolescence tool learning Data Matrix

on:
  push:
    branches:
      - research/obsolescence-tool-learning-datamatrix-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run generic contract regressions
        run: |
          set -euo pipefail
          python canonical/tests/test_cli_contract_role_selection.py
          python canonical/tests/test_cli_stdin_contract.py
          python canonical/tests/test_cli_route_race.py
      - name: Run frozen tool discovery and contract-learning experiment
        run: |
          set -euo pipefail
          python canonical/experiments/run_obsolescence_tool_learning_datamatrix_001.py
      - name: Execute generated independent verification mission
        run: |
          set -euo pipefail
          VERIFY_PATH="$(python - <<'PY'
          import json
          p='canonical/astra_runtime/evidence/OBSOLESCENCE-TOOL-LEARNING-DATAMATRIX-001__RESULT.json'
          print(json.load(open(p))['verification_mission_path'])
          PY
          )"
          python canonical/runtime/astra_runtime.py "$VERIFY_PATH"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsolescence-tool-learning-datamatrix-001
          path: |
            canonical/astra_runtime/evidence/OBSOLESCENCE-TOOL-LEARNING-DATAMATRIX-001__*.json
            canonical/astra_runtime/pending_bindings/OBSOLESCENCE-TOOL-LEARNING-DATAMATRIX-001__*.json
            canonical/astra_runtime/evidence/ASTRA-AUTO-VERIFY-DMTX-UTILS-*.json
            canonical/astra_runtime/state/ASTRA-AUTO-VERIFY-DMTX-UTILS-*.json
            canonical/astra_runtime/evidence/ASTRA-AUTO-VERIFY-IEC16022-*.json
            canonical/astra_runtime/state/ASTRA-AUTO-VERIFY-IEC16022-*.json
            canonical/astra_runtime/tmp/PROJECT_BRAIN_DATAMATRIX.png
          if-no-files-found: warn
