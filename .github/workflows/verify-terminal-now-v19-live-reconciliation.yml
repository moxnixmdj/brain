name: Verify terminal-now V19 live reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/TERMINAL_NOW_V19_LIVE_HEAD_RECONCILIATION_20261007_V1.json"
      - "canonical/runtime/terminal_now_v19_live_head_reconciliation_verify_v1.py"
      - "canonical/tests/test_terminal_now_v19_live_head_reconciliation_v1.py"
      - ".github/workflows/verify-terminal-now-v19-live-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python -m py_compile canonical/runtime/terminal_now_v19_live_head_reconciliation_verify_v1.py
      - run: python -m pytest -q canonical/tests/test_terminal_now_v19_live_head_reconciliation_v1.py
      - run: python canonical/runtime/terminal_now_v19_live_head_reconciliation_verify_v1.py
