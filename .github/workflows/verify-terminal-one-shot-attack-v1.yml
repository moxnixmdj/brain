name: Verify terminal one-shot attack graph
on:
  pull_request:
    paths:
      - canonical/runtime/terminal_autopilot_v1.py
      - canonical/runtime/terminal_autopilot_executor_v1.py
      - canonical/tests/test_terminal_autopilot_v1.py
      - canonical/tests/test_terminal_autopilot_executor_v1.py
      - .github/workflows/verify-terminal-one-shot-attack-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_terminal_autopilot_v1 canonical.tests.test_terminal_autopilot_executor_v1
