name: Verify Unknown-Domain V3 total/exact successor

on:
  pull_request:
    paths:
      - "canonical/runtime/unknown_domain_direct_hidden_generator_v3.py"
      - "canonical/runtime/unknown_domain_direct_candidate_v3.py"
      - "canonical/runtime/unknown_domain_direct_v3_universal_proof_v1.py"
      - "canonical/tests/test_unknown_domain_direct_v3_total_exact_v1.py"
      - ".github/workflows/verify-unknown-domain-v3-total-exact.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run V3 exact/collision regressions
        run: pytest -q canonical/tests/test_unknown_domain_direct_v3_total_exact_v1.py
      - name: Emit content-bound proof candidate
        run: python -m canonical.runtime.unknown_domain_direct_v3_universal_proof_v1
