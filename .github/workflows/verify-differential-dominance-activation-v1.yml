name: Verify differential dominance activation v1
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/DIFFERENTIAL_DOMINANCE_COMPILER_ACTIVATION_V1.json"
      - "canonical/verification/DIFFERENTIAL_DOMINANCE_COMPILER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/governance/EXECUTION_FIRST_SELF_PROVING_OPTIMIZER_V1.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V1.json"
      - "canonical/tests/test_differential_dominance_activation_v1.py"
      - ".github/workflows/verify-differential-dominance-activation-v1.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest canonical.tests.test_differential_dominance_activation_v1 -v
