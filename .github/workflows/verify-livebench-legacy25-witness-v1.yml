name: Verify LiveBench legacy25 witness compiler v1
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/livebench_legacy25_witness_compiler_v1.py"
      - "canonical/runtime/root2_livebench_if_astra_inference_adapter_v5.py"
      - "canonical/verification_tools/livebench_legacy25_exact_public_checker_verify_v1.py"
      - "canonical/tests/test_livebench_legacy25_witness_compiler_v1.py"
      - "canonical/tests/test_root2_livebench_if_astra_inference_adapter_v5.py"
      - ".github/workflows/verify-livebench-legacy25-witness-v1.yml"
permissions:
  contents: read
jobs:
  exact-public-checkers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact checker dependencies
        run: |
          python -m pip install --disable-pip-version-check langdetect==1.0.9 immutabledict==4.2.1 nltk==3.9.2 pytest
          python -m nltk.downloader -q punkt punkt_tab
      - name: Checkout pinned public LiveBench source
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git "$RUNNER_TEMP/LiveBench"
          git -C "$RUNNER_TEMP/LiveBench" checkout 8f8e5c381a16e3f24257776edd53471fe86f8091
          test "$(git -C "$RUNNER_TEMP/LiveBench" rev-parse HEAD)" = "8f8e5c381a16e3f24257776edd53471fe86f8091"
      - name: Run exact pinned public checker verification with diagnostic capture
        id: exact
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ runner.temp }}/LiveBench/livebench/if_runner
        run: |
          set +e
          python canonical/verification_tools/livebench_legacy25_exact_public_checker_verify_v1.py --output "$RUNNER_TEMP/legacy25_exact_result.json" >"$RUNNER_TEMP/legacy25_stdout.txt" 2>"$RUNNER_TEMP/legacy25_stderr.txt"
          code=$?
          echo "$code" >"$RUNNER_TEMP/legacy25_exit_code.txt"
          cat "$RUNNER_TEMP/legacy25_stdout.txt"
          cat "$RUNNER_TEMP/legacy25_stderr.txt" >&2
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy25-exact-public-checker-diagnostics
          path: |
            ${{ runner.temp }}/legacy25_exact_result.json
            ${{ runner.temp }}/legacy25_stdout.txt
            ${{ runner.temp }}/legacy25_stderr.txt
            ${{ runner.temp }}/legacy25_exit_code.txt
          if-no-files-found: error
      - name: Enforce exact checker success
        if: steps.exact.outcome != 'success'
        run: exit 1
      - name: Run Brain unit tests
        run: |
          python -m pytest -q canonical/tests/test_livebench_legacy25_witness_compiler_v1.py canonical/tests/test_root2_livebench_if_astra_inference_adapter_v5.py
