name: Verify universal learning contract v1

on:
  pull_request:
    paths:
      - "canonical/governance/UNIVERSAL_LEARNING_CONTRACT_V1.json"
      - "canonical/runtime/universal_learning_contract_v1.py"
      - "canonical/runtime/universal_learning_acceptance_reducer_v1.py"
      - "canonical/tests/test_universal_learning_contract_v1.py"
      - "canonical/tests/test_universal_learning_contract_binding_v1.py"
      - "canonical/tests/test_universal_learning_acceptance_reducer_v1.py"
      - ".github/workflows/verify-universal-learning-contract-v1.yml"
  push:
    paths:
      - "canonical/governance/UNIVERSAL_LEARNING_CONTRACT_V1.json"
      - "canonical/runtime/universal_learning_contract_v1.py"
      - "canonical/runtime/universal_learning_acceptance_reducer_v1.py"
      - "canonical/tests/test_universal_learning_contract_v1.py"
      - "canonical/tests/test_universal_learning_contract_binding_v1.py"
      - "canonical/tests/test_universal_learning_acceptance_reducer_v1.py"
      - ".github/workflows/verify-universal-learning-contract-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run universal learning tests
        run: |
          python -m unittest \
            canonical.tests.test_universal_learning_contract_v1 \
            canonical.tests.test_universal_learning_contract_binding_v1 \
            canonical.tests.test_universal_learning_acceptance_reducer_v1 -v
      - name: Verify theorem and fail-closed reducer boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime import universal_learning_contract_v1 as c
          from canonical.runtime import universal_learning_acceptance_reducer_v1 as r
          root=Path('.')
          gov=json.loads((root/'canonical/governance/UNIVERSAL_LEARNING_CONTRACT_V1.json').read_text())
          out=c.prove_control_invariants()
          assert out['pass'] is True, out
          assert out['semantic_success_rate_proved'] is False, out
          assert out['tool_learning_noninferiority_proved'] is False, out
          bindings=json.loads((root/'canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json').read_text())
          receipt={'independent_runner':{'conclusion':'success'},'verified':{
            'unknown_capture_total':True,
            'only_verified_coverage_uses_known_route':True,
            'learning_channels_complete':True,
            'candidate_requires_verification_before_trust':True,
            'promotion_requires_verified_state':True,
            'environment_change_invalidates_to_unknown':True,
            'finite_control_product_exhaustively_checked':True,
            'actual_component_bindings_exact':True}}
          red=r.reduce(contract_verification=receipt,evidence_bindings=bindings)
          assert red['pass'] is True, red
          assert red['target_predicate_discharge_candidate'] is False, red
          assert red['remaining_residuals']==['MATCHED_EMPIRICAL_LEARNING_EFFECTIVENESS_NONINFERIORITY'], red
          assert red['acceptance_credit_delta']==0, red
          assert gov['target_acceptance_decomposition']['current_state']=='OPEN'
          PY
