name: Verify explicit rubric plan optimizer
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/explicit_rubric_plan_optimizer.py
      - canonical/tests/test_explicit_rubric_plan_optimizer.py
      - .github/workflows/verify-explicit-rubric-plan-optimizer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_explicit_rubric_plan_optimizer
