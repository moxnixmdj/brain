name: Verify GitHub residual retrieval surfaces
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/github_public_retrieval_provider_v1.py
      - canonical/runtime/residual_witness_backend_router_v1.py
      - canonical/tests/test_github_public_retrieval_provider_v1.py
      - .github/workflows/verify-github-residual-retrieval-surfaces.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_github_public_retrieval_provider_v1
