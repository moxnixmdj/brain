name: Verify M3 contract task decomposition
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/m3_contract_task_decomposition.py
      - canonical/tests/test_m3_contract_task_decomposition.py
      - .github/workflows/verify-m3-contract-task-decomposition.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/m3_contract_task_decomposition.py
      - canonical/tests/test_m3_contract_task_decomposition.py
      - .github/workflows/verify-m3-contract-task-decomposition.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_m3_contract_task_decomposition
