name: Verify acceptance capability-source gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/acceptance_capability_source_gate_v1.py'
      - 'canonical/tests/test_acceptance_capability_source_gate_v1.py'
      - 'canonical/governance/ACCEPTANCE_PUBLIC_BAR_CAPABILITY_SOURCE_AUDIT_V1.json'
      - 'canonical/governance/OPUS55_ACCEPTANCE_RESIDUAL_MINIMUM_PROOF_PLAN_V1.json'
      - '.github/workflows/verify-acceptance-capability-source-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gate tests
        run: python -m unittest -v canonical.tests.test_acceptance_capability_source_gate_v1
      - name: Verify declared public-bar frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from canonical.runtime.acceptance_capability_source_gate_v1 import evaluate
          a=json.loads(Path("canonical/governance/ACCEPTANCE_PUBLIC_BAR_CAPABILITY_SOURCE_AUDIT_V1.json").read_text())
          assert len(a["routes"])==3
          verdicts={r["id"]:evaluate(r) for r in a["routes"]}
          assert all(not v["pass"] for v in verdicts.values()),verdicts
          assert a["conclusion"]["currently_clean_case_executable_routes"]==0
          assert a["fresh_acceptance_cases_consumed"]==0
          print(json.dumps(verdicts,sort_keys=True))
          PY
