name: Verify synthesis proof obligation delta

on:
  push:
    paths:
      - "canonical/governance/OPUS55_SYNTHESIS_PROOF_OBLIGATION_DELTA_INPUT_V1.json"
      - "canonical/runtime/synthesis_proof_obligation_delta_verifier_v1.py"
      - "canonical/tests/test_synthesis_proof_obligation_delta_verifier_v1.py"
      - "canonical/runtime/proof_obligation_delta_compiler_v1.py"
      - "canonical/verification/PROOF_OBLIGATION_DELTA_COMPILER_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/verification/OPUS55_SYNTHESIS_WITNESS_TARGET_BINDING_PUBLIC_RUNNER_VERIFICATION_20261002_V1.json"
      - "canonical/governance/OPUS55_TERMINAL_PROOF_PROTOCOLS_V1.json"
      - "canonical/governance/P3_SYNTHESIS_T1_T3_MULTIPLEX_TERMINAL_BINDING_V1.json"
      - ".github/workflows/verify-synthesis-proof-obligation-delta.yml"
  pull_request:
    paths:
      - "canonical/governance/OPUS55_SYNTHESIS_PROOF_OBLIGATION_DELTA_INPUT_V1.json"
      - "canonical/runtime/synthesis_proof_obligation_delta_verifier_v1.py"
      - "canonical/tests/test_synthesis_proof_obligation_delta_verifier_v1.py"
      - ".github/workflows/verify-synthesis-proof-obligation-delta.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adversarial tests
        run: python -m unittest canonical.tests.test_synthesis_proof_obligation_delta_verifier_v1 -v
      - name: Verify exact live synthesis residual
        run: python canonical/runtime/synthesis_proof_obligation_delta_verifier_v1.py
