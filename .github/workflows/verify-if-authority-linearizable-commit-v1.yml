name: Verify IF authority linearizable commit gate

on:
  pull_request:
    paths:
      - "canonical/runtime/instruction_authority_invariant_v1.py"
      - "canonical/tests/test_instruction_authority_invariant_v1.py"
      - "canonical/runtime/requirement_graph_kernel.py"
      - "canonical/governance/IF_AUTHORITY_CAUSAL_CUT_V2.json"
      - ".github/workflows/verify-if-authority-linearizable-commit-v1.yml"
  push:
    paths:
      - "canonical/runtime/instruction_authority_invariant_v1.py"
      - "canonical/tests/test_instruction_authority_invariant_v1.py"
      - "canonical/runtime/requirement_graph_kernel.py"
      - "canonical/governance/IF_AUTHORITY_CAUSAL_CUT_V2.json"
      - ".github/workflows/verify-if-authority-linearizable-commit-v1.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q canonical/tests/test_instruction_authority_invariant_v1.py
