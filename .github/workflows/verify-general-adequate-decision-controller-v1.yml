name: verify-general-adequate-decision-controller-v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/general_adequate_decision_controller_v1.py
      - canonical/tests/test_general_adequate_decision_controller_v1.py
      - canonical/governance/R2_GENERAL_ADEQUATE_DECISION_CONTROLLER_ACTIVATION_20261008_V1.json
      - .github/workflows/verify-general-adequate-decision-controller-v1.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run R2 falsification suite
        run: |
          set -o pipefail
          python3 -m unittest canonical.tests.test_general_adequate_decision_controller_v1 -v 2>&1 | tee r2-test-output.txt
      - name: Publish verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-general-adequate-decision-controller-test-output
          path: r2-test-output.txt
          if-no-files-found: warn

      - name: Surface R2 failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('r2-test-output.txt')
              ? fs.readFileSync('r2-test-output.txt', 'utf8')
              : 'R2 test output missing before publication';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'R2 CI failure diagnostics:\n\n```text\n' + raw.slice(-50000) + '\n```'
            });
