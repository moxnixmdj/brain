name: verify-general-adequate-decision-controller-v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/general_adequate_decision_controller_v1.py
      - canonical/runtime/r2_grounded_candidate_policy_frontier_v1.py
      - canonical/runtime/r2_existing_policy_cover_observation_reuse_v1.py
      - canonical/runtime/r2_raw_source_proof_material_adapter_v1.py
      - canonical/runtime/selected_semantic_truth_certificate_v1.py
      - canonical/tests/test_r2_raw_source_proof_material_adapter_v1.py
      - canonical/tests/test_r2_source_proof_material_integration_v1.py
      - canonical/runtime/regcap_candidate_ambiguity_control_v2.py
      - canonical/tests/test_regcap_candidate_ambiguity_control_v2.py
      - canonical/tests/test_general_adequate_decision_controller_v1.py
      - canonical/tests/test_r2_grounded_candidate_policy_frontier_v1.py
      - canonical/tests/test_general_adequate_decision_policy_cover_integration_v1.py
      - canonical/tests/test_r2_existing_policy_cover_observation_reuse_v1.py
      - canonical/governance/R2_GENERAL_ADEQUATE_DECISION_CONTROLLER_ACTIVATION_20261008_V1.json
      - canonical/runtime/finance_semantic_zero_reality_fixed_point_v1.py
      - canonical/tests/test_finance_semantic_zero_reality_fixed_point_v1.py
      - canonical/governance/FINANCE_SEMANTIC_ZERO_REALITY_FIXED_POINT_20261008_V1.json
      - .github/workflows/verify-general-adequate-decision-controller-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run R2 falsification suite
        run: |
          set -o pipefail
          python3 -m unittest canonical.tests.test_general_adequate_decision_controller_v1 canonical.tests.test_r2_raw_source_proof_material_adapter_v1 canonical.tests.test_r2_source_proof_material_integration_v1 canonical.tests.test_general_adequate_decision_information_origin_v1 canonical.tests.test_minimum_information_origin_policy_v1 canonical.tests.test_general_adequate_decision_policy_cover_integration_v1 canonical.tests.test_r2_existing_policy_cover_observation_reuse_v1 canonical.tests.test_finance_semantic_zero_reality_fixed_point_v1 canonical.tests.test_regcap_candidate_ambiguity_control_v2 -v 2>&1 | tee r2-test-output.txt
      - name: Publish verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-general-adequate-decision-controller-test-output
          path: r2-test-output.txt
          if-no-files-found: warn
