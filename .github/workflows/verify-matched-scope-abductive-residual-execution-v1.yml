name: Verify matched scope abductive residual execution v1
on:
  pull_request:
    paths:
      - "canonical/governance/MATCHED_SCOPE_ABDUCTIVE_RESIDUAL_INPUT_V1.json"
      - "canonical/governance/MATCHED_SCOPE_ABDUCTIVE_RESIDUAL_EXECUTION_V1.json"
      - "canonical/runtime/matched_scope_abductive_residual_execution_v1.py"
      - "canonical/tests/test_matched_scope_abductive_residual_execution_v1.py"
      - ".github/workflows/verify-matched-scope-abductive-residual-execution-v1.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python canonical/tests/test_matched_scope_abductive_residual_execution_v1.py
      - run: python canonical/runtime/matched_scope_abductive_residual_execution_v1.py > /tmp/matched-abductive.json
      - name: Assert zero-credit no-further-compression result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("/tmp/matched-abductive.json"))
          assert d["target_count"]==11
          assert d["verified_rule_count"]==11
          assert len(d["primitive_residual_facts"])==22
          assert d["minimum_joint_residual_size"]==22
          assert d["shared_residual_groups"]==[]
          assert d["capability_credit_delta"]==0 and d["family_credit_delta"]==0
          assert d["execution_authority"] is False and d["promotion_authority"] is False
          print("matched abductive residual execution: PASS")
          PY
