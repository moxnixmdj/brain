name: Verify P2 professional quality T1 multiplex
on:
  push:
    branches: [main]
    paths:
      - canonical/governance/P2_PROFESSIONAL_QUALITY_T1_MULTIPLEX_TERMINAL_BINDING_V1.json
      - canonical/runtime/p2_professional_quality_t1_multiplex_preflight.py
      - canonical/tests/test_p2_professional_quality_t1_multiplex_preflight.py
      - canonical/governance/TERMINAL_PORTFOLIO_BINDING_MANIFESTS_V1.json
      - .github/workflows/verify-p2-professional-quality-t1-multiplex.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/P2_PROFESSIONAL_QUALITY_T1_MULTIPLEX_TERMINAL_BINDING_V1.json
      - canonical/runtime/p2_professional_quality_t1_multiplex_preflight.py
      - canonical/tests/test_p2_professional_quality_t1_multiplex_preflight.py
      - canonical/governance/TERMINAL_PORTFOLIO_BINDING_MANIFESTS_V1.json
      - .github/workflows/verify-p2-professional-quality-t1-multiplex.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_p2_professional_quality_t1_multiplex_preflight.Tests.test_live_binding
  mutation-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_p2_professional_quality_t1_multiplex_preflight.Tests.test_gold_quality_leak_fails canonical.tests.test_p2_professional_quality_t1_multiplex_preflight.Tests.test_private_execution_dependency_fails canonical.tests.test_p2_professional_quality_t1_multiplex_preflight.Tests.test_private_score_inference_fails canonical.tests.test_p2_professional_quality_t1_multiplex_preflight.Tests.test_missing_ablation_rescue_check_fails canonical.tests.test_p2_professional_quality_t1_multiplex_preflight.Tests.test_cross_behavior_inheritance_fails canonical.tests.test_p2_professional_quality_t1_multiplex_preflight.Tests.test_manifest_route_loss_fails canonical.tests.test_p2_professional_quality_t1_multiplex_preflight.Tests.test_missing_dependency_fails
