name: Verify P2 professional quality T1 multiplex
# current-main verification trigger
on:
  push:
    branches: [main]
    paths:
      - canonical/governance/P2_PROFESSIONAL_QUALITY_T1_MULTIPLEX_TERMINAL_BINDING_V1.json
      - canonical/runtime/p2_professional_quality_t1_multiplex_preflight.py
      - canonical/tests/test_p2_professional_quality_t1_multiplex_preflight.py
      - canonical/governance/TERMINAL_PORTFOLIO_BINDING_MANIFESTS_V1.json
      - .github/workflows/verify-p2-professional-quality-t1-multiplex.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_p2_professional_quality_t1_multiplex_preflight
      - name: Verify live binding
        run: |
          python - <<'PY'
          from pathlib import Path
          from canonical.runtime.p2_professional_quality_t1_multiplex_preflight import evaluate
          import json
          out=evaluate(Path("."))
          print(json.dumps(out,indent=2,sort_keys=True))
          raise SystemExit(0 if out["pass"] else 1)
          PY
