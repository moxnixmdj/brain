name: Semantic Role Diagnostic 001

on:
  push:
    branches:
      - diagnostic/semantic-role-representation-v1-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove runtime unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD -- canonical/runtime/)"
      - name: Evaluate semantic role explanation
        run: python canonical/experiments/run_semantic_role_diagnostic_001.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-role-diagnostic-001
          path: canonical/astra_runtime/evidence/SEMANTIC_ROLE_DIAGNOSTIC_001__RESULT.json
