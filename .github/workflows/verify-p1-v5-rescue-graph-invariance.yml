name: Verify P1 V5 rescue graph-invariance counterexample
on:
  pull_request:
    paths:
      - "canonical/runtime/p1_v5_rescue_graph_invariance_counterexample_v1.py"
      - "canonical/tests/test_p1_v5_rescue_graph_invariance_counterexample_v1.py"
      - "canonical/governance/P1_V5_RESCUE_GRAPH_INVARIANCE_QUARANTINE_V1.json"
      - ".github/workflows/verify-p1-v5-rescue-graph-invariance.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact counterexample
        run: |
          python -m unittest canonical.tests.test_p1_v5_rescue_graph_invariance_counterexample_v1 -v
          python canonical/runtime/p1_v5_rescue_graph_invariance_counterexample_v1.py
