name: Real Same-Identity UBJSON Mission
# concurrent bridge relay: same runtime waits for identity-bound responses

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/runtime/astra_runtime.py'
      - 'canonical/runtime/external_tool_relay.py'
      - 'canonical/runtime/independent_npm_codec_verifier.py'
      - 'canonical/runtime/node_codec_runner.js'
      - 'canonical/runtime/goal_compiler.py'
      - 'canonical/tests/test_external_tool_relay.py'
      - 'canonical/tests/test_external_tool_bridge_wait.py'
      - 'canonical/tests/test_independent_npm_codec_verifier_bridge.py'
      - 'canonical/tests/test_node_codec_runner_projection.py'
      - 'canonical/tests/test_goal_compiler_source_tree_independent_verification.py'
      - 'canonical/astra_runtime/missions/ASTRA_REAL_SAME_IDENTITY_UBJSON_CANONICAL_SNAPSHOT_001.json'
      - 'canonical/same_identity_worker/tasks/SI_REAL_UBJSON_SNAPSHOT_001.json'
      - '.github/workflows/real-same-identity-ubjson.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real_ubjson:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify relay, wait semantics, and immutable mission bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            canonical.tests.test_external_tool_relay \
            canonical.tests.test_external_tool_bridge_wait \
            canonical.tests.test_bound_git_source_tree_dependency \
            canonical.tests.test_independent_npm_codec_verifier_bridge \
            canonical.tests.test_node_codec_runner_projection \
            canonical.tests.test_goal_compiler_source_tree_independent_verification
          python - <<'PY'
          import hashlib, pathlib
          mission=pathlib.Path('canonical/astra_runtime/missions/ASTRA_REAL_SAME_IDENTITY_UBJSON_CANONICAL_SNAPSHOT_001.json')
          expected='f0773c75d92335e35b7b91d6d0eb8b72b5ea1f8cc3fbd9ea7ff13d0af8856166'
          actual=hashlib.sha256(mission.read_bytes()).hexdigest()
          print({'mission_sha256':actual})
          assert actual==expected
          PY

      - name: Stamp the byte-pinned mission's OBS sidecar
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path(".")
          def sha256(rel):
              return hashlib.sha256((root/rel).read_bytes()).hexdigest()
          mission_rel = 'canonical/astra_runtime/missions/ASTRA_REAL_SAME_IDENTITY_UBJSON_CANONICAL_SNAPSHOT_001.json'
          generation = json.loads((root/'canonical/CANONICAL_POINTER.json').read_text()).get('canonical_generation')
          deps = [
            ('ASTRA_RUNTIME','EXECUTION_SURFACE','canonical/runtime/astra_runtime.py'),
            ('EXTERNAL_TOOL_RELAY','EXECUTION_SURFACE','canonical/runtime/external_tool_relay.py'),
            ('SAME_IDENTITY_SUPERVISOR','EXECUTION_SURFACE','canonical/runtime/same_identity_supervisor.py'),
            ('NPM_CODEC_RUNNER','EXECUTION_SURFACE','canonical/runtime/node_codec_runner.js'),
          ]
          obs = {
            'schema':'PROJECT_BRAIN_CONTINUOUS_OBS_CONTEXT_V1','status':'CURRENT','canonical_generation':generation,
            'canonical_state_dependencies':[
              {'path':'canonical/CANONICAL_POINTER.json','sha256':sha256('canonical/CANONICAL_POINTER.json')},
              {'path':'canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json','sha256':sha256('canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json')},
              {'path':'canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json','sha256':sha256('canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json')}],
            'dependency_inventory_complete':True,'material_world_state_dependencies_complete':True,'information_boundary_complete':True,
            # JIT acquisition IS the mission: the workflow exists to prove same-identity
            # capability acquisition, so discovery stays open; cognition stays forbidden.
            'information_policy':{'mode':'OPEN_DISCOVERY','allowed_exact_sources':[],'allowed_external_tool_kinds':[]},
            'unknown_material_dependencies':[],'stale_authority_absent':True,'valid_proof_action_priority':True,
            'obs_layers_current':{'goal':True,'capability':True,'blocker':True,'solution':True,'verification':True,'inherited_system':True,'obs_process':True},
            'dependencies':[{'dependency_id':did,'class':cls,'material':True,'volatility':'STATIC','scope':'GLOBAL','status':'READY','evidence':[path]} for did,cls,path in deps]}
          sidecar = root/(mission_rel + '.continuous_obs.json')
          sidecar.write_text(json.dumps(obs,indent=2,sort_keys=True)+'\n')
          from canonical.runtime import continuous_obs_runtime as obsr
          verdict = obsr.validate_context(obs, root=root.resolve())
          assert verdict.get('pass'), verdict.get('errors')
          print({'obs_sidecar': str(sidecar), 'pass': True})
          PY

      - name: Run same worker with concurrent bounded relay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import multiprocessing
          import os
          import pathlib
          import subprocess
          import sys
          import time
          import traceback

          agent='SUPERWORKER-UNIFIED-1'
          task_id='SI-REAL-UBJSON-SNAPSHOT-001'
          task='canonical/same_identity_worker/tasks/SI_REAL_UBJSON_SNAPSHOT_001.json'
          bridge=pathlib.Path('canonical/same_identity_worker/external_tool_bridge')/task_id
          bridge.mkdir(parents=True,exist_ok=True)
          relay_log=pathlib.Path('REAL_UBJSON_RELAY.jsonl')
          transcript=[]
          os.environ['PYTHONPATH']=str(pathlib.Path.cwd())
          completed=False

          def relay_loop():
              from canonical.runtime import external_tool_relay as relay
              try:
                  while True:
                      written=relay.service_pending(bridge,agent,task_id)
                      if written:
                          with relay_log.open('a',encoding='utf-8') as fh:
                              fh.write(json.dumps({
                                  'epoch':time.time(),
                                  'responses':written,
                                  'serviced':len(written),
                              },sort_keys=True)+'\n')
                              fh.flush()
                      time.sleep(0.02)
              except BaseException as exc:
                  with relay_log.open('a',encoding='utf-8') as fh:
                      fh.write(json.dumps({
                          'epoch':time.time(),
                          'fatal':type(exc).__name__+':'+str(exc),
                          'traceback':traceback.format_exc()[-6000:],
                      },sort_keys=True)+'\n')
                      fh.flush()
                  raise

          relay_proc=multiprocessing.Process(target=relay_loop,daemon=True)
          relay_proc.start()

          try:
              # First invocation may intentionally checkpoint and request a fresh
              # invocation. External requests after that are fulfilled in-process,
              # not by repeatedly restarting ASTRA.
              for iteration in range(1,5):
                  env=os.environ.copy()
                  env['PYTHONPATH']=str(pathlib.Path.cwd())
                  env['PROJECT_BRAIN_EXTERNAL_TOOL_WAIT_SECONDS']='90'
                  worker=subprocess.Popen(
                      [sys.executable,'canonical/runtime/same_identity_supervisor.py','--task',task],
                      text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env
                  )
                  killed_for_relay=False
                  deadline=time.monotonic()+1200
                  while worker.poll() is None:
                      if not relay_proc.is_alive():
                          worker.terminate()
                          killed_for_relay=True
                          break
                      if time.monotonic()>=deadline:
                          worker.terminate()
                          break
                      time.sleep(0.1)
                  try:
                      stdout,stderr=worker.communicate(timeout=10)
                  except subprocess.TimeoutExpired:
                      worker.kill()
                      stdout,stderr=worker.communicate()

                  record={
                      'iteration':iteration,
                      'returncode':worker.returncode,
                      'stdout':stdout[-12000:],
                      'stderr':stderr[-12000:],
                      'relay_alive':relay_proc.is_alive(),
                      'relay_exitcode':relay_proc.exitcode,
                      'killed_for_relay_failure':killed_for_relay,
                  }
                  transcript.append(record)
                  print(json.dumps(record,sort_keys=True))

                  if worker.returncode==0:
                      completed=True
                      print('REAL_UBJSON_MISSION_COMPLETE')
                      break
                  if worker.returncode==75:
                      continue

                  # With a concurrent relay, any ordinary BLOCKED return is now
                  # evidence of the next causal frontier rather than a cue to spin.
                  break
          finally:
              if relay_proc.is_alive():
                  relay_proc.terminate()
              relay_proc.join(timeout=5)
              pathlib.Path('REAL_UBJSON_LOOP_TRANSCRIPT.json').write_text(
                  json.dumps(transcript,indent=2,sort_keys=True)+'\n'
              )

          if not completed:
              print('REAL_UBJSON_MISSION_NOT_COMPLETE',file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-same-identity-ubjson-evidence
          if-no-files-found: warn
          path: |
            REAL_UBJSON_LOOP_TRANSCRIPT.json
            REAL_UBJSON_RELAY.jsonl
            canonical/same_identity_worker/state/
            canonical/same_identity_worker/evidence/
            canonical/same_identity_worker/external_tool_bridge/
            canonical/astra_runtime/state/
            canonical/astra_runtime/evidence/
            canonical/astra_runtime/artifacts/CANONICAL_POINTER_20260927.ubj
