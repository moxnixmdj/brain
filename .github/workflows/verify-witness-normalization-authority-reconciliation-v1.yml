name: Verify witness normalization authority reconciliation v1

on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/governance/OPUS55_BRAIN_WITNESS_NORMALIZATION_ACTIVATION_V1.json"
      - "canonical/governance/OPUS55_MATCHED_TARGET_NORMALIZATION_ACTIVATION_V1.json"
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/tests/test_witness_normalization_authority_reconciliation_v1.py"
      - ".github/workflows/verify-witness-normalization-authority-reconciliation-v1.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python canonical/tests/test_witness_normalization_authority_reconciliation_v1.py
