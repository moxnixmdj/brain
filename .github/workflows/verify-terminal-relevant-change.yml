name: Verify terminal-relevant change

on:
  pull_request:
    paths:
      - "canonical/runtime/**"
      - "canonical/tests/**"
      - "canonical/governance/**"
      - ".github/workflows/verify-terminal-relevant-change.yml"
  push:
    paths:
      - "canonical/runtime/**"
      - "canonical/tests/**"
      - "canonical/governance/**"
      - ".github/workflows/verify-terminal-relevant-change.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute terminal sentinels
        id: sentinel
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "HEAD=$(git rev-parse HEAD)"
            python -m py_compile               canonical/runtime/livebench_ratio_overlap_public_prompt_solver_v1.py               canonical/runtime/livebench_ngram_overlap_whitespace_invariant_constructor_v1.py               canonical/runtime/adaptive_terminal_closure_controller_v2.py               canonical/tests/test_livebench_ratio_overlap_public_prompt_solver_v1.py               canonical/tests/test_adaptive_terminal_closure_controller_v2.py
            python -m unittest canonical.tests.test_livebench_ratio_overlap_public_prompt_solver_v1 -v
            python -m unittest canonical.tests.test_adaptive_terminal_closure_controller_v2 -v
          } 2>&1 | tee terminal-verification.log
      - name: Upload verifier transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-verification-transcript
          path: terminal-verification.log
          if-no-files-found: error
      - name: Fail closed on sentinel failure
        if: steps.sentinel.outcome != 'success'
        run: exit 1
