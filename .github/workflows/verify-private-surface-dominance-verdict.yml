name: Verify private surface dominance verdict
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/PRIVATE_SURFACE_DOMINANCE_INPUT_V1.json
      - canonical/runtime/proof_route_dominance.py
      - canonical/verification/PRIVATE_SURFACE_DOMINANCE_VERDICT_V1.json
      - canonical/tests/test_private_surface_dominance_verdict.py
      - .github/workflows/verify-private-surface-dominance-verdict.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=. python -m unittest -v canonical.tests.test_private_surface_dominance_verdict
