name: Temporary verify science candidate-local rejection
on:
  push:
    branches:
      - repair/science-candidate-local-rejection-20261009-v2
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_harbor_brain_agent canonical.tests.test_harbor_science_planner_v1 canonical.tests.test_harbor_science_agent_v1
