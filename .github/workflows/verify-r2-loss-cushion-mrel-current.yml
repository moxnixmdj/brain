name: verify-r2-loss-cushion-mrel-current

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/loss_absorbing_cushion_regcap_grounding_v4.py
      - canonical/runtime/regcap_loss_cushion_truth_certificate_v2.py
      - canonical/runtime/regcap_property_candidate_discovery_v2.py
      - canonical/runtime/semantic_truth_dispatch_v1.py
      - canonical/tests/test_loss_absorbing_cushion_regcap_grounding_v4.py
      - canonical/tests/test_regcap_loss_cushion_truth_certificate_v2.py
      - canonical/tests/test_regcap_property_candidate_discovery_v2.py
      - canonical/tests/test_semantic_truth_dispatch_regcap_loss_v2.py
      - canonical/tests/test_loss_absorbing_cushion_mrel_current_integration_v1.py
      - .github/workflows/verify-r2-loss-cushion-mrel-current.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run focused MREL-expanded loss-cushion suite
        run: |
          python -m unittest             canonical.tests.test_regcap_property_candidate_discovery_v2             canonical.tests.test_loss_absorbing_cushion_regcap_grounding_v4             canonical.tests.test_regcap_loss_cushion_truth_certificate_v2             canonical.tests.test_semantic_truth_dispatch_regcap_loss_v2             canonical.tests.test_loss_absorbing_cushion_mrel_current_integration_v1             -v
