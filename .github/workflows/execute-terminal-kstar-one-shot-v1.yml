name: Execute terminal K-star one-shot V1

on:
  push:
    branches: [main]
    paths:
      - 'canonical/governance/TERMINAL_KSTAR_ONE_SHOT_EXECUTION_LOCK_20261007_V1.json'
      - 'canonical/astra_runtime/missions/ASTRA_TERMINAL_KSTAR_*_20261007_V1.json'
      - 'canonical/same_identity_worker/tasks/SI_TERMINAL_KSTAR_*_20261007_V1.json'
      - 'canonical/runtime/terminal_kstar_promotion_bridge_v1.py'
      - 'canonical/tests/test_terminal_kstar_promotion_bridge_v1.py'
      - '.github/workflows/execute-terminal-kstar-one-shot-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-kstar-one-shot-v1
  cancel-in-progress: true

# Landing on main goes through the front door (pull request + signed referee check);
# .github/scripts/land_on_main.sh needs the Brain Automation app to open that pull request.
env:
  AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
  AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input "pydantic>=2,<3" pytest
      - name: Hydrate exact current OBS into generator and verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.')
          def sha256(rel): return hashlib.sha256((root/rel).read_bytes()).hexdigest()
          pointer=json.loads((root/'canonical/CANONICAL_POINTER.json').read_text())
          generation=pointer['canonical_generation']
          deps=[
            ('CURRENT_TERMINAL_AUTHORITY','EXECUTION_AUTHORITY','canonical/governance/CURRENT_TERMINAL_AUTHORITY.json'),
            ('TERMINAL_CLOSURE_MANIFEST','CANONICAL_STATE','canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json'),
            ('KSTAR_EXECUTION_LOCK','EXECUTION_AUTHORITY','canonical/governance/TERMINAL_KSTAR_ONE_SHOT_EXECUTION_LOCK_20261007_V1.json'),
            ('CURRENT_PRIMITIVE_U_FRONTIER','CANONICAL_STATE','canonical/governance/CURRENT_PRIMITIVE_U_FRONTIER_20261007_V1.json'),
            ('SELECTED_DISCRIMINATOR_POLICY_COVER_BRIDGE','EXECUTION_SURFACE','canonical/governance/SELECTED_DISCRIMINATOR_POLICY_COVER_BRIDGE_20261007_V1.json'),
            ('TERMINAL_CLOSURE_REDUCER','EXECUTION_SURFACE','canonical/runtime/terminal_closure_reducer.py'),
            ('KSTAR_PROMOTION_BRIDGE','EXECUTION_SURFACE','canonical/runtime/terminal_kstar_promotion_bridge_v1.py'),
          ]
          obs={'schema':'PROJECT_BRAIN_CONTINUOUS_OBS_CONTEXT_V1','status':'CURRENT','canonical_generation':generation,
            'canonical_state_dependencies':[
              {'path':'canonical/CANONICAL_POINTER.json','sha256':sha256('canonical/CANONICAL_POINTER.json')},
              {'path':'canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json','sha256':sha256('canonical/governance/ACTIVE_GOAL_HIERARCHY_V1.json')},
              {'path':'canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json','sha256':sha256('canonical/governance/REAL_OUTPUT_SCOREBOARD_V1.json')}],
            'dependency_inventory_complete':True,'material_world_state_dependencies_complete':True,'information_boundary_complete':True,
            'information_policy':{'mode':'NO_EXTERNAL_INFORMATION','allowed_exact_sources':[],'allowed_external_tool_kinds':[]},
            'unknown_material_dependencies':[],'stale_authority_absent':True,'valid_proof_action_priority':True,
            'obs_layers_current':{'goal':True,'capability':True,'blocker':True,'solution':True,'verification':True,'inherited_system':True,'obs_process':True},
            'dependencies':[{'dependency_id':did,'class':cls,'material':True,'volatility':'STATIC','scope':'GLOBAL','status':'READY','evidence':[path]} for did,cls,path in deps]}
          pairs=[
            ('canonical/astra_runtime/missions/ASTRA_TERMINAL_KSTAR_ONE_SHOT_20261007_V1.json','canonical/same_identity_worker/tasks/SI_TERMINAL_KSTAR_ONE_SHOT_20261007_V1.json'),
            ('canonical/astra_runtime/missions/ASTRA_TERMINAL_KSTAR_VERIFY_20261007_V1.json','canonical/same_identity_worker/tasks/SI_TERMINAL_KSTAR_VERIFY_20261007_V1.json')]
          for mp,tp in pairs:
            mission=json.loads((root/mp).read_text()); mission['continuous_obs']=obs
            (root/mp).write_text(json.dumps(mission,indent=2,sort_keys=True)+'\n')
            task=json.loads((root/tp).read_text()); task['mission_sha256']=hashlib.sha256((root/mp).read_bytes()).hexdigest()
            (root/tp).write_text(json.dumps(task,indent=2,sort_keys=True)+'\n')
          PY
          PYTHONPATH=. python canonical/runtime/continuous_obs_runtime.py --root . --work-file canonical/astra_runtime/missions/ASTRA_TERMINAL_KSTAR_ONE_SHOT_20261007_V1.json
          PYTHONPATH=. python canonical/runtime/continuous_obs_runtime.py --root . --work-file canonical/astra_runtime/missions/ASTRA_TERMINAL_KSTAR_VERIFY_20261007_V1.json
      - name: Verify deterministic bridge before execution
        run: |
          set -euo pipefail
          python -m py_compile canonical/runtime/terminal_kstar_promotion_bridge_v1.py
          python -m pytest -q canonical/tests/test_terminal_kstar_promotion_bridge_v1.py
      - name: Execute the single K-star generator
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python canonical/runtime/same_identity_supervisor.py --root . --agent-id SUPERWORKER-TERMINAL-KSTAR --task canonical/same_identity_worker/tasks/SI_TERMINAL_KSTAR_ONE_SHOT_20261007_V1.json > /tmp/kstar_generator.json 2>/tmp/kstar_generator.err
          echo $? > /tmp/kstar_generator.rc
          cat /tmp/kstar_generator.json || true
          cat /tmp/kstar_generator.err >&2 || true
          exit 0
      - name: Independently verify exact K-star bytes
        shell: bash
        run: |
          set +e
          if [ -f canonical/astra_runtime/artifacts/TERMINAL_KSTAR_RESULT_20261007_V1.json ]; then
            PYTHONPATH=. python canonical/runtime/same_identity_supervisor.py --root . --agent-id SUPERWORKER-TERMINAL-KSTAR-VERIFY --task canonical/same_identity_worker/tasks/SI_TERMINAL_KSTAR_VERIFY_20261007_V1.json > /tmp/kstar_verifier.json 2>/tmp/kstar_verifier.err
            echo $? > /tmp/kstar_verifier.rc
          else
            echo 97 > /tmp/kstar_verifier.rc
            echo '{"status":"SKIPPED_RESULT_MISSING"}' > /tmp/kstar_verifier.json
            : > /tmp/kstar_verifier.err
          fi
          cat /tmp/kstar_verifier.json || true
          cat /tmp/kstar_verifier.err >&2 || true
          exit 0
      - name: Bind only independently verified universal proof
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python canonical/runtime/terminal_kstar_promotion_bridge_v1.py --root . > /tmp/kstar_bridge.out 2>/tmp/kstar_bridge.err
          echo $? > /tmp/kstar_bridge.rc
          cat /tmp/kstar_bridge.out || true
          cat /tmp/kstar_bridge.err >&2 || true
          exit 0
      - name: Run mandatory terminal reducer
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python canonical/runtime/terminal_closure_reducer.py canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json > /tmp/kstar_reducer.json 2>/tmp/kstar_reducer.err
          echo $? > /tmp/kstar_reducer.rc
          cat /tmp/kstar_reducer.json || true
          cat /tmp/kstar_reducer.err >&2 || true
          exit 0
      - name: Materialize exact terminal verdict
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          def txt(p):
            q=pathlib.Path(p); return q.read_text(errors='replace') if q.exists() else ''
          try: verdict=json.loads(txt('/tmp/kstar_reducer.json') or '{}')
          except Exception: verdict={}
          achieved=verdict.get('achieved') is True
          out={'schema':'PROJECT_BRAIN_TERMINAL_KSTAR_ONE_SHOT_EXECUTION_RECEIPT_V1','trigger_sha':os.environ.get('GITHUB_SHA'),
            'generator_returncode':int(txt('/tmp/kstar_generator.rc') or 999),'verifier_returncode':int(txt('/tmp/kstar_verifier.rc') or 999),
            'promotion_bridge_returncode':int(txt('/tmp/kstar_bridge.rc') or 999),'reducer_returncode':int(txt('/tmp/kstar_reducer.rc') or 999),
            'reducer_verdict':verdict,'terminal':achieved,'terminal_certificate_issued':achieved,'incremental_spend_usd':0}
          p=pathlib.Path('canonical/verification/TERMINAL_KSTAR_ONE_SHOT_EXECUTION_LATEST.json'); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if achieved:
            pathlib.Path('canonical/verification/TERMINAL_KSTAR_CERTIFICATE_20261007_V1.json').write_text(json.dumps(
              {'schema':'PROJECT_BRAIN_TERMINAL_KSTAR_CERTIFICATE_V1','status':'TERMINAL_TRUE__REDUCER_ACHIEVED','trigger_sha':os.environ.get('GITHUB_SHA'),
               'proof_route':verdict.get('proof_route'),'failed_predicates':verdict.get('failed_predicates'),'incremental_spend_usd':0},
              indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist exact one-shot evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Brain K-star One-Shot"
          git config user.email "project-brain-kstar@users.noreply.github.com"
          git add canonical/astra_runtime/missions/ASTRA_TERMINAL_KSTAR_*_20261007_V1.json
          git add canonical/same_identity_worker/tasks/SI_TERMINAL_KSTAR_*_20261007_V1.json
          git add canonical/governance/TERMINAL_CLOSURE_MANIFEST_V1.json
          git add -f canonical/astra_runtime/artifacts/TERMINAL_KSTAR_RESULT_20261007_V1.json 2>/dev/null || true
          git add -f canonical/verification/TERMINAL_KSTAR_INDEPENDENT_VERIFICATION_20261007_V1.json 2>/dev/null || true
          git add -f canonical/governance/TERMINAL_KSTAR_UNIVERSAL_PROOF_20261007_V1.json 2>/dev/null || true
          git add -f canonical/verification/TERMINAL_KSTAR_UNIVERSAL_VERIFIER_RECEIPT_20261007_V1.json 2>/dev/null || true
          git add -f canonical/governance/TERMINAL_KSTAR_FROZEN_PROOF_BUNDLE_20261007_V1.json 2>/dev/null || true
          git add -f canonical/verification/TERMINAL_KSTAR_PROMOTION_BRIDGE_RECEIPT_20261007_V1.json 2>/dev/null || true
          git add -f canonical/verification/TERMINAL_KSTAR_ONE_SHOT_EXECUTION_LATEST.json
          git add -f canonical/verification/TERMINAL_KSTAR_CERTIFICATE_20261007_V1.json 2>/dev/null || true
          git add -f canonical/same_identity_worker/state/SI-TERMINAL-KSTAR-*.json 2>/dev/null || true
          git add -f canonical/same_identity_worker/evidence/SI-TERMINAL-KSTAR-*__*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Record terminal K-star one-shot execution"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 1; continue; }
            bash .github/scripts/land_on_main.sh && exit 0
            sleep 1
          done
          exit 1
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-kstar-one-shot-v1
          if-no-files-found: warn
          retention-days: 90
          path: |
            /tmp/kstar_generator.json
            /tmp/kstar_generator.err
            /tmp/kstar_verifier.json
            /tmp/kstar_verifier.err
            /tmp/kstar_bridge.out
            /tmp/kstar_bridge.err
            /tmp/kstar_reducer.json
            /tmp/kstar_reducer.err
            canonical/astra_runtime/artifacts/TERMINAL_KSTAR_RESULT_20261007_V1.json
            canonical/verification/TERMINAL_KSTAR_INDEPENDENT_VERIFICATION_20261007_V1.json
            canonical/verification/TERMINAL_KSTAR_PROMOTION_BRIDGE_RECEIPT_20261007_V1.json
            canonical/verification/TERMINAL_KSTAR_ONE_SHOT_EXECUTION_LATEST.json

# retrigger_kstar_one_shot_20261007_1647_cairo
