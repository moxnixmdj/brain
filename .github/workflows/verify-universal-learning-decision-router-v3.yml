name: Verify universal learning decision router v3

on:
  pull_request:
    paths:
      - "canonical/governance/UNIVERSAL_LEARNING_DECISION_ROUTER_V3.json"
      - "canonical/action_intents/2026-10-03_UNIVERSAL_LEARNING_V3.json"
      - "canonical/runtime/structural_transfer_v3.py"
      - "canonical/runtime/decision_discriminator_v3.py"
      - "canonical/runtime/meta_learning_policy_v2.py"
      - "canonical/runtime/universal_learning_decision_router_v3.py"
      - "canonical/tests/test_universal_learning_decision_router_v3.py"
      - ".github/workflows/verify-universal-learning-decision-router-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V1 V2 V3 learning tests
        run: |
          python -m unittest             canonical.tests.test_universal_learning_contract_v1             canonical.tests.test_universal_active_transfer_learner_v2             canonical.tests.test_universal_learning_active_router_v2             canonical.tests.test_universal_learning_decision_router_v3 -v
      - name: Verify exact V3 blobs and zero-credit boundary
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from canonical.runtime import decision_discriminator_v3 as d
          root=Path('.')
          gov=json.loads((root/'canonical/governance/UNIVERSAL_LEARNING_DECISION_ROUTER_V3.json').read_text())
          for path,expected in gov['exact_bound_components'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==expected,(path,got,expected)
          assert gov['acceptance_credit_delta']==0
          assert gov['ownership_credit_delta']==0
          assert gov['fresh_reality_authority'] is False
          hs=[
            {'id':'h1','plausible':True,'best_action':'A','probability':'1/2'},
            {'id':'h2','plausible':True,'best_action':'B','probability':'1/2'},
          ]
          ranked=d.rank(hypotheses=hs,actions=[
            {'id':'fake','safe':True,'outcome_by_hypothesis':{'h1':'x','h2':'x'},'decision_gain':999,'time':1},
            {'id':'real','safe':True,'outcome_by_hypothesis':{'h1':'l','h2':'r'},'decision_gain':0,'time':1},
          ])
          assert [x['id'] for x in ranked]==['real'],ranked
          assert ranked[0]['conditional_decision_gain']=='1/2',ranked
          PY
