name: Verify LiveBench slot-feasibility threshold consequence

on:
  pull_request:
    paths:
      - "canonical/runtime/livebench_legacy15_slot_feasibility_v1.py"
      - "canonical/tests/test_livebench_legacy15_slot_feasibility_v1.py"
      - "canonical/governance/LIVEBENCH_SLOT_FEASIBILITY_THRESHOLD_CONSEQUENCE_20261005_V1.json"
      - "canonical/governance/LIVEBENCH_CONTAMINATION_SAFE_RESCUE_FRONTIER_V1.json"
      - ".github/workflows/verify-livebench-slot-feasibility-threshold-consequence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run theorem tests
        run: |
          python -m pip install -q pytest
          pytest -q canonical/tests/test_livebench_legacy15_slot_feasibility_v1.py
          python - <<'PY'
          from canonical.runtime import livebench_legacy15_slot_feasibility_v1 as f
          out=f.prove_support_wide_threshold_floor_impossible()
          assert out["status"]=="PASS__SUPPORT_WIDE_COMPARATOR_FLOOR_FALSIFIED"
          assert out["score"]["maximum_case_score_fraction"]=="1/4"
          assert out["score"]["below_comparator"] is True
          print("support-wide score-floor falsification PASS")
          PY
      - name: Verify exact frozen public-source support facts
        run: |
          git clone --filter=blob:none https://github.com/LiveBench/LiveBench.git /tmp/livebench
          git -C /tmp/livebench checkout 8f8e5c381a16e3f24257776edd53471fe86f8091
          python - <<'PY'
          import ast, hashlib, subprocess
          from pathlib import Path
          root=Path("/tmp/livebench")
          def blob(rel):
              b=(root/rel).read_bytes()
              return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          assert blob("livebench/if_runner/instruction_following_eval/instructions.py")=="4997bab885a676d92545fd91a9a20b48d234a2b2"
          assert blob("livebench/if_runner/instruction_following_eval/instructions_util.py")=="1f0dc0eaa05bd0f72f82f8183b90276ea4d2a87b"
          assert blob("livebench/if_runner/instruction_following_eval/instructions_registry.py")=="903ed738398648c7cfac61d5ffa478c22f1f0891"
          assert blob("livebench/process_results/instruction_following/utils.py")=="8ce01747887ec0792c8f024e1972e34ece781676"

          data=subprocess.check_output([
              "git","-C",str(root),"show",
              "686be1e78a0ba8036d7e355bc406e1a265da5292:livebench/if_runner/live_data.py"
          ])
          h=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          assert h=="6ff390d6885cf90f88d9d36959735cb327613edc"
          generator=data.decode()
          assert "np.random.randint(2, max_instructions+1" in generator
          assert "np.random.choice(all_constraints, draw, replace=False)" in generator
          assert "build_instruction.build_description()" in generator

          util_tree=ast.parse((root/"livebench/if_runner/instruction_following_eval/instructions_util.py").read_text())
          words=None
          for node in util_tree.body:
              if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="WORD_LIST" for t in node.targets):
                  words=ast.literal_eval(node.value)
          assert words is not None and "other" in words

          instructions=(root/"livebench/if_runner/instruction_following_eval/instructions.py").read_text()
          registry=(root/"livebench/if_runner/instruction_following_eval/instructions_registry.py").read_text()
          score=(root/"livebench/process_results/instruction_following/utils.py").read_text()
          assert '"Any other questions?"' in instructions
          assert 'if re.search(r"\\b" + word + r"\\b", value, flags=re.IGNORECASE):' in instructions
          assert 'return value.endswith(self._end_phrase)' in instructions
          assert '_KEYWORD + "forbidden_words": {_KEYWORD + "forbidden_words"}' in registry
          assert '_STARTEND + "end_checker": {_STARTEND + "end_checker"}' in registry
          assert 'avg_score = (score_1 + score_2) / 2' in score
          print("exact frozen source support facts PASS")
          PY
