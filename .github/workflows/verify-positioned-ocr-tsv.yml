name: Verify positioned OCR TSV bridge
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/positioned_ocr_tesseract_tsv.py
      - canonical/tests/test_positioned_ocr_tesseract_tsv.py
      - .github/workflows/verify-positioned-ocr-tsv.yml
  push:
    branches: [main]
    paths:
      - canonical/runtime/positioned_ocr_tesseract_tsv.py
      - canonical/tests/test_positioned_ocr_tesseract_tsv.py
      - .github/workflows/verify-positioned-ocr-tsv.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_positioned_ocr_tesseract_tsv
