name: Verify residual dependency eliminator

on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/residual_dependency_eliminator.py
      - canonical/tests/test_residual_dependency_eliminator.py
      - .github/workflows/verify-residual-dependency-eliminator.yml
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/residual_dependency_eliminator.py
      - canonical/tests/test_residual_dependency_eliminator.py
      - .github/workflows/verify-residual-dependency-eliminator.yml
  workflow_dispatch:

permissions:
  contents: read

# Verification is intentionally isolated from terminal-promotion authority.

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pytest -q canonical/tests/test_residual_dependency_eliminator.py
