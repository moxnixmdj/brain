name: Verify Root1 acquisition closure controller V2

on:
  pull_request:
    paths:
      - "canonical/runtime/root1_acquisition_closure_controller_v2.py"
      - "canonical/tests/test_root1_acquisition_closure_controller_v2.py"
      - "canonical/governance/ROOT1_ACQUISITION_CLOSURE_CONTROLLER_V2.json"
      - "canonical/action_intents/2026-10-04_ROOT1_ACQUISITION_CLOSURE_CONTROLLER_V2.json"
      - ".github/workflows/verify-root1-acquisition-closure-controller-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile canonical/runtime/root1_acquisition_closure_controller_v2.py
      - name: Run V4 and Root1 V2 tests
        run: python -m unittest canonical.tests.test_universal_learning_open_world_router_v4 canonical.tests.test_root1_acquisition_closure_controller_v2 -v
      - name: Verify exact blobs and dormant boundary
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from canonical.runtime import root1_acquisition_closure_controller_v2 as r1
          gov=json.loads(Path("canonical/governance/ROOT1_ACQUISITION_CLOSURE_CONTROLLER_V2.json").read_text())
          for path,expected in gov["exact_bound_components"].items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert got==expected,(path,got,expected)
          out=r1.acquisition_transaction(gap_evidence=None,required_primitives={"x"},verified_primitives=set(),actions=[])
          assert out["status"]=="NO_ACTION_ROOT1_INACTIVE",out
          assert out["selected_actions"]==[],out
          assert out["fresh_reality_authority"] is False
          assert out["promotion_authority"] is False
          PY
