name: Probe R3 pinned render stack
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/probe-r3-pinned-render-stack.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install and report render stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          libreoffice --version
          pdftoppm -v
          dpkg-query -W -f='${Package} ${Version}\n' libreoffice-core poppler-utils
