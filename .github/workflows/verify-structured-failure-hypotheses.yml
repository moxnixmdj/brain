name: Verify structured failure hypotheses
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/structured_failure_hypotheses.py
      - canonical/tests/test_structured_failure_hypotheses.py
      - .github/workflows/verify-structured-failure-hypotheses.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_structured_failure_hypotheses
