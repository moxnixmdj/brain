name: Verify Opus55 target identity truth lock V1

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/governance/OPUS55_TARGET_IDENTITY_TRUTH_LOCK_20261005_V1.json
      - canonical/runtime/opus55_target_identity_truth_lock_v1.py
      - canonical/tests/test_opus55_target_identity_truth_lock_v1.py
      - .github/workflows/verify-opus55-target-identity-truth-lock-v1.yml
      - canonical/governance/ROOT2_OUTPUT_ONLY_THRESHOLD_COMPILATION_V3.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile truth lock
        run: python -m py_compile canonical/runtime/opus55_target_identity_truth_lock_v1.py
      - name: Execute focused tests
        run: python -m unittest -v canonical.tests.test_opus55_target_identity_truth_lock_v1
      - name: Execute repository audit
        run: python canonical/runtime/opus55_target_identity_truth_lock_v1.py
