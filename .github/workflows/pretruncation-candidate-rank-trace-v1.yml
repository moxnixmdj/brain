name: Pretruncation Candidate Rank Trace V1

on:
  push:
    branches:
      - diagnostic/pretruncation-candidate-rank-v1-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove runtime unchanged from canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD -- canonical/runtime/)"
      - name: Measure full pre-truncation candidate pool
        run: python canonical/experiments/run_pretruncation_candidate_rank_trace_001.py
      - name: Upload trace evidence
        uses: actions/upload-artifact@v4
        with:
          name: pretruncation-candidate-rank-trace-001
          path: canonical/astra_runtime/evidence/PRETRUNCATION_CANDIDATE_RANK_TRACE_001__RESULT.json
          if-no-files-found: error
