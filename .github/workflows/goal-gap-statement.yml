name: goal-gap-statement
# An unstated requirement must be said out loud, named, and never guessed.
#
# The goal compiler already fails closed with a structured report:
# GoalCompilationFailure.detail is `<capability>:<slot>:<reason>`, for example
#   http.json.fetch_from_state:source_json_path:0_type_compatible_existing_files_named
# which states that the compiler looked for an existing file compatible with that
# slot and found zero. That is OWNER_ACTIVE_GOAL_20261018_V1.md section 5
# capability 4 -- "it says 'I don't have the data' out loud, then gets it, by
# itself". Measured 2026-11-02, the first half already worked and NOTHING consumed
# it; goal_gap_statement_v1 is the consumer.
#
# These tests pin what makes consuming it honest rather than decorative:
#   1. the missing slot is named, with the compiler's own reason carried through;
#   2. no value is ever invented for a slot the compiler could not fill -- there is
#      no field that could hold one;
#   3. a refusal carrying detail=None blames the REPORT, not the goal, because
#      saying "the goal is missing X" there would be inventing an X;
#   4. a goal that COMPILES is never endorsed;
#   5. a selection the goal did not FORCE is reported loudly as
#      LOW_CONFIDENCE_SELECTION instead of passing as a success.
#
# Item 5 is the dangerous failure and the reason this exists. Measured 2026-11-02
# on 12 under-specified goals: 5 failed closed with a precise report, 4 compiled
# onto the intended row, and 3 compiled onto the WRONG row and reported success --
# a JSON query routed to software.repair.choreograph.crossfile.v1, a rename routed
# to inline_helper (which deletes), a request for a repository log routed to
# python.repository.acceptance.measure.v1. A refusal is honest; a confident wrong
# selection is not.
#
# The rule is structural, not a fitted threshold: the selected row DECLARES
# requirements and the goal matched NONE of them, so nothing in the goal asked for
# that capability. Score separated the same 7 cases (11-13 wrong vs 24-36 right)
# and coverage separated them too (0.17-0.25 vs 0.50-1.00), but both are reported
# as auditable evidence rather than used as cutoffs -- a numeric threshold fitted
# to 7 points would be overfitting, and n=7 with the intended row being my
# judgment rather than ground truth the tree declares is stated in the module.
# Rows declaring no requirements are exempt: matching none of nothing says nothing.
#
# Negative control verified on every commit that touches this: inventing a slot
# value fails 1 test, swallowing detail=None fails 2, endorsing a compiled
# selection fails 1, dropping the unforced check fails 2, INVERTING it fails 3,
# and suppressing the evidence fails 3. Restored byte-identically after each
# (diff against the pre-mutation backup clean); 12 pass.
#
# live_integrated_brain_v1.py is in the path filter deliberately: this module
# parses that compiler's failure detail, so a change to the report format must
# re-run these tests rather than silently invalidating the consumer.
#
# Authority NONE. No capability is executed, registered, promoted or credited here,
# and no count moves.

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/goal_gap_statement_v1.py
      - canonical/tests/test_an_unstated_requirement_is_said_out_loud_v1.py
      - canonical/runtime/live_integrated_brain_v1.py
      - .github/workflows/goal-gap-statement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: An unstated requirement is said out loud, named, and never guessed
        run: python -m unittest canonical.tests.test_an_unstated_requirement_is_said_out_loud_v1 -v
