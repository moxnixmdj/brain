name: goal-gap-statement
# An unstated requirement must be said out loud, named, and never guessed.
#
# The goal compiler already fails closed with a structured report:
# GoalCompilationFailure.detail is `<capability>:<slot>:<reason>`, for example
#   http.json.fetch_from_state:source_json_path:0_type_compatible_existing_files_named
# which states that the compiler looked for an existing file compatible with that
# slot and found zero. That is OWNER_ACTIVE_GOAL_20261018_V1.md section 5
# capability 4 -- "it says 'I don't have the data' out loud, then gets it, by
# itself". Measured 2026-11-02, the first half already worked and NOTHING consumed
# it; goal_gap_statement_v1 is the consumer.
#
# These tests pin what makes consuming it honest rather than decorative:
#   1. the missing slot is named, with the compiler's own reason carried through;
#   2. no value is ever invented for a slot the compiler could not fill -- there is
#      no field that could hold one;
#   3. a refusal carrying detail=None blames the REPORT, not the goal, because
#      saying "the goal is missing X" there would be inventing an X;
#   4. a goal that COMPILES is never endorsed -- selection_endorsed is False on every
#      path;
#   5. NO verdict is drawn from lexical overlap, and a strong match is not accused of
#      being a guess.
#
# Item 5 is a retraction, and the reason it is pinned by a test rather than just
# deleted. A rule merged on 2026-11-02 reported LOW_CONFIDENCE_SELECTION whenever the
# selected row declared `requires` that the goal matched none of. On 7 under-specified
# goals it separated perfectly -- all 3 wrong selections had matched_requires empty,
# all 4 intended ones non-empty -- so it looked structural rather than tuned.
#
# It was measuring vocabulary coincidence. Across all 149 bound rows, 182 of 182
# `requires` tokens (100%) are dotted WORLD-PRECONDITION identifiers --
# python.source.file.available, image.file.available, structured.json.available -- not
# input slots (those are `input_names`: output_path, source_root, json_path) and not
# words a sentence contains. matched_requires is therefore non-empty only when a goal
# happens to share a sub-token with a precondition name: "Create the archive from the
# manifest" matched manifest.json.available on the word "manifest" alone. That accident
# is what the n=7 separation was.
#
# The counterexample that decided it is pinned here as a regression test: "Create a
# DOCX document report." selects docx.document.create_from_json_record at score 37,
# above every correct case in the n=7 sample, matching create/document/docx -- 3 of 4
# goal tokens -- on what the row PROVIDES. Its matched_requires is empty only because
# that row's precondition is structured.json.available. The rule called an obviously
# correct, strongly matched selection a guess and told the reader not to act on it.
#
# Widened from n=7 to the repository's own corpus -- 323 goals drawn from the
# LIVE_SOLVER_END_TO_END_MEASUREMENT receipts and the compiler's test files -- the rule
# would newly refuse 26 of the 149 goals that compile today, that one among them.
# Cross-referenced against the receipts' own independent oracle, no goal was attested
# REACHED_AND_BOUND onto a capability the rule would refuse, so the harm is false
# accusation rather than lost work. A report that calls correct selections guesses is
# worse than no report: it trains whoever reads it to discount the cases that are real.
#
# No replacement rule is offered, and that is the finding. Telling "Query the data file
# and write the result out" bound to a cross-file repair WRITER apart from "Create a
# DOCX document report" bound to a DOCX creator is a semantic question. The two overlap
# on every lexical field the compiler emits, so no deterministic function of score,
# matched_provides or matched_requires separates them -- and answering it anyway would
# mean putting model cognition in the producer path, which
# GENERAL_COGNITION_SUBSTRATE_AND_CAPABILITY_OWNERSHIP_LAW_V4 forbids outright. The
# evidence is reported; the judgment is withheld.
#
# Negative control verified on the commit that retracted it: reintroducing the rule
# fails 4 tests, endorsing a selection fails 3, suppressing the evidence fails 2.
# Restored byte-identically after each (diff against the pre-mutation backup clean);
# 12 pass. Earlier controls on the commit that added the module: inventing a slot value
# fails 1, swallowing detail=None fails 2.

on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/goal_gap_statement_v1.py
      - canonical/tests/test_an_unstated_requirement_is_said_out_loud_v1.py
      - canonical/runtime/live_integrated_brain_v1.py
      - .github/workflows/goal-gap-statement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: An unstated requirement is said out loud, named, and never guessed
        run: python -m unittest canonical.tests.test_an_unstated_requirement_is_said_out_loud_v1 -v
