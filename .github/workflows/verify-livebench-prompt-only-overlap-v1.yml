name: Verify LiveBench prompt-only overlap compiler v1
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/livebench_prompt_only_overlap_compiler_v1.py"
      - "canonical/tests/test_livebench_prompt_only_overlap_compiler_v1.py"
      - "canonical/governance/LIVEBENCH_PROMPT_ONLY_OVERLAP_BREAKTHROUGH_V1.json"
      - ".github/workflows/verify-livebench-prompt-only-overlap-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -q pytest
      - name: Run exact public-family tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q canonical/tests/test_livebench_prompt_only_overlap_compiler_v1.py --junitxml=prompt-only-overlap-junit.xml
          code=$?
          echo "$code" > prompt-only-overlap-exit.txt
          exit 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-only-overlap-verification
          path: |
            prompt-only-overlap-junit.xml
            prompt-only-overlap-exit.txt
      - name: Enforce test result
        shell: bash
        run: test "$(cat prompt-only-overlap-exit.txt)" = "0"
