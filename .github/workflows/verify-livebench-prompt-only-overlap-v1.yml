name: Verify LiveBench prompt-only overlap compiler v1
on:
  pull_request:
    branches: [main]
    paths:
      - "canonical/runtime/livebench_prompt_only_overlap_compiler_v1.py"
      - "canonical/tests/test_livebench_prompt_only_overlap_compiler_v1.py"
      - "canonical/governance/LIVEBENCH_PROMPT_ONLY_OVERLAP_BREAKTHROUGH_V1.json"
      - ".github/workflows/verify-livebench-prompt-only-overlap-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -q pytest
      - run: python -m pytest -q canonical/tests/test_livebench_prompt_only_overlap_compiler_v1.py
