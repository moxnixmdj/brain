name: Verify distributional target upper-envelope V1

on:
  pull_request:
    paths:
      - 'canonical/governance/DISTRIBUTIONAL_TARGET_UPPER_ENVELOPE_THEOREM_20261006_V1.json'
      - 'canonical/runtime/distributional_target_upper_envelope_v1.py'
      - 'canonical/tests/test_distributional_target_upper_envelope_v1.py'
      - '.github/workflows/verify-distributional-target-upper-envelope-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate governance JSON
        run: python -m json.tool canonical/governance/DISTRIBUTIONAL_TARGET_UPPER_ENVELOPE_THEOREM_20261006_V1.json > /dev/null
      - name: Run finite falsifier contract
        run: python -m unittest canonical.tests.test_distributional_target_upper_envelope_v1 -v
