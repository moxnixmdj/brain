name: Verify terminal delta admission gate v1
on:
  pull_request:
    paths:
      - "canonical/runtime/terminal_delta_admission_gate_v1.py"
      - "canonical/tests/test_terminal_delta_admission_gate_v1.py"
      - "canonical/governance/TERMINAL_DELTA_ADMISSION_GATE_V1.json"
      - ".github/workflows/verify-terminal-delta-admission-gate-v1.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile canonical/runtime/terminal_delta_admission_gate_v1.py
      - run: python -m unittest canonical.tests.test_terminal_delta_admission_gate_v1 -v
