name: Verify current authority scheduler generation

on:
  pull_request:
    paths:
      - "canonical/governance/CURRENT_TERMINAL_AUTHORITY_V1.json"
      - "canonical/governance/TERMINAL_SCHEDULING_ACTIVATION_V6.json"
      - "canonical/governance/OPUS55_ACCEPTANCE_ACTION_HYPERGRAPH_V2.json"
      - "canonical/governance/CANONICAL_PROOF_ATOM_BASIS_ACTIVATION_V1.json"
      - "canonical/tests/test_current_authority_scheduler_generation.py"
      - ".github/workflows/verify-current-authority-scheduler-generation.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python canonical/tests/test_current_authority_scheduler_generation.py
