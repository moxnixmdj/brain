name: Verify Brain witness normalization

on:
  push:
    paths:
      - "canonical/governance/OPUS55_ACCEPTANCE_PREDICATE_EVIDENCE_BINDINGS_V2.json"
      - "canonical/governance/OPUS55_BRAIN_WITNESS_NORMALIZATION_V1.json"
      - "canonical/runtime/brain_witness_normalization_verifier_v1.py"
      - "canonical/tests/test_brain_witness_normalization_v1.py"
      - ".github/workflows/verify-brain-witness-normalization.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run witness normalization tests
        run: python -m unittest canonical.tests.test_brain_witness_normalization_v1 -v
      - name: Run live witness normalization verifier
        run: python canonical/runtime/brain_witness_normalization_verifier_v1.py
