name: verify-live-integrated-brain-v1
on:
  pull_request:
    branches: [main]
    paths:
      - canonical/runtime/live_integrated_brain_v1.py
      - canonical/tests/test_live_integrated_brain_v1.py
      - .github/workflows/verify-live-integrated-brain-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pytest canonical/tests/test_live_integrated_brain_v1.py -q
