name: Verify explicit recovery planner
on:
  push:
    branches: [main]
    paths:
      - canonical/runtime/explicit_recovery_planner.py
      - canonical/tests/test_explicit_recovery_planner.py
      - .github/workflows/verify-explicit-recovery-planner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v canonical.tests.test_explicit_recovery_planner
