name: Verify P1 V7 failure-semantics identifiability v1

on:
  pull_request:
    paths:
      - "canonical/governance/P1_V7_FAILURE_SEMANTICS_IDENTIFIABILITY_CUT_V1.json"
      - "canonical/runtime/p1_v7_failure_semantics_identifiability_v1.py"
      - "canonical/tests/test_p1_v7_failure_semantics_identifiability_v1.py"
      - "canonical/runtime/p1_v6_derived_only_counterexample_v1.py"
      - "canonical/runtime/trajectory_failure_typed_ir_candidate_v7.py"
      - "canonical/runtime/trajectory_failure_typed_ir_proof_v6.py"
      - ".github/workflows/verify-p1-v7-failure-semantics-identifiability-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run identifiability tests
        run: python -m unittest canonical.tests.test_p1_v7_failure_semantics_identifiability_v1 -v
      - name: Execute identifiability cut
        run: python -m canonical.runtime.p1_v7_failure_semantics_identifiability_v1 > p1-v7-identifiability.json
      - name: Enforce theorem and zero credit
        run: |
          python - <<'PY'
          import json
          p=json.load(open("p1-v7-identifiability.json"))
          assert p["theorem_established"] is True, p
          assert p["status"].startswith("PASS__CURRENT_FROZEN_TRANSPORT_PROJECTION_UNDERDETERMINES"), p
          assert p["projection_equal_after_removing_failure_semantics"] is True, p
          assert p["required_behavior_differs"] is True, p
          assert p["classification"] == "INFORMATION_OR_SPECIFICATION_RESIDUAL", p
          assert p["minimum_missing_fact"] == "FAILURE_SEMANTICS_OR_AN_INDEPENDENTLY_PROVED_EQUIVALENT_DISCRIMINATOR", p
          assert p["terminal_results_replayed"] == 0, p
          assert p["new_reality_units_consumed"] == 0, p
          assert p["capability_credit_delta"] == 0, p
          assert p["family_credit_delta"] == 0, p
          PY
      - name: Upload identifiability verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-v7-failure-semantics-identifiability-v1
          path: p1-v7-identifiability.json
          if-no-files-found: error
